name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Itihasa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Itihasa-APK
          path: Itihasa.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Itihasa.apk \
            --title "Itihasa APK (build ${{ github.run_number }})" \
            --notes "Debug APK built from commit ${{ github.sha }}. Download Itihasa.apk and install it on your Android phone." \
            --latest
