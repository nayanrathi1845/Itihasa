plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.itihasa.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nr1845.itihasa'
        minSdk 24
        targetSdk 36
        versionCode 12
        versionName '2.0.1'
    }

    // Release signing: the upload key is supplied by the release workflow through environment
    // variables (GitHub secrets). Nothing secret is stored in the repository.
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Firebase Analytics + Authentication (no Firestore / Realtime DB). Versions are managed by the BoM.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'

    // Google Play services pulls in very old androidx.activity (1.0.0) and androidx.fragment (1.1.0),
    // which Play Console flags as outdated. Pin current stable versions instead.
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'
}
