plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.itihasa.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.itihasa.app'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Firebase Analytics only (no Auth / Firestore / Realtime DB). Versions are managed by the BoM.
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-analytics'
}
