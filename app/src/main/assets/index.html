['प्रद्युम्न द्वारका लौटते हैं','मायावती ने प्रद्युम्न को उनकी पहचान बताई और शंबर की माया को हराने की विधि सिखाई। प्रद्युम्न ने दैत्य का वध किया और मायावती के साथ द्वारका लौटे। रुक्मिणी ने अपने खोए पुत्र को पहचान लिया, और परिवार उस बालक के लौटने पर आनंदित हुआ जिसे वे मरा हुआ मान चुकी थीं।'],
['स्यमंतक मणि द्वारका में संदेह लाती है','सत्राजित के पास तेजस्वी स्यमंतक मणि थी, जिसकी उपस्थिति समृद्धि के साथ संदेह भी लाई। जब उसका भाई प्रसेन मणि पहने हुए लुप्त हो गया, तो लोगों ने कृष्ण पर मणि लेने का आरोप लगाया। कृष्ण यह जानने और अपना नाम निष्कलंक करने के लिए वन में गए कि वास्तव में क्या हुआ था।'],
['कृष्ण का जाम्बवती और सत्यभामा से विवाह','स्यमंतक मणि के लुप्त होने पर कृष्ण ने उसे खोजा और जाम्बवान को एक गुफा में उसकी रखवाली करते पाया। लंबे संघर्ष के बाद जाम्बवान ने कृष्ण को पहचान लिया और मणि के साथ अपनी पुत्री जाम्बवती भी उन्हें सौंप दी। बाद में सत्राजित ने मणि के विवाद में अपनी भूल मानते हुए सत्यभामा का विवाह कृष्ण से कर दिया।'],
['स्यमंतक मणि और सत्राजित की मृत्यु','सत्राजित का भाई प्रसेन स्यमंतक मणि पहने हुए मारा गया और संदेह कृष्ण पर आया। कृष्ण ने जाम्बवान के पास से मणि पाकर लौटा दी और अपना नाम निष्कलंक किया। बाद में शतधन्वा ने सत्राजित की हत्या कर दी, और कृष्ण ने मणि वापस पाने तथा न्याय लौटाने के लिए हत्यारे का पीछा किया।'],
['कृष्ण का अन्य रानियों से विवाह','कृष्ण ने कई राजकुमारियों से विवाह किया, जिन्होंने अपने स्वयंवर में उन्हें चुना या उनकी शरण माँगी। हर विवाह ने द्वारका को एक और राजपरिवार से जोड़ा। रानियाँ अलग-अलग महलों में रहती थीं, फिर भी कृष्ण हर घर का ध्यान रखते थे; यह ऐसी दिव्य उपस्थिति थी जो साधारण मानव-सामर्थ्य से सीमित नहीं थी।'],
['कृष्ण नरकासुर की बंदी राजकुमारियों को छुड़ाते हैं','नरकासुर ने अनेक राजकुमारियों को बंदी बना रखा था और अदिति के कुंडल चुरा लिए थे। कृष्ण और सत्यभामा ने उसके दुर्ग पर आक्रमण किया, दैत्य को हराया और बंदियों को मुक्त किया। राजकुमारियों ने कृष्ण से विवाह की प्रार्थना की ताकि वे अपमानित न रहें, और कृष्ण ने उन्हें अपने परिवार में अपनाया।'],
['अदिति को उनके कुंडल मिलते हैं','नरकासुर को हराने के बाद कृष्ण ने अदिति के चुराए हुए कुंडल लौटा दिए। देवताओं ने कृतज्ञता से उनका स्वागत किया कि दैत्य का अत्याचार समाप्त हुआ और स्वर्ग की निधि लौट आई। सत्यभामा कृष्ण के साथ गईं और उन्होंने इंद्र के स्वर्ग के आश्चर्य देखे।'],
['सत्यभामा पारिजात वृक्ष द्वारका लाती हैं','इंद्र के स्वर्ग में सत्यभामा ने पारिजात वृक्ष को द्वारका ले जाना चाहा। इंद्र ने इसका विरोध किया, पर कृष्ण विजयी हुए और उन्होंने वह दिव्य वृक्ष सत्यभामा के महल के उद्यान में लगा दिया। इस प्रसंग में एक राजकीय यात्रा के साथ कृष्ण और देवराज के बीच की विनोद भरी स्पर्धा जुड़ी है।'],
['कृष्ण और रुक्मिणी की मीठी नोक-झोंक','कृष्ण ने छेड़ते हुए कहा कि रुक्मिणी किसी अधिक शक्तिशाली पति को चुन सकती थीं। रुक्मिणी ने उनकी बात को सच मान लिया और वे मूर्छित हो गईं। कृष्ण ने उन्हें सांत्वना दी और अपना स्नेह समझाया। उनकी इस विनोद भरी बातचीत ने उनके विवाह की निकटता और विश्वास को प्रकट किया, और रुक्मिणी की भक्ति अडिग रही।'],
['अनिरुद्ध का रुक्मवती से विवाह और रुक्मी का वध','कृष्ण के पौत्र अनिरुद्ध का विवाह रुक्मी की पुत्री रुक्मवती से हुआ। विवाह में पासे का खेल विवाद में बदल गया जब रुक्मी ने छल किया और बलराम का अपमान किया। बलराम ने रुक्मी को मार डाला; झगड़ा समाप्त हुआ, पर उत्सव के लिए जुटे परिवारों में शोक छा गया।'],
['बाणासुर अनिरुद्ध को बंदी बनाता है','राजकुमारी उषा ने स्वप्न में एक युवक को देखा और बाद में उसे अनिरुद्ध के रूप में पहचाना। उसकी सखी चित्रलेखा उसे चुपके से उषा के महल में ले आई। जब पहरेदारों ने उसे देख लिया, तो बाणासुर ने अनिरुद्ध को पकड़कर कारागार में डाल दिया, और इससे कृष्ण के परिवार तथा असुर-राज के बीच युद्ध की भूमिका बनी।'],
['कृष्ण बाणासुर को पराजित करते हैं','कृष्ण और बलराम अनिरुद्ध को छुड़ाने आए, और शिव अपने भक्त बाणासुर की रक्षा के लिए युद्ध में उतरे। कृष्ण शिव की सेनाओं से लड़े और अंत में बाणासुर को वश में किया; उन्होंने उसकी अनेक भुजाओं में से चार को छोड़कर शेष काट दीं। शिव के कहने पर उन्होंने राजा को जीवित छोड़ दिया, और अनिरुद्ध उषा के साथ द्वारका लौटे।'],
['राजा नृग गिरगिट की देह से मुक्त होते हैं','यादव राजकुमारों ने एक कुएँ में फँसा विशाल गिरगिट देखा और सहायता के लिए कृष्ण को बुलाया। कृष्ण ने उसे छुआ और वह प्राणी राजा नृग बन गया। राजा ने बताया कि उन्होंने भूल से एक ही गाय दो ब्राह्मणों को दान कर दी थी और उन्हें शाप मिला था। उनकी कथा शासकों को दान और संपत्ति के मामले में सावधान रहने की चेतावनी देती है।'],
['बलराम गोकुल जाते हैं और यमुना की धारा मोड़ते हैं','बलराम गोकुल के ग्वालों और गोपियों से मिलने गए, जिन्होंने स्नेह से उनका स्वागत किया। जब यमुना उनके बुलाने पर पास नहीं आईं, तो उन्होंने अपने हल से उनकी धारा खींच ली। नदी प्रकट हुई और क्षमा माँगने लगी। बलराम ने वह ऋतु अपने पुराने मित्रों के साथ बिताई और कृष्ण की स्मृतियाँ उनके साथ बाँटीं।'],
['पौंड्रक भगवान होने का ढोंग करता है','पौंड्रक ने दावा किया कि केवल वही सच्चा वासुदेव है और कृष्ण को संदेश भेजा कि वे अपने चिह्न त्याग दें। कृष्ण ने उत्तर में युद्ध किया और उसे पराजित कर दिया। झूठे दावेदार की चुनौती समाप्त हुई, पर उसके मित्र काशीराज ने संघर्ष जारी रखा।'],
['काशीराज की नगरी का पतन','कृष्ण के पौंड्रक को हराने के बाद काशीराज ने उनके विरुद्ध सेना भेजी। कृष्ण के चक्र ने नगर की रक्षा-व्यवस्था को भेद दिया और युद्ध समाप्त हो गया। यह प्रसंग दिखाता है कि पौंड्रक के दावे ने उसके साथियों को ऐसे संघर्ष में खींच लिया जिसे वे जीत नहीं सकते थे।'],
['बलराम द्विविद को पराजित करते हैं','द्विविद वानर ने पूरे प्रदेश में उत्पात मचा रखा था; वह गाँवों को डुबोता और यज्ञों में विघ्न डालता था। बलराम उसके सामने आए और चट्टानों तथा वृक्षों की भयंकर मार के बीच लड़े। अंत में बलराम ने उसे मार गिराया, उत्पात समाप्त हुआ और लोग फिर सुरक्षित हुए।'],
['बलराम हस्तिनापुर को यमुना की ओर खींचते हैं','जब कौरवों ने सांब को छोड़ने से मना किया, तो बलराम न्याय माँगने हस्तिनापुर गए। वृद्धों ने उनकी बात टाल दी, इसलिए उन्होंने अपने हल से नगर को फँसाया और उसे यमुना की ओर खींचने लगे। कौरवों ने हार मान ली और बलराम के बल को पहचानकर सांब को मुक्त कर दिया।'],
['द्वारका में कृष्ण का गृहस्थ जीवन','कृष्ण द्वारका में अपनी रानियों और बच्चों के बीच रहते और हर घर की आवश्यकताओं का ध्यान रखते थे। वे नित्य कर्म करते, आगंतुकों से मिलते और अपने परिवार की देखभाल करते। यह वृत्तांत भगवान को एक साथ अनेक घरों में विचरते हुए दिखाता है, जहाँ वे हर एक में पूरी तरह उपस्थित और स्नेहमय रहते हैं।'],
['कृष्ण जरासंध के बंदी राजाओं को छुड़ाते हैं','जरासंध के बंदी बनाए राजाओं ने संदेश भेजकर कृष्ण से सहायता माँगी। कृष्ण इंद्रप्रस्थ गए और वहाँ उन्होंने भीम तथा अर्जुन के साथ मगध के शासक को ललकारने की योजना बनाई। उनका यह अभियान बंदी राजाओं को मुक्त करेगा और राजसूय यज्ञ के लिए युधिष्ठिर की तैयारी को बल देगा।'],
['कृष्ण इंद्रप्रस्थ आते हैं','कृष्ण इंद्रप्रस्थ पहुँचे और पांडवों ने उनका स्वागत किया। उन्होंने जरासंध की चुनौती पर उन्हें परामर्श दिया और भीम तथा अर्जुन के साथ वेश बदलकर राजा के पास जाने की योजना बनाई। उनकी इस यात्रा ने यादवों की कथा को महाभारत की घटनाओं से जोड़ दिया।'],
['भीम जरासंध को पराजित करते हैं','ब्राह्मणों के वेश में कृष्ण, भीम और अर्जुन ने जरासंध को ललकारा। राजा ने मल्लयुद्ध के लिए भीम को चुना और यह युद्ध कई दिन चला। कृष्ण ने भीम को दिखाया कि जरासंध को कैसे चीरें कि दोनों भाग फिर न जुड़ सकें। भीम ने राजा को मार डाला और बंदी शासकों को मुक्त किया।'],
['बंदी राजा अपने राज्यों को लौटते हैं','जरासंध की मृत्यु के बाद बंदी राजा कारागार से छूटे। उन्होंने कृष्ण का आभार माना और उनकी रक्षा का समाचार लेकर अपने राज्यों को लौट गए। उनकी मुक्ति से युधिष्ठिर की प्रतिष्ठा बढ़ी और इंद्रप्रस्थ में राजसूय यज्ञ का मार्ग खुल गया।'],
['युधिष्ठिर का राजसूय यज्ञ और शिशुपाल का पतन','युधिष्ठिर के राजसूय में अग्रपूजा के लिए कृष्ण को चुना गया। शिशुपाल ने इस पर आपत्ति की और एकत्र राजाओं के सामने उनका अपमान किया। कृष्ण ने शिशुपाल की माँ को उसके अनेक अपराध क्षमा करने का वचन दिया था, पर जब सीमा पार हो गई तो उन्होंने सुदर्शन चक्र से उसका वध कर दिया।'],
['कृष्ण चेदिराज को पराजित करते हैं','चेदियों का राजा शिशुपाल सभा के सामने खड़ा हुआ और उसने कृष्ण के सम्मान को चुनौती दी। कृष्ण ने उसकी माँ के लिए उसे क्षमा किया था, फिर भी वह देर तक अपमान करता रहा। जब शिशुपाल ने वचन की सीमा पार कर दी, तो कृष्ण ने चक्र छोड़ा और उसके आक्रमण का अंत किया; इस प्रकार राजसूय का वह टकराव समाप्त हुआ।'],
['दुर्योधन माया-सभा में भ्रमित होता है','दुर्योधन पांडवों की अद्भुत सभा में घूमा और उसने स्वच्छ फ़र्श को जल तथा जलाशय को ठोस भूमि समझ लिया। जब वह लड़खड़ाया तो सेवक हँस पड़े। अपमानित होकर वह ईर्ष्या से भरा हस्तिनापुर लौटा, और उसकी यही कुढ़न उस द्यूत-क्रीड़ा का कारण बनी जिसने पांडवों का जीवन बदल दिया।'],
['शाल्व द्वारका पर आक्रमण करता है','शाल्व ने सौभ नाम के उड़ने वाले नगर में बैठकर द्वारका पर आक्रमण किया; वह रुक्मिणी के विवाह में कृष्ण की भूमिका का बदला लेना चाहता था। माया से भरे उस विमान ने रक्षकों को भ्रम में डाल दिया, और कृष्ण नगर की रक्षा के लिए लौटे। उन्होंने आकाश में शाल्व का पीछा किया और अपनी प्रजा पर आए संकट को मिटाने के लिए युद्ध किया।'],
['कृष्ण शाल्व के उड़ते नगर का नाश करते हैं','कृष्ण ने शाल्व की माया को भेद दिया और अपने चक्र से उस राजा को मार गिराया। सौभ टूटकर गिर पड़ा और द्वारका पर आक्रमण समाप्त हुआ। शाल्व की पराजय ने दिखाया कि छल और मायावी अस्त्र अपनी प्रजा की रक्षा के कृष्ण के संकल्प को नहीं हरा सकते।'],
['दंतवक्र और विदूरथ की पराजय','दंतवक्र अपने मित्र शाल्व का बदला लेने कृष्ण के सामने आया। कृष्ण ने उससे युद्ध किया और गदा से उसे मार गिराया। फिर विदूरथ ने आक्रमण किया, पर कृष्ण के चक्र ने इस अंतिम संकट का भी अंत कर दिया। नगर सुरक्षित हुआ और प्रतिद्वंद्वी राजाओं के बीच प्रतिशोध का चक्र समाप्त हो गया।'],
['बलराम की तीर्थयात्रा और बल्वल का वध','महायुद्ध के समय बलराम ने किसी भी पक्ष से लड़ने के बजाय तीर्थयात्रा चुनी और पवित्र स्थलों की यात्रा की। नैमिषारण्य में बल्वल नाम का दैत्य ऋषियों के यज्ञ को दूषित करता था। बलराम ने उसे मार डाला और ऋषियों का सम्मान करते हुए तथा उनकी यज्ञभूमि की शांति लौटाकर अपनी यात्रा पर आगे बढ़े।'],
['सुदामा कृष्ण के लिए विनम्र भेंट लाते हैं','कृष्ण के बचपन के मित्र सुदामा निर्धनता में रहते थे, फिर भी संतुष्ट थे। पत्नी के आग्रह पर वे भेंट के रूप में चिवड़े की छोटी पोटली लेकर द्वारका गए। कृष्ण ने स्नेह से उनका स्वागत किया, उनके चरण धोए और उनसे निर्धन आगंतुक की तरह नहीं, प्रिय मित्र की तरह व्यवहार किया।'],
['कृष्ण अपने मित्र की भक्ति का फल देते हैं','कृष्ण ने सुदामा का लाया चिवड़ा चाव से खाया; उन्होंने उस विनम्र भेंट के पीछे का प्रेम देखा। सुदामा धन माँगे बिना, इस मिलन के लिए कृतज्ञ होकर विदा हुए। घर लौटने पर उन्होंने पाया कि उनकी निर्धनता दूर हो चुकी है। कृष्ण ने उनसे माँगने को कहे बिना उनकी आवश्यकता पूरी कर दी थी।'],
['यादव और ग्वाले कुरुक्षेत्र में मिलते हैं','एक सूर्यग्रहण के अवसर पर यादव और वृंदावन के ग्वाले कुरुक्षेत्र में इकट्ठे हुए। नंद, यशोदा और गोपियों ने बहुत वर्षों बाद कृष्ण और बलराम को फिर देखा। उनके मिलन में आनंद और शोक दोनों थे, क्योंकि जिन्होंने कृष्ण को पाला था वे अब द्वारका में रहने वाले भगवान से फिर मिले थे।'],
['कुरुक्षेत्र में गोपियों का कृष्ण से पुनर्मिलन','गोपियाँ कृष्ण को वृंदावन के उन वनों में लौटा ले जाना चाहती थीं जहाँ उन्होंने उनकी युवावस्था की लीलाएँ साथ जी थीं। उन्होंने उनसे अपने हृदयों में लौट आने और केवल राजकीय कर्तव्यों में न रहने की प्रार्थना की। कृष्ण ने उन्हें सांत्वना दी, और उनका पुनर्मिलन उस प्रेम की अभिव्यक्ति था जो लंबे वियोग के पार भी बना रहा।'],
['नंद और यशोदा कृष्ण के बचपन को याद करते हैं','नंद और यशोदा ने कृष्ण और बलराम को गले लगाया और उन बच्चों को याद किया जिन्हें उन्होंने गोकुल में पाला था। कृष्ण ने माता-पिता के रूप में उनका सम्मान किया और उन्हें अपने स्नेह का भरोसा दिलाया। उनके मिलन ने दिखाया कि राजसी जीवन ने उस बंधन को नहीं मिटाया जो वर्षों की देखभाल और प्रेम से बना था।'],
['कृष्ण की रानियाँ अपने विवाहों की कथाएँ सुनाती हैं','कृष्ण की रानियों ने बताया कि उनका विवाह उनसे कैसे हुआ, और संदेशों, स्वयंवरों, उद्धार तथा पारिवारिक संबंधों की कथाएँ सुनाईं। हर वृत्तांत ने एक ही भक्ति तक पहुँचने का अलग मार्ग दिखाया। उनकी बातचीत से कृष्ण के अनेक संबंध और हर रानी का उनके प्रति निजी प्रेम प्रकट हुआ।'],
['वसुदेव महान यज्ञ करते हैं','ऋषियों और संबंधियों की एक सभा में वसुदेव ने यज्ञ किया और आध्यात्मिक ज्ञान चाहा। ऋषियों ने समझाया कि परम भगवान हर प्राणी में कैसे विद्यमान हैं और भक्ति कर्म को कैसे पवित्र करती है। वसुदेव विनम्रता से सुनते रहे, और यादवों की वह सभा पवित्र उपदेश का अवसर बन गई।'],
['कृष्ण देवकी के खोए पुत्रों को लौटाते हैं','देवकी को उन छह पुत्रों की याद आई जिन्हें कंस ने मार डाला था, और उन्होंने कृष्ण से कहा कि वे उन्हें एक बार फिर देखना चाहती हैं। कृष्ण और बलराम सुतल लोक गए और उन पुत्रों को ले आए। देवकी ने उन्हें गले लगाया, और उनका आशीर्वाद पाकर वे अपने नियत धाम को लौट गए।'],
['सुभद्रा का विवाह और श्रुतदेव पर कृष्ण की कृपा','अर्जुन कृष्ण के समर्थन से सुभद्रा को ले गए, और यादवों ने अंत में इस विवाह को स्वीकार कर लिया। एक अन्य प्रसंग में कृष्ण विनम्र ब्राह्मण श्रुतदेव और राजा बहुलाश्व के यहाँ गए और दोनों का समान सम्मान किया। उनकी कृपा धन या पद पर नहीं, हृदय की भक्ति पर निर्भर थी।'],
['वेद भगवान की स्तुति करते हैं','मूर्तिमान वेदों ने भगवान की ब्रह्माण्ड के स्रोत और साधारण वाणी से परे के सत्य के रूप में स्तुति की। उनके स्तोत्रों ने पूछा कि सीमित मन अनंत का वर्णन कैसे कर सकता है। कृष्ण की उपस्थिति केवल शब्दों से नहीं, भक्ति और अंतर्दृष्टि से समझी गई।'],
['कृष्ण शिव की रक्षा करते हैं','जब असुर वृकासुर ने शिव को संकट में डाला, तो कृष्ण उनकी रक्षा के लिए आए। युवा ब्राह्मण का वेश धरकर कृष्ण ने दैत्य को मना लिया कि वह अपने वरदान की परीक्षा स्वयं पर करे। वृकासुर ने अपना हाथ अपने ही सिर पर रखा और नष्ट हो गया। शिव मुक्त हुए और देवताओं ने कृष्ण की बुद्धिमत्ता की प्रशंसा की।'],
['कृष्ण ब्राह्मण के खोए पुत्रों को लौटाते हैं','द्वारका में एक ब्राह्मण के नवजात पुत्र बार-बार मर जाते थे और वह राजा को उनकी रक्षा न कर पाने का दोष देता था। अर्जुन ने अगले बालक को बचाने का वचन दिया, पर बचा न सके। कृष्ण उन्हें साथ लेकर लोकों के पार दिव्य धाम तक गए, जहाँ उन्हें खोए हुए पुत्र मिले और उन्होंने उन्हें उनके पिता को लौटा दिया।'],
['रानियाँ कृष्ण की लीलाओं का गान करती हैं','द्वारका की रानियों ने कृष्ण के पराक्रमों, मित्रताओं और दिव्य गुणों का चिंतन किया। उनके गीत ने अनेक प्रसंगों को उन भगवान की अंतिम स्तुति में पिरो दिया जो उनके बीच पति, राजा और मित्र बनकर रहे। दसवाँ स्कन्ध उनकी भक्ति और स्मरण के साथ समाप्त होता है।'],
['यादव पिंडारक में उत्सव मनाते हैं','पिंडारक के पास एक जमावड़े में यादव युवकों ने सांब को गर्भवती स्त्री का वेश पहनाया और आए हुए ऋषियों से पूछा कि कौन-सा बालक जन्म लेगा। उनके इस उपहास से ऋषियों का अपमान हुआ और उन्होंने कुल को शाप दे दिया। इसी घटना से उन घटनाओं की शृंखला आरंभ हुई जो यादव वंश का अंत करेगी।'],
['यादव राजकुमारों पर ऋषियों का शाप','ऋषियों ने घोषणा की कि लोहे का एक मूसल यादव कुल का नाश करेगा। राजकुमार वह शाप घर ले आए, और यादवों ने मूसल को घिसकर चूर कर दिया और समुद्र में फेंक दिया। उसके लोहे के कण तट पर सरकंडों के रूप में लौट आए और संकट को आगे ले चले।'],
['राजा निमि नौ योगेंद्रों से प्रश्न करते हैं','राजा निमि ने नौ योगेंद्रों का स्वागत किया और पूछा कि लोग भय और सांसारिक दुख से कैसे मुक्त हो सकते हैं। ऋषियों ने एक-एक करके उत्तर दिया और भक्ति, भगवान के स्वरूप तथा साधक के दायित्वों का वर्णन किया। उनका संवाद भागवत के भक्ति-मार्ग का पथ-प्रदर्शक बन गया।'],
['भागवत धर्म का मार्ग','योगेंद्रों ने समझाया कि भागवत धर्म सच्ची भक्ति, करुणा, स्मरण और सेवा से निभाया जाता है। भक्त सभी प्राणियों में भगवान को देखता है और आध्यात्मिक जीवन का उपयोग दूसरों पर अधिकार पाने के लिए नहीं करता। उनके उपदेश ने निमि को साधारण कर्तव्यों के बीच विवेक से जीने का व्यावहारिक मार्ग दिया।'],
['माया से पार कैसे जाएँ','ऋषियों ने बताया कि इंद्रियों और परिवर्तनशील संसार की आसक्ति आत्मा को कैसे बाँध सकती है। भगवान की कथा सुनकर, भक्तों की सेवा करके और विवेक जगाकर साधक माया के पार जा सकता है। यह उपदेश संसार को नकारता नहीं; यह दिखाता है कि सनातन को भूले बिना उसमें कैसे जिया जाए।'],
['भगवान के अवतार और उनका उद्देश्य','ऋषि द्रुमिल ने भगवान के अवतारों और उनके अलग-अलग उद्देश्यों का वर्णन किया। हर युग में भगवान सज्जनों की रक्षा, विनाशकारी शक्तियों के दमन और आध्यात्मिक समझ को नया करने के लिए प्रकट होते हैं। निमि ने सुना कि भगवान के अनेक रूप करुणा और शक्ति के एक ही स्रोत को व्यक्त करते हैं।'],
['चार युगों में उपासना','करभाजन ने बताया कि हर युग में लोग भगवान की उपासना कैसे करते हैं। समय की परिस्थितियों के अनुसार साधनाएँ बदलती हैं, पर भक्ति ही केंद्रीय सिद्धांत बनी रहती है। वर्तमान युग में भगवान के नामों का श्रवण और कीर्तन ऐसा मार्ग है जो विक्षेप और कठिनाई के बीच भी बहुत लोगों के लिए सुलभ है।'],
['कृष्ण उद्धव से अपने प्रस्थान की तैयारी करने को कहते हैं','कृष्ण ने उद्धव से कहा कि यादव कुल का अंत निकट है और वे शीघ्र ही संसार छोड़ देंगे। उद्धव शोक से भर गए और पूछा कि कृष्ण के मार्गदर्शन के बिना वे कैसे जिएँगे। कृष्ण ने अंतिम उपदेश आरंभ किया और अपने मित्र को शोक को समझ और स्थिर भक्ति में बदलने में सहायता दी।'],
['अवधूत और उनके चौबीस गुरु','कृष्ण ने उद्धव को एक अवधूत के बारे में बताया जिन्होंने प्रकृति और दैनिक जीवन में मिले चौबीस गुरुओं से सीखा। पृथ्वी ने धैर्य, जल ने पवित्रता, अग्नि ने रूपांतरण और आकाश ने विशालता सिखाई। जो ध्यान से देखे और अहंकार से मुक्त रहे, उसे एक पक्षी या बालक भी कोई सत्य दिखा सकता है।'],
['अवधूत ने प्रकृति से क्या सीखा','अवधूत ने मधुमक्खी से सीखा कि धन या कामना के वश में न हों, और कबूतर के शोक से सीखा कि अत्यधिक आसक्ति से बचें। समुद्र ने गहराई और स्थिरता सिखाई; चंद्रमा ने दिखाया कि रूप बदलते हैं पर आत्मा बनी रहती है। उनके गुरु औपचारिक पाठशालाओं तक सीमित नहीं थे।'],
['अवधूत अपना उपदेश पूरा करते हैं','अवधूत ने समझाया कि ज्ञानी मनुष्य संसार को देखता है पर उसमें फँसता नहीं। आत्म-संयम, विनम्रता और सजग ध्यान हर अनुभव को सीखने का अवसर बना देते हैं। कृष्ण ने इस वृत्तांत से उद्धव को दिखाया कि आध्यात्मिक अंतर्दृष्टि शास्त्र और गुरुओं के साथ-साथ प्रत्यक्ष अवलोकन से भी जाग सकती है।'],
['आत्मा सांसारिक जीवन में उलझ जाती है','कृष्ण ने बताया कि जीव कैसे शरीर, इंद्रियों और संपत्ति को अपना स्वरूप मान लेता है और उनके बदलने पर भय अनुभव करता है। कामना कर्म की ओर ले जाती है और कर्म और अधिक आसक्ति लाता है। उद्धव ने सीखा कि आत्मा के स्वरूप और भगवान की उपस्थिति का स्मरण इस चक्र को ढीला कर सकता है।'],
['बंधन, मुक्ति और भक्ति','कृष्ण ने बंधन और मुक्ति का भेद बताया: बंधन तादात्म्य और तृष्णा से बढ़ता है, जबकि मुक्ति ज्ञान और भक्ति से आती है। भक्त को दया या दायित्व छोड़ने की आवश्यकता नहीं। अपने कर्म भगवान को अर्पित करके और दूसरों से सम्मान का व्यवहार करके मनुष्य आसक्ति के वश में हुए बिना सक्रिय रह सकता है।'],
['विवेक के साथ विहित कर्मों का त्याग','कृष्ण ने समझाया कि आध्यात्मिक परिपक्वता में मनुष्य स्वार्थ भरी अपेक्षा के बिना अपने कर्तव्य निभाता है और फिर धीरे-धीरे कर्ता होने का अहंकार भी छोड़ देता है। त्याग लापरवाही भरी उपेक्षा नहीं है। वह तब जागता है जब मनुष्य कर्म का उद्देश्य समझ लेता है और अपनी पहचान या सुख के लिए उसके फल पर निर्भर नहीं रहता।'],
['हंस रूप भगवान कुमारों को उपदेश देते हैं','एक बार चारों कुमारों ने हंस के रूप में प्रकट हुए भगवान से आत्मा और मन का भेद पूछा। भगवान ने समझाया कि मन को इस प्रकार साधा जा सकता है कि वह बदलते विषयों के पीछे भागने के बजाय सत्य में टिके। इस संवाद ने दिखाया कि स्पष्ट जिज्ञासा और भक्ति साथ-साथ काम करती हैं।'],
['भक्ति और ध्यान का मार्ग','कृष्ण ने उद्धव को सिखाया कि एकाग्र होकर पूजा करें, भगवान के गुणों का स्मरण करें और हृदय में दिव्य उपस्थिति का ध्यान करें। उन्होंने बताया कि निरंतर अभ्यास धीरे-धीरे विक्षेप को शांत करता है। भक्ति ध्यान को ऊष्मा और उद्देश्य देती है, और ध्यान भक्त को बदलती परिस्थितियों में स्थिर रहने में सहायता करता है।'],
['योग-सिद्धियों की सीमाएँ','कृष्ण ने उन असाधारण शक्तियों का वर्णन किया जो योग से जाग सकती हैं, जैसे असामान्य बल या दृष्टि। उन्होंने उद्धव को चेताया कि इन क्षमताओं को मुक्ति न समझ बैठें। जो साधक सिद्धियों पर गर्व करने लगता है वह और उलझ सकता है; लक्ष्य मुक्ति और प्रेममयी भक्ति है, प्रदर्शन नहीं।'],
['सर्वत्र भगवान की उपस्थिति देखना','उद्धव ने पूछा कि पूरी सृष्टि में भगवान को कैसे पहचानें। कृष्ण ने समझाया कि भगवान संसार के सबसे उत्तम, सबसे शक्तिशाली और सबसे सुंदर गुणों में झलकते हैं, पर उन्हीं तक सीमित नहीं हैं। सर्वत्र भगवान को देखने से सभी प्राणियों के प्रति श्रद्धा और करुणा जागती है।'],
['ब्रह्मचारियों और गृहस्थों के कर्तव्य','कृष्ण ने विद्यार्थियों और गृहस्थों के कर्तव्य बताए: अनुशासन से सीखना, गुरुओं का सम्मान करना, परिवार की देखभाल करना और अतिथियों का स्वागत करना। ये दायित्व प्रतिष्ठा के लिए नहीं, भगवान को अर्पित करके निभाए जा सकते हैं। उन्होंने सिखाया कि आध्यात्मिक जीवन अध्ययन, काम और घर की लय में बुना जा सकता है।'],
['वानप्रस्थों और संन्यासियों के कर्तव्य','जो लोग गृहस्थ जीवन से हट जाते हैं, उनके लिए कृष्ण ने सादगी, संयम और अध्ययन बताया। वानप्रस्थ और संन्यासी सभी प्राणियों से दया का व्यवहार करें और प्रशंसा पाने के लिए तप का उपयोग न करें। उनका बाहरी जीवन तभी सार्थक है जब वह भीतरी स्वतंत्रता और भगवान के स्मरण को सहारा दे।'],
['भिक्षु का गीत','कृष्ण ने एक निर्धन भिक्षु का गीत सुनाया, जिसका अपमान और तिरस्कार किया गया था। दूसरों को दोष देने के बजाय उस भिक्षु ने पहचाना कि मनुष्य के अधिकांश दुख मन की प्रतिक्रियाओं से ही बनते हैं। उसकी इस समझ से उद्धव जान सके कि धैर्य और आत्मज्ञान हृदय को कटुता से कैसे बचाते हैं।'],
['राजा ऐल का गीत','उर्वशी के छोड़ जाने पर शोक से व्याकुल राजा पुरूरवा उसे खोजते हुए भटकते रहे। समय के साथ उन्होंने देखा कि कामना ने उन्हें कैसे बेचैन और पराधीन बना दिया था। उनका गीत आसक्ति की क्षणभंगुरता और उस शांति पर विचार करता है जो मन के आध्यात्मिक सत्य की ओर मुड़ने पर मिलती है।'],
['ज्ञान, कर्म और भक्ति का सार','कृष्ण ने ज्ञान, कर्म और भक्ति के मार्गों की तुलना की और समझाया कि सच्चे मन से चलने पर हर मार्ग भगवान की ओर ले जा सकता है। ज्ञान आत्मा को स्पष्ट करता है, संयमित कर्म नीयत को शुद्ध करता है, और भक्ति हृदय को भगवान की ओर खींचती है। उद्धव सुनते रहे और कृष्ण ने इन मार्गों को एक साथ जोड़ दिया।'],
['उद्धव के अंतिम प्रश्न और प्रस्थान','उद्धव ने अपने अंतिम प्रश्न पूछे और सुने हुए उपदेशों के अनुसार जीने का कृष्ण का आशीर्वाद पाया। वे भगवान के ज्ञान को ध्यान के जीवन में साथ लेकर बदरिकाश्रम चले गए। कृष्ण की प्रत्यक्ष उपस्थिति से दूर होकर भी उद्धव स्मरण और भक्ति के द्वारा उनके निकट रहे।'],
['यादव प्रभास में एकत्र होते हैं','यादव तीर्थयात्रा के लिए प्रभास गए और लोहे के मूसल के शाप को उसकी पूर्ति की ओर ले चले। पुराने झगड़े फिर उभर आए, और कुल के लोग मदिरा पीकर आपस में लड़ने लगे। कृष्ण ने देखा कि अंत निकट है, और बलराम उस जमावड़े से हटकर संसार छोड़ने की तैयारी करने लगे।'],
['यादव कुल स्वयं को नष्ट कर लेता है','प्रभास के झगड़े में लोहे के सरकंडे हथियार बन गए। यादव एक-दूसरे पर तब तक टूटते रहे जब तक लगभग पूरा कुल नहीं गिर गया। कृष्ण इस विनाश को होते देखते रहे; वे जानते थे कि शाप और कुल का अपना क्रोध एक साथ आ मिले हैं। वह शक्तिशाली वंश अपने ही कलह से समाप्त हो गया।'],
['कृष्ण वैकुंठ लौटते हैं','यादवों के विनाश के बाद कृष्ण वन में एक वृक्ष के नीचे बैठे। जरा नाम के व्याध ने उनके चरण को मृग समझकर बाण चला दिया। कृष्ण ने उसे क्षमा किया और संसार छोड़कर अपने दिव्य धाम लौट गए। उनके प्रस्थान से एक युग का अंत और कलियुग का आरंभ हुआ।'],
['कलियुग के भावी राजा','शुकदेव ने उन राजवंशों का वर्णन किया जो कलियुग के बढ़ने के साथ राज्य करेंगे। उनकी सत्ता शीघ्र उठेगी और शीघ्र ढल जाएगी, और अनेक शासक प्रजा की उपेक्षा करेंगे। यह भविष्यवाणी श्रोताओं से कहती है कि राजनीतिक परिवर्तन को काल के बड़े प्रवाह के भीतर देखें और उसे खोजें जो उसके परे स्थिर रहता है।'],
['कलियुग के कष्ट','कलियुग के गहराने के साथ सत्य, धैर्य और करुणा क्षीण होते हैं, जबकि लोभ और कलह बढ़ते हैं। लोग चरित्र के बजाय धन और पद से मनुष्य का मूल्य आँकने लगते हैं। शुकदेव का वर्णन इन प्रवृत्तियों से सावधान करता है और श्रोताओं को प्रेरित करता है कि जब समाज इनके उलटे गुणों को पुरस्कृत करे तब भी वे सच्चाई और दया की रक्षा करें।'],
['भगवान का नाम धर्म की रक्षा करता है','कलियुग में धर्म क्षीण होता है, फिर भी भगवान का नाम एक शक्तिशाली शरण बना रहता है। उसे सुनना और जपना मन को स्थिर कर सकता है और भक्ति जगा सकता है। भागवत सिखाता है कि संकट के युग में भी साधना संभव है और सच्चा स्मरण आशा तथा नैतिक उद्देश्य को लौटा सकता है।'],
['चार प्रकार के प्रलय','शुकदेव ने ब्रह्माण्ड के अलग-अलग प्रलयों का वर्णन किया: प्राणियों का नित्य अंत, लोकों का समय-समय पर लय, भौतिक सृष्टि का अंतिम प्रलय और अज्ञान से आत्मा की मुक्ति। सृष्टि और प्रलय विशाल चक्रों में चलते हैं, जबकि परम भगवान उनसे परे रहते हैं।'],
['परीक्षित को शुकदेव का अंतिम उपदेश','जब सात दिन पूरे होने को आए, शुकदेव ने परीक्षित को याद दिलाया कि आत्मा सनातन है और भय बदलते शरीर का है। राजा ने एकाग्रता और भक्ति से सुना था। अब वे मृत्यु का सामना करने को तैयार हुए, उनका मन छोड़े हुए राज्य पर नहीं, भगवान पर टिका था।'],
['तक्षक परीक्षित को डसता है और जनमेजय यज्ञ आरंभ करते हैं','परीक्षित उपदेश में लीन थे जब तक्षक वेश बदलकर आया और उसने उन्हें घातक दंश दिया। राजा ने भगवान का चिंतन करते हुए मृत्यु का सामना किया। बाद में उनके पुत्र जनमेजय ने उनका बदला लेने के लिए सर्प-यज्ञ आरंभ किया, पर ऋषि आस्तीक राजा को उसे रोकने के लिए मना लेंगे।'],
['वेदों का विभाजन और संरक्षण','शुकदेव ने याद किया कि वेदों को शाखाओं में कैसे बाँटा गया ताकि उनकी शिक्षाएँ सुरक्षित रहें और आगे पहुँचें। ऋषियों ने अलग-अलग संहिताओं का दायित्व लिया और सुनिश्चित किया कि पवित्र ज्ञान पीढ़ियों तक जीवित रहे। यह वृत्तांत अनुशासित अध्ययन और उन अनेक गुरुओं का सम्मान करता है जिन्होंने परंपरा को आगे बढ़ाया।'],
['पुराण-परंपराओं का स्मरण','ऋषियों ने पुराण-परंपराओं को व्यवस्थित किया और उन्हें गुरुओं की परंपरा से आगे बढ़ाया। ये इतिहास वंशावलियों, सृष्टि के वृत्तांतों और भगवान के विषय की शिक्षाओं को सुरक्षित रखते हैं। भागवत स्वयं को स्मृति की इसी धारा में रखता है और श्रवण तथा भक्ति पर केंद्रित मार्ग देता है।'],
['मार्कंडेय दीर्घ तप करते हैं','ऋषि मार्कंडेय ने कठोर तप किया और नर-नारायण की उपासना की। देवताओं ने उनके संयम की परीक्षा ली, पर वे भक्ति में स्थिर रहे। भगवान प्रकट हुए और उन्होंने वर माँगने को कहा। मार्कंडेय ने दिव्य माया की शक्ति देखने की इच्छा की; वे समझना चाहते थे कि भगवान की माया लोकों के अनुभव को कैसे गढ़ती है।'],
['मार्कंडेय भगवान की माया देखते हैं','एक प्रलय की बाढ़ में मार्कंडेय अनंत जल में बह चले। उन्होंने बरगद के नीचे विश्राम करते एक नन्हे बालक को देखा और उसकी साँस के साथ भीतर चले गए, जहाँ उन्होंने पूरा ब्रह्माण्ड देखा। जब वे बाहर आए तो बाढ़ लुप्त हो चुकी थी। वे समझ गए कि वह बालक नारायण थे और सृष्टि भगवान के भीतर टिकी है।'],
['शिव और उमा मार्कंडेय को आशीर्वाद देते हैं','शिव और उमा मार्कंडेय के पास आए और उन्होंने उनकी भक्ति की प्रशंसा की। उन्होंने वर देने को कहा, और मार्कंडेय ने स्थायी भक्ति और ज्ञान माँगा। शिव ने उनकी प्रार्थना स्वीकार की और ऋषि को दीर्घ आयु का आशीर्वाद दिया। यह प्रसंग दिव्य परंपराओं का सामंजस्य और अडिग साधना को मिलने वाला सम्मान दिखाता है।'],
['भगवान के विराट रूप के अंग','शुकदेव ने भगवान के विराट रूप के अंगों और उन गुणों का वर्णन किया जिनके वे प्रतीक हैं। यह चित्र श्रोताओं को संसार की रचना के माध्यम से—विराट देह से लेकर उसके प्राणियों तक—भगवान के चिंतन का मार्ग देता है। यह वर्णन से आगे बढ़कर भक्ति और समस्त सृष्टि के प्रति श्रद्धा तक ले जाता है।'],
['बारह स्कन्धों का स्मरण','सूत ने बारह स्कन्धों और उन अनेक कथाओं को याद किया जिनके द्वारा भागवत सृष्टि, भक्ति, धर्म और मुक्ति की शिक्षा देता है। ये वृत्तांत बार-बार भगवान की उपस्थिति और भक्तों के प्रेम की ओर लौटते हैं। उनका उद्देश्य तब पूरा होता है जब श्रोता भगवान का स्मरण करें और करुणा से जिएँ।'],
['अठारह पुराण और उनका विस्तार','भागवत अठारह पुराणों के विस्तार और उनके पारंपरिक परिमाण का वर्णन करके समाप्त होता है। हर पुराण अपने ढंग से इतिहासों, शिक्षाओं और भगवान के वृत्तांतों को सुरक्षित रखता है। यह अंतिम स्मरण भागवत को पवित्र साहित्य के व्यापक भंडार के भीतर रखता है और भक्ति को उसका केंद्रीय उपहार बताता है।']

const groups=[
{name:'Bala Kanda',stories:[['The Birth of Rama','King Dasharatha of Ayodhya longed for an heir. After a sacred rite, his queens welcomed four sons: Rama, Bharata, Lakshmana and Shatrughna. Rama, born to Kausalya, grew into a thoughtful and capable prince. The brothers were trained in statecraft and arms, and Rama and Lakshmana became especially close. Their childhood in the palace was the beginning of a journey that would carry them far beyond Ayodhya.'],['Vishvamitra Arrives at Ayodhya','The sage Vishvamitra came to Dasharatha’s court seeking help. Demons were disrupting the rites he performed in the forest, and he asked that Rama protect the sacrifice. Dasharatha hesitated to send his young son, but the sage Vasishta advised him to honor the request. Rama set out with Lakshmana, guided by Vishvamitra. The journey began his life as a protector beyond the palace walls.'],['Rama and Lakshmana Leave with Vishvamitra','Vishvamitra taught the princes sacred knowledge and gave them powerful weapons. On the road they faced dangers that tested their courage and discipline. Rama protected the sage’s rite from the demons Maricha and Subahu, driving Maricha far away and defeating Subahu. The brothers learned that strength carried responsibility: they were travelling not for glory, but to safeguard the work of a sage.'],['The Story of Ahalya','At the hermitage of Gautama, Rama encountered Ahalya, who had long lived under a curse. In Valmiki’s telling, the sage had cursed her after discovering Indra’s deception, and she remained secluded until Rama’s arrival. Rama’s presence brought the curse to an end. Gautama returned, and Ahalya was welcomed again. Later tellings vary in the details, but the episode is remembered as one of restoration and release.'],['The Slaying of Tataka','Vishvamitra led Rama and Lakshmana into a forest where the yaksha woman Tataka threatened travellers and sages. Rama was uneasy about fighting a woman, but Vishvamitra explained the danger she posed and asked him to protect the region. Rama faced Tataka and killed her. The act was a difficult first test of his duty as a warrior, and Vishvamitra then entrusted him with further knowledge and weapons.'],['Rama Breaks Shiva’s Bow','In Mithila, King Janaka announced that whoever could lift and string the great bow associated with Shiva could marry his daughter Sita. Many powerful kings tried and failed. Rama approached the bow at Vishvamitra’s request, lifted it, and as he drew it, the bow broke with a thunderous sound. Janaka recognized Rama’s strength and character and prepared for the marriage.'],['The Marriage of Rama and Sita','Janaka welcomed Dasharatha and the royal family to Mithila. With the sages presiding, Rama and Sita were married, and the other royal brothers were married to Janaka’s family as well. The ceremonies joined two kingdoms and two families. Rama and Sita returned to Ayodhya with the blessings of their elders, beginning a partnership that would be tested by exile, separation and war.']]},
{name:'Ayodhya Kanda',stories:[['The Coronation That Never Happened','Dasharatha decided to make Rama his heir, and Ayodhya prepared for the coronation. The city rejoiced at the news. But Manthara, a servant of Queen Kaikeyi, warned her that Rama’s accession might leave Bharata without a place in the kingdom. Kaikeyi remembered two boons Dasharatha had promised her and resolved to claim them. The preparations for a joyful ceremony turned into a crisis for the royal family.'],['Kaikeyi’s Two Boons','Kaikeyi asked Dasharatha to grant the two boons he had once promised: that Bharata be crowned king and that Rama spend fourteen years in the forest. Dasharatha was devastated, but Rama accepted the demand to uphold his father’s word. He did not blame Kaikeyi or resist the decision. His calm acceptance transformed the private conflict in the palace into the turning point of the epic.'],['Rama Accepts Exile','Rama told Sita and Lakshmana that he would leave for the forest. He accepted bark garments and prepared to depart, placing his father’s promise above his own claim to the throne. Dasharatha, overcome by grief, could not bear to see him go. Rama comforted those around him and set out from Ayodhya, beginning the years of exile.'],['Sita and Lakshmana Join Rama','Sita insisted that she would share Rama’s life in the forest, while Lakshmana asked to accompany and protect them. Rama tried to explain the hardships they would face, but both remained firm. Sita left the security of the palace, and Lakshmana left his wife Urmila and the royal life behind. Their choice made the exile a shared journey of loyalty and family duty.'],['The Departure from Ayodhya','Rama, Sita and Lakshmana rode out of Ayodhya as citizens followed in sorrow. The trio eventually continued without the crowd, travelling through forests and settlements. Dasharatha mourned Rama’s departure and died grieving for his son. The exiles reached the forest, where they began a simpler life away from the court. Their departure left Ayodhya without its chosen heir and brought Bharata home to a changed kingdom.'],['Bharata Refuses the Throne','Bharata returned to Ayodhya and learned what Kaikeyi had done. He rejected the throne and rebuked the decision that had sent Rama away. He travelled to the forest and pleaded with Rama to return, but Rama would not break their father’s promise. Bharata carried Rama’s sandals back to Ayodhya and placed them on the throne, governing as Rama’s representative while awaiting his brother’s return.']]},
{name:'Aranya Kanda',stories:[['Life in the Forest','Rama, Sita and Lakshmana travelled through the forests, meeting sages and protecting hermitages from threats. They eventually made their home near Panchavati. Their days included visits from forest dwellers, quiet routines and the duties of guarding the region. Though they had left palace life behind, the forest brought its own responsibilities and dangers, setting the stage for the events that would separate Sita from Rama.'],['The Encounter with Shurpanakha','Shurpanakha, Ravana’s sister, encountered Rama and expressed a desire to marry him. Rama gently declined and directed her to Lakshmana, who also refused. Enraged, she threatened Sita. Lakshmana intervened and wounded her, and Shurpanakha fled to her relatives for help. Her humiliation and anger drew Khara and Dushana into conflict with Rama, and eventually brought news of Sita to Ravana.'],['The Battle with Khara and Dushana','Khara and Dushana led a large force against Rama after hearing Shurpanakha’s account. Lakshmana took Sita to safety while Rama faced the attackers alone. Rama fought through the assault and defeated the rakshasa warriors, including their commanders. The battle demonstrated his skill, but its consequences travelled beyond the forest: Shurpanakha carried the story to Ravana, who began to scheme against Sita.'],['The Golden Deer','Ravana enlisted Maricha to lure Rama away from the hermitage. Maricha took the form of a dazzling golden deer, and Sita asked Rama to catch it. Rama pursued the deer, which led him deeper into the forest. When Rama’s arrow struck Maricha, the demon cried out in Rama’s voice. Hearing it, Sita urged Lakshmana to go to Rama, leaving her without their protection.'],['The Abduction of Sita','With Rama and Lakshmana away, Ravana approached the hermitage disguised as an ascetic. He revealed his identity and tried to persuade Sita to go with him. When she refused, he seized her and carried her toward Lanka in his chariot. Sita called for help and left signs along the way. The abduction began the search that would bring Rama into alliance with the vanaras.'],['Jatayu’s Last Stand','The aged eagle Jatayu saw Ravana carrying Sita away and tried to stop him. He fought bravely, damaging Ravana’s chariot and challenging the abduction, but Ravana cut off his wings and left him mortally wounded. Rama and Lakshmana later found Jatayu. Before dying, he told them what had happened and pointed them toward the south. Rama mourned the loyal bird and performed his funeral rites.']]},
{name:'Kishkindha Kanda',stories:[['Rama Meets Hanuman','While searching for Sita, Rama and Lakshmana entered the region of Kishkindha. Hanuman approached them in the guise of an ascetic and spoke with care and intelligence. He learned who they were and brought them to Sugriva, the exiled vanara prince. Hanuman’s meeting with Rama began a bond of service and friendship that would become essential to the search for Sita and the journey to Lanka.'],['The Alliance with Sugriva','Sugriva told Rama that his brother Vali had taken the kingdom and that Sugriva lived in fear of him. Rama agreed to help Sugriva regain his place, and Sugriva promised to help find Sita. They pledged their alliance before a fire. After Rama helped Sugriva defeat Vali, Sugriva became king and organized the vanaras to search in every direction.'],['The Defeat of Vali','Sugriva challenged Vali to a duel, but Rama could not distinguish the brothers at first and held back. Sugriva returned wearing a garland, and the brothers fought again. Rama then released an arrow that struck Vali. As Vali lay dying, he questioned Rama’s decision to shoot from concealment. Rama explained his reasons; Vali entrusted his son Angada to Sugriva, and Sugriva took the throne.'],['The Search for Sita','Sugriva sent search parties across the regions, with Hanuman, Angada and Jambavan travelling south. Their search seemed to fail until they met Sampati, Jatayu’s brother, who saw Lanka across the ocean and told them Sita was there. Jambavan reminded Hanuman of the strength he had forgotten. The vanaras chose Hanuman to make the great leap across the sea.']]},
{name:'Sundara Kanda',stories:[['Hanuman Leaps Across the Ocean','Encouraged by Jambavan, Hanuman grew in confidence and prepared to cross the ocean. He launched himself from the mountain and flew over the sea toward Lanka. Along the way, he met challenges that tested both his strength and judgment. He overcame them without losing sight of his purpose. His leap carried Rama’s hope across the water and brought him to the city where Sita was held.'],['Hanuman Finds Sita in Ashoka Vatika','Hanuman entered Lanka at night and searched its palaces and gardens. At last he found Sita in Ashoka Vatika, guarded by rakshasis and grieving for Rama. He watched from a tree until Ravana came and urged her to accept him. Sita refused. When Ravana left, Hanuman approached cautiously, recited Rama’s story and showed her Rama’s ring as proof that he had come from her husband.'],['Hanuman’s Message to Sita','Sita recognized Rama’s ring and listened as Hanuman described Rama’s search and his determination to rescue her. Hanuman offered to carry her back, but Sita declined, choosing to wait for Rama and avoid any question about how she returned. She gave Hanuman a jewel to take to Rama and a message recalling a moment from their life together. Hanuman left with proof that Sita was alive and steadfast.'],['Hanuman Sets Lanka Ablaze','Before leaving Lanka, Hanuman allowed himself to be captured after confronting Ravana’s warriors. Ravana ordered that Hanuman’s tail be set on fire. Hanuman used the flames to leap from rooftop to rooftop, setting parts of the city ablaze before escaping. He made sure Sita was safe, then crossed back over the ocean. He delivered her message and jewel to Rama, restoring the army’s hope.']]},
{name:'Yuddha Kanda',stories:[['The Building of Rama’s Bridge','Rama and his army reached the ocean, but Lanka lay far across the water. After the ocean deity revealed a way forward, Nala led the vanaras in building a bridge. They carried stones and trees to the shore, working together until the army could cross to Lanka.'],['Vibhishana Leaves Ravana’s Court','Ravana’s brother Vibhishana urged him to return Sita and avoid a disastrous war. Ravana rejected his counsel and drove him away. Vibhishana chose to seek refuge with Rama. Though some in Rama’s camp distrusted him, Rama welcomed him and accepted him as an ally. Vibhishana’s knowledge of Lanka later helped Rama’s army understand the challenges ahead.'],['The First Battles at Lanka','Rama’s army surrounded Lanka, and Ravana’s warriors came out to meet them. The fighting spread across the city gates and battlefield. Vanara leaders faced Lanka’s commanders while Rama’s side pressed the siege. The opening battles showed the scale of Ravana’s forces and the courage of the allies who had gathered to rescue Sita.'],['Indrajit’s Serpent Weapons','Indrajit, Ravana’s son, attacked using powerful weapons and concealment. His serpent weapon bound Rama and Lakshmana, leaving the army in despair. Garuda’s arrival freed the brothers from the serpents. The episode revealed Indrajit as a formidable opponent, while the brothers’ release returned hope to the vanara army.'],['Kumbhakarna Awakens','As the war turned against Lanka, Ravana called upon his mighty brother Kumbhakarna. The rakshasa was roused from his long sleep and told of the danger facing their kingdom. Though he criticized Ravana’s choices, Kumbhakarna agreed to fight for his family and Lanka. He entered the battlefield knowing the odds were grave.'],['The Fall of Kumbhakarna','Kumbhakarna advanced through the battlefield, scattering the vanara army with his immense strength. Rama confronted him and fought with powerful arrows. After a fierce struggle, Rama struck Kumbhakarna down. His death was a major loss for Lanka, and Ravana grieved for the brother who had fought despite believing the war was unjust.'],['Indrajit’s Illusion','Indrajit used deception to weaken Rama’s army, creating the appearance that Sita had been killed. The vanaras were overcome with grief, but Vibhishana recognized the act as an illusion. He explained that Indrajit was trying to confuse them and that Sita remained alive. The truth restored the army’s resolve and turned its attention to stopping Indrajit.'],['Lakshmana Defeats Indrajit','Vibhishana revealed that Indrajit was performing a rite at Nikumbhila to strengthen himself for battle. Lakshmana, accompanied by Vibhishana and the vanara warriors, went to confront him. The two warriors fought fiercely. Lakshmana finally defeated Indrajit, ending the threat of Ravana’s most powerful son.'],['Hanuman Brings the Healing Herbs','During the fighting, Lakshmana and many vanara warriors were gravely wounded. Hanuman was sent to find healing herbs on a distant mountain. Unable to identify the right plants, he lifted and carried the mountain itself back to the battlefield. The herbs helped revive the wounded, and the army could continue the struggle.'],['Ahiravan’s Abduction of Rama and Lakshmana','In a later Ramayana episode, Ahiravan—a powerful ruler of the underworld and an ally or relative of Ravana in some versions—uses deception to carry Rama and Lakshmana away. Hanuman discovers that the brothers have been taken below the earth and sets out to rescue them. After overcoming the guardians and Ahiravan’s schemes, Hanuman frees Rama and Lakshmana and brings them back to the battlefield.\nLater-tradition note: This episode is not part of Valmiki’s Yuddha Kanda. Versions differ on Ahiravan’s identity and on the details of the rescue.'],['The Fall of Ravana','The conflict between Rama’s forces and Ravana’s army culminated in a decisive battle. Ravana was defeated, and Sita’s rescue became possible. The ending of the war is commonly understood as the triumph of dharma over destructive pride, though the epic’s aftermath and later traditions contain further complexities.'],['Sita’s Trial by Fire','After Ravana’s defeat, Sita was brought before Rama. In the Valmiki account, Rama spoke of the need to answer public doubts about her time in Lanka. Sita entered the fire, calling upon it to bear witness to her truth. The fire god returned her unharmed, affirming her purity. Retellings differ in how they frame this painful episode.'],['Rama’s Return to Ayodhya','With the war over and Sita rescued, Rama, Sita, Lakshmana and their companions began the journey home. They travelled in the Pushpaka chariot, passing places connected with their years in exile. In Ayodhya, Bharata welcomed Rama and returned the kingdom to him. Rama’s coronation marked the end of exile and the beginning of his reign.']]}

const mbGroups=[
{name:'Adi Parva',stories:[['Sauti Arrives at the Forest of Naimisha','At a twelve-year sacrifice in Naimisha forest, storyteller Sauti arrives and is welcomed by the sages. They ask him to recount the history of the Bharata family. Sauti begins with tales of creation, royal lineages and vows, showing how the epic passes from one gathering of listeners to another.'],['Uttanka’s Journey and the Serpent King Takshaka','Uttanka is sent to obtain his teacher’s wife’s earrings. His dangerous journey brings him to the serpent king Takshaka. Years later, Uttanka urges King Janamejaya to avenge his father Parikshit’s death by beginning a sacrifice that will draw the serpents into the fire.'],['The Story of Ruru and Pramadvara','Ruru falls in love with Pramadvara, but she dies from a snakebite just before their wedding. Grief-stricken, he is offered a chance to give her half his life. Ruru accepts, and Pramadvara returns to life. Their story asks what love may demand in return for a second chance.'],['Chyavana and Sukanya','Sukanya accidentally disturbs the meditation of the aged sage Chyavana. To make amends, she becomes his devoted wife. The Ashvins offer to restore Chyavana’s youth, and Sukanya remains faithful through their test. Chyavana is renewed, and the episode explains the Ashvins’ place in sacred rites.'],['Garuda’s Birth','Vinata and Kadru, wives of sage Kashyapa, become mothers of very different children: Vinata’s sons include Garuda, while Kadru gives birth to the serpents. A wager leaves Vinata enslaved to Kadru. Garuda grows strong and learns that he must obtain amrita to win his mother’s freedom.'],['Garuda’s Quest for the Nectar of Immortality','To free Vinata, Garuda journeys to the guarded place where the gods keep amrita. He overcomes obstacles and carries the vessel toward the serpents. Indra pursues him, but they reach an understanding. Garuda sets the nectar down without drinking; the serpents lose it, while Vinata is released.'],['Kadru and Vinata’s Wager','Kadru and Vinata dispute the color of the divine horse Uchchaihshravas. Kadru secretly orders her serpent sons to darken its tail, making her win. Vinata must serve her sister. The deceit shapes the rivalry between the serpents and Garuda, whose later quest is driven by his mother’s captivity.'],['Parikshit Is Cursed by the Young Sage','King Parikshit, exhausted while hunting, asks sage Samika for water. The sage remains absorbed in meditation and does not answer. In anger, Parikshit places a dead snake around his neck. Samika’s son Shringin hears of the insult and curses the king to die from a serpent’s bite.'],['Takshaka’s Bite and the Death of Parikshit','Parikshit prepares for the curse, surrounding himself with guards and seeking protection. The serpent king Takshaka finds a way past the defenses and bites him. The king dies, and his son Janamejaya inherits the throne. When he learns how his father was killed, Janamejaya resolves to destroy the serpents.'],['Astika Is Born to Save the Serpents','The sage Jaratkaru marries a woman of the serpent lineage, also named Jaratkaru, so the family can continue. Their son Astika grows into a learned and composed young sage. When Janamejaya’s sacrifice begins pulling serpents into the fire, Astika will be the one able to ask the king to stop it.'],['Janamejaya Begins the Serpent Sacrifice','Janamejaya gathers priests and begins a sacrifice intended to destroy the serpent race. As the chants rise, serpents are drawn from across the world and fall toward the fire. Takshaka remains hidden with Indra, but the ritual threatens every snake. The king’s grief becomes a danger reaching far beyond its cause.'],['Astika Stops the Sacrifice','Astika arrives at the sacrifice and praises Janamejaya until the king offers him a boon. Astika asks that the ritual end. The priests warn that Takshaka is nearly drawn into the fire, but Janamejaya honors his promise. The sacrifice stops, and Astika’s judgment prevents vengeance from becoming total destruction.'],['Shantanu Meets the River Goddess Ganga','King Shantanu sees a beautiful woman beside the river and asks her to marry him. She agrees on one condition: he must never question her actions. They have sons, but each time a child is born, Ganga carries him to the river. Shantanu endures this in silence until the eighth child tests him.'],['The Birth and Return of Devavrata','When Ganga carries away their eighth son, Shantanu can no longer remain silent. She reveals that the children were Vasus born on earth under a curse. She keeps the eighth child alive and raises him as Devavrata, teaching him warfare and wisdom. Years later, she returns him to his father as a gifted prince.'],['Shantanu Meets Satyavati','Shantanu falls in love with Satyavati, daughter of a fisherman. Her father agrees to the marriage only if Satyavati’s children inherit the throne. Shantanu refuses to displace Devavrata and returns to the palace in sorrow. Seeing his father’s grief, Devavrata goes to the fisherman to secure the marriage.'],['Devavrata Makes His Terrible Vow','Devavrata gives up his claim to the throne so Satyavati’s children can rule. When the fisherman worries that Devavrata’s future children might claim the kingdom, Devavrata vows lifelong celibacy. The gods call him Bhishma, the one of the terrible vow. Shantanu grants him the power to choose the time of his death.'],['Amba, Ambika, and Ambalika Are Brought to Hastinapura','Bhishma rides to Kashi and carries away its three princesses for his half-brother Vichitravirya. Amba tells him she had already chosen King Shalva. Bhishma lets her go, but Shalva refuses to accept her. Ambika and Ambalika marry Vichitravirya, leaving the kingdom’s succession uncertain.'],['Amba and Shalva’s Broken Promise','Amba returns to Bhishma after Shalva rejects her and asks him to marry her. Bound by his vow, Bhishma refuses. Amba’s life is left in ruins by choices made in the name of royal duty, and she vows to bring Bhishma down. Her determination later shapes the story of Shikhandi.'],['The Birth of Dhritarashtra, Pandu, and Vidura','After Vichitravirya dies without heirs, Satyavati asks Vyasa to continue the royal line. Dhritarashtra is born blind, Pandu pale and physically frail, and Vidura to a maid in the palace. The three grow into very different men, but their descendants will shape the rivalry that leads to war.'],['Kunti Receives a Mantra from Sage Durvasa','As a young woman, Kunti serves the visiting sage Durvasa with care. Pleased by her hospitality, he gives her a mantra to call a deity and receive a child. Curious about its power, Kunti invokes the sun god before marriage. The unexpected result becomes a secret she carries for years.'],['The Birth of Karna','Surya answers Kunti’s invocation, and Karna is born wearing natural armor and earrings. Unmarried and afraid of scandal, Kunti places the infant in a basket and sets him afloat. Adhiratha and Radha find and raise him as their own. Karna grows up loved, unaware of his royal birth.'],['Pandu’s Curse and His Departure for the Forest','Pandu strikes a pair of deer while hunting, unaware that they are a sage and his mate in animal form. The dying sage curses Pandu: if he approaches either wife in desire, he will die. Unable to remain king, Pandu gives up the throne and withdraws to the forest with Kunti and Madri.'],['The Birth of the Pandavas','With Pandu’s consent, Kunti uses Durvasa’s mantra to call the gods. Yudhishthira, Bhima and Arjuna are born to her; Madri invokes the Ashvins and gives birth to Nakula and Sahadeva. The brothers grow up in the forest before returning to Hastinapura, where their talents and popularity trouble the Kauravas.'],['Gandhari’s Hundred Sons Are Born','Gandhari’s pregnancy lasts unusually long. When she gives birth to a mass of flesh, Vyasa divides it and places the pieces in jars. From them come Duryodhana and his brothers, as well as their sister Duhshala. Ominous signs accompany Duryodhana’s birth, but Dhritarashtra raises him as heir.'],['Drona and Drupada’s Friendship Turns to Enmity','As students, Drona and Prince Drupada promise to share everything when Drupada becomes king. Years later, Drona visits him in poverty and asks for help. Drupada dismisses him, saying friendship cannot exist between a king and a poor teacher. Drona remembers the humiliation and later uses his students to capture Drupada.'],['The Princes Learn the Art of War','Drona becomes the Kuru princes’ teacher and trains them in weapons and warfare. Arjuna’s focus impresses him, while Bhima and Duryodhana excel with the mace. The brothers and cousins compete throughout their lessons. Drona’s instruction prepares them for battle but also intensifies the rivalry within the royal family.'],['Ekalavya’s Guru Dakshina','Ekalavya wants to learn archery from Drona, who refuses to teach him. Ekalavya makes a clay image of Drona and practices until he becomes a remarkable archer. When Drona sees his skill, he asks for Ekalavya’s right thumb as a teacher’s fee. Ekalavya gives it, losing his greatest talent.'],['Karna Challenges Arjuna at the Tournament','At a public display of the princes’ skills, Arjuna amazes the crowd with his archery. Karna steps forward and performs the same feats, challenging him. When Karna’s birth is questioned, Duryodhana makes him king of Anga so he can compete. Karna’s gratitude binds him to Duryodhana and his lifelong contest with Arjuna.'],['The Pandavas Escape the Lac Palace','Duryodhana arranges for the Pandavas to stay in a palace made of flammable materials, planning to burn them alive. Warned by Vidura, the brothers secretly dig a tunnel. When the palace is set on fire, they escape underground with Kunti and disappear into the forest, keeping their survival secret.'],['Hidimba, Hidimbi, and the Birth of Ghatotkacha','In the forest, the demon Hidimba plans to eat the Pandavas, but his sister Hidimbi falls in love with Bhima. Bhima defeats Hidimba and marries Hidimbi for a time. Their son Ghatotkacha grows into a powerful warrior with magical abilities, later becoming a crucial ally in the war.'],['Bhima Defeats Bakasura','The Pandavas live quietly in Ekachakra, where Bakasura demands food and a person to eat. Bhima volunteers to take the offering. He eats the food himself, then fights Bakasura and kills him. The town is freed from fear, while the Pandavas continue travelling without revealing their identities.'],['Arjuna Meets the Gandharva Chitraratha','While travelling, Arjuna encounters the Gandharva Chitraratha, who challenges the brothers. After Arjuna defeats him, the two become allies. Chitraratha shares knowledge about royal customs and recommends that the Pandavas appoint a learned priest. His counsel helps the brothers as they continue life as wanderers.'],['Draupadi Is Born from the Sacrificial Fire','King Drupada performs a sacrifice hoping for a son who can defeat Drona. From the fire emerge Dhrishtadyumna, destined to become a warrior, and Draupadi, whose fate will draw the Pandavas and Kauravas into conflict. Their unusual birth begins a new chapter in the family’s struggle for power and justice.'],['Arjuna Wins Draupadi at the Swayamvara','At Draupadi’s swayamvara, suitors must string a mighty bow and hit a target by looking at its reflection. Many kings fail. Arjuna, disguised as a Brahmana, completes the challenge and wins Draupadi. The rulers protest, but the Pandavas defend their victory and take her away, unaware how the contest will change their future.'],['Draupadi Marries the Five Pandavas','When the Pandavas return home with Draupadi, Kunti tells them to share what they have brought before learning what it is. The family treats her words as a command. After counsel with sages and Drupada, Draupadi becomes wife to all five brothers, with rules established to protect harmony.'],['Arjuna’s Pilgrimage and His Marriage to Ulupi','After entering a chamber where Yudhishthira and Draupadi are together, Arjuna accepts a period of exile under the brothers’ agreement. During his travels he meets Ulupi, a Naga princess, who brings him to her underwater realm. They marry, and their son Iravan is born. Arjuna continues his pilgrimage.'],['Arjuna Meets Chitrangada in Manipur','In Manipur, Arjuna meets Princess Chitrangada and asks her father for permission to marry her. The king agrees on the condition that their child remain in Manipur and inherit the throne. Arjuna accepts. Their son Babruvahana grows up in his mother’s kingdom, far from his father’s other family.'],['Krishna Helps Arjuna Win Subhadra','Arjuna visits Dwaraka in disguise and falls in love with Krishna’s sister Subhadra. Krishna understands their feelings and helps them elope, knowing a formal proposal might be refused. Arjuna carries Subhadra away, and Krishna later calms the Yadavas. The marriage strengthens the bond between Krishna’s family and the Pandavas.'],['Arjuna and Krishna Burn the Khandava Forest','Agni asks Krishna and Arjuna to help him consume the Khandava forest. Indra sends rain to protect it, but Arjuna blocks the downpour while Krishna fights beside him. Many creatures flee and the forest burns. The architect Maya survives and offers to build the Pandavas a remarkable hall.'],['Maya Builds a Hall for the Pandavas','Grateful to Arjuna for saving his life, Maya designs a vast assembly hall for the Pandavas. Crystal floors, hidden pools and unusual spaces confuse visitors. The hall becomes a sign of their growing power. When Duryodhana later visits, his humiliation inside it deepens the jealousy that leads to the dice game.']]},
{name:'Sabha Parva',stories:[['Maya’s Marvelous Hall at Indraprastha','Maya completes an extraordinary hall filled with crystal floors, clear pools and doors that seem to vanish. The Pandavas welcome sages and kings there. Its wonders display their prosperity, but also become the setting for Duryodhana’s embarrassment. The hall’s beauty foreshadows the envy and rivalry that will undo the gathering.'],['Narada’s Questions on the Duties of a King','Narada visits Yudhishthira and asks whether he governs wisely. His questions range from justice and taxation to the care of soldiers, farmers and visitors. Yudhishthira listens, understanding that a king’s duty is more than victory or wealth. The conversation frames the responsibilities that accompany his growing power.'],['Krishna, Bhima, and Arjuna Set Out for Magadha','Jarasandha has imprisoned many kings. Krishna, Bhima and Arjuna travel to Magadha in disguise to challenge him. They enter the city and reveal their purpose. Jarasandha agrees to a duel, choosing Bhima. The struggle will decide whether the captive kings can be freed and Yudhishthira can perform the Rajasuya.'],['Bhima’s Final Duel with Jarasandha','Bhima and Jarasandha wrestle for days, each matching the other’s strength. Bhima cannot defeat him until Krishna gives a sign by splitting a blade of grass. Bhima tears Jarasandha apart so the halves cannot reunite. The imprisoned kings are freed, clearing the way for Yudhishthira’s imperial sacrifice.'],['Arjuna’s Campaign in the North','For Yudhishthira’s Rajasuya, Arjuna leads a northern campaign to secure recognition and tribute from neighboring rulers. He faces resistance, but many kings accept his authority after battle or negotiation. The journey tests his skill as a commander and expands the Pandava kingdom beyond Indraprastha.'],['Bhima’s Campaign in the East','Bhima travels east to gather tribute for the Rajasuya. He meets powerful rulers and wins their submission through diplomacy and combat. His campaign demonstrates the strength behind Yudhishthira’s growing sovereignty. The wealth and support Bhima secures help make the coming sacrifice possible.'],['Sahadeva’s Campaign in the South','Sahadeva leads the southern campaign, visiting kingdoms and gathering their acknowledgment of Yudhishthira’s rule. Some rulers submit peacefully; others are defeated. His success adds to the resources needed for the Rajasuya and shows that each brother contributes to the family’s rise.'],['Nakula’s Campaign in the West','Nakula leads the Pandava campaign through western lands. He meets local rulers, secures tribute and brings distant kingdoms into the alliance around Yudhishthira. His journey completes the four-direction conquest begun by his brothers and prepares the way for the Rajasuya ceremony.'],['Yudhishthira’s Rajasuya Sacrifice','After the kings accept his authority, Yudhishthira performs the Rajasuya sacrifice. Rulers and sages gather at Indraprastha, and the ceremony celebrates the Pandavas’ new standing. Krishna is chosen to receive the first honor. The choice angers Shishupala, turning a sacred gathering into a deadly confrontation.'],['Shishupala Challenges Krishna','Shishupala insults Krishna before the assembled kings, accusing the Pandavas of dishonoring the ceremony. Krishna has promised Shishupala’s mother to forgive a set number of offenses. When Shishupala continues beyond that limit, Krishna kills him with his discus. The assembly falls silent, and Yudhishthira’s sacrifice proceeds.'],['Duryodhana Walks Through the Hall of Illusions','Duryodhana mistakes crystal surfaces for water and pools for solid floors. The Pandavas and their attendants laugh when he stumbles. Humiliated, Duryodhana leaves Indraprastha feeling mocked. His wounded pride hardens into a plan to take their kingdom through a game of dice.'],['Shakuni Invites Yudhishthira to Dice','Duryodhana asks his uncle Shakuni to arrange a game with Yudhishthira. Dhritarashtra sends the invitation, and Yudhishthira feels bound by royal custom to attend, though he knows the game is dangerous. Shakuni plays on Duryodhana’s behalf, drawing Yudhishthira into increasingly reckless wagers.'],['Yudhishthira Loses His Kingdom and Freedom','Yudhishthira wagers his jewels, wealth, kingdom, brothers and finally himself, losing each time. He then stakes Draupadi, though whether he had any right to wager her becomes central. The game strips the Pandavas of power and forces the Kuru elders to confront a grave injustice.'],['Draupadi Is Summoned to the Assembly','Dushasana is sent to bring Draupadi into the assembly. She refuses to come until the elders answer whether Yudhishthira, having lost himself first, could still wager her. Dushasana drags her before the court. Her question unsettles the room, yet the powerful men hesitate to intervene.'],['Draupadi Questions the Kuru Elders','Before the elders, Draupadi asks whether she was lawfully won if Yudhishthira had already lost his freedom. Bhishma says the question is difficult because the rules and duties conflict. Vikarna speaks in her defense, while Karna supports the Kauravas. The assembly’s failure to protect her marks a moral collapse.'],['Bhima’s Vows in the Assembly','Seeing Draupadi humiliated, Bhima swears to kill Dushasana and break Duryodhana’s thigh. Arjuna and the other brothers restrain him, but the vows remain. Dhritarashtra fears the consequences and grants Draupadi boons, restoring the Pandavas’ freedom and possessions for a time.'],['Dhritarashtra Grants Draupadi Her Boons','Dhritarashtra offers Draupadi a boon, and she asks that Yudhishthira be freed. With a second boon, she secures the freedom of her other husbands and their weapons. She refuses to ask for more, trusting their virtue. The Pandavas depart, but Duryodhana soon calls them back to another game.'],['The Second Dice Game and the Pandavas’ Exile','A second game sets the terms of a thirteen-year exile, including one final year in disguise. Yudhishthira loses, and the Pandavas leave with Draupadi. Dushasana’s insult and Duryodhana’s triumph remain fresh in their minds. They enter the forest carrying vows of justice and knowing war may follow.']]},
{name:'Vana Parva',stories:[['The Pandavas Begin Their Forest Exile','The Pandavas leave the city and enter the forest with Draupadi. They meet sages, endure hardship and consider how to live after losing their kingdom. Yudhishthira worries about those who followed them, while Bhima and Draupadi urge action against the Kauravas. The forest becomes both refuge and school.'],['Bhima Defeats the Demon Kirmira','Near the forest, the demon Kirmira blocks the Pandavas’ path and threatens them. He is related to Bakasura and seeks revenge. Bhima steps forward and fights him while the others watch. After a fierce struggle, Bhima kills Kirmira, clearing the way for the exiles to continue their journey.'],['Arjuna Sets Out to Win Celestial Weapons','The Pandavas know they may face a great war, so Yudhishthira sends Arjuna to seek divine weapons. Arjuna travels north, performs austerities and gains the attention of the gods. His departure leaves the family anxious, but his mission is essential if they are to challenge the Kauravas.'],['Arjuna Meets Shiva as the Kirata Hunter','While Arjuna performs penance, a wild boar charges toward him. Arjuna and a hunter release arrows at the same moment and argue over who struck it. They fight, and Arjuna discovers the hunter is Shiva in disguise. Pleased by his courage, Shiva grants him the Pashupata weapon.'],['Arjuna Receives the Pashupata Weapon','After revealing himself, Shiva gives Arjuna the powerful Pashupata weapon and instructs him in its use. Other gods offer celestial weapons as well. Arjuna accepts them with humility, aware their power must be used only when necessary. His training prepares him for the coming war and deepens his connection to the divine world.'],['Urvashi’s Curse and Arjuna’s Year in Disguise','At Indra’s court, Urvashi approaches Arjuna, but he honors her as an ancestor and refuses. Angered, she curses him to live as a eunuch. Indra explains that the curse will serve as a blessing for one year. During the final year of exile, Arjuna will use it to live as Brihannala.'],['Arjuna Visits Indra’s Heaven','Arjuna reaches Indra’s celestial court and learns music, dance and divine warfare. Indra welcomes him as a son and prepares him for battles against powerful enemies. Arjuna’s stay is not merely a reward; it gives him weapons and knowledge to protect his brothers and meet the dangers ahead.'],['Arjuna Battles the Nivatakavachas','Indra asks Arjuna to defeat the Nivatakavacha demons, whose stronghold has resisted the gods. Arjuna enters their realm and fights them with celestial weapons. He overcomes their defenses and returns victorious. The battle proves he can use his new powers against formidable enemies without losing discipline.'],['The Pandavas Visit the Sacred Pilgrimage Sites','Lomasa guides Yudhishthira and the brothers on pilgrimage through sacred places. At each site he tells histories of sages, kings and vows. The journey gives the exiles a way to endure hardship and reconnect with the land’s ancient stories. Yudhishthira learns that many heroes faced trials before finding their way forward.'],['Rishyasringa and the Kingdom Without Rain','A kingdom suffers a long drought, and its people learn that the young ascetic Rishyasringa’s presence may bring rain. A princess is sent to invite him from his secluded forest life. When he arrives, the skies open and the land is restored. The story joins ascetic power, royal need and human connection.'],['The Hawk, the Dove, and King Shibi','A hawk pursues a dove that seeks refuge with King Shibi. The king promises to protect it, while the hawk argues that it too needs food. Shibi offers his own flesh in exchange. As he weighs it against the dove, he discovers the test is divine. His compassion wins praise.'],['Nala and Damayanti Hear of One Another','Princess Damayanti hears of King Nala’s virtues from a talking swan, and Nala hears of her beauty and character. Though they have never met, they fall in love. The swan carries messages between them. Their story begins with admiration from afar and moves toward a choice that will challenge gods and kings.'],['Damayanti Chooses Nala at the Swayamvara','At Damayanti’s swayamvara, the gods appear in Nala’s likeness, hoping she will choose one of them. Damayanti studies the figures and recognizes the mortal Nala by his human signs. She places the garland around him. The gods accept her choice, and the couple marry.'],['Nala Loses His Kingdom in a Dice Game','Kali enters Nala’s life and influences him toward a dice game with his brother Pushkara. Nala loses his kingdom and wealth, while Damayanti chooses to remain beside him. The couple leave for the forest with little to carry. Their misfortune mirrors the Pandavas’ exile, making Nala’s story meaningful to Yudhishthira.'],['Nala and Damayanti Are Separated in the Forest','As they wander hungry and exhausted, Nala fears that Damayanti’s presence will make her suffer more. One night he leaves her while she sleeps. Damayanti wakes alone and searches through the forest. Nala’s decision deepens their sorrow, but each must survive separately before finding the way back.'],['Nala Meets the Serpent Karkotaka','Nala rescues the serpent Karkotaka from a fire. The serpent bites him, changing his appearance, but explains that the transformation will protect him from Kali and help him later. Nala takes the name Bahuka and learns to drive horses for King Rituparna. His hidden identity gives him time to prepare for reunion.'],['Nala Learns the Secret of the Dice','Nala serves King Rituparna, an expert at dice. In exchange for teaching him to drive horses, Rituparna teaches Nala the knowledge behind the game. Nala gains control over the dice that once ruined him. With his confidence restored, he becomes ready to return to Damayanti and reclaim his life.'],['Nala and Damayanti Find Each Other Again','Damayanti arranges a second swayamvara, hoping the news will reach Nala. Bahuka arrives with King Rituparna, and Damayanti recognizes signs of her husband beneath his disguise. Nala reveals himself, and the couple reunite. He regains his true form, defeats Pushkara in a new game and restores his kingdom.'],['Savitri Follows Yama to Save Satyavan','Savitri chooses Satyavan despite learning that he is destined to die within a year. When Yama comes to claim Satyavan’s life, she follows him and speaks with wisdom and devotion. Yama grants her boons, but she asks for one that requires Satyavan to live. Bound by his promise, Yama restores her husband.'],['Bhima Meets Hanuman on the Mountain Path','Searching for a fragrant flower for Draupadi, Bhima meets an old monkey lying across the path. The monkey asks him to move its tail, but Bhima cannot lift it. The monkey reveals himself as Hanuman, his elder brother through the wind god. Hanuman blesses Bhima and teaches him humility.'],['Duryodhana Is Captured by the Gandharvas','During a visit to the forest, Duryodhana is captured by the Gandharva king Chitrasena. The Kauravas cannot free him, and Yudhishthira asks the Pandavas to rescue their cousin despite their enmity. Arjuna and Bhima defeat the Gandharvas and bring Duryodhana back. Their act leaves him ashamed and resentful.'],['The Pandavas Rescue Duryodhana','The Pandavas free Duryodhana and return him safely to his camp. He is humiliated that the cousins he wronged have saved him. Duryodhana considers ending his life, but Karna and Shakuni persuade him to continue. The rescue reveals Yudhishthira’s commitment to family duty amid a bitter feud.'],['Jayadratha Abducts Draupadi','While the Pandavas are away, Jayadratha sees Draupadi and carries her off in his chariot. She resists and condemns him. The brothers pursue Jayadratha, defeat him and bring him before Yudhishthira. Draupadi asks that his life be spared, but Bhima humiliates him by cutting his hair.'],['The Story of Rama and Sita','To comfort Yudhishthira, Markandeya recounts Rama’s story: he loses his kingdom, goes into exile with Sita and Lakshmana, then searches for Sita after Ravana abducts her. Rama allies with the vanaras, defeats Ravana and returns home. The tale offers the Pandavas an example of endurance through hardship.'],['The Wise Hunter Teaches the Proud Ascetic','A learned Brahmana seeks wisdom from an ascetic, who directs him to a humble hunter devoted to his parents. The hunter explains that virtue depends on how one acts in daily life, not merely on status or ritual. His teaching challenges the Brahmana to recognize wisdom in an unexpected place.'],['Draupadi and Satyabhama Discuss Marriage and Duty','Satyabhama asks Draupadi how she keeps the affection of five husbands. Draupadi says she does not rely on magic or control; she treats each husband with respect, avoids jealousy and attends to the household. Their conversation offers a personal view of marriage and duty, and shows their friendship.'],['The Yaksha’s Questions at the Forest Lake','At a lake guarded by a mysterious Yaksha, each Pandava drinks without answering its questions and falls unconscious. Yudhishthira listens and answers questions about life, duty and wisdom. Asked to restore one brother, he chooses Nakula so both Kunti and Madri will have a living son. The Yaksha reveals himself as Dharma and revives all four.']]},
{name:'Virata Parva',stories:[['The Pandavas Choose Their Disguises','With their twelve years in the forest complete, the Pandavas must spend one year undiscovered. They plan disguises suited to Virata’s court: Yudhishthira becomes a courtier, Bhima a cook, Arjuna a dance teacher, Nakula a horse keeper and Sahadeva a cattle tender. Draupadi enters the palace as a maid.'],['Yudhishthira Becomes Virata’s Adviser','Yudhishthira enters King Virata’s court as Kanka, a learned courtier who plays dice and advises the king. He hides his royal identity and watches over his family from within the palace. His patience is tested as the disguised Pandavas face danger while trying to complete their final year unnoticed.'],['Bhima Enters the Palace Kitchen','Bhima takes the name Ballava and becomes a cook in Virata’s palace. His great size and strength are hard to conceal, so he claims experience in wrestling and food preparation. He uses his position to protect his family and waits for the moment when his strength will be needed.'],['Arjuna Becomes Brihannala','Arjuna adopts the name Brihannala and teaches music and dance to Princess Uttara. Urvashi’s curse allows him to live in this disguise for a year. Though the role seems far from the battlefield, it places him near the royal family and hides his identity until the time comes to fight.'],['Draupadi Serves as Sairandhri','Draupadi enters the palace as Sairandhri, a woman skilled in arranging hair and clothing. She asks Queen Sudeshna for protection and warns that she will not accept harassment. Her position gives her little power, but she remains alert and resourceful while trying to protect the secret of her husbands.'],['Bhima Defeats Kichaka','Kichaka, the queen’s brother, harasses Draupadi and refuses to heed her warnings. She asks Bhima for help. At night, Bhima meets Kichaka in a hall and defeats him in a fierce fight. The court believes the mysterious Gandharva husbands punished him, and Draupadi’s tormentor is gone.'],['The Kauravas Raid Virata’s Cattle','Duryodhana’s forces raid Virata’s cattle, hoping to test whether the Pandavas are hiding in the kingdom. Prince Uttara boasts that he can defeat them, but when he sees the Kaurava army he loses courage. Brihannala offers to drive his chariot and help him face the warriors.'],['Arjuna Reveals His Identity Beneath the Shami Tree','Brihannala takes Uttara to a shami tree where Arjuna’s weapons are hidden. He reveals his true identity and asks Uttara to serve as his charioteer. Uttara is astonished, then agrees. Arjuna retrieves his bow Gandiva and prepares to meet the Kaurava army.'],['Arjuna and Uttara Defend the Cattle','Arjuna drives into battle while Uttara holds the reins. Arjuna defeats the Kaurava warriors and recovers Virata’s cattle, sparing the elders he reveres. The victory protects the kingdom and keeps the Pandavas’ disguise intact until the year is complete.'],['The Pandavas Reveal Themselves to King Virata','When the year ends, the Pandavas reveal who they are. King Virata honors them and offers his daughter Uttara to Arjuna. Arjuna has taught her as a student and accepts her instead as a bride for his son Abhimanyu. The alliance with Virata strengthens the Pandavas before war.']]},
{name:'Udyoga Parva',stories:[['The Pandavas Ask for Their Share of the Kingdom','After exile, the Pandavas send word that they seek the kingdom promised to them. They prefer a peaceful settlement but will not surrender their rights. Dhritarashtra’s court debates their demand, while Duryodhana remains unwilling to return even a small portion of the land.'],['Duryodhana and Arjuna Seek Krishna’s Support','Duryodhana and Arjuna both visit Krishna as he rests. Krishna offers one side his large Narayani army and the other his own presence without weapons. Duryodhana chooses the army, while Arjuna chooses Krishna as his charioteer. Their choices reveal their different ideas of strength.'],['Duryodhana Chooses Krishna’s Army','Krishna gives Duryodhana the choice of the Narayani army, while Arjuna will have Krishna himself, unarmed. Duryodhana is pleased to receive the soldiers. Arjuna is content with Krishna’s companionship. Their decision sets the battle’s alliances and shows the Pandavas’ trust in Krishna beyond military numbers.'],['Shalya Is Persuaded to Join Duryodhana','Shalya travels to support the Pandavas, but Duryodhana secretly arranges lavish hospitality along the way. Thinking Yudhishthira provided it, Shalya promises a boon to Duryodhana. When he learns the truth, Shalya must honor his word, though he later agrees to weaken Karna’s confidence as his charioteer.'],['Sanjaya Carries the Kauravas’ Message to the Pandavas','Sanjaya visits the Pandavas as Dhritarashtra’s messenger. He urges them to avoid war and reminds them of the destruction it will bring. Yudhishthira listens but insists that peace requires justice. Sanjaya returns to Hastinapura carrying the Pandavas’ position and a warning that delay will not erase their claim.'],['Yudhishthira Offers One Last Path to Peace','Yudhishthira says the Pandavas will accept even a small settlement if it allows peace and preserves their rightful place. His offer shows restraint after years of hardship. Duryodhana refuses any compromise, making the failure of negotiation increasingly clear to the kings gathering on both sides.'],['The Story of Vidula and Her Son','Kunti tells Krishna the story of Queen Vidula, whose son retreats after defeat. Vidula challenges his despair and urges him to recover his courage and act for his people. Her words move him to return to the struggle. Kunti sends the tale as a message to the Pandavas before war.'],['Krishna Sets Out as a Peace Envoy','The Pandavas ask Krishna to travel to Hastinapura and seek peace. He agrees, carrying their offer while knowing Duryodhana may refuse. Kunti gives Krishna words for her sons, reminding them of their duty. Krishna’s journey is the final major attempt to prevent war through diplomacy.'],['Krishna Refuses Duryodhana’s Feast','Duryodhana invites Krishna to dine at the royal palace, but Krishna declines while the conflict remains unresolved. He chooses instead to accept Vidura’s simple hospitality. His decision signals that he will not be swayed by luxury or flattery and that the purpose of his visit is justice and peace.'],['Krishna Speaks for Peace in the Kuru Assembly','Krishna addresses the Kuru court and urges the elders to return the Pandavas’ kingdom. He describes the cost of war and asks Duryodhana to choose reconciliation. Bhishma, Vidura and others support peace, but Duryodhana rejects their counsel. The assembly hears the last clear appeal before battle.'],['Duryodhana Plots to Capture Krishna','Duryodhana decides to seize Krishna and prevent him from leaving the court. Krishna is not taken by surprise. He reveals his vast divine form before the assembly, showing that he cannot be restrained by force. The Kuru elders are awed, while Duryodhana remains set on war.'],['Krishna Reveals His Universal Form','As Duryodhana’s plan to capture him unfolds, Krishna displays his universal form in the Kuru assembly. The gathered rulers see gods and worlds within him. Dhritarashtra briefly receives sight to beh
