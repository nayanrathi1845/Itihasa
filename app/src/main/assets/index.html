['वन में वृद्धजनों के अंतिम दिन','वृद्धजन वन में अपनी आध्यात्मिक साधना जारी रखते हैं, जबकि संजय उनकी सेवा करते हैं। उनका जीवन शांत है और राजनीति से दूर। पांडवों को स्वीकारना पड़ता है कि उनके माता-पिता की पीढ़ी का अंत निकट है। उनका संन्यास युद्ध के बाद परिवार के जीवन का अंतिम अध्याय बन जाता है।'],
['नारद का वन की दावाग्नि का समाचार लाना','ऋषि नारद युधिष्ठिर को बताते हैं कि दावाग्नि ने धृतराष्ट्र, गांधारी और कुंती को ग्रस लिया है। उन्होंने भागना नहीं चुना और तपस्या के बीच मृत्यु स्वीकार की। संजय बचकर समाचार लाए हैं। पांडव शोक करते हैं, यह जानते हुए कि उनके वृद्धजन उसी त्याग के साथ मृत्यु को प्राप्त हुए जो उन्होंने चुना था।'],
['गांधारी का शाप यादवों तक पहुँचता है','बहुत पहले युद्ध के बाद गांधारी ने कृष्ण के वंश को शाप दिया था। वर्षों बाद यादव आपस में झगड़ने लगते हैं और द्वारका में विनाश के लक्षण दिखाई देते हैं। कृष्ण समझ जाते हैं कि शाप फलीभूत हो रहा है। वे बचने का प्रयास नहीं करते और स्वीकार करते हैं कि उनके लोगों का समय आ गया है।'],
['साम्ब और लोहे का मूसल','युवा यादव साम्ब को गर्भवती स्त्री के वेश में सजाकर आए हुए ऋषियों का उपहास करते हैं और पूछते हैं कि कौन-सा शिशु जन्म लेगा। ऋषि शाप देते हैं कि लोहे का मूसल उनके वंश का नाश करेगा। मूसल को घिसकर समुद्र में फेंक दिया जाता है, पर उसके लोहे के टुकड़े तट पर सरकंडों के रूप में लौट आते हैं और विपत्ति का बीज लिए रहते हैं।'],
['यादवों का अंतिम कलह','समुद्र-तट की एक सभा में यादव मदिरा पीते हैं और पुरानी शिकायतों पर झगड़ पड़ते हैं। लोहे के सरकंडे शस्त्र बन जाते हैं और वे एक-दूसरे पर भीषण युद्ध में टूट पड़ते हैं। कृष्ण अपने वंश को स्वयं को नष्ट करते देखते हैं। केवल कुछ लोग बचते हैं, और द्वारका की शक्ति एक ही दिन में समाप्त हो जाती है।'],
['कृष्ण का संसार से प्रस्थान','यादवों के विनाश के बाद कृष्ण वन में जाकर एक वृक्ष के नीचे बैठ जाते हैं। जरा नाम का एक व्याध उनके पैर को हिरण समझकर बाण चला देता है। कृष्ण उसे क्षमा करके संसार छोड़ देते हैं। यादवों का युग समाप्त होता है, और पांडव जान लेते हैं कि उनका अपना समय भी निकट है।'],
['अर्जुन का द्वारका लौटना','कृष्ण के प्रस्थान के बाद अर्जुन द्वारका जाता है और नगर को शोकग्रस्त और असुरक्षित पाता है। वह जीवित बची स्त्रियों और बच्चों को इकट्ठा करके उन्हें सुरक्षित ले जाने की तैयारी करता है। कृष्ण के बिना अर्जुन उस शक्ति के अभाव को अनुभव करता है जो कभी उसके धनुष से अविभाज्य लगती थी।'],
['अर्जुन का बचे हुए लोगों की रक्षा में असफल होना','मार्ग में लुटेरे शरणार्थियों पर आक्रमण करते हैं। अर्जुन के बाण और बल उसका साथ छोड़ देते हैं, और वह सबकी रक्षा नहीं कर पाता। वह समझ जाता है कि कृष्ण के जाने और युग के अंत के साथ उसकी पुरानी शक्तियाँ क्षीण हो गई हैं। बचे हुए लोग बिखर जाते हैं, और अर्जुन यह पीड़ादायक ज्ञान लेकर पांडवों के पास लौटता है।'],
['पांडवों का राज्य-त्याग','कृष्ण के प्रस्थान और द्वारका के पतन का समाचार सुनकर पांडव परीक्षित का राज्याभिषेक करके सिंहासन छोड़ देते हैं। वे राजसी वस्त्र त्यागकर हिमालय की ओर अंतिम यात्रा आरंभ करते हैं। द्रौपदी और भाई युधिष्ठिर के पीछे चलते हैं, सत्ता और संपत्ति से मुँह मोड़कर।'],
['महाप्रस्थान में द्रौपदी का गिरना','जैसे-जैसे दल उत्तर की ओर चढ़ता है, द्रौपदी गिर पड़ती है। भीम पूछते हैं कि वह सबसे पहले क्यों गिरी। युधिष्ठिर कहते हैं कि वह अन्य भाइयों से अधिक अर्जुन को चाहती थी। वे पीछे नहीं मुड़ते, यात्रा जारी रखते हैं, जबकि अन्य मौन शोक करते हैं।'],
['भाइयों का एक-एक करके गिरना','सहदेव, नकुल, अर्जुन और भीम बारी-बारी से मार्ग में गिरते हैं। युधिष्ठिर हर एक से जुड़े दोष बताते हैं: ज्ञान, सौंदर्य, कौशल या बल का अभिमान। वे बिना पीछे मुड़े उनकी मृत्यु को स्वीकार करके आगे बढ़ते हैं, जबकि वफ़ादार कुत्ता उनके साथ रहता है।'],
['कुत्ते के साथ युधिष्ठिर का आगे बढ़ना','इंद्र का रथ युधिष्ठिर को स्वर्ग ले जाने आता है, पर युधिष्ठिर अपने पीछे आए कुत्ते को छोड़ने से मना कर देते हैं। इंद्र कहते हैं कि कोई मनुष्य पशु के साथ प्रवेश नहीं कर सकता। युधिष्ठिर स्वर्ग के पुरस्कार की तुलना में निष्ठा को चुनते हैं, और कुत्ता स्वयं को अपने पुत्र की परीक्षा लेते हुए धर्म के रूप में प्रकट करता है।'],
['इंद्र का युधिष्ठिर को स्वर्ग आमंत्रित करना','इंद्र युधिष्ठिर को स्वर्ग में आमंत्रित करते हैं, पर वे पूछते हैं कि उनके भाइयों और द्रौपदी का क्या हुआ। रथ उन्हें आगे ले जाता है, और वे दुर्योधन को देवताओं के बीच सम्मानित देखते हैं। यह दृश्य युधिष्ठिर को विचलित करता है और वे पूछते हैं कि उनके प्रियजन कहाँ गए।'],
['कुत्ते को न छोड़ने का युधिष्ठिर का निश्चय','स्वर्ग में प्रवेश से पहले युधिष्ठिर उस कुत्ते को छोड़ने से मना करते हैं जो उनके साथ बना रहा। कुत्ता उनके दिव्य पिता धर्म बन जाता है और उनकी करुणा की प्रशंसा करता है। यह अंतिम परीक्षा सिद्ध करती है कि युधिष्ठिर निजी पुरस्कार से अधिक निष्ठा और देखभाल को महत्त्व देते हैं।'],
['स्वर्ग में युधिष्ठिर का दुर्योधन को देखना','युधिष्ठिर दुर्योधन को देवताओं के बीच वैभव के साथ बैठा पाते हैं। वे समझ नहीं पाते कि जिसने इतना कष्ट दिया, उसका सम्मान क्यों हो रहा है, जबकि उनका अपना परिवार अनुपस्थित है। वे भाइयों और द्रौपदी को पाए बिना वहाँ रहने से मना करते हैं और उनके भाग्य में सहभागी होने पर अड़ जाते हैं।'],
['कष्ट के लोक की परीक्षा','एक मार्गदर्शक युधिष्ठिर को अँधेरे और पीड़ादायक लोक से ले जाता है, जहाँ उन्हें भाइयों और द्रौपदी की आवाज़ें सुनाई देती हैं। वे आराम की ओर लौटने के बजाय उनके साथ रहना चुनते हैं। यह दृश्य अंतिम परीक्षा सिद्ध होता है; फिर वे अपने प्रियजनों को स्वर्ग में पुनः स्थापित देखते हैं।'],
['स्वर्ग में पांडवों और द्रौपदी का पुनर्मिलन','देवता पांडवों, द्रौपदी और उनके सहयोगियों की अंतिम नियति समझाते हैं। युधिष्ठिर अपने परिवार को दिव्य रूपों में देखते हैं और समझते हैं कि सांसारिक गुण और दोष ने उनके मार्ग कैसे गढ़े। महाकाव्य रणभूमि से परे पुनर्मिलन और कुरु परिवार की लंबी यात्रा के साथ समाप्त होता है।']
];

['भगवान विष्णु के अनेक अवतार','भागवत विष्णु के अनेक अवतारों का स्मरण करता है, जो तब प्रकट होते हैं जब संसार को रक्षा या मार्गदर्शन चाहिए। भगवान युग के संकट के अनुरूप रूप धारण करते हैं—प्रलय से जीवन को बचाने वाले मत्स्य से लेकर पृथ्वी को उठाने वाले वराह तक। ये प्रसंग श्रोताओं को कृष्ण के जीवन के लिए तैयार करते हैं, जो इस पुराण की केंद्रीय कथा है।'],
['व्यास को अपना कार्य अधूरा लगता है','वेदों, इतिहासों और महाभारत की रचना के बाद व्यास सरस्वती के तट पर अशांत मन से बैठे थे। उनकी महान रचनाएँ उन्हें शांति नहीं दे पाई थीं। उन्होंने धर्म और मानव जीवन के लक्ष्यों को समझाया था, फिर भी उन्हें लगा कि भगवान की प्रेममयी लीलाओं पर उन्होंने अभी पर्याप्त ध्यान नहीं दिया।'],
['नारद व्यास को भक्ति-कथाओं की शक्ति दिखाते हैं','नारद व्यास के पास आए और उनकी बेचैनी समझ गए। उन्होंने बताया कि यदि भगवान की महिमा न हो तो केवल धर्म और ज्ञान का लेखन हृदय को अछूता छोड़ सकता है। नारद ने व्यास से दिव्य प्रेम और भक्तों के जीवन का गान करने का आग्रह किया। इसी परामर्श से व्यास ने भागवत की रचना की।'],
['दासी-पुत्र से ऋषि बनने तक नारद की यात्रा','नारद ने अपने एक पूर्व जन्म को याद किया, जब वे एक दासी के बालक के रूप में विनम्रता से संतों की सेवा करते थे। वे उनसे भगवान की चर्चा सुनते और उनका आशीर्वाद पाते। माँ की मृत्यु के बाद वे अकेले भटके और सुनी हुई बातों का ध्यान करते रहे। उस जीवन के अंत में उनकी भक्ति उन्हें नारद के रूप में उनके भविष्य की ओर ले गई।'],
['पांडव शिविर पर अश्वत्थामा का रात्रि आक्रमण','कुरुक्षेत्र युद्ध के बाद अश्वत्थामा रात में सोते हुए शिविर में घुसा और उसने द्रौपदी के पुत्रों तथा अन्य योद्धाओं को मार डाला। अर्जुन ने उसका पीछा किया और उसे द्रौपदी के सामने ले आए। अपने बच्चों के शोक में डूबी द्रौपदी ने उसे जीवित छोड़ने को कहा। पांडवों ने उसकी मणि उतार ली और उसे दंड दिया; इस प्रकार बिना एक और हत्या के यह प्रसंग समाप्त हुआ।'],
['अर्जुन अश्वत्थामा का पीछा करते हैं','रात के संहार के बाद भागे अश्वत्थामा के पीछे अर्जुन निकल पड़े। घिर जाने पर अश्वत्थामा ने एक भयानक अस्त्र छोड़ा; अर्जुन ने अपने अस्त्र से उत्तर दिया। इससे पहले कि अस्त्र संसार को नष्ट करते, ऋषियों ने हस्तक्षेप किया। अर्जुन ने अपना अस्त्र लौटा लिया, और बाद में कृष्ण ने अश्वत्थामा के अंतिम प्रहार से गर्भस्थ परीक्षित की रक्षा की।'],
['कृष्ण गर्भस्थ परीक्षित की रक्षा करते हैं','अश्वत्थामा ने अपना अस्त्र उत्तरा के गर्भस्थ शिशु की ओर चलाया, जो पांडव वंश का अंतिम उत्तराधिकारी था। उत्तरा ने रक्षा के लिए कृष्ण को पुकारा। कृष्ण तेजोमय रूप में गर्भ में प्रविष्ट हुए और उन्होंने शिशु को अस्त्र की ज्वाला से बचा लिया। परीक्षित जीवित रहे और भगवान की कृपा से वंश आगे चला।'],
['कृष्ण के प्रति कुंती की कृतज्ञता-प्रार्थना','जब कृष्ण विदा होने लगे, तो कुंती को याद आया कि उन्होंने एक के बाद एक संकट में उनके परिवार की रक्षा कैसे की थी। उन्होंने प्रार्थना की कि कठिनाइयाँ उनका मन कृष्ण की ओर लगाए रखें और सुख उन्हें भुला न दे। उनके शब्द दुख की कामना नहीं थे, बल्कि उस शरण पर विश्वास की अभिव्यक्ति थे जो उन्हें कृष्ण में मिली थी।'],
['युधिष्ठिर युद्ध की कीमत से जूझते हैं','पांडव युद्ध जीत चुके थे, फिर भी युधिष्ठिर को केवल विधवाएँ, शोकाकुल माता-पिता और मारे गए संबंधी दिखाई देते थे। इतनी कीमत पर मिले सिंहासन के वे स्वयं को योग्य नहीं मानते थे। कृष्ण और ऋषियों ने उन्हें याद दिलाया कि प्रजा को अब भी एक न्यायी शासक चाहिए। युधिष्ठिर राज्य को फिर से सँवारने का भार स्वीकार करने लगे।'],
['भीष्म का अंतिम उपदेश और प्रस्थान','भीष्म बाणों की शय्या पर लेटे थे और उन्होंने युधिष्ठिर को धर्म, न्याय और राजा के दायित्वों का ज्ञान दिया। उचित समय आने पर भीष्म ने अपना मन भगवान में स्थिर किया और देह त्याग दी। पांडवों ने उस वृद्ध के लिए शोक किया जिसने पीढ़ियों तक उनके परिवार का मार्गदर्शन किया था।'],
['कृष्ण द्वारका लौटते हैं','युद्ध के बाद कृष्ण हस्तिनापुर से विदा होकर पश्चिम की ओर द्वारका चले। नगरवासियों ने आनंद से उनका स्वागत किया; वे अपने प्रिय संबंधी और रक्षक को फिर देखने के लिए उत्सुक थे। युद्ध की उथल-पुथल के बाद उनकी वापसी ने सबको सांत्वना दी, और कथा कुरु वंश की अगली पीढ़ी की ओर मुड़ गई।'],
['कृष्ण द्वारका में प्रवेश करते हैं','कृष्ण ने द्वारका में प्रवेश किया तो लोगों ने संगीत, पुष्पों और स्नेह से उनका अभिनंदन किया। नगर का आनंद भगवान और उनसे प्रेम करने वालों के बीच के बंधन को दर्शाता था। वे अपने परिवार से मिले और यादवों के बीच फिर अपना जीवन जीने लगे, जबकि बाहरी संसार की घटनाएँ आगे बढ़ती रहीं।'],
['कृष्ण की रक्षा में परीक्षित का जन्म','गर्भ में अश्वत्थामा के अस्त्र से बचने के बाद परीक्षित का जन्म हुआ। परिवार प्रसन्न हुआ कि कुरु वंश आगे चलेगा। बड़े होते हुए वे संसार को ध्यान से देखते और उस रहस्यमय रूप को खोजते जो जन्म से पहले उन्हें दिखा था। हर वस्तु को परखने की इसी आदत से उनका नाम परीक्षित पड़ा—परीक्षा करने वाला।'],
['नारद युधिष्ठिर से मिलने आते हैं','नारद युधिष्ठिर से मिलने आए और उन्होंने राजा को अब भी युद्ध की हानियों के बोझ से दबा पाया। उन्होंने याद दिलाया कि जीवन काल के अनुसार चलता है और बुद्धिमान से बुद्धिमान शासक को भी परिवर्तन स्वीकार करना पड़ता है। नारद के आगमन से युधिष्ठिर शोक से अपने कर्तव्यों की ओर मुड़े और यह विश्वास कर सके कि भगवान हर समय साथ रहते हैं।'],
['पांडव संसार छोड़ते हैं','जब कृष्ण के संसार से प्रस्थान का समाचार मिला, तो पांडवों को लगा कि उनका भी समय आ गया है। उन्होंने परीक्षित का राज्याभिषेक किया, राज्य उन्हें सौंपा और द्रौपदी के साथ हिमालय की ओर चल पड़े। सत्ता और संपत्ति पीछे छोड़कर उन्होंने भगवान में मन लगाए अपनी अंतिम यात्रा आरंभ की।'],
['बैल और गाय के रूप में धर्म और पृथ्वी का संवाद','परीक्षित ने धर्म को एक पैर पर खड़े बैल के रूप में और पृथ्वी को दुखी गाय के रूप में देखा। उन्होंने पूछा कि उन्हें किसने कष्ट पहुँचाया। बैल ने बताया कि अलग-अलग युगों में नैतिक गुण क्षीण होते जाते हैं, और गाय कृष्ण की उपस्थिति के खो जाने पर शोक कर रही थी। परीक्षित समझ गए कि संसार एक कठिन समय में प्रवेश कर रहा है।'],
['परीक्षित कलि का सामना करते हैं','युग का प्रतीक कलि उस बैल और गाय को मार रहा था। परीक्षित ने शस्त्र उठाया, पर कलि दया की भीख माँगने लगा। राजा ने उसे छोड़ दिया और उसके रहने के लिए वे स्थान तय किए जहाँ लोभ, मद, हिंसा और असत्य पनपते हैं। कलि की पहुँच सीमित करके परीक्षित ने प्रजा की रक्षा और धर्म को बचाने का प्रयास किया।'],
['वह शाप जिसने परीक्षित को सात दिन का जीवन दिया','शिकार करते हुए थके परीक्षित ने ध्यानमग्न ऋषि शमीक से जल माँगा, पर उत्तर नहीं मिला। क्रोध के एक क्षण में उन्होंने ऋषि के गले में मरा हुआ साँप डाल दिया। शमीक के पुत्र शृंगी ने राजा को शाप दिया कि सात दिन के भीतर सर्पदंश से उनकी मृत्यु होगी। परीक्षित ने इस चेतावनी को स्वीकार किया और आध्यात्मिक तैयारी की ओर मुड़ गए।'],
['राजा परीक्षित को उपदेश देने शुकदेव का आगमन','परीक्षित ने राज्य त्याग दिया और शेष दिनों का सदुपयोग करने का निश्चय करके गंगा तट पर चले गए। ऋषि उनके चारों ओर एकत्र हुए और युवा मुनि शुकदेव वहाँ पहुँचे। राजा ने पूछा कि मृत्यु निकट हो तो मनुष्य को क्या सुनना, क्या स्मरण करना और क्या करना चाहिए। शुकदेव ने वह उपदेश आरंभ किया जो भागवत का केंद्रीय ढाँचा बना।'],
['शुकदेव परीक्षित को मृत्यु की तैयारी सिखाते हैं','शुकदेव ने परीक्षित से कहा कि वे भय और संग्रह से ध्यान हटाकर सनातन भगवान की ओर लगाएँ। मनुष्य श्रवण, कीर्तन और संयमित चिंतन से भगवान का स्मरण कर सकता है। राजा एकाग्र होकर सुनते रहे और बचे हुए थोड़े समय में यह समझने लगे कि देह और उसके दावे छूट जाने पर क्या शेष रहता है।'],
['भगवान के विराट रूप में ब्रह्माण्ड का दर्शन','शुकदेव ने ब्रह्माण्ड को भगवान के विशाल विराट रूप के रूप में बताया। पर्वत, नदियाँ, ग्रह और प्राणी उस विश्व-देह के अंगों के रूप में चिंतन किए जा सकते हैं। इस दृष्टि से परीक्षित को मन स्थिर करने का मार्ग मिला: संसार को भगवान से अलग देखने के बजाय वे पूरी सृष्टि में उनकी उपस्थिति पहचान सकते थे।'],
['ध्यान और मुक्ति का मार्ग','शुकदेव ने बताया कि साधक कैसे मन को एकाग्र करे, उसे धीरे-धीरे विक्षेपों से हटाए और भगवान में स्थिर करे। ध्यान इंद्रियों को शांत करता है और भक्ति हृदय को प्रेम की दिशा देती है। परीक्षित ने जाना कि मुक्ति सत्य से पलायन नहीं, बल्कि सनातन आत्मा और भगवान से उसके संबंध की स्पष्ट पहचान है।'],
['भक्ति साधना का हृदय क्यों है','ऋषियों ने पूछा कि भिन्न-भिन्न कर्तव्यों वाले लोग भगवान के निकट कैसे आ सकते हैं। शुकदेव ने उत्तर दिया कि सच्चे मन से अर्पित करने पर अनेक साधारण भूमिकाओं में भी भक्ति की जा सकती है। पूजा, दान, अध्ययन और सेवा तब सार्थक होते हैं जब वे मन को अहंकार या फल की ओर नहीं, भगवान की ओर मोड़ें।'],
['नारद ब्रह्मा से पूछते हैं कि ब्रह्माण्ड कैसे आरंभ हुआ','नारद सोचते थे कि इतने लोक और प्राणी कैसे अस्तित्व में आए। उन्होंने ब्रह्मा से सृष्टि और उनके अपने ज्ञान के स्रोत के बारे में पूछा। ब्रह्मा ने उत्तर दिया कि वे स्वतंत्र रूप से कार्य नहीं करते: सृष्टि के पीछे की शक्ति और बुद्धि परम भगवान से आती है, जिनकी उपस्थिति ब्रह्माण्ड की हर अवस्था को धारण करती है।'],
['ब्रह्मा सृष्टि और विराट पुरुष का वर्णन करते हैं','ब्रह्मा ने बताया कि भगवान की सृजन-शक्ति से तत्व, इंद्रियाँ और लोक क्रमशः कैसे प्रकट होते हैं। विराट पुरुष वह ढाँचा देते हैं जिससे ब्रह्माण्ड व्यवस्थित होता है। सृष्टि अपने स्रोत से अलग नहीं है; वह दिव्य इच्छा से प्रकट होती है और असंख्य रूपों के उत्पन्न होने पर भी भगवान उसमें विद्यमान रहते हैं।'],
['भगवान के अवतार और उनके कार्य','शुकदेव ने अनेक अवतारों और उनके कार्यों के नाम गिनाए: धर्मात्माओं की रक्षा, संतुलन की पुनर्स्थापना और भक्ति-मार्ग का उपदेश। उनके रूप भिन्न हैं, पर उद्देश्य जुड़ा हुआ है। परीक्षित ने सुना कि भगवान किसी एक रूप में सीमित हुए बिना हर युग की आवश्यकता कैसे पूरी करते हैं।'],
['भगवान और सृष्टि के विषय में परीक्षित के प्रश्न','परीक्षित ने पूछा कि जीवात्मा, भौतिक देह और परम भगवान का आपस में क्या संबंध है। उन्होंने यह भी पूछा कि सृष्टि कैसे आरंभ होती है और जीव उसके चक्रों से कैसे छूटते हैं। शुकदेव ने इन प्रश्नों का स्वागत किया और बताया कि सावधान जिज्ञासा भागवत-श्रवण का अंग है तथा ज्ञान भक्ति से जुड़कर ही पूर्ण होता है।'],
['ब्रह्मा को चार मूल श्लोक प्राप्त होते हैं','सृष्टि का कार्य आरंभ करने से पहले ब्रह्मा ने मार्गदर्शन चाहा। भगवान ने उन्हें चार श्लोकों में भागवत का सार-तत्व प्रकट किया: भगवान ही समस्त वस्तुओं के स्रोत, आधार और उनके पीछे का सत्य हैं। ब्रह्मा ने इस उपदेश का ध्यान किया और फिर इसका ज्ञान ऋषियों की परंपरा में आगे बढ़ाया।'],
['पुराण के दस विषय','शुकदेव ने बताया कि पुराण में सृष्टि, पुनर्सृष्टि, वंशावलियों, मन्वंतरों, पालन और लोकों के अंतिम प्रलय की चर्चा हो सकती है। फिर भी ये सभी विषय अंततः परम भगवान और भक्ति-मार्ग की ओर संकेत करते हैं। भागवत इन विषयों को ऐसी कथाओं में पिरोता है जो श्रोताओं को ब्रह्माण्ड और अपने आध्यात्मिक उद्देश्य, दोनों को समझने में सहायता करती हैं।'],
['कृष्ण के प्रस्थान के बाद विदुर की उद्धव से भेंट','कौरव सभा छोड़ने के बाद विदुर ज्ञान की खोज में यात्रा करते रहे। यमुना तट पर उनकी भेंट उद्धव से हुई, जो कृष्ण के प्रस्थान का शोक कर रहे थे। उद्धव ने कृष्ण के जीवन का स्मरण किया और विदुर को ऋषि मैत्रेय के पास भेजा, जो सृष्टि और आत्मा के विषय में उनके प्रश्नों का उत्तर दे सकते थे।'],
['उद्धव वृंदावन में कृष्ण की लीलाओं को याद करते हैं','उद्धव को ग्वालों के बीच कृष्ण का बचपन और यौवन याद आया, जहाँ हर साधारण कार्य भी आश्चर्य से भरा लगता था। उन्होंने नंद, यशोदा और गोपियों का प्रेम देखा था और जानते थे कि कृष्ण के मित्र उन्हें दूर या अप्राप्य नहीं मानते थे। कृष्ण के प्रस्थान के बाद भी उनका वह स्नेह उद्धव के मन में बसा रहा।'],
['यादवों के पतन के बाद उद्धव कृष्ण का संदेश ले जाते हैं','यादव कुल के विनाश के बाद उद्धव विदुर से मिले और उन्होंने कृष्ण का अंतिम संदेश सुनाया। उन्होंने भगवान के प्रस्थान का वर्णन किया और विदुर से गहरे उपदेश के लिए ऋषि मैत्रेय के पास जाने का आग्रह किया। उद्धव के शब्दों ने कृष्ण की शिक्षा को द्वारका से आगे पहुँचाया और उन लोगों के लिए सुरक्षित रखा जिन्होंने उनके अंतिम दिन नहीं देखे थे।'],
['विदुर मैत्रेय से ज्ञान माँगते हैं','विदुर मैत्रेय के पास पहुँचे और पूछा कि ब्रह्माण्ड कैसे आरंभ हुआ और जीव भौतिक जीवन में कैसे बँध जाता है। मैत्रेय ने धैर्य से उत्तर दिया और सृष्टि, भगवान के अवतारों तथा ज्ञान और भक्ति के मार्गों का वर्णन किया। उनका संवाद भागवत को कृष्ण के प्रस्थान की कथा से अस्तित्व की गहरी रचना की ओर ले जाता है।'],
['ध्यान के बाद ब्रह्मा को नारायण के दर्शन','ब्रह्मा सृष्टि के स्रोत को समझने के लिए गहरे ध्यान में बैठे। अंत में उन्होंने कारण-जल पर विराजमान तेजस्वी नारायण को देखा। इस दर्शन से उन्हें ज्ञात हुआ कि उनका सृजन-कार्य भगवान की कृपा पर निर्भर है। ब्रह्मा को अपना कार्य आरंभ करने का विश्वास मिला और उन्होंने उनकी स्तुति की जिन्होंने उनके भीतर ज्ञान जगाया था।'],
['लोकों और उनके प्राणियों की सृष्टि','मैत्रेय ने बताया कि भगवान की शक्ति से तत्व और जीव-रूप कैसे प्रकट होते हैं। सृष्टि क्रमशः आगे बढ़ती है; काल, प्रकृति और विराट पुरुष लोकों को आकार देते हैं। प्राणी असंख्य रूप धारण करते हैं, पर उनका मूल एक है। विदुर यह समझने के लिए सुनते रहे कि ब्रह्माण्ड विविध होकर भी भगवान में कैसे टिका रहता है।'],
['रुद्र और मानस-पुत्र ऋषियों का जन्म','ब्रह्मा ने लोकों को बसाने में सहायता के लिए अपने मन से ऋषियों को उत्पन्न किया। जब उनके क्रोध ने रूप लिया, तो रुद्र प्रकट हुए—शक्तिशाली और कठिनाई से वश में आने वाले। ब्रह्मा ने रुद्र को स्थान और कर्तव्य दिए, फिर ऋषियों और पहले मानव-युगल मनु और शतरूपा के माध्यम से सृष्टि आगे बढ़ाई।'],
['वराह पृथ्वी को कारण-जल से उठाते हैं','जब पृथ्वी कारण-जल में डूब गई, तो विष्णु विशाल वराह के रूप में प्रकट हुए। उन्होंने गहराई में गोता लगाया, डूबी हुई पृथ्वी को खोजा और उसे अपने दाँतों पर उठा लिया। जब उन्होंने पृथ्वी को उसके स्थान पर स्थापित किया तो देवताओं ने उनकी स्तुति की, और जीवन तथा सृष्टि फिर संभव हुए।'],
['दिति का गर्भधारण और दो दैत्यों का आगमन','दिति अपने पति कश्यप के पास अशुभ घड़ी में पहुँचीं, जबकि उन्होंने प्रतीक्षा करने की चेतावनी दी थी। कश्यप ने पहले ही जान लिया कि उनकी संतान लोकों में उथल-पुथल लाएगी। बाद में दिति को ज्ञात हुआ कि उनके पुत्र शक्तिशाली असुर हिरण्याक्ष और हिरण्यकशिपु होंगे, जिनके कर्म देवताओं को चुनौती देंगे और भगवान को संघर्ष में खींच लाएँगे।'],
['चार कुमार जय और विजय को शाप देते हैं','चार बाल-ऋषि, कुमार, वैकुंठ के द्वार पर पहुँचे, पर जय और विजय ने उन्हें रोक दिया। अपमानित अनुभव करके ऋषियों ने द्वारपालों को शाप दिया कि वे पृथ्वी पर भगवान के विरोधियों के बीच जन्म लें। विष्णु ने इस शाप को एक बड़ी योजना का अंग मानकर स्वीकार किया, और द्वारपाल अपने अवतरण के लिए तैयार हुए।'],
['जय और विजय वैकुंठ से गिरते हैं','जय और विजय ने भगवान को प्रणाम किया और अपना भाग्य स्वीकार किया। विष्णु ने वचन दिया कि उनका वियोग थोड़े समय का होगा और वे हर जन्म में उनसे मिलेंगे। पृथ्वी पर उनका पहला जीवन शक्तिशाली भाइयों हिरण्याक्ष और हिरण्यकशिपु के रूप में आरंभ हुआ, जिनकी शत्रुता उन्हें भगवान के सामने ला खड़ा करेगी।'],
['वराह का हिरण्याक्ष से युद्ध','हिरण्याक्ष अपने बल के योग्य प्रतिद्वंद्वी की खोज में लोकों में घूमा और उसने वराह को पृथ्वी उठाए हुए पाया। उसने भगवान को युद्ध के लिए ललकारा। वराह ने दैत्य के प्रहारों का उत्तर देते हुए पृथ्वी की रक्षा की, और देवता चिंतित होकर देखते रहे जब यह युद्ध लोकों को कँपा रहा था।'],
['वराह हिरण्याक्ष को पराजित करते हैं','भयंकर युद्ध के बाद वराह ने हिरण्याक्ष को मार गिराया और लोकों को फिर सुरक्षित किया। देवताओं ने भगवान की स्तुति की और पृथ्वी अपने स्थान पर निश्चिंत टिक गई। दैत्य की पराजय ने दिखाया कि बड़ा से बड़ा बल भी जीवन की रक्षा और व्यवस्था की पुनर्स्थापना के दिव्य उद्देश्य को नहीं हरा सकता।'],
['कर्दम की तपस्या और भगवान का वरदान','कर्दम मुनि ने योग्य जीवन-संगिनी और धर्म के अनुकूल जीवन की कामना से अनेक वर्षों तक तप किया। विष्णु प्रकट हुए और वचन दिया कि मनु की पुत्री देवहूति उनकी पत्नी बनेंगी। कर्दम ने विनम्रता से यह वरदान ग्रहण किया और ऐसा गृहस्थ जीवन बसाने को तैयार हुए जो ध्यान के जीवन को भी सहारा दे।'],
['कर्दम और देवहूति का साथ जीवन आरंभ होता है','देवहूति ने कर्दम से विवाह किया और संयम के सादे जीवन में उनका साथ दिया। बाद में कर्दम ने अपनी योग-शक्ति से एक अद्भुत आकाशगामी विमान रचा और दोनों ने साथ यात्रा की। उनके जीवन में गृहस्थ का स्नेह और साधना एक साथ रहे, और वे उन पुत्रियों के माता-पिता बने जिनसे ऋषियों के कुल चले।'],
['देवहूति को उपदेश देने कपिल का जन्म','कर्दम के वन चले जाने के बाद उनके पुत्र कपिल देवहूति के पास रहे। देवहूति ने उनसे आत्मा का स्वरूप और दुख के कारण समझाने को कहा। कपिल ने उन्हें सिखाने का वचन दिया, और जो माँ कभी उनका पालन करती थीं, वे उनकी श्रद्धालु शिष्या बन गईं।'],
['कपिल आत्मा और भौतिक जगत को समझाते हैं','कपिल ने देवहूति को सिखाया कि बदलते शरीर और मन से स्थायी आत्मा को अलग पहचानें। प्रकृति से इंद्रियाँ और अनुभव का संसार उत्पन्न होता है, पर आत्मा उनमें बँधी नहीं है। स्पष्ट समझ आसक्ति को ढीला करती है और मनुष्य को सुख-दुख का सामना अधिक स्वतंत्रता से करने देती है।'],
['देवहूति भक्ति का मार्ग सीखती हैं','कपिल ने बताया कि भक्ति ज्ञान को प्रेम का केंद्र देती है और हृदय को स्वार्थ भरी आसक्ति से मुक्त करती है। साधक करुणा छोड़े बिना भगवान का स्मरण, दूसरों की सेवा और मन का संयम कर सकता है। देवहूति ने जो सीखा उसका अभ्यास किया और धीरे-धीरे अपने भीतर शांति पाई।'],
['कपिल के उपदेश से देवहूति को मुक्ति','कपिल का उपदेश सुनकर देवहूति अंतर्मुख हुईं और उन्होंने ध्यान तथा भक्ति का अभ्यास किया। उनकी समझ इतनी गहरी हुई कि भय और कामना का उन पर शासन न रहा। कपिल उपदेशक के रूप में अपनी यात्रा पर आगे बढ़ गए, और देवहूति ने पुत्र से मिले ज्ञान के द्वारा आध्यात्मिक मुक्ति पाई।'],
['सती को दक्ष के यज्ञ का समाचार मिलता है','सती को पता चला कि उनके पिता दक्ष ने एक महान यज्ञ रचा है और अनेक देवताओं और ऋषियों को बुलाया है, पर शिव को नहीं। वे जाना चाहती थीं; उनका मानना था कि अपने परिवार से मिलने के लिए पुत्री को औपचारिक निमंत्रण की आवश्यकता नहीं। शिव ने चेताया कि दक्ष का वैर उस सभा को पीड़ादायक बना सकता है, फिर भी सती का मन अपने संबंधियों को देखने को खिंचता रहा।'],
['सती दक्ष के सामने शिव का पक्ष लेती हैं','यज्ञ में सती ने देखा कि उनके पिता ने शिव को सम्मान नहीं दिया है। उन्होंने दक्ष को उन भगवान का अपमान करने पर ललकारा जो सांसारिक पद और संपत्ति से परे हैं। दक्ष ने तिरस्कार से उत्तर दिया। सती समझ गईं कि पिता के अहंकार ने उस सभा को श्रद्धा के बजाय अनादर का स्थान बना दिया है।'],
['सती देह त्याग देती हैं','शिव का अपमान न सह पाने पर सती योग-ध्यान में लीन हुईं और उन्होंने देह त्याग दी। उनकी मृत्यु से देवता और ऋषि विचलित हो उठे। जब शिव ने यह सुना, तो शोक और क्रोध ने उन्हें घेर लिया, और उन्होंने अपने उग्र गण वीरभद्र को दक्ष का सामना करने और यज्ञ को नष्ट करने भेजा।'],
['वीरभद्र दक्ष का यज्ञ नष्ट करते हैं','वीरभद्र और शिव के गण यज्ञशाला पर टूट पड़े; उन्होंने सभा को तितर-बितर कर दिया और दक्ष के अपमान का साथ देने वालों को दंड दिया। अनुष्ठान भंग हो गया और दक्ष मारे गए। देवताओं ने देखा कि अहंकार ने एक पवित्र आहुति को कैसे कलह और शोक का कारण बना दिया।'],
['दक्ष शिव से मेल करते हैं','देवता और ऋषि शिव के पास गए और उनसे व्यवस्था लौटाने तथा यज्ञ पूरा होने देने की प्रार्थना की। शिव का क्रोध शांत हुआ। दक्ष को मेढ़े के सिर के साथ फिर जीवित किया गया और उन्होंने शिव को प्रणाम किया। दक्ष के अपनी भूल मानने और देवताओं के उचित सम्मान लौटाने के बाद यज्ञ फिर आरंभ हुआ।'],
['ध्रुव को पिता की गोद से हटा दिया जाता है','बालक ध्रुव ने अपने सौतेले भाई को राजा उत्तानपाद की गोद में बैठे देखा और वह भी वहाँ बैठना चाहता था। रानी सुरुचि ने उसे रोक दिया और कहा कि वह तभी वहाँ बैठ सकता है जब उसकी कोख से जन्म ले। उनके शब्दों और पिता की चुप्पी से आहत ध्रुव अपनी माँ सुनीति के पास दौड़ा, जिन्होंने उसे कटुता के बजाय प्रार्थना की राह दिखाई।'],
['नारद वन में ध्रुव का मार्गदर्शन करते हैं','ध्रुव ऐसा स्थान पाने का निश्चय करके घर से निकला जिसे कोई उससे छीन न सके। वन में नारद उससे मिले और उन्होंने उसके संकल्प की परीक्षा ली। बालक की सच्चाई देखकर ऋषि ने उसे एक मंत्र और विष्णु के ध्यान की विधि सिखाई। ध्रुव ने अडिग श्रद्धा से तपस्या आरंभ की।'],
['ध्रुव की तपस्या से भगवान का वरदान','ध्रुव की तपस्या इतनी तीव्र हो गई कि लोक काँपने लगे। विष्णु उसके सामने प्रकट हुए और बालक का क्रोध विस्मय में घुल गया। ध्रुव ने भगवान की स्तुति की और आकाश में ऐसा स्थान पाया जो सदा अचल रहेगा। वह मान-सम्मान खोजने निकला था, पर उसे वह भक्ति मिली जो उसके सोचे हुए पुरस्कार से कहीं बड़ी थी।'],
['ध्रुव घर लौटते हैं और राजा बनते हैं','ध्रुव अपने परिवार के पास लौटे; अब वे उस रोष से मुक्त थे जिसने उन्हें घर से दूर किया था। पिता ने आनंद से उनका स्वागत किया और आगे चलकर ध्रुव एक बुद्धिमान शासक बने। उन्होंने प्रजा की रक्षा की और बहुत वर्षों तक राज्य किया, यह याद रखते हुए कि भगवान की कृपा राजकीय सम्मान से अधिक मूल्यवान है।'],
['ध्रुव क्रोध को जीतते हैं और ध्रुव तारा पाते हैं','अपने भाई उत्तम के मारे जाने के बाद ध्रुव ने शोक और क्रोध में यक्षों पर चढ़ाई की। मनु ने उनसे आग्रह किया कि निर्दोष प्राणियों के कष्ट पाने से पहले रुक जाएँ। ध्रुव ने बात मानी, कुबेर का आशीर्वाद स्वीकार किया और अंत में संसार छोड़कर अचल ध्रुव तारे को प्राप्त हुए, जो उनकी भक्ति का स्थायी प्रतीक है।'],
['राजा अंग अपना राज्य छोड़ते हैं','राजा अंग अपने पुत्र वेन को सही राह दिखाने में असफल रहे, जिसकी क्रूरता से राज्य त्रस्त था। जब प्रजा और ऋषि भी वेन को न बदल सके, तो अंग शासन से ऊब गए और चुपचाप वन चले गए। उनके जाने से सिंहासन वेन के हाथ आ गया और प्रजा उस सौम्य राजा से वंचित हो गई जो उसकी रक्षा करता था।'],
['वेन का क्रूर शासन और ऋषियों का हस्तक्षेप','वेन ने यज्ञों पर रोक लगा दी और आदेश दिया कि लोग केवल उसी की पूजा करें। ऋषियों ने उसे धर्म का सम्मान करने की चेतावनी दी, पर उसने उनकी सलाह ठुकरा दी। अंत में उन्होंने उसके अन्यायी शासन का अंत किया। राज्य को अराजकता से बचाने के लिए उन्होंने वेन के शरीर से एक धर्मात्मा शासक को प्रकट किया और पृथु का जन्म हुआ।'],
['धर्म-राज्य की पुनर्स्थापना के लिए पृथु का जन्म','पृथु न्यायी राजा के लक्षणों के साथ जन्मे। ऋषियों ने उनका राज्याभिषेक किया और उनके शासन की संभावनाओं की प्रशंसा की। वेन के समय में भूमि बंजर हो गई थी, इसलिए पृथु उसकी समृद्धि लौटाने और ऐसा राज्य स्थापित करने निकले जहाँ लोग सुरक्षित रहकर अपने कर्तव्य निभा सकें।'],
['पृथु पृथ्वी को प्रजा का पोषण करने के लिए मनाते हैं','जब पृथ्वी ने अपनी उपज रोक ली, तो पृथु ने उसका पीछा किया, यहाँ तक कि वह गाय के रूप में प्रकट हुई। उसने बताया कि लोगों ने उसके उपहारों का दुरुपयोग किया है। पृथु ने भूमि की रक्षा और बुद्धिमानी से खेती का वचन दिया। तब पृथ्वी ने पोषण दिया, और प्रजा ने सीखा कि समृद्धि राज-सत्ता के साथ-साथ देखभाल पर भी निर्भर है।'],
['पृथु का यज्ञ और भगवान का परामर्श','पृथु ने अश्वमेध यज्ञों की शृंखला आरंभ की, पर इंद्र ने ईर्ष्या से अनुष्ठानों में विघ्न डाला। ऋषियों ने व्यवस्था लौटाने में सहायता की और विष्णु ने प्रकट होकर पृथु को अहंकार और स्पर्धा से बचने का परामर्श दिया। पृथु ने प्रतिष्ठा की चाह छोड़ दी और न्यायपूर्ण शासन तथा प्रजा की सेवा पर ध्यान लगाया।'],
['पृथु की तपस्या और परमधाम-गमन','वर्षों के न्यायपूर्ण शासन के बाद पृथु और उनकी रानी वन चले गए। उन्होंने तप और ध्यान किया और धीरे-धीरे राजसी आसक्तियाँ छोड़ दीं। जब पृथु का जीवन पूरा हुआ, तो वे भगवान के धाम को गए, और उनकी रानी अपनी भक्ति और संयम से उनके पीछे गईं।'],
['पृथु के वंशज और रुद्र का स्तोत्र','शुकदेव ने पृथु के वंशजों का वर्णन किया और प्रचेताओं की शिव से भेंट का स्मरण किया। शिव ने उन भाइयों को विष्णु की स्तुति का एक स्तोत्र सिखाया, जिसे वे अपने लंबे ध्यान में साथ ले गए। उनकी कथा राजवंश की परंपरा को भक्ति के उस उपदेश से जोड़ती है जो अगली पीढ़ी का मार्गदर्शन करेगा।'],
['प्रचेताओं की शिव से भेंट','दस प्रचेता तप करने निकले और उनकी भेंट शिव से हुई, जिन्होंने उन्हें विष्णु-भक्ति का स्तोत्र सिखाया। उन्होंने श्रद्धा से यह उपदेश ग्रहण किया और अपना ध्यान जारी रखा। शिव के परामर्श ने उन्हें लंबी साधना के लिए तैयार किया और दिखाया कि भक्ति अलग-अलग दिव्य परंपराओं के साधकों को जोड़ सकती है।'],
['पुरंजन की कथा: एक राजा नगर खोजता है','नारद ने राजा प्राचीनबर्हि को पुरंजन की रूपक-कथा सुनाई, जो बसने के लिए स्थान खोज रहा था। उसे नौ द्वारों वाला एक नगर मिला और वह उसके सुखों में आसक्त हो गया। इस कथा से नारद ने दिखाना आरंभ किया कि आत्मा कैसे शरीर को ही अपना स्वरूप मान लेती है और अपने गहरे स्वभाव को भूल जाती है।'],
['पुरंजन की रहस्यमयी रानी से भेंट','पुरंजन नौ द्वारों वाले नगर में गया और वहाँ सखियों से घिरी एक सुंदर रानी से मिला। उसने उससे विवाह किया और अपना जीवन उसकी इच्छाओं और नगर के सुखों के अनुसार ढाल लिया। उसकी कथा दर्शाती है कि मन और इंद्रियाँ देहधारी आत्मा को कैसे चलाते हैं और प्रायः उसे आध्यात्मिक समझ से दूर ले जाते हैं।'],
['पुरंजन के नगर को काल घेर लेता है','वर्ष बीतने के साथ नगर पर काल और बुढ़ापे की सेनाओं के आक्रमण होने लगे। पुरंजन ने अपने घर को बचाने का प्रयास किया, पर परिवर्तन को रोक न सका। अंत में मृत्यु ने उसे आ घेरा और उसकी गहरी आसक्ति उसे एक और जन्म में ले गई। यह रूपक दिखाता है कि शरीर से चिपके रहना आत्मा को बार-बार के जन्मों में बाँधता है।'],
['पुरंजन के रूपक की व्याख्या','नारद ने समझाया कि पुरंजन जीवात्मा है, नगर उसका शरीर है और रानी मन है। इंद्रियाँ और उनके विषय आत्मा को अनुभवों में खींचते हैं, जबकि काल शरीर को निरंतर क्षीण करता जाता है। इस रूपक को समझकर प्राचीनबर्हि जान पाते हैं कि भक्ति और आत्मज्ञान क्यों आवश्यक हैं।'],
['प्रचेताओं का मारिषा से विवाह और दक्ष का जन्म','लंबे तप के बाद प्रचेता लौटे और उन्होंने मारिषा से विवाह किया। उनके पुत्र दक्ष एक महान प्रजापति बने और सृष्टि का कार्य आगे बढ़ाया। इस परिवार की कथा मनु की आरंभिक पीढ़ियों को उन अनेक वंशों से जोड़ती है जिन्होंने लोकों को बसाया।'],
['प्रचेता संसार का त्याग करते हैं','प्रचेताओं ने देखा कि उनकी अनुपस्थिति में संसार के वन नष्ट हो गए हैं और वे चिंतित हो उठे। सोम ने उन्हें क्रोध पर संयम रखने और अपने दायित्व निभाने की सलाह दी। राज्य करने और परिवार बसाने के बाद भाइयों ने आध्यात्मिक जीवन अपनाया, सांसारिक कर्तव्य पीछे छोड़े और भक्ति से मुक्ति की खोज की।'],
['प्रियव्रत के रथ से सात द्वीप बनते हैं','प्रियव्रत एक बार तेजस्वी रथ में सूर्य के मार्ग के पीछे-पीछे चले ताकि संसार का कोई भाग अंधकार में न रहे। उनके पहियों की लीकें सात समुद्र बन गईं, जिन्होंने पृथ्वी के महान द्वीपों को अलग किया। वे सत्ता त्यागना चाहते थे, फिर भी कुछ समय राज्य करके आध्यात्मिक जीवन में लौट गए।'],
['आग्नीध्र का इतिहास','आग्नीध्र पृथ्वी के एक महान खंड पर राज्य करते थे और योग्य जीवन-संगिनी चाहते थे। उनका जीवन और उनके वंशज उस वंश-परंपरा का अंग बने जिसने संसार की भूमियों और जनों को आकार दिया। शुकदेव ने यह वंशावली यह दिखाने के लिए सुनाई कि राजाओं का इतिहास सृष्टि के बड़े वृत्तांत में कैसे गुँथा हुआ है।'],
['नाभि की प्रार्थना और ऋषभ का जन्म','राजा नाभि और रानी मेरुदेवी ने ऐसे पुत्र के लिए प्रार्थना की जिसमें सर्वोच्च गुण हों। विष्णु उनके पुत्र ऋषभ के रूप में प्रकट हुए। राजा ने श्रद्धा से उनका स्वागत किया, और ऋषभ ऐसे शासक बने जिनका जीवन आत्म-संयम और सांसारिक आसक्ति से मुक्ति का महत्व सिखाएगा।'],
['ऋषभ अपने पुत्रों को मानव जीवन का उद्देश्य सिखाते हैं','ऋषभ ने अपने पुत्रों से कहा कि मानव जीवन केवल इंद्रिय-सुख में नहीं बिताना चाहिए। यह सत्य की खोज, ज्ञानियों की सेवा और आत्मा को बार-बार के दुख से मुक्त करने का अवसर देता है। उन्होंने करुणा और संयम के अभ्यास का आग्रह किया, ताकि राज-सत्ता आध्यात्मिक उन्नति में बाधा न बने।'],
['ऋषभ अपना राज्य त्यागते हैं','पुत्रों को उपदेश देने के बाद ऋषभ ने राज्य उन्हें सौंप दिया और राजसी जीवन त्याग दिया। वे बिना किसी संपत्ति के विचरते रहे और कष्टों को बिना शिकायत स्वीकार करते रहे। लोगों ने उनके असामान्य आचरण को गलत समझा, पर वे निंदा-स्तुति से मुक्त रहे और दिखाया कि बाहरी पद से अधिक महत्व भीतरी संयम का है।'],
['ऋषभ देह त्यागते हैं','ऋषभ मौन रहकर विचरते थे, संपत्ति और यश से विरक्त। जब उनका शरीर वन की आग में भस्म हुआ, तो उन्होंने बिना भय के मृत्यु का सामना किया। उनका जीवन पहले ही दिखा चुका था कि आत्मा की पहचान शरीर से नहीं है, और उनके शांत प्रस्थान ने वैराग्य के उस मार्ग को पूरा किया जिसका उन्होंने उपदेश दिया था।'],
['भरत एक मृग-शावक में आसक्त हो जाते हैं','राजा भरत ने वन में ध्यान करने के लिए अपना राज्य छोड़ दिया। एक दिन उन्होंने एक असहाय मृग-शावक को बचाया और वे उससे गहराई से जुड़ गए। उनके विचार उपासना से हटकर उस पशु की सुरक्षा में लगने लगे। मृत्यु के समय इसी आसक्ति ने उनका अगला जन्म तय किया; यह सिखाता है कि दया भी बंधन बन सकती है जब वह आध्यात्मिक लक्ष्य को ढक दे।'],
['भरत का मृग के रूप में पुनर्जन्म','भरत मृग के रूप में जन्मे, पर उन्हें अपना पिछला जन्म याद रहा। वे ऋषियों के निकट रहे और नई आसक्तियाँ बनाने से बचते हुए उस जीवन के समाप्त होने की प्रतीक्षा करते रहे। उनकी स्मृति ने उन्हें अपनी भूल से सीखने का अवसर दिया। अगले जन्म में उन्होंने जड़ जैसा दिखने का निश्चय किया ताकि कोई उन्हें सांसारिक महत्वाकांक्षा में न खींचे।'],
['जड़ भरत बलि से बचाए जाते हैं','ब्राह्मण परिवार में जन्मे भरत ऐसा व्यवहार करते थे मानो कुछ समझते ही न हों। कुछ लोगों ने उन्हें भद्रकाली के सामने नरबलि के लिए पकड़ लिया। देवी ने यह बलि अस्वीकार की और उन लोगों का नाश कर दिया। भरत शांत रहे, और दिखाया कि ज्ञानी आत्मा शरीर पर आए संकटों से अछूती रहती है।'],
['राजा रहूगण भरत को गुरु मानते हैं','जड़ भरत को राजा रहूगण की पालकी ढोने पर लगा दिया गया। जब उनके असमान कदमों से राजा को कष्ट हुआ, तो रहूगण ने उन्हें डाँटा। भरत के उत्तर में आत्मा और शरीर के विषय में गहरा ज्ञान प्रकट हुआ। राजा ने अपना अज्ञान पहचाना, पालकी से उतरे और भरत से उपदेश देने की प्रार्थना की।'],
['भरत रहूगण को आत्मा का ज्ञान देते हैं','भरत ने समझाया कि शरीर बदलता है और कर्म करता है, पर आत्मा उन गतियों से सीमित नहीं है। पद या बल का अहंकार लोगों के बीच झूठे भेद खड़े करता है। रहूगण ध्यान से सुनते रहे और सीखा कि सच्चा अधिकार स्वयं को समझने और दूसरों से तिरस्कार के बिना व्यवहार करने से आरंभ होता है।'],
['भरत और रहूगण का संवाद','रहूगण ने पूछा कि मनुष्य सांसारिक जीवन के चक्र से कैसे मुक्त हो सकता है। भरत ने ज्ञानी गुरुओं की शरण, इंद्रिय-संयम और आत्मा के सच्चे स्वरूप की पहचान का महत्व बताया। उनके संवाद ने वन-मार्ग की एक संयोगवश हुई भेंट को विनम्रता और मुक्ति की सीख में बदल दिया।'],
['संसार रूपी वन','भरत ने सांसारिक अस्तित्व को एक खतरनाक वन बताया, जहाँ यात्री इच्छाओं, भयों और झूठे वादों में भटक जाते हैं। लोग सुख खोजते हैं, पर उन्हें हानि और भ्रम मिलता है। इस चित्र से रहूगण समझ सके कि मार्ग सुहावना दिखने पर भी आसक्ति आत्मा को उसके उद्देश्य से कैसे दूर ले जा सकती है।'],
['वन के रूपक की व्याख्या','वन के ब्योरे देहधारी जीवन के संघर्षों से मेल खाते हैं: पारिवारिक बंधन, संपत्ति, शत्रु और क्षणिक सुख। यात्री आत्मा है, जो अपने गंतव्य का स्पष्ट ज्ञान न होने से बार-बार अनुभवों से गुज़रती रहती है। ज्ञान और भक्ति इस वन से निकलकर स्थायी मुक्ति तक पहुँचने का मार्ग देते हैं।'],
['भरत का वंश','शुकदेव ने भरत के वंशजों और उनके बाद चले राजवंशों का वर्णन किया। उनके इतिहास ने राजा के नाम को भूमि और उसकी प्रजा से जोड़ा और फिर पुराण की व्यापक वंशावलियों की ओर बढ़ा। इन वंशों के माध्यम से श्रोता देख सकते थे कि परिवारों के इतिहास पीढ़ियों तक राज्यों को कैसे गढ़ते हैं।'],
['सात द्वीप और उनके आश्चर्य','शुकदेव ने सात महान द्वीपों और उन्हें घेरने वाले समुद्रों का वर्णन किया, जिनकी अपनी-अपनी विशेषताएँ और निवासी हैं। यह वर्णन आधुनिक मानचित्र नहीं, बल्कि पारंपरिक ब्रह्माण्ड-भूगोल है। यह श्रोता को पुराण की दृष्टि में संसार के विशाल विस्तार की कल्पना करने का निमंत्रण देता है।'],
['भगीरथ गंगा को पृथ्वी पर लाते हैं','भगीरथ ने कठोर तप किया ताकि गंगा उतरें और सगर के पुत्रों की भस्म को पवित्र करें। शिव ने नदी को अपनी जटाओं में धारण किया और फिर उसकी धाराओं को पृथ्वी की ओर छोड़ा। भगीरथ जल को सागर तक ले गए, अपने पूर्वजों की आशा पूरी की और संसार को एक पवित्र नदी दी।'],
['आकाश में सूर्य की यात्रा','सूर्य आकाश में चलते हुए समय को अंकित करता और जीवन का पोषण करता है। उसकी गति दिनों, ऋतुओं और मानव कार्यों के चक्रों को जोड़ती है। शुकदेव ने ब्रह्माण्ड की व्यवस्था को ऐसे तंत्र के रूप में बताया जिसमें आकाशीय पिंड उन मार्गों पर चलते हैं जो संसार की सेवा करते और सृष्टि की बड़ी रचना को दर्शाते हैं।'],
['ब्रह्माण्ड की व्यवस्था में चंद्रमा, तारे और ग्रह','चंद्रमा और तारे समय को अंकित करते हैं और जीवन की लय को प्रभावित करते हैं। शुकदेव ने उनकी गतियों को एक व्यवस्थित ब्रह्माण्ड का अंग बताया, जहाँ आकाशीय गति ऋतुओं और अनुष्ठानों के पंचांग से जुड़ी है। आकाश बिखरे हुए प्रकाश-बिंदु नहीं, बल्कि दिव्य शक्ति से धारण किए गए विशाल विधान का अंग है।'],
['ध्रुवलोक और शिशुमार चक्र','ध्रुव का तारा उस स्थिर बिंदु की तरह अचल चमकता है जिसके चारों ओर आकाश-मंडल घूमता प्रतीत होता है। शुकदेव ने शिशुमार के आकार के नक्षत्र-मंडल का वर्णन किया, जो यह दिखाने का एक और ढंग है कि आकाश भगवान के विराट रूप को दर्शाता है। ये चित्र श्रोताओं को व्यवस्था और पृथ्वी-लोक के ऊपर दिव्य उपस्थिति का ध्यान करने में सहायता करते हैं।'],
['राहु और पृथ्वी के नीचे के लोक','शुकदेव ने आकाशीय पिंडों के बीच राहु के स्थान और पृथ्वी के नीचे के लोकों का वर्णन किया। इन लोकों के अपने भू-दृश्य और प्राणी हैं, और हर एक में जीवन की अपनी परिस्थितियाँ हैं। यह वृत्तांत ब्रह्माण्ड को अनेक स्तरों वाला दिखाता है, जो साधारण दृष्टि की पहुँच से बहुत आगे तक फैला है।'],
['शेष लोकों को धारण करते हैं','लोकों के आधार में शेष विराजते हैं, जो संकर्षण का महान सर्प-रूप हैं। वे दिव्य बल से सृष्टि को धारण करते हैं और भगवान में लीन रहते हैं। यह चित्र परिवर्तनशील ब्रह्माण्ड के नीचे की स्थिरता और समस्त लोकों को सँभालने वाली शक्ति को व्यक्त करता है।'],
['नरक के लोक','शुकदेव ने नरक के लोकों को ऐसे स्थान बताया जहाँ प्राणी अपने हानिकारक कर्मों का फल भोगते हैं। हर प्रकार का कष्ट क्रूरता या स्वार्थ के किसी ढंग से जुड़ा है। यह वृत्तांत श्रोताओं को सावधानी से कर्म करने की प्रेरणा देता है और याद दिलाता है कि हमारे चुनाव ही आगे के अनुभवों को गढ़ते हैं।'],
['अजामिल मृत्यु के क्षण में अपने पुत्र को पुकारता है','अजामिल कभी संयमी ब्राह्मण था, पर उसने अपने कर्तव्य छोड़ दिए और लापरवाही का जीवन जिया। मृत्यु के समय उसने अपने छोटे पुत्र नारायण को पुकारा। उस नाम को सुनकर विष्णु के दूत आ गए और उन्होंने यम के सेवकों को उसे ले जाने से रोक दिया। अजामिल के इस अप्रत्याशित उद्धार से पाप, पश्चाताप और भगवान के नाम की शक्ति पर विवाद आरंभ हुआ।'],
['विष्णु के दूत यमदूतों को रोकते हैं','यमदूतों ने कहा कि अजामिल अपने पिछले कर्मों के कारण उनका है। विष्णुदूतों ने तर्क दिया कि भगवान का नाम पुकारने से उसकी स्थिति बदल गई है। दोनों दलों में इस पर विवाद हुआ कि मनुष्य को उत्तरदायी क्या बनाता है और क्या सच्चा स्मरण नया मार्ग खोल सकता है। अजामिल ने उनकी बातें सुनीं और उसे होश आ गया।'],
['अजामिल जागता है और अपना जीवन बदलता है','दूतों के अदृश्य होने पर अजामिल समझा कि वह मृत्यु के कितने निकट था और भगवान के नाम ने उसकी रक्षा कैसे की। उसने अपना पुराना जीवन छोड़ा और गंगा तट पर जाकर भक्ति और संयम का अभ्यास किया। जीवन के अंत में विष्णु के दूतों ने उसका स्वागत किया और उसे मुक्ति मिली।'],
['यम भगवान के नाम की शक्ति समझाते हैं','यम ने अपने सेवकों से कहा कि विष्णु ही परम अधिकारी हैं और उनके भक्त साधारण न्याय के अधीन नहीं हैं। दोषों से भरा मनुष्य भी यदि सच्चे मन से भगवान की ओर मुड़े तो उसे नए जीवन की राह मिल सकती है। यम ने सेवकों को भक्तों का सम्मान करने और अपनी शक्ति की सीमाएँ याद रखने का आदेश दिया।'],
['नारद के उपदेश से दक्ष के पुत्र घर छोड़ देते हैं','दक्ष ने अपने पुत्रों को संतान उत्पन्न करने भेजा, पर नारद ने उन्हें जीवन के उद्देश्य पर विचार करना सिखाया। युवकों ने सांसारिक कर्तव्यों में लौटने के बजाय वैराग्य चुना। उनके न लौटने से दक्ष क्रोधित हुए और उन्होंने नारद को दोष दिया, जिनके परामर्श ने उनके जीवन की दिशा बदल दी थी।'],
['दक्ष नारद को शाप देते हैं','जब नारद के उपदेशों से दक्ष के पुत्रों और बाद में पुत्रियों ने गृहस्थ जीवन त्याग दिया, तो दक्ष ने उन पर सृष्टि में बाधा डालने का आरोप लगाया। उन्होंने नारद को शाप दिया कि वे बिना स्थायी घर के सदा घूमते रहें। नारद ने शांति से शाप स्वीकार किया और जहाँ भी गए, भक्ति फैलाते रहे।'],
['दक्ष की पुत्रियों की संतानें','दक्ष की पुत्रियों का विवाह ऋषियों से हुआ और उनसे देवता, दानव, पशु और अनेक प्रकार के प्राणी जन्मे। उनके वंशजों ने लोकों को जीवन के विविध रूपों से भर दिया। मैत्रेय ने विदुर को ये वंश-परंपराएँ सुनाईं और दिखाया कि सृष्टि अनेक पीढ़ियों के निर्णयों और संबंधों से कैसे आगे बढ़ती है।'],
['बृहस्पति इंद्र की सभा छोड़ देते हैं','एक बार जब गुरु बृहस्पति देव-सभा में आए तो इंद्र ने उनका सम्मान नहीं किया। बृहस्पति चुपचाप चले गए और देवता अपने आध्यात्मिक मार्गदर्शक से वंचित हो गए। असुरों को बढ़त मिल गई, और इंद्र ने सीखा कि सत्ता और पद ज्ञान देने वालों के प्रति विनम्रता का स्थान नहीं ले सकते।'],
['इंद्र को नारायण कवच मिलता है','देवता दुर्बल हो चुके थे, तब इंद्र ने नारायण कवच से रक्षा चाही, जो विश्वरूप का सिखाया हुआ पवित्र स्तोत्र था। भगवान का स्मरण करके और दिव्य रक्षा पर भरोसा रखकर इंद्र असुरों का सामना करने को तैयार हुए। यह उपदेश भक्ति को उस समय की शरण बताता है जब अकेला बल सुरक्षा नहीं दे पाता।'],
['देवता वृत्र के विरुद्ध दधीचि से सहायता माँगते हैं','विश्वरूप के मारे जाने के बाद देवता वृत्र से पराजित हुए। वे ऋषि दधीचि के पास गए, जिनकी अस्थियों से ऐसा अस्त्र बन सकता था जो उस दैत्य को हरा सके। दधीचि लोकों के कल्याण के लिए अपना शरीर देने को तैयार हो गए और उन्होंने दूसरों की सुरक्षा को अपने जीवन से ऊपर रखा।'],
['इंद्र को वज्र मिलता है','देवताओं ने दधीचि की अस्थियों से वज्र बनाया और इंद्र उसे लेकर युद्ध में गए। वे जानते थे कि इस अस्त्र में उस ऋषि का दान है जिसने स्वेच्छा से अपना बलिदान दिया। यह जानते हुए इंद्र वृत्र के सामने खड़े हुए, यद्यपि परिणाम केवल अस्त्र की शक्ति पर निर्भर नहीं था।'],
['वृत्रासुर भक्त के रूप में लड़ता है','वृत्र युद्ध में इंद्र से भिड़ा, पर वह भक्त की अंतर्दृष्टि से बोला। उसे न क्रोध चला रहा था, न मृत्यु का भय; वह केवल भगवान का स्मरण चाहता था। उसके शब्दों ने देवताओं को विचलित कर दिया; उन्होंने देखा कि असुर के बाहरी रूप के भीतर विष्णु में लगा हुआ हृदय छिपा है।'],
['इंद्र वृत्रासुर को पराजित करते हैं','युद्ध तब तक चलता रहा जब तक इंद्र ने वज्र से वृत्र पर प्रहार नहीं किया। वृत्र गिर पड़ा और देवता प्रसन्न हुए, पर इंद्र को ब्राह्मण-पुत्र के वध का बोझ अनुभव हुआ और वे परिणामों से डर गए। वृत्र की भक्ति श्रोताओं के मन में बनी रही और उसने दिखाया कि आध्यात्मिक मूल्य जन्म या बाहरी रूप से तय नहीं होता।'],
['इंद्र विजय के परिणामों का सामना करते हैं','वृत्र की मृत्यु के बाद इंद्र अपराध-बोध से व्याकुल होकर सार्वजनिक जीवन से हट गए। अंत में देवताओं ने प्रायश्चित्त के अनुष्ठान पूरे करने और अपने पद पर लौटने में उनकी सहायता की। उनकी विजय ने स्वर्ग की रक्षा की, पर यह भी सिखाया कि सफलता अपने कर्मों की ज़िम्मेदारी को नहीं मिटाती।'],
['वृत्रासुर पहले राजा चित्रकेतु था','शुकदेव ने बताया कि वृत्र पहले राजा चित्रकेतु था, जो विष्णु का भक्त शासक था। एक पीड़ादायक हानि और ऋषियों से भेंट के बाद चित्रकेतु को आध्यात्मिक अंतर्दृष्टि मिली। बाद में एक शाप ने उसे वृत्र बना दिया, पर नए जन्म में भी उसकी भक्ति नहीं बदली।'],
['ऋषि चित्रकेतु को सांत्वना देते हैं','अपने छोटे पुत्र की मृत्यु पर चित्रकेतु शोक में डूब गए, और ऋषि अंगिरा तथा नारद ने उन्हें जीवन के बदलते बंधनों को समझने में सहायता की। उन्होंने बालक को थोड़ी देर के लिए जीवित किया ताकि वह बोलकर समझा सके कि कोई एक जन्म आत्मा का परिवार तय नहीं करता। चित्रकेतु अपनी आसक्ति छोड़ने और गहरे ज्ञान की खोज करने लगे।'],
['चित्रकेतु को भगवान की उपस्थिति का अनुभव','उपदेश पाकर चित्रकेतु ने भक्ति का अभ्यास किया और उन्हें भगवान अनंत के दर्शन हुए। वे दिव्य विमान में आकाश-लोकों में घूमते और बिना अहंकार के अपना आनंद बाँटते रहे। पर शिव और पार्वती से उनकी भेंट शीघ्र ही यह परखने वाली थी कि उनकी अंतर्दृष्टि विनम्रता में पकी है या नहीं।'],
['पार्वती चित्रकेतु को शाप देती हैं','चित्रकेतु ने शिव को पार्वती के साथ बैठे देखा और उनकी निकटता पर हल्की-फुल्की टिप्पणी कर दी। पार्वती ने इसे अनादर माना और उन्हें असुर के रूप में जन्म लेने का शाप दिया। चित्रकेतु ने बिना क्रोध के शाप स्वीकार किया और दिखाया कि नई कठिनाई आने पर भी उन्हें भगवान की इच्छा पर भरोसा है।'],
['मरुतों का जन्म','दिति ऐसा पुत्र चाहती थीं जो इंद्र को हरा सके, और उन्होंने एक लंबा व्रत आरंभ किया। इंद्र उनकी सेवा करते रहे और संकट को टालने के अवसर की प्रतीक्षा करते रहे। जब दिति से नियम में चूक हुई, तो इंद्र उनके गर्भ में प्रविष्ट हुए और उन्होंने भ्रूण के टुकड़े कर दिए; पर वे बालक मरुत बन गए, जो बाद में देवताओं से जा मिले।'],
['पुंसवन व्रत','शुकदेव ने पुंसवन अनुष्ठान समझाया, जो परंपरा से स्वस्थ संतान की कामना करने वाली स्त्री द्वारा किया जाने वाला व्रत है। इसमें संयमित आचरण, पूजा और माता तथा गर्भस्थ शिशु की देखभाल सम्मिलित है। इस उपदेश के साथ स्कन्ध समाप्त होता है और दिखाता है कि पुराण में गृहस्थ जीवन और साधना कैसे जुड़े हैं।'],
['नारद जय और विजय की कथा समझाते हैं','युधिष्ठिर ने नारद से पूछा कि भगवान का भक्त वृत्र असुरों में क्यों जन्मा। नारद ने कथा को जय और विजय तक पहुँचाया, उन द्वारपालों तक जिन्हें कुमारों ने शाप दिया था। उन्होंने बताया कि लगातार जन्मों में भगवान के विरोधी उसी शाप से जुड़े थे और अंत में वे उन्हीं के पास लौट गए।'],
['हिरण्यकशिपु अपने भाई के लिए शोक करता है','वराह द्वारा हिरण्याक्ष के वध के बाद हिरण्यकशिपु ने अपने भाई का शोक मनाया और विष्णु से बदला लेने की प्रतिज्ञा की। उसने अपनी माँ और संबंधियों से शोक न करने को कहा और तर्क दिया कि जैसे काल जीवन के पीछे चलता है, वैसे ही मृत्यु शरीर के पीछे चलती है। पर सांत्वना के इन शब्दों के नीचे लोकों को जीतने की महत्वाकांक्षा पल रही थी।'],
['हिरण्यकशिपु की तपस्या से ब्रह्मा का वरदान','हिरण्यकशिपु ने तब तक कठोर तप किया जब तक ब्रह्मा प्रकट नहीं हुए। उसने माँगा कि वह किसी ऐसे प्राणी, अस्त्र, स्थान या समय में न मारा जाए जिसकी वह कल्पना कर सकता था। ब्रह्मा ने यह जटिल वरदान दे दिया और हिरण्यकशिपु ने मान लिया कि वह अजेय हो गया है। उसकी शक्ति शीघ्र ही देवताओं और मनुष्यों, दोनों के लिए बोझ बन गई।'],
['पिता के शासन में प्रह्लाद की भक्ति बढ़ती है','हिरण्यकशिपु ने लोकों पर अधिकार कर लिया और आदेश दिया कि सब उसी का सम्मान करें। पर उसका छोटा पुत्र प्रह्लाद विष्णु का भक्त बना रहा। जब उससे पूछा गया कि उसने क्या सीखा, तो प्रह्लाद ने भक्ति की और सत्ता तथा भय के बीच रहते हुए भी भगवान को याद रखने की आवश्यकता की बात कही।'],
['प्रह्लाद अपने सहपाठियों को सिखाते हैं','जब गुरु कक्षा से बाहर गए, तो प्रह्लाद ने दूसरे बालकों को इकट्ठा किया और उन्हें बचपन से ही भगवान को खोजने की सीख दी। उन्होंने समझाया कि जीवन छोटा है और भक्ति किसी भी आयु में आरंभ हो सकती है। बालक उनके शांत विश्वास से प्रभावित होकर सुनते रहे, यद्यपि वे जानते थे कि प्रह्लाद के पिता ऐसी शिक्षा के विरोधी हैं।'],
['नारद का उपदेश गर्भ में ही प्रह्लाद तक पहुँचता है','प्रह्लाद ने बताया कि उन्होंने जन्म से पहले ही भक्ति सीख ली थी, जब उनकी माँ नारद के आश्रम में रहती थीं। ऋषि ने उन्हें विष्णु के विषय में उपदेश दिया था और गर्भस्थ शिशु ने उसे सुन लिया था। इस स्मरण से स्पष्ट हुआ कि पिता की धमकियों और राज-दरबार की शिक्षा के बावजूद प्रह्लाद की आस्था अडिग क्यों रही।'],
['हिरण्यकशिपु प्रह्लाद को मारने का प्रयास करता है','हिरण्यकशिपु ने विष, शस्त्रों, अग्नि, साँपों और पर्वत की ऊँचाई से अपने पुत्र को नष्ट करने का प्रयास किया। हर प्रयास विफल हुआ और प्रह्लाद बिना द्वेष के विष्णु का स्मरण करते रहे। राजा का क्रोध और गहरा होता गया जब उसने जाना कि न सत्ता, न भय उसके पुत्र से उसकी आस्था छुड़वा सकते हैं।'],
['नरसिंह खंभे से प्रकट होते हैं','हिरण्यकशिपु ने पूछा कि क्या विष्णु पास के खंभे में हैं और उस पर प्रहार किया। नरसिंह प्रकट हुए, जो न मनुष्य थे न पशु, और उन्होंने संध्या के समय देहली पर दैत्य से युद्ध किया। उन्होंने हिरण्यकशिपु को अपनी गोद में रखा और नखों से उसका वध किया; इस प्रकार वरदान की शर्तें पूरी हुईं और प्रह्लाद की रक्षा हुई।'],
['प्रह्लाद नरसिंह के सामने प्रार्थना करते हैं','देवता नरसिंह के प्रचंड क्रोध से डर रहे थे, पर प्रह्लाद बिना भय के उनके पास गए। उन्होंने विनम्रता से प्रार्थना की और कहा कि भक्ति के बिना जन्म या पद किसी को योग्य नहीं बनाते। नरसिंह का क्रोध शांत हुआ और उन्होंने प्रह्लाद को आशीर्वाद दिया, जिन्होंने केवल अपने पिता और समस्त प्राणियों का कल्याण माँगा।'],
['प्रह्लाद का राज्याभिषेक','हिरण्यकशिपु की मृत्यु के बाद प्रह्लाद को सिंहासन पर बैठाया गया। उन्होंने प्रतिशोध से नहीं, करुणा और भक्ति से शासन किया। पहले का असुर-राज्य ऐसा स्थान बन गया जहाँ लोग स्वतंत्र होकर भगवान का सम्मान कर सकते थे, और प्रह्लाद के जीवन ने दिखाया कि शासक का बल शांति की सेवा कर सकता है।'],
['शिव त्रिपुर के तीन नगरों का नाश करते हैं','दैत्यों के तीन नगर आकाश में विचरते थे; वरदानों से सुरक्षित होने के कारण उन्हें जीतना कठिन था। जब उन्होंने लोकों को संकट में डाला, तो शिव दिव्य रथ पर चढ़े और एक ही बाण छोड़कर तीनों नगरों को भस्म कर दिया। देवताओं ने त्रिपुर के विनाशक त्रिपुरारि के रूप में उनकी स्तुति की और लोकों में व्यवस्था लौट आई।'],
['धर्म का सनातन मार्ग','नारद ने धर्म के स्थायी सिद्धांत बताए: सत्य, करुणा, संयम, दान और भगवान का स्मरण। बदलते युगों और परिस्थितियों में भी ये मूल्य सार्थक रहते हैं। युधिष्ठिर ने सुना कि आध्यात्मिक जीवन केवल अनुष्ठानों से नहीं, बल्कि इस बात से भी टिका है कि लोग एक-दूसरे से कैसा व्यवहार करते हैं।'],
['दैनिक जीवन में सदाचार','ऋषियों ने पूछा कि साधारण जीवन के कर्तव्यों में लोगों को कैसा आचरण करना चाहिए। नारद ने बताया कि ईमानदारी, आत्म-संयम, सम्मान और निष्पक्षता परिवारों और समाज में विश्वास बनाए रखते हैं। नैतिक आचरण हृदय को भक्ति के लिए तैयार करता है, और छोटे से छोटे निर्णय में भी मनुष्य की धर्म की समझ झलक सकती है।'],
['संन्यासी का जीवन','नारद ने उन लोगों से अपेक्षित अनुशासन बताया जो गृहस्थ जीवन त्यागते हैं: सादगी, अध्ययन, संयम और सब प्राणियों के प्रति दया। संन्यास कष्ट या अहंकार का प्रदर्शन नहीं है। यह ममता का धीरे-धीरे छूटना है ताकि साधक भगवान में एकाग्र रह सके।'],
['गृहस्थ के कर्तव्य','गृहस्थ आतिथ्य, ईमानदार परिश्रम, बड़ों की देखभाल और दान से परिवारों और समाज को सँभालते हैं। नारद ने बताया कि सांसारिक दायित्व भगवान की सेवा के रूप में निभाए जा सकते हैं। घर तब साधना का स्थान बन जाता है जब उसके सदस्य सम्मान से व्यवहार करें और जो उनके पास है उसे बाँटें।'],
['ब्रह्मचारी और वानप्रस्थ के कर्तव्य','नारद ने विद्यार्थियों और वन में चले जाने वालों के दायित्व बताए। विद्यार्थी अनुशासन और सम्मान के साथ सीखते हैं; वानप्रस्थ अपना जीवन सरल बनाते और चिंतन की ओर मुड़ते हैं। हर आश्रम के अपने कर्तव्य हैं, और हर एक मनुष्य को ज्ञान और भक्ति के लिए तैयार कर सकता है।'],
['गजेंद्र को ग्राह पकड़ लेता है','गजराज गजेंद्र अपने झुंड के साथ एक सरोवर में उतरा, पर एक ग्राह ने उसका पैर पकड़ लिया। संघर्ष बहुत समय तक चलता रहा और दूसरे हाथी उसे छुड़ा न सके। जब उसका बल क्षीण होने लगा, तो गजेंद्र को पिछले जन्म की एक प्रार्थना याद आई और उसने सहायता के लिए भगवान को पुकारा।'],
['गजेंद्र सहायता के लिए भगवान को पुकारता है','गजेंद्र ने एक कमल उठाकर भगवान को अर्पित किया और ग्राह से तथा सांसारिक जीवन के गहरे बंधन से छुटकारे की प्रार्थना की। उसकी प्रार्थना ऐसे हृदय से निकली जिसमें न अहंकार बचा था न बल। देवताओं ने उसकी पुकार सुनी, पर इस संघर्ष को केवल भगवान ही समाप्त कर सकते थे।'],
['भगवान गजेंद्र का उद्धार करते हैं','विष्णु गरुड़ पर आए और उन्होंने ग्राह को मारकर गजेंद्र को छुड़ाया। हाथी उस संघर्ष से और अपने पिछले जीवन के फल से मुक्त हुआ। यह कथा उस भक्त का सम्मान करती है जिसने संकट में भगवान को याद किया, और दिखाती है कि सच्चा समर्पण शारीरिक बल से आगे तक पहुँचता है।'],
['समुद्र-मंथन आरंभ होता है','देवता अपनी शक्ति खो चुके थे और अमृत पाने का उपाय खोज रहे थे। विष्णु ने उन्हें असुरों के साथ मिलकर मंदराचल पर्वत और वासुकि नाग से समुद्र मथने की सलाह दी। दोनों प्रतिद्वंद्वी इस विशाल कार्य में जुट गए, और हर पक्ष अमृत को अपने लिए पाने की आशा कर रहा था।'],
['मंदराचल को आधार चाहिए','जब देवता और असुर मंदराचल को समुद्र तक ले गए, तो पर्वत जल में डूब गया। उनका प्रयास व्यर्थ होता दिखा, तभी विष्णु ने विशाल कच्छप का रूप धारण किया। उन्होंने पर्वत को अपनी पीठ पर सँभाला और मंथन को स्थिर आधार दिया।'],
['समुद्र से विष और रत्न निकलते हैं','समुद्र मथने पर सबसे पहले घातक विष निकला, जिसने पूरी सृष्टि को संकट में डाल दिया। लोकों की रक्षा के लिए शिव ने उसे पी लिया और अपने कंठ में धारण किया। फिर अनेक रत्न निकले, जिनमें देवी लक्ष्मी, दिव्य अश्व और दिव्य प्राणी थे, और अंत में अमृत प्रकट हुआ।'],
['अमृत बाँटने के लिए मोहिनी प्रकट होती हैं','असुरों ने अमृत छीन लिया और देवताओं को भय हुआ कि वे अत्यधिक शक्तिशाली हो जाएँगे। विष्णु ने मोहिनी का मनमोहक रूप धारण किया और उसे न्याय से बाँटने का प्रस्ताव रखा। उनके सौंदर्य से मुग्ध असुर उन्हें अमृत परोसने देने को मान गए; वे उनकी योजना नहीं समझ पाए।'],
['मोहिनी देवताओं को अमृत देती हैं','मोहिनी ने देवताओं और असुरों को अलग-अलग बैठाया और पहले देवताओं को अमृत पिलाया। राहु वेश बदलकर उनके बीच बैठ गया, पर सूर्य और चंद्रमा ने उसे पहचान लिया। इससे पहले कि अमृत उसके शरीर को अमर करता, विष्णु ने राहु का सिर काट दिया, और देवताओं ने अपनी शक्ति फिर पा ली।'],
['देवता और असुर स्वर्ग के लिए लड़ते हैं','देवताओं के अमृत पी लेने पर असुरों ने जाना कि उनके साथ छल हुआ है और उन्होंने आक्रमण कर दिया। सेनाएँ लोकों भर में भिड़ गईं। विष्णु ने देवताओं की सहायता की और युद्ध उनके पक्ष में मुड़ गया, यद्यपि दोनों दलों का संघर्ष बाद के युगों में भी चलता रहा।'],
['नारद युद्ध समाप्त कराते हैं','युद्ध तब तक चलता रहा जब तक नारद ने बीच में आकर दोनों पक्षों से रुकने का आग्रह नहीं किया। देवता अपने स्वर्ग-धाम लौट गए और असुर पीछे हट गए। उनके हस्तक्षेप से वह युद्ध थम गया और दोनों पक्षों को याद आया कि अंतहीन संघर्ष सभी लोकों का नाश कर सकता है।'],
['पाँचवाँ और छठा मन्वंतर तथा ब्रह्मा की प्रार्थना','शुकदेव ने पाँचवें और छठे मन्वंतर के शासकों और दिव्य रक्षकों का वर्णन किया। इन युगों में ब्रह्मा ने भगवान की स्तुति की और सृष्टि के कार्य के लिए शक्ति माँगी। यह वृत्तांत दिखाता है कि हर ब्रह्माण्डीय काल के अपने रक्षक होते हैं, फिर भी वह भगवान की बड़ी योजना के भीतर रहता है।'],
['शिव मोहिनी का मनमोहक रूप देखते हैं','शिव ने मोहिनी के सौंदर्य के बारे में सुना और विष्णु से वह रूप दिखाने को कहा। जब मोहिनी प्रकट हुईं, तो शिव मुग्ध हो गए और माया के हटने तक उनके पीछे चलते रहे। तब उन्होंने भगवान की माया की शक्ति समझी और विष्णु की स्तुति की कि उन्होंने दिखा दिया कि बड़े तपस्वियों की भी परीक्षा हो सकती है।'],
['भविष्य के मन्वंतर','शुकदेव ने उन मनुओं का वर्णन किया जो आने वाले युगों का मार्गदर्शन करेंगे और उन दिव्य प्राणियों का जो उनके साथ सेवा करेंगे। हर मन्वंतर के अपने शासक, ऋषि और रक्षक होते हैं। बदलते नाम और काल श्रोताओं को याद दिलाते हैं कि लोक विशाल चक्रों से गुज़रते हैं, जबकि दिव्य व्यवस्था स्थिर रहती है।'],
['मनुओं और उनके रक्षकों के कर्तव्य','मनु धर्म की रक्षा, प्राणियों के पालन और मानव समाज के मार्गदर्शन से अपने-अपने काल का संचालन करते हैं। उनके मंत्री, ऋषि और दिव्य सहयोगी इस दायित्व में भागीदार हैं। शुकदेव ने ये कर्तव्य यह दिखाने के लिए समझाए कि ब्रह्माण्ड की व्यवस्था दिव्य शक्ति जितनी ही सेवा और न्याय पर भी टिकी है।'],
['बलि स्वर्ग-लोक को जीत लेते हैं','राजा बलि और असुरों ने देवताओं को हराकर स्वर्ग पर अधिकार कर लिया। देवताओं ने विष्णु से सहायता माँगी और अदिति ने अपने पुत्रों का लोक लौटने की प्रार्थना की। भगवान ने उनके पुत्र के रूप में प्रकट होने का वचन दिया, और इससे बलि की वामन से भेंट की भूमिका बनी।'],
['अदिति पयोव्रत करती हैं','अपने पति कश्यप की सलाह पर अदिति ने पयोव्रत किया, जो विष्णु को समर्पित संयम का व्रत है। उन्होंने देवताओं की रक्षा के लिए प्रार्थना की—बलि से द्वेष के कारण नहीं, अपने पुत्रों की चिंता के कारण। विष्णु प्रकट हुए और आश्वासन दिया कि संतुलन लौटाने के लिए वे जन्म लेंगे।'],
['अदिति और कश्यप के घर वामन का जन्म','विष्णु अदिति और कश्यप के घर एक तेजस्वी बौने ब्राह्मण के रूप में जन्मे। देवता प्रसन्न हुए और उन्होंने पवित्र उपहार भेंट किए। कद में छोटे होने पर भी वामन में लोकों को लौटाने की शक्ति थी, और वे बलि से उसके महान यज्ञ में मिलने चल पड़े।'],
['वामन बलि के यज्ञ में पहुँचते हैं','बलि उदारता से यज्ञ कर रहे थे, तभी वामन वहाँ पहुँचे। उस बाल-ब्राह्मण के तेज ने सबका ध्यान खींच लिया। बलि ने उनका स्वागत किया और जो माँगें वह देने का वचन दिया। वामन ने केवल तीन पग भूमि माँगी—एक छोटा-सा दान, जिसमें आने वाली परीक्षा का विस्तार छिपा था।'],
['वामन तीन पग भूमि माँगते हैं','बलि के गुरु शुक्राचार्य ने वामन को विष्णु के रूप में पहचान लिया और बलि को हामी न भरने की चेतावनी दी। बलि ने कीमत पर विचार किया, पर अपना वचन निभाना चुना। उन्होंने वामन के हाथ में जल डालकर विधिपूर्वक तीन पग भूमि दान कर दी, यद्यपि गुरु को राज्य खो जाने का भय था।'],
['विष्णु अपना विराट रूप प्रकट करते हैं','वामन बढ़ते गए, यहाँ तक कि उनका शरीर ब्रह्माण्ड में भर गया। एक पग में उन्होंने पृथ्वी नाप ली और दूसरे में स्वर्ग, और तीसरे के लिए कोई स्थान न बचा। बलि ने भगवान का विराट रूप देखा और समझ गए कि यह अतिथि उनके वचन और विनम्रता की परीक्षा लेने आया था।'],
['लोक दान करने के बाद बलि बाँध लिए जाते हैं','लोक नाप लिए जाने पर विष्णु के पार्षदों ने बलि को बाँध दिया। राजा ने यह शिकायत नहीं की कि दान ने उनका सब कुछ ले लिया; उन्होंने माना कि तीसरा पग अब भी उन पर उधार है। हानि में भी उनकी सच्चाई और स्थिरता से भगवान प्रसन्न हुए और बलि के अंतिम प्रस्ताव की प्रतीक्षा करने लगे।'],
['बलि वामन को अपना सिर अर्पित करते हैं','बलि ने वामन के तीसरे पग के लिए अपना सिर अर्पित किया। प्रह्लाद ने अपने वंशज की सत्यनिष्ठा की प्रशंसा की, और विष्णु ने यह भेंट स्वीकार करके उन्हें आशीर्वाद दिया। बलि को दूसरे रूप में राज्य लौटाया गया और सुतल लोक में भगवान की रक्षा का वचन मिला।'],
['भगवान की रक्षा में बलि सुतल में प्रवेश करते हैं','बंधन से मुक्त होकर बलि सुतल में गए, जहाँ विष्णु उनके द्वार पर पहरा देते थे। बलि ने अपना स्वर्गीय साम्राज्य खोया, पर भगवान की उपस्थिति और संगति पाई। यह कथा दिखाती है कि समर्पण और सत्यनिष्ठा सांसारिक प्रभुता से गहरा वरदान दिला सकते हैं।'],
['मत्स्य अवतार मनु को प्रलय से बचाता है','जब एक नन्ही मछली ने मनु से रक्षा माँगी, तो उन्होंने उसे एक छोटे पात्र में रख दिया। मछली हर नए स्थान से बड़ी होती गई और उसने स्वयं को विष्णु के रूप में प्रकट किया। उसने मनु को आने वाले प्रलय की चेतावनी दी और उनकी नौका को राह दिखाई, जिससे जीवन के बीज और ऋषि जल के पार सुरक्षित पहुँचे।'],
['राजा सुद्युम्न का बदलता भाग्य','सुद्युम्न एक ऐसे वन में गए जहाँ एक शाप ने उनका रूप बदल दिया, और उन्हें बारी-बारी से पुरुष और स्त्री के रूप में रहना पड़ा। इस असामान्य भाग्य ने राजवंश को अस्थिर कर दिया, पर एक ऋषि ने राज्य के चलते रहने का उपाय निकालने में सहायता की। यह कथा पुराण की राजवंशावलियों में गुँथी जटिल नियतियों को दर्शाती है।'],
['मनु के पुत्र और राजाओं के वंश','शुकदेव ने मनु के वंशजों का वर्णन किया और उन शासकों के बारे में बताया जिन्होंने संसार भर में राज्य और कुल स्थापित किए। उनके इतिहास में साहस, भूलें और भक्ति के कार्य सम्मिलित हैं। इन वंशावलियों से परीक्षित ने जाना कि बाद की कथाओं के राजपरिवार आरंभिक पीढ़ियों से कैसे निकले।'],
['सुकन्या का निर्णय और अश्विनीकुमार','राजकुमारी सुकन्या ने अनजाने में वृद्ध ऋषि च्यवन का ध्यान भंग कर दिया। प्रायश्चित्त के लिए उन्होंने उनसे विवाह किया और निष्ठा से उनकी सेवा की। अश्विनीकुमारों ने च्यवन का यौवन लौटाने का प्रस्ताव रखा और सुकन्या की निष्ठा की परीक्षा ली। उन्होंने बदले हुए रूपों के बीच अपने पति को पहचान लिया, और च्यवन को नया बल मिला।'],
['दुर्वासा के क्रोध के बावजूद अम्बरीष अपना व्रत निभाते हैं','राजा अम्बरीष ने भक्ति से एक पवित्र उपवास रखा। व्रत खोलने का समय समाप्त होने को था, तभी ऋषि दुर्वासा आए और स्नान करने चले गए। व्रत निभाने के लिए अम्बरीष ने जल का घूँट ले लिया, जिससे दुर्वासा क्रोधित हो उठे। एक अग्निमय कृत्या राजा के पीछे दौड़ी, पर विष्णु के चक्र ने उनकी रक्षा की।'],
['दुर्वासा सुदर्शन से रक्षा खोजते हैं','सुदर्शन चक्र लोकों भर में दुर्वासा का पीछा करता रहा। उन्होंने ब्रह्मा और शिव से सहायता माँगी, पर कोई उसे रोक न सका। विष्णु ने उनसे कहा कि केवल अम्बरीष की क्षमा ही उन्हें बचा सकती है। दुर्वासा लौटे और राजा ने बिना रोष के उनका स्वागत किया; इस प्रकार करुणा ने उस पीछा करने का अंत किया।'],
['राजा हरिश्चंद्र की सत्य-परीक्षा','हरिश्चंद्र ने ऋषि विश्वामित्र को दान का वचन दिया और उन्हें अपना राज्य और धन सौंपना पड़ा। वचन निभाने के लिए उन्होंने निर्धनता सही और श्मशान में काम किया। जब उनके अपने परिवार पर विपत्ति आई, तब भी वे सत्य पर टिके रहे। अंत में देवताओं ने उनका परिवार लौटाया और उनकी अडिग सच्चाई की प्रशंसा की।'],
['सगर के पुत्र यज्ञ के अश्व को खोजते हैं','राजा सगर का यज्ञ का अश्व लुप्त हो गया और उनके अनेक पुत्रों ने उसे खोजने के लिए पृथ्वी खोद डाली। वे ऋषि कपिल तक पहुँचे, उनके तेज को अपराध का चिह्न समझ बैठे और उन पर टूट पड़े। कपिल की शक्ति ने उन्हें भस्म कर दिया। बाद में उनके वंशजों ने उनकी भस्म तक पवित्र जल लाने का उपाय खोजा।'],
['भगीरथ गंगा को पृथ्वी पर लाते हैं','भगीरथ ने कठोर तप किया ताकि गंगा उतरें और सगर के पुत्रों की भस्म को पवित्र करें। शिव ने नदी को अपनी जटाओं में धारण किया और फिर उसकी धाराओं को पृथ्वी की ओर छोड़ा। भगीरथ जल को सागर तक ले गए, अपने पूर्वजों की आशा पूरी की और संसार को एक पवित्र नदी दी।'],
['कल्माषपाद का शाप','राजा कल्माषपाद ने ऋषि वसिष्ठ का अपराध किया और उन्हें नरभक्षी बनने का शाप मिला। इस शाप ने राजपरिवार को शोक में डाला और ऋषि की करुणा की परीक्षा ली। राजा के लंबे कष्ट के बाद शाप समाप्त हुआ, और कठिन परिस्थितियों में जन्मे वंशजों से वंश आगे चला।'],
['इक्ष्वाकु वंश में राम का जन्म','भागवत राम के जीवन का वर्णन करता है, जो इक्ष्वाकु वंश में धर्म की रक्षा के लिए जन्मे। उनकी कथा उनके जन्म और राजसी पालन-पोषण से उन परीक्षाओं तक जाती है जिन्होंने उनके चरित्र को गढ़ा। पुराण उन्हें ऐसे दिव्य राजा के रूप में याद करता है जिनका आचरण कर्तव्य और साहस का आदर्श बना।'],
['राम का वनवास और सीता की खोज','राम ने अपने पिता के वचन को चुनौती देने के बजाय वनवास स्वीकार किया। सीता और लक्ष्मण वन में उनके साथ गए। जब रावण ने सीता का हरण किया, तो राम ने उनकी खोज की, वानरों से मित्रता की और लंका पार गए। उनकी सहायता से उन्होंने रावण को हराया और अयोध्या लौटे।'],
['निमि और विदेह का वंश','ऋषि वसिष्ठ से विवाद के बाद राजा निमि का वंश एक विलक्षण जन्म के द्वारा आगे चला। उनके वंशजों ने विदेह पर राज्य किया और वे ज्ञान तथा आध्यात्मिक जिज्ञासा के लिए प्रसिद्ध हुए। शुकदेव ने उनका इतिहास उन प्राचीन राजवंशों के अंग के रूप में सुनाया जो अंततः कृष्ण के पूर्वजों की बड़ी कथा से जुड़ते हैं।'],
['ययाति से पहले का चंद्रवंश','शुकदेव ने पुरूरवा और उर्वशी से लेकर ययाति तक पहुँचने वाली पीढ़ियों में चंद्रवंश का वर्णन किया। इस वंश में ऐसे राजा हुए जिनकी कामनाओं और निर्णयों ने उनके वंशजों का भाग्य गढ़ा। यह वृत्तांत ययाति की कथा और राजकुल की बाद की शाखाओं की पारिवारिक पृष्ठभूमि तैयार करता है।'],
['परशुराम सहस्रार्जुन को पराजित करते हैं','अपनी हज़ार भुजाओं के लिए प्रसिद्ध राजा कार्तवीर्य अर्जुन ने ऋषि जमदग्नि की पवित्र गाय छीन ली। परशुराम लौटे और उन्होंने राजा का वध कर दिया। जब कार्तवीर्य के पुत्रों ने जमदग्नि की हत्या कर दी, तो परशुराम ने अपना फरसा उठाया और अत्याचारी क्षत्रिय शासकों से युद्ध किया, पिता का बदला लिया और संतुलन लौटाया।'],
['योद्धा राजाओं के विरुद्ध परशुराम की प्रतिज्ञा','जमदग्नि के शोक में परशुराम ने उन शासकों को दंड देने की प्रतिज्ञा की जो अपनी सत्ता का दुरुपयोग करते थे। उन्होंने क्षत्रिय सेनाओं को बार-बार हराया और बाद में अपने क्रोध को शांत करने के लिए अनुष्ठान किए। उनकी कथा उग्र है, फिर भी यह चेतावनी देती है कि संयम और न्याय से अलग होने पर राज-सत्ता विनाशकारी हो जाती है।'],
['ययाति अपने बुढ़ापे के बदले यौवन लेते हैं','राजा ययाति को समय से पहले बुढ़ापे का शाप मिला। उन्होंने अपने पुत्रों से कहा कि वे अपना यौवन देकर उनका बुढ़ापा ले लें, पर अधिकांश ने मना कर दिया। सबसे छोटे पुत्र पूरु मान गए। ययाति कुछ समय फिर सांसारिक सुखों में लगे, यह सोचकर कि वे अपनी कामनाएँ तृप्त कर लेंगे, पर उन्होंने जाना कि भोग से तृष्णा केवल बढ़ती है।'],
['ययाति सीखते हैं कि कामना तृप्त नहीं होती','वर्षों के भोग के बाद ययाति ने पहचाना कि कामना भोगने से कभी समाप्त नहीं होती, जैसे घी डालने से आग नहीं बुझती। उन्होंने पूरु का यौवन लौटाया, उन्हें राज्य दिया और वन चले गए। उनकी कथा आत्म-संयम और सांसारिक तृप्ति की सीमाओं की स्थायी सीख बन गई।'],
['पूरु के वंश में भरत का जन्म','पूरु के वंश में राजा भरत हुए, जिनका नाम इस भूमि और इसकी प्रजा से जुड़ गया। उनके वंशजों ने बदलते भाग्य के बीच राजवंश को आगे बढ़ाया। शुकदेव का वृत्तांत भरत के वंश को बाद के राज्यों से जोड़ता है और दिखाता है कि एक शासक की विरासत किसी प्रदेश की पहचान कैसे गढ़ सकती है।'],
['रंतिदेव अपना अंतिम भोजन बाँट देते हैं','राजा रंतिदेव लंबा उपवास सह चुके थे जब अंत में अन्न और जल आया। इससे पहले कि वे खाते, एक-एक करके अतिथि आए, हर एक ज़रूरतमंद। उन्होंने हर भाग दे दिया, अपना अंतिम जल भी, और उन्हें कोई पछतावा नहीं हुआ। अतिथियों ने स्वयं को दिव्य प्राणियों के रूप में प्रकट किया और उनकी करुणा तथा निःस्वार्थता की प्रशंसा की।'],
['पांचाल, मगध और कुरु के राजवंश','शुकदेव ने उन राजपरिवारों की शाखाओं का वर्णन किया जिन्होंने पांचाल, मगध और कुरु पर राज्य किया। उनके वंश महाकाव्यों की कथाओं से और परीक्षित के अपने पूर्वजों से जुड़ते हैं। इस वंशावली ने भागवत की भक्ति-कथाओं को प्राचीन राजाओं के परिचित इतिहास के भीतर रखने में सहायता की।'],
['अनु, द्रुह्यु, तुर्वसु और यदु के वंशज','ययाति के पुत्रों ने अलग-अलग राजवंश चलाए: अनु, द्रुह्यु, तुर्वसु, यदु और पूरु। उनके वंशज अनेक प्रदेशों में फैले और उन्होंने अलग-अलग राज्य बनाए। शुकदेव ने इन शाखाओं का क्रम से वर्णन किया और दिखाया कि एक ही परिवार अनेक जनों और राजनीतिक इतिहासों का स्रोत कैसे बना।'],
['यदु वंश और कृष्ण के पूर्वज','यदु का वंश राजाओं की पीढ़ियों से चलता हुआ वसुदेव और देवकी के जन्म तक पहुँचा। उनके परिवार का इतिहास सीधे कृष्ण के प्राकट्य तक ले जाता है। शुकदेव का वृत्तांत प्राचीन शासकों को भागवत की केंद्रीय कथा से जोड़कर राजवंशावली को पूरा करता है।'],
['देवकी के विवाह में कंस भविष्यवाणी सुनता है','जब वसुदेव अपनी वधू देवकी को रथ में घर ले जा रहे थे, एक आकाशवाणी ने कंस को चेताया कि देवकी की आठवीं संतान उसे मारेगी। कंस ने अपनी बहन पर तलवार खींच ली, पर वसुदेव ने उसे छोड़ देने के लिए मना लिया और हर संतान उसे सौंपने का वचन दिया। कंस मान गया, पर शीघ्र ही भय ने उसे जकड़ लिया।'],
['वसुदेव देवकी की संतानें सौंपने का वचन देते हैं','कंस ने वसुदेव और देवकी को कारागार में डाल दिया और हर जन्म पर निगरानी रखी। वसुदेव ने वचन निभाया और पहली संतान उस अत्याचारी के पास ले गए। कंस ने पहले उस शिशु को लौटा दिया, पर देवताओं की योजना के विषय में नारद की चेतावनी ने उसे शंकालु बना दिया। भविष्यवाणी से बचने के लिए वह देवकी की संतानों को मारने लगा।'],
['कृष्ण देवकी की कारा-कोठरी में प्रकट होते हैं','समय आने पर विष्णु अपने दिव्य रूप में देवकी और वसुदेव के सामने प्रकट हुए और आश्वासन दिया कि वे उनके पुत्र के रूप में जन्म लेंगे। फिर वे नवजात शिशु बन गए। पहरेदारों और कारागार की दीवारों से घिरे होने पर भी माता-पिता समझ गए कि इस बालक का जन्म संसार के लिए आशा लेकर आया है।'],
['वसुदेव कृष्ण को यमुना पार ले जाते हैं','कारागार के द्वार खुल गए और पहरेदार सो गए। वसुदेव रात में नवजात कृष्ण को गोकुल की ओर ले चले। यमुना चढ़ी हुई थी, पर उसने पार जाने भर का मार्ग दे दिया, और शेष ने बालक को वर्षा से बचाया। वसुदेव ने कृष्ण को यशोदा की नवजात पुत्री से बदला और बिना किसी के देखे लौट आए।'],
['नंद और यशोदा अपने पुत्र का स्वागत करते हैं','नंद और यशोदा जागे तो उन्होंने अपने घर में एक बालक पाया और गोकुल के लोगों के साथ उसके जन्म का उत्सव मनाया। देवकी की संतान से हुई अदला-बदली से अनजान, वे कृष्ण को अपना ही पुत्र मानकर प्रेम करते थे। ग्वालों ने गाँव को संगीत, उपहारों और आनंद भरे आशीर्वादों से भर दिया।'],
['पूतना वेश बदलकर गोकुल आती है','राक्षसी पूतना सुंदर स्त्री का वेश धरकर आई और उसने शिशु कृष्ण को दूध पिलाने की बात कही। उसके स्तन पर विष लगा था, पर कृष्ण ने विष के साथ उसके प्राण भी खींच लिए। उसका विशाल शरीर गाँव भर में गिर पड़ा, और ग्वाले समझ गए कि बालक एक घातक आक्रमण से बच गया है।'],
['शकटासुर और तृणावर्त','एक उत्सव में छकड़े में छिपे एक दैत्य ने कृष्ण को कुचलना चाहा, पर शिशु ने लात मारकर उसे चूर कर दिया। बाद में तृणावर्त बवंडर बनकर उन्हें आकाश में उड़ा ले गया। कृष्ण दैत्य की पकड़ में भारी होते गए और वह धड़ाम से धरती पर आ गिरा। गाँव वालों ने बालक को फिर सुरक्षित पाया।'],
['यशोदा कृष्ण के मुख में ब्रह्माण्ड देखती हैं','कृष्ण ने मिट्टी खा ली तो यशोदा ने उनसे मुँह खोलने को कहा। उन्होंने उसके भीतर पूरा ब्रह्माण्ड देखा: तारे, भूमियाँ, समुद्र और स्वयं को भी, कृष्ण को गोद में लिए हुए। इस दर्शन से वे चौंक गईं, पर भगवान की शक्ति ने शीघ्र ही उस क्षण को ममता से ढक दिया और वे फिर अपने नन्हे पुत्र की देखभाल में लग गईं।'],
['यशोदा कृष्ण को ऊखल से बाँधती हैं','कृष्ण ने मटकियाँ फोड़ीं और बंदरों को माखन बाँटा। जब यशोदा ने उन्हें पकड़ना चाहा तो वे भागे, और अंत में उन्होंने उन्हें एक भारी ऊखल से बाँध दिया। उनका प्रेम बालक की स्वतंत्रता से बड़ा था, फिर भी रस्सी हर बार छोटी पड़ती रही, जब तक कृष्ण ने स्वयं को उनकी भक्ति से बँधने नहीं दिया।'],
['कृष्ण यमलार्जुन वृक्षों को उखाड़ते हैं','ऊखल घसीटते हुए कृष्ण दो ऊँचे वृक्षों के बीच से निकले और उन्होंने उन्हें गिरा दिया। वे वृक्ष कुबेर के शापित पुत्र नलकूबर और मणिग्रीव थे। वे तनों से निकले, उन्होंने कृष्ण की स्तुति की और शाप से मुक्त हुए। आवाज़ सुनकर ग्वाले दौड़े आए कि क्या हुआ।'],
['ग्वाले गोकुल से वृंदावन जाते हैं','गोकुल में बार-बार आए संकटों के बाद ग्वालों ने वृंदावन जाने का निश्चय किया। उन्होंने अपने छकड़े लादे और बच्चों, गायों तथा घर का सामान एक अधिक सुरक्षित वन-बस्ती में ले आए। वहाँ कृष्ण और बलराम गायों के बीच बड़े हुए और खेलने के लिए झरने, कुंज और खुले चरागाह खोजते रहे।'],
['कृष्ण वत्सासुर और बकासुर को पराजित करते हैं','वत्सासुर बछड़े का रूप धरकर झुंड में मिल गया, पर कृष्ण ने उसे पहचान लिया और उठाकर दूर फेंक दिया। बकासुर विशाल बगुले के रूप में आया और उसने कृष्ण को निगल लिया, पर कृष्ण ने उसका गला जला दिया और वह हार गया। ग्वाल-बाल अपने मित्र के साहस पर आनंदित हुए।'],
['अघासुर ग्वाल-बालों को निगल लेता है','अघासुर ने विशाल अजगर का रूप लिया और अपना मुँह गुफा की तरह खोल दिया। बालक उसे कोई अजूबा समझकर भीतर चले गए, और कृष्ण उन्हें बचाने पीछे गए। वे दैत्य के भीतर बढ़ते गए जब तक अघासुर का दम नहीं घुट गया। कृष्ण ने अपने मित्रों को फिर जीवित किया और देवताओं ने इस उद्धार का उत्सव मनाया।'],
['ब्रह्मा बछड़ों और ग्वाल-बालों को छिपा देते हैं','ब्रह्मा सोचने लगे कि बालक कृष्ण बलवान दैत्यों को कैसे हरा सकते हैं, इसलिए उन्होंने बछड़ों और ग्वाल-बालों को छिपा दिया। उत्तर में कृष्ण स्वयं हर खोया हुआ बछड़ा और बालक बन गए, उनके घर लौटे और एक वर्ष तक उनके परिवारों के साथ रहे। किसी को अंतर नहीं दिखा, क्योंकि हर रूप स्वयं कृष्ण ही थे।'],
['ब्रह्मा कृष्ण के अनंत रूप देखते हैं','जब ब्रह्मा लौटे, तो उन्होंने कृष्ण के असंख्य रूप देखे, हर एक तेजस्वी और पूर्ण। भगवान ने प्रकट किया कि वे केवल गाँव के बालक नहीं, सभी प्राणियों के स्रोत हैं। ब्रह्मा ने विनम्रता से प्रणाम किया, बछड़ों और बालकों को लौटाया और अपने कार्य पर लौटने से पहले कृष्ण की स्तुति की।'],
['कृष्ण और बलराम धेनुकासुर को पराजित करते हैं','धेनुकासुर मीठे ताल-फलों के एक वन की रखवाली करता था और जो भी पास आता उसे भगा देता था। बलराम ने एक पेड़ हिलाया, तो गधे के रूप वाला दैत्य आक्रमण करने दौड़ा। बलराम ने धेनुक को टाँगों से पकड़ा और पटक दिया। कृष्ण और बलराम ने दूसरे दैत्यों को भी हराया, और ग्वालों ने निर्भय होकर फल बटोरे।'],
['कृष्ण कालिय नाग का दमन करते हैं','कालिय ने यमुना के जल को विषैला कर दिया था और उसके तट के पास पशु-पक्षी मरकर गिरने लगे थे। कृष्ण नदी में कूद पड़े और नाग से लड़े। वे कालिय के अनेक फनों पर तब तक नाचते रहे जब तक नाग की पत्नियों ने दया की भीख नहीं माँगी। कृष्ण ने उसे छोड़ दिया, पर नदी छोड़ने और ग्वालों को कष्ट न देने का आदेश दिया।'],
['कृष्ण ग्वालों को दावानल से बचाते हैं','जब ग्वाल-बाल वन में सो रहे थे, लपटों ने उन्हें घेर लिया। उन्होंने सहायता के लिए कृष्ण को पुकारा और कृष्ण ने आग को निगलकर सबको बचा लिया। बालक सकुशल वृंदावन लौटे, चकित कि जब संकट हर दिशा से आए तब भी उनका मित्र उनकी रक्षा कर सकता है।'],
['प्रलंबासुर ग्वाल-बालों को ललकारता है','प्रलंबासुर ग्वाले का वेश धरकर बालकों के खेल में सम्मिलित हो गया। उसने बलराम को अपना जोड़ीदार चुना और निकल भागने की आशा में उन्हें उठा ले चला। बलराम भारी होते गए, उन्होंने दैत्य को पहचान लिया और उसे मार गिराया। कृष्ण ने अपने भाई की प्रशंसा की और बालक फिर खेलने लगे।'],
['कृष्ण एक और दावानल को निगलते हैं','वन की आग ने एक बार फिर ग्वालों और उनके पशुओं को घेर लिया। बालक कृष्ण के चारों ओर इकट्ठे हो गए, उन्हें भरोसा था कि वे रक्षा करेंगे। कृष्ण ने उनसे आँखें बंद करने को कहा और लपटों को निगल लिया। उन्होंने आँखें खोलीं तो वे सुरक्षित थे और चारों ओर वन शांत खड़ा था।'],
['गोपियाँ कृष्ण की बाँसुरी का गान करती हैं','जब कृष्ण बाँसुरी बजाते, तो गोपियाँ खेतों और वनों के पार उसके स्वर सुनतीं। वे बतातीं कि उस ध्वनि से नदियाँ ठहर जाती हैं, पशु स्थिर खड़े रह जाते हैं और वृक्ष उनकी ओर झुक जाते हैं। उनका गीत बताता है कि कृष्ण के संगीत ने वृंदावन के हर कोने में भक्ति कैसे जगाई।'],
['गोप-कन्याएँ कात्यायनी की पूजा करती हैं','युवा गोपियों ने इस आशा से कात्यायनी का व्रत रखा कि कृष्ण उनके पति बनें। वे यमुना में स्नान करतीं और सादी भेंटों से देवी की पूजा करतीं। कृष्ण ने खेल-खेल में उनके वस्त्र ले लिए और जब वे विनम्रता से उनके पास आईं तो लौटा दिए; उन्होंने उनकी भक्ति स्वीकार की और उनका व्रत पूरा किया।'],
['कृष्ण यज्ञ करने वाले ब्राह्मणों की पत्नियों को मुक्त करते हैं','ग्वाल-बाल भूखे थे, इसलिए कृष्ण ने उन्हें यज्ञ करने वाले ब्राह्मणों से भोजन माँगने भेजा। पुरोहितों ने उनकी उपेक्षा की, पर उनकी पत्नियाँ कृष्ण का नाम सुनते ही उत्साह से भोजन ले आईं। कृष्ण ने उनका आभार माना और सिखाया कि भक्ति अनुष्ठान के अहंकार से बड़ी हो सकती है। स्त्रियाँ कृष्ण में मन लगाए घर लौट गईं।'],
['कृष्ण इंद्र का यज्ञ रुकवाते हैं','ग्वालों ने वर्षा और चरागाह के लिए इंद्र का वार्षिक यज्ञ रचा। कृष्ण ने नंद से कहा कि इसके बजाय गोवर्धन पर्वत और उस भूमि का सम्मान करें जो सीधे उनका पोषण करती है। लोग मान गए और उन्होंने पर्वत को भोजन और पूजा अर्पित की। इससे इंद्र क्रोधित हुए और उन्होंने दंड देने के लिए आँधी-वर्षा भेजी।'],
['कृष्ण गोवर्धन पर्वत उठाते हैं','इंद्र की वर्षा से वृंदावन डूबने लगा। कृष्ण ने गोवर्धन पर्वत को एक उँगली पर उठा लिया और ग्वालों तथा उनकी गायों को उसके नीचे शरण लेने बुलाया। सात दिन तक आँधी-वर्षा चलती रही और वे पर्वत को स्थिर थामे रहे। लोगों ने देखा कि कृष्ण की रक्षा इंद्र की शक्ति से बड़ी है।'],
['तूफ़ान के बाद इंद्र विनम्रता सीखते हैं','इंद्र ने देखा कि उनका तूफ़ान कृष्ण की रक्षा में रहने वालों का कुछ नहीं बिगाड़ सका। अपना अहंकार पहचानकर वे सुरभि के साथ आए और क्षमा माँगी। उन्होंने कृष्ण को गोविंद, गायों और पृथ्वी के रक्षक, के रूप में सम्मान दिया। तूफ़ान थम गया और ग्वाले अपने घरों को लौट गए।'],
['नंद को वरुण-लोक से छुड़ाया जाता है','नंद असमय यमुना में उतरे और वरुण के सेवकों ने उन्हें पकड़कर अपने स्वामी के पास पहुँचा दिया। कृष्ण वरुण-लोक गए और अपने पिता को छुड़ा लाए। नंद उन दिव्य लोकों को देखकर, जिनकी झलक उन्हें मिली थी, और अपने पुत्र को मिले सम्मान से चकित होकर लौटे।'],
['गोपियाँ कृष्ण को खोजती हैं','रास की रात कृष्ण अचानक अदृश्य हो गए। गोपियों ने वन भर में उन्हें खोजा और वृक्षों, लताओं तथा पशुओं से पूछा कि क्या उन्होंने कृष्ण को देखा है। उन्होंने उनकी पिछली लीलाओं का अनुकरण किया और उनके पदचिह्नों के पीछे चलीं; उनकी विरह-व्याकुलता गहरी होती गई जब उन्होंने जाना कि उनके हृदय कितनी पूरी तरह कृष्ण से बँधे हैं।'],
['गोपियाँ कृष्ण के लौटने के लिए गाती हैं','कृष्ण को न पाकर गोपियों ने उनके सौंदर्य, दया और लीलाओं का गान किया। उनके गीत में शोक और विश्वास दोनों थे: वे उनके बिना बहुत व्याकुल थीं, फिर भी उस आनंद को याद करती थीं जो कृष्ण ने उन्हें दिया था। यह प्रार्थना विरह में प्रेम की भागवत की सबसे प्रसिद्ध अभिव्यक्तियों में गिनी जाती है।'],
['कृष्ण गोपियों को सांत्वना देते हैं','कृष्ण गोपियों के पास लौटे और उन्होंने समझाया कि वियोग ने उनकी भक्ति को और दृढ़ किया है। उन्होंने उनके उस प्रेम की प्रशंसा की जो न फल पर निर्भर था न अधिकार पर। गोपियों ने फिर उनका स्वागत किया, और उस रात का मिलन आनंद तथा अपने बंधन की गहरी समझ के साथ फिर आरंभ हुआ।'],
['रास-मंडल का नृत्य','कृष्ण ने चाँदनी में गोपियों के साथ मंडल बनाकर नृत्य किया और हर गोपी के पास प्रकट हुए, ताकि हर भक्त को लगे कि वे उसी के साथ हैं। इस नृत्य ने अनेक प्रेमियों को एक दिव्य उपस्थिति में जोड़ दिया। ऋषियों ने बाद में समझाया कि यह प्रसंग आध्यात्मिक प्रेम का प्रतीक है और इसे श्रद्धा से सुनना चाहिए।'],
['सुदर्शन की मुक्ति और शंखचूड़ की पराजय','पूजा की एक रात सुदर्शन नाम के सर्प ने नंद को पकड़ लिया, पर कृष्ण ने उसे छुआ और उस शाप से मुक्त कर दिया जिसने उसका रूप बदला था। बाद में शंखचूड़ नाम का दैत्य गोपियों को हर ले गया। बलराम और कृष्ण ने उसका पीछा किया; कृष्ण ने दैत्य को मारा और उसके सिर की मणि ले आए।'],
['गोपियाँ वन में कृष्ण का गान करती हैं','जब कृष्ण और बलराम गायें चराते, तो गोपियाँ दूर से उन्हें देखतीं और उनके सौंदर्य तथा कौशल का गान करतीं। वे कृष्ण की बाँसुरी का और गायों की उस धूल का वर्णन करतीं जो उनके मुख पर छा जाती थी। उनके युगल-पदों ने वन के साधारण दृश्यों को दिव्य उपस्थिति के चिह्न बना दिया।'],
['अक्रूर को कृष्ण को मथुरा लाने भेजा जाता है','कंस ने अक्रूर को बुलाया और कहा कि वे कृष्ण और बलराम को मल्ल-उत्सव के लिए मथुरा ले आएँ। अक्रूर जानते थे कि इस निमंत्रण में संकट छिपा है, पर कृष्ण से मिलने की बात से वे आनंदित थे। वे भगवान के दर्शन का अवसर पाने की प्रार्थना करते हुए गोकुल की ओर चल पड़े।'],
['कृष्ण केशी और व्योम को पराजित करते हैं','केशी ने शक्तिशाली घोड़े के रूप में वृंदावन पर आक्रमण किया, पर कृष्ण ने अपनी भुजा दैत्य के मुँह में डाल दी और उसे हरा दिया। बाद में व्योम ग्वाल-बालों के बीच वेश बदलकर आया और उसने कुछ बालकों को गुफा में छिपा दिया। कृष्ण ने यह छल पकड़ लिया, बच्चों को छुड़ाया और दैत्य को मार डाला।'],
['अक्रूर गोकुल पहुँचते हैं','अक्रूर गोकुल पहुँचे और उन्होंने कृष्ण तथा बलराम को गायें चराते देखा। इस दर्शन से भाव-विभोर होकर उन्होंने प्रणाम किया। कृष्ण ने स्नेह से उनका स्वागत किया और मथुरा के लोगों का हाल पूछा। अक्रूर ने कंस का निमंत्रण सुनाया, और ग्वालों के शोक के बावजूद दोनों भाई जाने की तैयारी करने लगे।'],
['अक्रूर कृष्ण और बलराम को मथुरा ले जाते हैं','जब रथ गोकुल से निकला, तो गोपियाँ कृष्ण को जाते देखती रहीं और उन्हें भय हुआ कि वे उन्हें फिर कभी नहीं देख पाएँगी। अक्रूर ने यमुना के जल में भगवान के दिव्य रूप देखे और उनकी स्तुति की। कृष्ण और बलराम मथुरा की ओर बढ़ते गए, जबकि वृंदावन के लोग शोक में डूबे रहे।'],
['अक्रूर भगवान की स्तुति करते हैं','यात्रा के बीच अक्रूर ने यमुना में स्नान किया और जल के भीतर कृष्ण और बलराम को उनके विराट रूपों में देखा। उन्होंने भगवान की ब्रह्माण्ड के स्रोत और सब प्राणियों की शरण के रूप में स्तुति की। कृष्ण रथ पर लौट आए और अक्रूर नई भक्ति के साथ मथुरा की ओर चले।'],
['कृष्ण धोबी का घमंड तोड़ते हैं','मथुरा में कृष्ण ने राजा के एक धोबी से उत्सव के योग्य वस्त्र माँगे। उसने मना कर दिया और दोनों भाइयों का अपमान किया। कृष्ण ने उसे मार गिराया और अपने तथा बलराम के लिए वस्त्र ले लिए। नगरवासी उन निर्भीक आगंतुकों को देखकर चकित रह गए जिन्होंने राजा की सत्ता को चुनौती दी थी।'],
['कृष्ण माली और कुब्जा पर कृपा करते हैं','एक विनम्र माली ने फूलों और प्रार्थनाओं से कृष्ण और बलराम का स्वागत किया, और कृष्ण ने उसे आशीर्वाद दिया। वे त्रिवक्रा से भी मिले, जो महल की कुबड़ी सेविका थी और जिसने सुगंधित चंदन भेंट किया। कृष्ण ने कोमलता से उसका शरीर सीधा कर दिया और उसका आत्मविश्वास लौटाया। साधारण लोगों के प्रति उनकी इस दया से पूरी मथुरा में आनंद छा गया।'],
['कृष्ण कंस का धनुष तोड़ते हैं','उत्सव-स्थल पर कृष्ण ने सैनिकों के पहरे में रखा विशाल धनुष देखा। उन्होंने उसे उठाया और तोड़ डाला, और उसकी टंकार पूरी मथुरा में गूँज उठी। कंस ने वह ध्वनि सुनी और भयभीत हो गया; उसे आभास हुआ कि जिस युवा आगंतुक को उसने बुलाया है, उसे वश में करना सरल नहीं होगा।'],
['कुवलयापीड़ मल्ल-भूमि का पहरा देता है','कंस ने कृष्ण और बलराम को मारने के लिए भयंकर हाथी कुवलयापीड़ को अखाड़े के द्वार पर खड़ा किया। महावत ने उसे उन पर छोड़ दिया, पर कृष्ण ने हाथी को पकड़कर मार डाला। दोनों भाई उसके दाँत लिए अखाड़े में उतरे, पहलवानों का सामना करने को तैयार।'],
['कृष्ण और बलराम पहलवानों को पराजित करते हैं','प्रमुख पहलवान चाणूर और मुष्टिक ने भीड़ के सामने दोनों भाइयों को ललकारा। कृष्ण चाणूर से लड़े और बलराम मुष्टिक से। पहलवान गिर पड़े और लोग आनंदित हो उठे। भाइयों को मारने की कंस की योजना विफल हो गई, और अब वह अत्याचारी उसी संकट के सामने था जिससे वह डरता था।'],
['कृष्ण कंस के अत्याचार का अंत करते हैं','कंस ने अपने सैनिकों को कृष्ण को पकड़ने और वसुदेव तथा नंद को बंदी बनाने का आदेश दिया। कृष्ण उछलकर राजा के मंच पर चढ़ गए और उसे नीचे खींच लिया; इस प्रकार उसका शासन समाप्त हुआ। उन्होंने अपने माता-पिता को मुक्त किया और यादव कुल का सम्मान लौटाया। मथुरा के लोगों ने अत्याचारी के पतन का उत्सव मनाया।'],
['कृष्ण और बलराम सांदीपनि से शिक्षा पाते हैं','उपनयन के बाद कृष्ण और बलराम ने ऋषि सांदीपनि से शिक्षा ली। उन्होंने कलाओं और विद्याओं में आश्चर्यजनक तेज़ी से निपुणता पा ली। गुरु-दक्षिणा देने के लिए उन्होंने पूछा कि गुरु क्या चाहते हैं। सांदीपनि ने अपने उस पुत्र को लौटाने को कहा जो समुद्र में डूबकर मर गया था, और दोनों भाई उसे खोजने निकल पड़े।'],
['दोनों भाई गुरु के खोए पुत्र को लौटाते हैं','कृष्ण और बलराम ने सांदीपनि के पुत्र को समुद्र और यमलोक में खोजा। उन्होंने बालक को ढूँढ़ निकाला और उसे जीवित उसके माता-पिता के पास ले आए। सांदीपनि इस भेंट से आनंदित हुए, और भाइयों ने उस गुरु के प्रति कृतज्ञता के साथ अपनी शिक्षा पूरी की जिसने उन्हें अपनाया था।'],
['उद्धव नंद और यशोदा से मिलते हैं','कृष्ण ने अपने मित्र उद्धव को नंद और यशोदा के लिए संदेश देकर वृंदावन भेजा। उन्होंने कृष्ण के बारे में पूछा और उनके बचपन को व्याकुलता से याद किया। उद्धव ने देखा कि वे कृष्ण से कितना गहरा प्रेम करते हैं और समझे कि उनके सरल स्नेह में वह आध्यात्मिक गहराई है जिसे वे पहले नहीं समझ पाए थे।'],
['उद्धव गोपियों का विरह-प्रेम सुनते हैं','गोपियों ने उद्धव से कहा कि वे उनका संदेश कृष्ण तक पहुँचाएँ। एक गोपी ने एक भौंरे से ऐसे बात की मानो वह कृष्ण का दूत हो, और उसकी वाणी उलाहने और कोमलता के बीच डोलती रही। उद्धव ने सुना और देखा कि वियोग ने उनकी भक्ति को कमज़ोर नहीं किया; उसने उनके स्मरण को निरंतर बना दिया था।'],
['कृष्ण त्रिवक्रा और अक्रूर से मिलने जाते हैं','कृष्ण त्रिवक्रा के घर गए, जिसने भक्ति से उनका स्वागत किया, और फिर अक्रूर से मिले। इन भेंटों ने दिखाया कि कृष्ण उन्हें याद रखते हैं जिन्होंने उनके प्रति दया दिखाई थी। वे यादव परिवार का मार्गदर्शन भी करते रहे और मथुरा से बाहर की राजनीतिक चिंताओं पर भी ध्यान देते रहे।'],
['अक्रूर हस्तिनापुर संदेश ले जाते हैं','कृष्ण ने अक्रूर को हस्तिनापुर भेजा, यह जानने के लिए कि धृतराष्ट्र के शासन में पांडवों के साथ कैसा व्यवहार हो रहा है। अक्रूर ने कुरु वृद्धों से बात की और युवा राजकुमारों को घेरे हुए संकट को देखा। वे समाचार लेकर लौटे, जिससे कृष्ण को कुरु सभा में बढ़ते संघर्ष को समझने में सहायता मिली।'],
['जरासंध मथुरा पर आक्रमण करता है','जरासंध ने कंस का बदला लेने के लिए मथुरा पर बार-बार आक्रमण किया। कृष्ण और बलराम ने नगर की रक्षा की, पर लगातार घेराबंदी से प्रजा कष्ट पाती रही। उनकी रक्षा के लिए कृष्ण ने किलेबंद नगर द्वारका में जाने की व्यवस्था की, जहाँ यादव समुद्र के पास अधिक सुरक्षित रह सकते थे।'],
['कृष्ण द्वारका नगरी बसाते हैं','कृष्ण यादवों को द्वारका ले गए, जो समुद्र से सुरक्षित और उनकी रक्षा के लिए बनी एक भव्य नगरी थी। लोग अपने परिवारों और संपत्ति के साथ वहाँ बस गए। कृष्ण का यह निर्णय संकट से पलायन नहीं, बल्कि शत्रुओं का सामना करने की योजना बनाते हुए अपने समुदाय को बचाने का उपाय था।'],
['मुचुकुंद लंबी नींद से जागते हैं','कृष्ण आक्रमणकारी कालयवन को उस गुफा में खींच ले गए जहाँ राजा मुचुकुंद सो रहे थे। कालयवन ने सोते हुए राजा को ठोकर मारी और मुचुकुंद की दृष्टि की अग्नि से भस्म हो गया। राजा जागे, उन्होंने जाना कि युग बीत चुके हैं, और वे कृष्ण से मिले। उन्होंने दूसरे राज्य के बजाय साधना को चुना।'],
['कृष्ण और बलराम द्वारका लौटते हैं','जरासंध की सेनाओं के दबाव से निकलकर कृष्ण और बलराम द्वारका लौटे। समुद्री दुर्ग की रक्षा के लिए कृतज्ञ प्रजा ने उनका स्वागत किया। दोनों भाई चुनौतियों का सामना करते रहे और द्वारका को यादव कुल का सुरक्षित घर बनाते रहे।'],
['रुक्मिणी कृष्ण को गुप्त संदेश भेजती हैं','राजकुमारी रुक्मिणी का विवाह शिशुपाल से तय कर दिया गया था, जबकि उन्होंने मन में कृष्ण को चुन लिया था। उन्होंने एक विश्वसनीय ब्राह्मण के हाथ पत्र भेजा और कृष्ण से विवाह से पहले उन्हें ले जाने की प्रार्थना की। कृष्ण को संदेश मिला और वे उनके चुनाव का मान रखने का निश्चय करके तुरंत विदर्भ चल पड़े।'],
['कृष्ण रुक्मिणी को उनके विवाह से ले जाते हैं','रुक्मिणी के विवाह के अवसर पर कृष्ण पहुँचे और उन्हें अपने रथ में ले चले। उनके संबंधियों ने पीछा किया, पर कृष्ण के साथियों ने उन्हें रोके रखा। रुक्मिणी का भाई रुक्मी पीछे आया और उसने कृष्ण को ललकारा; कृष्ण ने उसे हरा दिया, पर रुक्मिणी के कहने पर उसके प्राण छोड़ दिए।'],
['द्वारका में रुक्मिणी का विवाह','द्वारका में कृष्ण और रुक्मिणी का स्वागत हुआ और आनंदमय समारोह के साथ उनका विवाह हुआ। रुक्मिणी कृष्ण की प्रधान रानी बनीं; उनकी भक्ति और धैर्य की सब सराहना करते थे। उनके विवाह से यादवों के बीच कृष्ण के जीवन का और द्वारका से जुड़े अनेक राजकीय संबंधों का नया अध्याय आरंभ हुआ।'],
['प्रद्युम्न का जन्म और हरण','रुक्मिणी ने प्रद्युम्न को जन्म दिया, जो कृष्ण जैसे दिखते थे। दैत्य शंबर ने शिशु को हर लिया और समुद्र में फेंक दिया, पर एक मछली ने उसे निगल लिया। एक मछुआरे ने वह मछली पकड़ी और प्रद्युम्न शंबर के ही घर में जीवित मिले, जहाँ मायावती ने उनका पालन किया।'],
