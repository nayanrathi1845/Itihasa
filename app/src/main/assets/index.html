<style>
:root{--ink:#38291f;--muted:#7d6c5c;--paper:#fbf6ed;--card:#fffdf8;--line:#e8dccb;--rust:#8c482e;--rust2:#a65b38;--gold:#ead8b9;--green:#477457;--shadow:0 10px 30px #51351b0d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh;padding-bottom:90px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line);background:#fbf6edf2;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{height:44px;width:44px;border-radius:14px;background:var(--rust);color:#fff6e9;display:grid;place-items:center;font-family:Georgia,serif;font-size:27px}.brand h1{font:700 24px Georgia,serif;margin:0;color:var(--rust)}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em}.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;color:var(--rust);font-size:20px}.content{padding:26px 24px}.hero{background:linear-gradient(120deg,#efdfc3,#e6c99c);border-radius:24px;padding:30px;display:grid;grid-template-columns:1.2fr .8fr;gap:22px;overflow:hidden;position:relative}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:800;color:var(--rust)}h2,h3,p{margin-top:0}.hero h2{font:700 clamp(32px,4vw,48px)/1.08 Georgia,serif;color:#593321;margin:12px 0}.hero p{color:#684f3c;max-width:470px}.hero-art{border-radius:18px;min-height:220px;background:linear-gradient(145deg,#bb8650,#75402c);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;color:#f9e9c9;text-align:center;padding:20px}.hero-art:before{content:"☼";font-size:160px;opacity:.2;position:absolute;right:-12px;top:-42px}.hero-art span{font:italic 30px Georgia,serif;position:relative;max-width:230px}.primary{background:var(--rust);color:white;border:0;border-radius:12px;padding:12px 17px;font-weight:700}.secondary{background:transparent;color:var(--rust);border:1px solid #c7a68b;border-radius:12px;padding:10px 14px;font-weight:650}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:30px 0 14px}.section-head h2{font:700 25px Georgia,serif;margin:0}.sub{color:var(--muted);font-size:13px}.text-link{border:0;background:none;color:var(--rust);font-weight:700}.continue-card,.scripture-card,.story-row,.empty-state,.reader{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.continue-card{display:flex;align-items:center;gap:16px;padding:16px}.cover{flex:0 0 88px;height:100px;border-radius:12px;display:grid;place-items:center;color:#fff4df;font:32px Georgia,serif;background:linear-gradient(145deg,#c58a4e,#783d2a)}.continue-card h3{font:700 19px Georgia,serif;margin:3px 0}.progress{height:5px;background:#eee3d4;border-radius:99px;overflow:hidden;margin-top:12px}.progress span{display:block;height:100%;background:var(--rust2);width:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.scripture-card{padding:16px;cursor:pointer;transition:transform .15s,border .15s}.scripture-card:hover,.story-row:hover{transform:translateY(-2px);border-color:#c7a68b}.scripture-art{height:112px;border-radius:12px;background:linear-gradient(145deg,#d7b77f,#94583a);display:grid;place-items:center;color:#fff2d5;font:40px Georgia,serif;margin-bottom:13px}.scripture-card h3{font:700 19px Georgia,serif;margin:0 0 4px}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:750;background:#e6efe5;color:var(--green)}.pill.soon{background:#f1e9dc;color:#856b4e}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ed;border-top:1px solid var(--line);display:flex;justify-content:center;gap:clamp(8px,6vw,72px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:8;backdrop-filter:blur(12px)}.nav-btn{background:none;border:0;color:#8b7a6b;min-width:64px;display:grid;justify-items:center;gap:2px;font-size:11px}.nav-btn strong{font-size:21px;font-weight:500}.nav-btn.active{color:var(--rust);font-weight:800}.page-title{font:700 34px Georgia,serif;margin:0 0 6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:99px;color:var(--muted)}.chip.active{background:var(--rust);border-color:var(--rust);color:white}.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline-color:var(--rust)}.library-list{display:grid;gap:10px}.library-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%;color:inherit}.library-icon{height:48px;width:48px;border-radius:13px;background:#f1e4cf;display:grid;place-items:center;color:var(--rust);font-size:23px;flex-shrink:0}.library-item .details{flex:1}.library-item h3{font:700 18px Georgia,serif;margin:0 0 3px}.library-item p{font-size:12px;color:var(--muted);margin:0}.chevron{font-size:23px;color:#aa8a70}.kanda{margin:24px 0}.kanda h3{font:700 21px Georgia,serif;margin:0 0 10px}.story-row{display:flex;align-items:center;gap:13px;padding:13px 15px;margin:8px 0;width:100%;text-align:left;color:inherit}.number{width:35px;height:35px;border-radius:10px;background:#f2e5d1;color:var(--rust);display:grid;place-items:center;font-weight:800;flex-shrink:0}.story-row .details{flex:1}.story-row h4{margin:0;font-size:15px}.story-row small{color:var(--muted)}.reader{max-width:760px;margin:auto;padding:clamp(20px,5vw,46px)}.reader .back{border:0;background:none;color:var(--rust);font-weight:700;padding:0;margin-bottom:25px}.reader h2{font:700 clamp(30px,5vw,44px)/1.12 Georgia,serif;margin:10px 0}.reader-meta{color:var(--muted);font-size:13px;margin-bottom:24px}.reader-body{font:18px/1.9 Georgia,serif;color:#4c3b2e}.source-note{padding:15px;border-radius:12px;background:#f3e8d5;color:#72563f;font-size:13px;margin:24px 0}.reader-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.empty-state{text-align:center;padding:40px 20px}.empty-state .big{font-size:44px}.empty-state h3{font:700 24px Georgia,serif;margin:12px 0}.notice{background:#f3e8d5;border:1px solid #e5d2b8;padding:28px;border-radius:20px;text-align:center;max-width:520px;margin:32px auto}.notice .symbol{font-size:42px}.notice h2{font:700 28px Georgia,serif;color:var(--rust);margin:12px 0}.notice p{color:#72563f}.settings-card{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}.settings-card label{display:flex;justify-content:space-between;align-items:center;gap:10px}.settings-card select{padding:8px;border-radius:8px;border:1px solid var(--line);background:white}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#38291f;color:white;padding:11px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:11px;padding:30px 10px 12px}
.has-img{display:block!important;padding:0!important;overflow:hidden}.cover-img{width:100%;height:100%;object-fit:cover;display:block}.hero-art.has-img:before{display:none}.hero-art.has-img .cover-img{position:absolute;inset:0}.notice .symbol .cover-img{height:160px;border-radius:14px;margin-bottom:16px}
@media(max-width:700px){.topbar{padding:14px 16px}.content{padding:18px 16px}.hero{grid-template-columns:1fr;padding:23px}.hero-art{min-height:120px}.hero-art span{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scripture-card{padding:12px}.scripture-art{height:90px}.section-head h2{font-size:22px}.brand h1{font-size:22px}.page-title{font-size:30px}}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.scripture-card h3{font-size:17px}.hero h2{font-size:32px}}

<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">इ</div><div><h1>Itihasa</h1><small>Stories that shaped Bharat</small></div></div><button class="icon-btn" aria-label="Search" onclick="showPage('stories');document.getElementById('searchInput').focus()">⌕</button></header>

<div id="toast" class="toast hidden" role="status"></div>
<script>
const scriptures=[
{name:'Ramayana',sub:'30 stories · Available now',status:'available',symbol:'राम',desc:'The journey of Rama, Sita and their companions.'},
{name:'Mahabharata',sub:'The great Indian epic',status:'soon',symbol:'ॐ',desc:'The great epic of the Kuru dynasty.'},
{name:'Bhagavata Purana',sub:'Devotional narratives',status:'soon',symbol:'कृष्ण',desc:'Stories of Vishnu and his avatars, including Krishna.'},
{name:'Shiva Purana',sub:'Stories of Shiva',status:'soon',symbol:'शिव',desc:'Narratives associated with Shiva and his traditions.'},
{name:'Vishnu Purana',sub:'Cosmology and avatars',status:'soon',symbol:'विष्णु',desc:'Cosmology, dynasties and the deeds of Vishnu.'},
{name:'Devi Bhagavata Purana',sub:'The Divine Goddess',status:'soon',symbol:'शक्ति',desc:'Stories and teachings centred on the Goddess.'},
{name:'Markandeya Purana',sub:'Includes Devi Mahatmya',status:'soon',symbol:'देवी',desc:'A Puranic collection including the celebrated Devi Mahatmya.'},
{name:'Bhagavad Gita',sub:'Wisdom and duty',status:'soon',symbol:'गीता',desc:'Krishna’s teachings to Arjuna on duty, action and knowledge.'},
{name:'The Upanishads',sub:'Philosophy and inquiry',status:'soon',symbol:'ॐ',desc:'Philosophical explorations of the self and ultimate reality.'},
{name:'The Vedas',sub:'Foundational Vedic texts',status:'soon',symbol:'वेद',desc:'The four foundational Vedic collections.'},
{name:'Other Puranas',sub:'More collections planned',status:'soon',symbol:'✧',desc:'Discover more Puranic traditions in future updates.'}
];
const covers={'Ramayana':['ramayana','50% 16%'],'Mahabharata':['mahabharata','50% 18%'],'Bhagavata Purana':['bhagavata-purana','50% 18%'],'Shiva Purana':['shiva-purana','50% 15%'],'Vishnu Purana':['vishnu-purana','50% 25%'],'Devi Bhagavata Purana':['devi-bhagavata-purana','50% 6%'],'Markandeya Purana':['markandeya-purana','50% 25%'],'Bhagavad Gita':['bhagavad-gita','50% 28%'],'The Upanishads':['upanishads','50% 31%'],'The Vedas':['vedas','50% 40%'],'Other Puranas':['other-puranas','50% 43%']};
function coverImg(name){const c=covers[name];return c?`<img class="cover-img" src="assets/images/${c[0]}.webp" alt="${esc(name)} cover illustration" style="object-position:${c[1]}" decoding="async">`:''}
const groups=[
{name:'Bala Kanda',stories:[['The Birth of Rama','The ancient kingdom of Kosala was ruled by King Dasharatha, whose greatest sorrow was that he had no heir. After seeking guidance from his sages, a sacred sacrifice was performed. In the traditional account, a divine being brought a consecrated offering for the queens. In time, four princes were born: Rama, Bharata, Lakshmana and Shatrughna. Rama’s life would become central to one of India’s most enduring epics.'],['Vishvamitra Arrives at Ayodhya','The sage Vishvamitra came to King Dasharatha seeking help. His sacred rites were being disturbed by powerful beings, and he asked that Rama accompany him. Though the king hesitated, the royal teacher Vashishtha counselled him to trust the sage. Rama and Lakshmana then set out on a journey that would test their courage and begin their education in a wider world.'],['Rama and Lakshmana Leave with Vishvamitra','Rama and Lakshmana left the comforts of Ayodhya under Vishvamitra’s guidance. The sage taught them sacred knowledge and prepared them for the challenges ahead. Their journey through the forest marked a transition from princes sheltered by the palace to young men learning discipline, responsibility and the protection of others.'],['The Story of Ahalya','During their travels, Rama encountered the hermitage associated with Ahalya, whose story is told in differing ways across Ramayana traditions. In Valmiki’s account, her release from a long curse is connected with Rama’s arrival. The episode invites readers to consider the power of grace, the consequences of actions and the many ways later traditions have interpreted Ahalya’s story.'],['The Slaying of Tataka','Vishvamitra led the princes into a forest troubled by Tataka. Rama struggled with the responsibility of using force, but the sage explained the duty he believed Rama must fulfil. Rama confronted Tataka and protected the region. The episode presents an early test of judgement, courage and the difficult responsibilities that accompany power.'],['Rama Breaks Shiva’s Bow','At King Janaka’s court, a great bow associated with Shiva was presented as a test for the assembled suitors. Rama lifted and strung it, and the bow broke with a tremendous sound. The feat demonstrated his extraordinary strength and led to the marriage arrangements that would unite Rama and Sita.'],['The Marriage of Rama and Sita','After Rama’s feat at Janaka’s court, the marriage of Rama and Sita was celebrated alongside the marriages of their brothers. The alliance joined two royal houses and began a partnership that would face extraordinary trials. The wedding is remembered as a joyful turning point before the events that take the story far beyond palace life.']]},
{name:'Ayodhya Kanda',stories:[['The Coronation That Never Happened','King Dasharatha decided to crown Rama as his successor. The people of Ayodhya welcomed the prospect, seeing Rama as a worthy future king. Yet events inside the palace unsettled the plan. A decision that seemed certain was about to change the lives of the royal family and the future of the kingdom.'],['Kaikeyi’s Two Boons','Influenced by Manthara, Queen Kaikeyi recalled two boons Dasharatha had once promised her. She asked that Bharata be crowned king and that Rama spend fourteen years in exile. Bound by his word, Dasharatha was devastated. The episode explores the weight of promises and the collision between private desire and public duty.'],['Rama Accepts Exile','When Rama learned of Kaikeyi’s demands, he accepted exile rather than allow his father’s promise to be broken. His response demonstrated his commitment to duty, though it brought profound grief to Dasharatha and Ayodhya. The episode remains one of the epic’s defining portrayals of resolve in the face of personal loss.'],['Sita and Lakshmana Join Rama','Sita insisted on accompanying Rama into exile, and Lakshmana chose to go with them. Their decisions were shaped by love, loyalty and a shared sense of responsibility. Leaving the palace meant surrendering comfort and status, but the three began their forest life together, bound by commitments stronger than royal privilege.'],['The Departure from Ayodhya','Rama, Sita and Lakshmana departed Ayodhya as citizens grieved their departure. Dasharatha’s sorrow deepened, while the city struggled to accept the loss of its beloved prince. Their journey away from the capital marks the start of the long exile and shifts the story from royal succession to life in the forest.'],['Bharata Refuses the Throne','Bharata returned to discover that Rama had been exiled and that his own coronation had been arranged. He rejected the throne gained through these circumstances and travelled to ask Rama to return. When Rama refused to violate their father’s promise, Bharata took Rama’s sandals as a symbol of his rule and governed as his brother’s representative.']]},
{name:'Aranya Kanda',stories:[['Life in the Forest','Rama, Sita and Lakshmana travelled through forests and visited hermitages, meeting sages and learning about the challenges facing those who lived there. Their exile became a period of endurance and encounter. The forest setting also introduced the dangers and relationships that would eventually lead to Sita’s abduction.'],['The Encounter with Shurpanakha','Shurpanakha encountered Rama and expressed interest in him. The confrontation escalated when she approached Sita and Lakshmana intervened. The episode set off a chain of retaliatory events involving Ravana and the forces of Lanka. Details differ in later retellings, making it important to distinguish the source tradition being followed.'],['The Battle with Khara and Dushana','After the encounter with Shurpanakha, Khara and Dushana led forces against Rama. Rama fought them and defeated the attackers. The conflict brought the events in the forest to the attention of Ravana, setting the stage for the plan that would separate Rama from Sita.'],['The Golden Deer','Ravana enlisted Maricha, who appeared as a beautiful golden deer near the hermitage. Sita asked Rama to capture it. Rama pursued the deer, and Maricha’s deception drew him away from the dwelling. This moment created the opening Ravana needed to approach Sita while Rama and Lakshmana were absent.'],['The Abduction of Sita','With Rama away and Lakshmana drawn from the hermitage, Ravana approached Sita in disguise and abducted her. Sita resisted and called for help as Ravana carried her toward Lanka. The abduction transformed Rama’s exile into a desperate search and became the central conflict driving the remainder of the epic.'],['Jatayu’s Last Stand','The vulture-king Jatayu witnessed Sita being carried away and fought Ravana in an attempt to rescue her. Though gravely wounded, he later told Rama what had happened. Jatayu’s courage and sacrifice gave Rama crucial information and made him a symbol of loyalty and selfless action.']]},
{name:'Kishkindha Kanda',stories:[['Rama Meets Hanuman','While searching for Sita, Rama and Lakshmana encountered Hanuman, who approached them on behalf of Sugriva. Hanuman recognised their nobility and became a trusted ally. Their meeting began one of the epic’s most important relationships, built on service, confidence and shared purpose.'],['The Alliance with Sugriva','Rama and Sugriva formed an alliance: Rama would help Sugriva regain his position, and Sugriva would use his allies to search for Sita. The agreement linked two struggles and turned Rama’s search into a wider mission. Their alliance would mobilise the forces needed to reach Lanka.'],['The Defeat of Vali','Rama intervened in the conflict between Sugriva and Vali, leading to Vali’s death and Sugriva’s restoration. The episode has long prompted discussion about kingship, justice and the ethics of intervention. Different commentators interpret Rama’s actions in different ways, making this a useful story for thoughtful reading rather than a simple victory narrative.'],['The Search for Sita','Sugriva organised search parties in different directions. The southern group, including Hanuman, eventually learned that Lanka lay across the ocean. Their search had been difficult and uncertain, but the new information created a path forward and prepared Hanuman for his extraordinary leap.']]},
{name:'Sundara Kanda',stories:[['Hanuman Leaps Across the Ocean','Encouraged to recognise his strength, Hanuman leapt across the ocean toward Lanka. Along the way he faced obstacles that tested his courage, discernment and determination. His journey is celebrated as a turning point in the search for Sita and as a story about discovering one’s capabilities in service of a larger purpose.'],['Hanuman Finds Sita in Ashoka Vatika','After searching Lanka, Hanuman found Sita in the Ashoka grove, guarded and grieving but steadfast in her resolve. He approached carefully and offered Rama’s signet ring as proof that he had come from her husband. Their meeting restored hope and gave Hanuman a way to carry news back to Rama.'],['Hanuman’s Message to Sita','Hanuman reassured Sita that Rama was searching for her and offered to carry her away. Sita chose to wait for Rama, placing her trust in his coming victory and the restoration of justice. Hanuman received a token from her to take back, turning their encounter into a vital exchange of recognition and hope.'],['Hanuman Sets Lanka Ablaze','After being captured, Hanuman’s tail was set alight, but he used the opportunity to set parts of Lanka ablaze before escaping. He then returned across the ocean with news of Sita. The episode celebrates his resourcefulness and courage, while marking the end of reconnaissance and the beginning of preparations for war.']]},
{name:'Yuddha Kanda',stories:[['The Building of Rama’s Bridge','Rama’s allies worked together to build a bridge across the ocean toward Lanka. The undertaking required collective effort and faith in a difficult mission. The bridge became a powerful image of cooperation: a diverse group joined its abilities to make possible what had first seemed beyond reach.'],['The Fall of Ravana','The conflict between Rama’s forces and Ravana’s army culminated in a decisive battle. Ravana was defeated, and Sita’s rescue became possible. The ending of the war is commonly understood as the triumph of dharma over destructive pride, though the epic’s aftermath and later traditions contain further complexities.']]}
];
const allStories=groups.flatMap((g,gi)=>g.stories.map((s,si)=>({title:s[0],body:s[1],kanda:g.name,index:groups.slice(0,gi).reduce((n,x)=>n+x.stories.length,0)+si+1})));
let page='home',filter='All',selectedScripture='Ramayana',currentStory=0,query='',toastTimer;let saved=JSON.parse(localStorage.getItem('itihasa-saved')||'[]');let progress=JSON.parse(localStorage.getItem('itihasa-progress')||'{}');let language=localStorage.getItem('itihasa-language')||'English';
const main=document.getElementById('main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2300)}
function saveData(){localStorage.setItem('itihasa-saved',JSON.stringify(saved));localStorage.setItem('itihasa-progress',JSON.stringify(progress))}
function showPage(next){page=next;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===next));render()}
function scriptureCard(s){return `<article class="scripture-card" onclick="openScripture('${esc(s.name)}')"><div class="scripture-art${covers[s.name]?' has-img':''}">${coverImg(s.name)||s.symbol}</div><h3>${esc(s.name)}</h3><p class="sub">${esc(s.sub)}</p><span class="pill ${s.status==='soon'?'soon':''}">${s.status==='available'?'Read now':'Coming soon'}</span></article>`}
function home(){const last=progress.last??0;const story=allStories[last]||allStories[0];return `<section class="hero"><div><div class="eyebrow">Your journey into Indian epics</div><h2>Discover the stories of our timeless past.</h2><p>Explore legendary characters, epic journeys and ancient wisdom—one story at a time.</p><button class="primary" onclick="openScripture('Ramayana')">Explore the Ramayana →</button></div><div class="hero-art"><span>Echoes of an ancient world</span></div></section><div class="section-head"><div><h2>Continue reading</h2><div class="sub">Pick up where you left off</div></div><button class="text-link" onclick="showPage('stories')">View all</button></div><div class="continue-card" role="button" tabindex="0" onclick="readStory(${story.index-1})"><div class="cover">राम</div><div style="flex:1"><div class="eyebrow">Ramayana · ${esc(story.kanda)}</div><h3>${esc(story.title)}</h3><div class="sub">Story ${story.index} of 30 · About 2 min read</div><div class="progress"><span style="width:${progress[story.index-1]?'100%':'0%'}"></span></div></div><span class="chevron">›</span></div><div class="section-head"><div><h2>Explore scriptures</h2><div class="sub">A growing library of Indian traditions</div></div><button class="text-link" onclick="showPage('stories')">All scriptures</button></div><div class="grid">${scriptures.slice(0,6).map(scriptureCard).join('')}</div>`}
function storyList(){return groups.map(g=>`<section class="kanda"><h3>${esc(g.name)}</h3>${g.stories.map(s=>{const st=allStories.find(x=>x.title===s[0]);return `<button class="story-row" onclick="readStory(${st.index-1})"><span class="number">${st.index}</span><span class="details"><h4>${esc(st.title)}</h4><small>Read story · ${esc(g.name)}</small></span><span class="chevron">›</span></button>`}).join('')}</section>`).join('')}
function storiesPage(){let list=scriptures.filter(s=>(filter==='All'||(filter==='Available'&&s.status==='available')||(filter==='Coming soon'&&s.status==='soon'))&&(`${s.name} ${s.desc}`.toLowerCase().includes(query.toLowerCase())));return `<div class="eyebrow">The library</div><h2 class="page-title">Stories & scriptures</h2><p class="sub">Choose a collection to explore. More texts will be added over time.</p><div class="toolbar">${['All','Available','Coming soon'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><input class="search" id="searchInput" placeholder="Search scriptures…" value="${esc(query)}" oninput="setQuery(this.value)"/><div class="library-list" style="margin-top:16px">${list.map(s=>`<button class="library-item" onclick="openScripture('${esc(s.name)}')"><span class="library-icon${covers[s.name]?' has-img':''}">${coverImg(s.name)||s.symbol}</span><span class="details"><h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p></span><span class="pill ${s.status==='soon'?'soon':''}">${s.status==='available'?'Available':'Coming soon'}</span><span class="chevron">›</span></button>`).join('')||'<div class="empty-state">No scriptures match that search.</div>'}</div>`}
function setFilter(x){filter=x;render()}function setQuery(x){query=x;const pos=document.getElementById('searchInput')?.selectionStart;render();const el=document.getElementById('searchInput');el?.focus();if(pos!==undefined)el?.setSelectionRange(pos,pos)}
function openScripture(name){selectedScripture=name;if(name!=='Ramayana'){main.innerHTML=`<div class="notice"><div class="symbol">${coverImg(name)||'✧'}</div><div class="eyebrow">Coming soon</div><h2>${esc(name)}</h2><p>You will be able to read them soon.</p><p>We're building this collection carefully, with attention to source traditions and context.</p><button class="primary" onclick="showPage('stories')">Back to stories</button></div>`;return}page='collection';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page==='stories'));render()}
function collection(){return `<button class="text-link" onclick="showPage('stories')">← All scriptures</button><div class="hero" style="margin-top:16px;grid-template-columns:1fr .55fr"><div><div class="eyebrow">The epic collection</div><h2>Ramayana</h2><p>The journey of Rama, Sita, Lakshmana and Hanuman—told across six Kandas.</p><span class="pill">30 stories · Available now</span></div><div class="hero-art has-img">${coverImg('Ramayana')}</div></div><div class="section-head"><div><h2>All 30 stories</h2><div class="sub">Read in traditional Kanda order</div></div></div>${storyList()}`}
function readStory(i){currentStory=Math.max(0,Math.min(i,allStories.length-1));progress.last=currentStory;progress[currentStory]=true;saveData();page='reader';render()}
function reader(){const s=allStories[currentStory];return `<article class="reader"><button class="back" onclick="showPage('collection')">← Back to Ramayana</button><div class="eyebrow">Ramayana · ${esc(s.kanda)}</div><h2>${esc(s.title)}</h2><div class="reader-meta">Story ${s.index} of 30 · ${language} · 2 min read</div><div class="reader-body"><p>${esc(s.body)}</p></div><div class="source-note"><strong>Source & context</strong><br>This is a concise introductory retelling for the prototype. Before publication, the story should be verified against the selected source edition and clearly distinguish source text from later regional retellings.</div><div class="reader-actions"><button class="secondary" onclick="toggleSave(${currentStory})">${saved.includes(currentStory)?'♥ Saved':'♡ Save story'}</button><div><button class="secondary" ${currentStory===0?'disabled':''} onclick="readStory(${currentStory-1})">← Previous</button> <button class="primary" ${currentStory===29?'disabled':''} onclick="readStory(${currentStory+1})">Next →</button></div></div></article>`}
function toggleSave(i){if(saved.includes(i))saved=saved.filter(x=>x!==i);else saved.push(i);saveData();showToast(saved.includes(i)?'Story saved':'Removed from saved stories');render()}
function savedPage(){if(!saved.length)return `<div class="eyebrow">Your library</div><h2 class="page-title">Saved stories</h2><div class="empty-state"><div class="big">♡</div><h3>No saved stories yet</h3><p class="sub">Bookmark a story to find it here later.</p><button class="primary" onclick="showPage('stories')">Explore stories</button></div>`;return `<div class="eyebrow">Your library</div><h2 class="page-title">Saved stories</h2><p class="sub">Your bookmarked reading list, stored on this device.</p>${saved.map(i=>{const s=allStories[i];return `<button class="story-row" onclick="readStory(${i})"><span class="number">${s.index}</span><span class="details"><h4>${esc(s.title)}</h4><small>${esc(s.kanda)}</small></span><span class="chevron">›</span></button>`}).join('')}`}
function profile(){return `<div class="eyebrow">Your preferences</div><h2 class="page-title">Profile & settings</h2><p class="sub">A simple reading experience, tailored to you.</p><div class="settings-card"><label><span><strong>Reading language</strong><br><small class="sub">Choose the language for story text</small></span><select onchange="setLanguage(this.value)"><option ${language==='English'?'selected':''}>English</option><option ${language==='Hindi'?'selected':''}>Hindi</option></select></label></div><div class="settings-card"><strong>Reading progress</strong><p class="sub" style="margin:6px 0 12px">${Object.keys(progress).filter(k=>k!=='last').length} of 30 stories opened on this device.</p><div class="progress"><span style="width:${Math.min(100,Object.keys(progress).filter(k=>k!=='last').length/30*100)}%"></span></div></div><div class="settings-card"><strong>About Itihasa</strong><p class="sub" style="margin:6px 0 0">A text-first explorer for India's epics, Puranas and philosophical traditions. Content will identify its source tradition wherever possible.</p></div><div class="settings-card"><strong>Privacy</strong><p class="sub" style="margin:6px 0 0">This prototype stores bookmarks and reading progress locally in your browser. It has no account system or server.</p></div><button class="secondary" onclick="if(confirm('Clear all saved stories and reading progress on this device?')){saved=[];progress={};saveData();render();showToast('Local reading data cleared')}" style="margin-top:8px">Clear local reading data</button>`}
function setLanguage(x){language=x;localStorage.setItem('itihasa-language',x);showToast('Language preference saved. Hindi story text is a future content task.');}
function render(){if(page==='home')main.innerHTML=home();else if(page==='stories')main.innerHTML=storiesPage();else if(page==='collection')main.innerHTML=collection();else if(page==='reader')main.innerHTML=reader();else if(page==='saved')main.innerHTML=savedPage();else if(page==='profile')main.innerHTML=profile();window.scrollTo({top:0,behavior:'smooth'})}
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
