const hiStories=[
['राम का जन्म','अयोध्या के राजा दशरथ संतान की कामना करते थे। एक पवित्र यज्ञ के बाद उनकी रानियों ने चार पुत्रों को जन्म दिया—राम, भरत, लक्ष्मण और शत्रुघ्न। कौशल्या के पुत्र राम विवेकशील और कुशल राजकुमार के रूप में बड़े हुए। भाइयों ने शासन और शस्त्रविद्या की शिक्षा पाई, और राम तथा लक्ष्मण में विशेष स्नेह था। राजमहल में बीता उनका बचपन उस यात्रा की शुरुआत था जो उन्हें अयोध्या से बहुत दूर ले जाने वाली थी।'],
['विश्वामित्र का अयोध्या आगमन','ऋषि विश्वामित्र दशरथ के दरबार में सहायता माँगने आए। वन में उनके यज्ञों में राक्षस विघ्न डाल रहे थे, इसलिए उन्होंने राम से यज्ञ की रक्षा करने को कहा। दशरथ अपने युवा पुत्र को भेजने में हिचकिचाए, पर ऋषि वसिष्ठ ने उन्हें विश्वामित्र की विनती स्वीकार करने की सलाह दी। राम, लक्ष्मण के साथ विश्वामित्र के मार्गदर्शन में चल पड़े। यह राजमहल से बाहर रक्षक के रूप में राम की पहली यात्रा थी।'],
['राम और लक्ष्मण विश्वामित्र के साथ जाते हैं','विश्वामित्र ने राजकुमारों को दिव्य अस्त्रों का ज्ञान दिया। मार्ग में उनके साहस और संयम की परीक्षा हुई। राम ने ताड़का और सुबाहु जैसे राक्षसों से विश्वामित्र के यज्ञ की रक्षा की; मारीच को दूर फेंका और सुबाहु का वध किया। भाइयों ने समझा कि शक्ति का उपयोग उत्तरदायित्व के साथ होना चाहिए। वे यश पाने नहीं, बल्कि ऋषि के तप और कार्य की रक्षा करने निकले थे।'],
['अहल्या की कथा','गौतम ऋषि के आश्रम में राम की भेंट अहल्या से हुई, जो लंबे समय से शाप के कारण एकांत में थीं। वाल्मीकि की कथा में, इंद्र के छल का पता चलने पर गौतम ने उन्हें शाप दिया था; राम के आगमन तक वे वहीं रहीं। राम की उपस्थिति से शाप समाप्त हुआ। गौतम लौटे और अहल्या को फिर स्वीकार किया। बाद की कथाओं में इस प्रसंग के विवरण अलग-अलग हैं, पर इसे मुक्ति और पुनर्स्थापन की कथा के रूप में याद किया जाता है।'],
['ताड़का का वध','विश्वामित्र राम और लक्ष्मण को ऐसे वन में ले गए जहाँ यक्षी ताड़का यात्रियों और ऋषियों को भयभीत करती थी। राम स्त्री से युद्ध करने को लेकर संकोच में थे, पर विश्वामित्र ने उसके खतरे को समझाया और क्षेत्र की रक्षा करने को कहा। राम ने ताड़का का सामना कर उसका वध किया। यह योद्धा के रूप में उनके कर्तव्य की पहली कठिन परीक्षा थी। इसके बाद विश्वामित्र ने उन्हें और ज्ञान तथा अस्त्रों का प्रशिक्षण दिया।'],
['राम शिवधनुष तोड़ते हैं','मिथिला के राजा जनक ने घोषणा की कि जो शिव से जुड़ा विशाल धनुष उठा कर उस पर प्रत्यंचा चढ़ाएगा, वही उनकी पुत्री सीता से विवाह करेगा। अनेक शक्तिशाली राजा असफल रहे। विश्वामित्र के कहने पर राम धनुष के पास गए, उसे उठाया और प्रत्यंचा चढ़ाने लगे। धनुष गर्जना के साथ टूट गया। जनक ने राम के सामर्थ्य और स्वभाव को पहचाना और विवाह की तैयारी की।'],
['राम और सीता का विवाह','जनक ने दशरथ और उनके परिवार का मिथिला में स्वागत किया। ऋषियों की उपस्थिति में राम और सीता का विवाह हुआ, और राजकुमारों के विवाह जनक के परिवार की कन्याओं से भी संपन्न हुए। इन विवाहों से दो राजपरिवार जुड़े। राम और सीता बड़ों का आशीर्वाद लेकर अयोध्या लौटे। उनका साथ आगे वनवास, विरह और युद्ध की कठिन परीक्षाओं से गुजरने वाला था।'],
['जो राज्याभिषेक नहीं हो सका','दशरथ ने राम को युवराज बनाने का निश्चय किया और अयोध्या में राज्याभिषेक की तैयारी होने लगी। नगरवासी इस समाचार से प्रसन्न थे। लेकिन मंथरा ने रानी कैकेयी को चेताया कि राम के राजा बनने पर भरत का स्थान कम हो सकता है। कैकेयी को दशरथ के दिए दो वरदान याद आए और उसने उन्हें माँगने का निश्चय किया। आनंद का समारोह राजपरिवार के संकट में बदल गया।'],
['कैकेयी के दो वरदान','कैकेयी ने दशरथ से अपने दो वरदान माँगे: भरत का राज्याभिषेक और राम को चौदह वर्ष का वनवास। दशरथ शोक से टूट गए, पर राम ने पिता के वचन की मर्यादा रखने के लिए यह माँग स्वीकार कर ली। उन्होंने कैकेयी को दोष नहीं दिया और विरोध भी नहीं किया। उनकी शांत स्वीकृति ने महल के विवाद को महाकाव्य का निर्णायक मोड़ बना दिया।'],
['राम वनवास स्वीकार करते हैं','राम ने सीता और लक्ष्मण को बताया कि वे वन जा रहे हैं। उन्होंने राजसी वस्त्र त्यागे, वन के वस्त्र धारण किए और पिता के वचन को अपने राजसिंहासन से ऊपर रखा। दशरथ शोक में डूब गए और राम को जाते देखना सहन न कर सके। राम ने अपने प्रियजनों को सांत्वना दी और अयोध्या से निकल पड़े। वनवास के चौदह वर्ष आरंभ हुए।'],
['सीता और लक्ष्मण राम के साथ जाते हैं','सीता ने आग्रह किया कि वह वन में राम के साथ रहेंगी। लक्ष्मण ने भी उनकी रक्षा के लिए साथ चलने का निश्चय किया। राम ने वन के कष्ट समझाए, पर दोनों अपने निर्णय पर दृढ़ रहे। सीता ने महल का सुरक्षित जीवन छोड़ा और लक्ष्मण अपनी पत्नी उर्मिला तथा राजसी जीवन से विदा हुए। उनके निर्णय ने वनवास को निष्ठा और पारिवारिक कर्तव्य की साझा यात्रा बना दिया।'],
['अयोध्या से प्रस्थान','राम, सीता और लक्ष्मण रथ से अयोध्या से निकले, जबकि दुखी नगरवासी उनके पीछे चल पड़े। कुछ समय बाद तीनों ने भीड़ से अलग अपनी यात्रा जारी रखी और वन तथा बस्तियों से होते हुए आगे बढ़े। दशरथ राम के वियोग में शोक करते रहे और अंततः उनका निधन हो गया। वनवासी वन पहुँचे और सरल जीवन आरंभ किया। अयोध्या अपने चुने हुए युवराज से वंचित रह गई।'],
['भरत सिंहासन स्वीकार नहीं करते','भरत अयोध्या लौटे और उन्हें कैकेयी के कार्य का पता चला। उन्होंने सिंहासन ठुकरा दिया और राम को वन भेजने के निर्णय का विरोध किया। वे वन में राम से मिलने गए और उन्हें लौटकर राजा बनने की विनती की, पर राम पिता के वचन से पीछे नहीं हटे। भरत राम की चरण-पादुकाएँ लेकर अयोध्या लौटे और उन्हें सिंहासन पर रखकर राम के प्रतिनिधि के रूप में शासन किया।'],
['वन में जीवन','राम, सीता और लक्ष्मण वनों में घूमते हुए ऋषियों से मिले और उनके आश्रमों को संकट से बचाया। अंततः उन्होंने पंचवटी के पास निवास बनाया। उनके दिन वनवासियों से मिलने, सादा जीवन बिताने और क्षेत्र की रक्षा करने में गुजरते थे। राजमहल छोड़ने के बाद भी वन में नई जिम्मेदारियाँ और खतरे थे। आगे की घटनाएँ सीता को राम से अलग कर देने वाली थीं।'],
['शूर्पणखा से भेंट','रावण की बहन शूर्पणखा ने राम को देखा और उनसे विवाह की इच्छा जताई। राम ने विनम्रता से मना किया और उसे लक्ष्मण के पास भेजा; लक्ष्मण ने भी उसे अस्वीकार किया। क्रोधित होकर उसने सीता को धमकाया। लक्ष्मण ने बीच में आकर उसे घायल कर दिया। शूर्पणखा अपने संबंधियों के पास सहायता माँगने भागी। उसके अपमान और क्रोध ने खर-दूषण को राम से भिड़ाया और अंततः रावण को सीता के बारे में बताया।'],
['खर-दूषण से युद्ध','शूर्पणखा की बात सुनकर खर और दूषण बड़ी सेना लेकर राम पर चढ़ आए। लक्ष्मण सीता को सुरक्षित स्थान पर ले गए और राम ने अकेले हमलावरों का सामना किया। राम ने युद्ध में राक्षस योद्धाओं और उनके सेनापतियों को परास्त किया। इस विजय का समाचार वन से बाहर पहुँचा: शूर्पणखा ने रावण को सब बताया और उसने सीता के अपहरण की योजना बनानी शुरू की।'],
['स्वर्ण मृग','रावण ने मारीच की सहायता से राम को आश्रम से दूर ले जाने की योजना बनाई। मारीच ने चमकते स्वर्ण मृग का रूप धारण किया और सीता ने राम से उसे पकड़ने को कहा। राम मृग के पीछे वन में दूर तक गए। राम के बाण से घायल होने पर मारीच ने राम की आवाज़ में पुकार लगाई। यह सुनकर सीता ने लक्ष्मण से राम की सहायता के लिए जाने को कहा।'],
['सीता का अपहरण','राम और लक्ष्मण के दूर होने पर रावण संन्यासी के वेश में आश्रम आया। उसने अपना परिचय दिया और सीता को अपने साथ चलने के लिए मनाने की कोशिश की। सीता के मना करने पर उसने उन्हें बलपूर्वक उठाया और रथ से लंका की ओर ले चला। सीता ने सहायता के लिए पुकारा और रास्ते में निशान छोड़े। इस अपहरण ने उस खोज को जन्म दिया जिसने राम को वानरों का सहयोगी बनाया।'],
['जटायु का अंतिम संघर्ष','वृद्ध गिद्ध जटायु ने रावण को सीता का अपहरण करते देखा और उसे रोकने का प्रयास किया। उसने बहादुरी से युद्ध किया, रावण के रथ को क्षति पहुँचाई, पर रावण ने उसके पंख काट दिए और उसे मरणासन्न छोड़ दिया। बाद में राम और लक्ष्मण ने जटायु को पाया। मरने से पहले उसने उन्हें घटना बताई और दक्षिण दिशा का संकेत दिया। राम ने शोकपूर्वक जटायु का अंतिम संस्कार किया।'],
['राम की हनुमान से भेंट','सीता की खोज करते हुए राम और लक्ष्मण किष्किन्धा के क्षेत्र में पहुँचे। हनुमान तपस्वी का वेश बनाकर उनसे मिले और सावधानी तथा बुद्धिमत्ता से बातचीत की। परिचय जानने के बाद वे दोनों भाइयों को निर्वासित वानर राजकुमार सुग्रीव के पास ले गए। हनुमान की यह भेंट सेवा और मित्रता के ऐसे संबंध की शुरुआत थी जो सीता की खोज और लंका की यात्रा में निर्णायक बना।'],
['सुग्रीव से मित्रता','सुग्रीव ने राम को बताया कि उसके भाई वाली ने राज्य छीन लिया है और वह स्वयं भय में रह रहा है। राम ने सुग्रीव को उसका स्थान वापस दिलाने में सहायता का वचन दिया; सुग्रीव ने सीता की खोज में मदद करने का वचन दिया। दोनों ने अग्नि के सामने मित्रता की शपथ ली। राम की सहायता से वाली के पराजित होने पर सुग्रीव राजा बने और उन्होंने वानरों को चारों दिशाओं में खोज के लिए भेजा।'],
['वाली का पराजय','सुग्रीव ने वाली को द्वंद्व के लिए ललकारा, पर दोनों भाइयों को पहचानना कठिन था, इसलिए राम ने पहले बाण नहीं चलाया। सुग्रीव माला पहनकर लौटा और दोनों फिर भिड़े। इस बार राम ने छिपकर बाण चलाया, जो वाली को लगा। मृत्युशय्या पर वाली ने राम के निर्णय पर प्रश्न किया। राम ने अपना पक्ष रखा; वाली ने अपने पुत्र अंगद को सुग्रीव के संरक्षण में सौंपा और सुग्रीव ने राज्य संभाला।'],
['सीता की खोज','सुग्रीव ने सीता की खोज के लिए दलों को अलग-अलग दिशाओं में भेजा। हनुमान, अंगद और जाम्बवान दक्षिण की ओर गए। खोज निष्फल लग रही थी कि उनकी भेंट जटायु के भाई संपाति से हुई। उसने दूर समुद्र पार लंका में सीता को देखा था। जाम्बवान ने हनुमान को उनकी भूली हुई शक्ति याद दिलाई। वानरों ने समुद्र पार जाने के लिए हनुमान को चुना।'],
['हनुमान का समुद्र लाँघना','जाम्बवान से प्रोत्साहित होकर हनुमान ने अपनी शक्ति पहचानी और समुद्र पार करने की तैयारी की। वे पर्वत से उछलकर समुद्र के ऊपर से लंका की ओर उड़ चले। मार्ग में ऐसी चुनौतियाँ आईं जिन्होंने उनके बल और विवेक दोनों की परीक्षा ली। उन्होंने ध्येय से विचलित हुए बिना बाधाएँ पार कीं। उनकी छलाँग राम की आशा को समुद्र पार ले गई और उन्हें उस नगर तक पहुँचा गई जहाँ सीता बंदी थीं।'],
['अशोक वाटिका में सीता','हनुमान रात में लंका में प्रवेश कर महलों और उपवनों में सीता को खोजते रहे। अंततः उन्होंने अशोक वाटिका में सीता को देखा, जो राक्षसियों की निगरानी में राम के विरह में थीं। वे पेड़ पर छिपकर देखते रहे। रावण आया और सीता को स्वीकार करने के लिए दबाव डाला, पर सीता ने उसे ठुकरा दिया। उसके जाने पर हनुमान ने राम की कथा सुनाई और पहचान के लिए उनकी अंगूठी दिखाई।'],
['हनुमान का सीता को संदेश','सीता ने राम की अंगूठी पहचान ली और हनुमान से उनकी खोज तथा उन्हें बचाने के संकल्प के बारे में सुना। हनुमान ने उन्हें वापस ले जाने की पेशकश की, पर सीता ने मना किया। वे राम की प्रतीक्षा करना चाहती थीं और अपने लौटने के तरीके पर कोई संदेह नहीं चाहती थीं। उन्होंने राम को देने के लिए एक रत्न और अपने जीवन की एक स्मृति का संदेश हनुमान को दिया। हनुमान इस प्रमाण के साथ लौटे कि सीता जीवित और दृढ़ थीं।'],
['हनुमान ने लंका जलाई','लंका छोड़ने से पहले हनुमान ने रावण के योद्धाओं से भिड़कर स्वयं को बंदी बनने दिया। रावण ने उनकी पूँछ में आग लगाने का आदेश दिया। हनुमान ने उसी अग्नि के सहारे छतों पर छलाँग लगाई और नगर के कुछ हिस्सों में आग लगा दी, फिर वहाँ से निकल गए। सीता की कुशलता सुनिश्चित कर वे समुद्र पार लौटे। उन्होंने सीता का संदेश और रत्न राम को दिया, जिससे सेना की आशा लौट आई।'],
['राम का सेतु निर्माण','राम और उनकी सेना समुद्र तट पर पहुँचे, पर लंका बहुत दूर थी। समुद्र देवता से मार्ग मिलने के बाद नल ने वानरों के साथ सेतु निर्माण का नेतृत्व किया। वानर पत्थर और वृक्ष तट तक लाते रहे और मिलकर समुद्र पर पुल बनाया। इसके सहारे सेना लंका तक पहुँच सकी।'],
['विभीषण रावण का दरबार छोड़ते हैं','रावण के भाई विभीषण ने उसे सीता लौटाकर विनाशकारी युद्ध टालने की सलाह दी। रावण ने उनकी बात अस्वीकार कर उन्हें दरबार से निकाल दिया। विभीषण ने राम की शरण लेने का निर्णय किया। राम की सेना के कुछ लोगों को उन पर संदेह था, फिर भी राम ने उन्हें सहयोगी के रूप में स्वीकार किया। लंका का उनका ज्ञान आगे की लड़ाई में काम आया।'],
['लंका के शुरुआती युद्ध','राम की सेना ने लंका को घेर लिया और रावण के योद्धा नगर से बाहर आकर भिड़े। लड़ाई नगर के द्वारों और रणभूमि तक फैल गई। वानर सेनानायक लंका के सेनापतियों से लड़े, जबकि राम की सेना घेरा कसती रही। आरंभिक युद्धों ने रावण की सेना का आकार और सीता को बचाने आए सहयोगियों का साहस दिखाया।'],
['इंद्रजीत के नागास्त्र','रावण का पुत्र इंद्रजीत शक्तिशाली अस्त्रों और छिपकर युद्ध करने की कला से लड़ा। उसके नागास्त्र ने राम और लक्ष्मण को सर्प-बन्धन में जकड़ दिया, जिससे सेना निराश हो गई। गरुड़ के आगमन से दोनों भाई सर्पों के बंधन से मुक्त हुए। इस प्रसंग में इंद्रजीत की प्रचंड शक्ति दिखती है, और भाइयों की मुक्ति से वानर सेना में फिर आशा जागती है।'],
['कुंभकर्ण का जागना','युद्ध लंका के विरुद्ध जाने लगा तो रावण ने अपने विशालकाय भाई कुंभकर्ण को जगवाया। उसे लंबे निद्रा-काल से उठाकर राज्य के संकट के बारे में बताया गया। कुंभकर्ण ने रावण के निर्णयों की आलोचना की, फिर भी परिवार और लंका के लिए युद्ध करने को तैयार हुआ। विपरीत परिस्थितियों का ज्ञान होते हुए भी वह रणभूमि में उतरा।'],
['कुंभकर्ण का अंत','कुंभकर्ण ने अपनी विशाल शक्ति से वानर सेना को तितर-बितर कर दिया। राम ने उसका सामना किया और शक्तिशाली बाणों से युद्ध किया। भीषण संघर्ष के बाद राम ने कुंभकर्ण को गिरा दिया। उसकी मृत्यु लंका के लिए बड़ी क्षति थी। रावण ने अपने भाई के लिए शोक किया, जिसने युद्ध को अनुचित मानने के बावजूद उसके पक्ष में लड़ाई की थी।'],
['इंद्रजीत का मायाजाल','इंद्रजीत ने राम की सेना को कमजोर करने के लिए छल का सहारा लिया और ऐसा आभास कराया मानो सीता मारी गई हों। वानर शोक में डूब गए, पर विभीषण ने इस कृत्य को माया पहचाना। उन्होंने समझाया कि इंद्रजीत उन्हें भ्रमित करना चाहता है और सीता जीवित हैं। सत्य जानकर सेना का साहस लौटा और सबका ध्यान इंद्रजीत को रोकने पर गया।'],
['लक्ष्मण इंद्रजीत को पराजित करते हैं','विभीषण ने बताया कि इंद्रजीत निकुम्भिला में एक अनुष्ठान कर रहा है जिससे उसे युद्ध में बल मिलता। लक्ष्मण, विभीषण और वानर योद्धाओं के साथ उसे रोकने गए। दोनों वीरों के बीच भीषण युद्ध हुआ। अंततः लक्ष्मण ने इंद्रजीत को पराजित किया और रावण के सबसे शक्तिशाली पुत्र का खतरा समाप्त हुआ।'],
['हनुमान संजीवनी लाते हैं','युद्ध में लक्ष्मण और अनेक वानर योद्धा गंभीर रूप से घायल हो गए। हनुमान को दूर पर्वत से औषधियाँ लाने भेजा गया। वे सही पौधों को पहचान नहीं पाए, इसलिए पूरा पर्वत ही उठाकर रणभूमि में ले आए। औषधियों से घायल योद्धाओं को जीवन मिला और सेना युद्ध जारी रख सकी।'],
['अहिरावण राम और लक्ष्मण का अपहरण करता है','बाद की रामायण कथा में अहिरावण—जिसे कुछ संस्करणों में रावण का सहयोगी या संबंधी और पाताल का शक्तिशाली शासक बताया गया है—छल से राम और लक्ष्मण को उठा ले जाता है। हनुमान को पता चलता है कि दोनों भाइयों को पाताल ले जाया गया है, और वे उन्हें छुड़ाने निकलते हैं। रक्षकों और अहिरावण की योजनाओं को पार कर हनुमान राम और लक्ष्मण को मुक्त कर रणभूमि में वापस लाते हैं।'],
['रावण का पतन','राम की सेना और रावण की सेना के बीच संघर्ष एक निर्णायक युद्ध में परिणत हुआ। रावण पराजित हुआ और सीता का उद्धार संभव हुआ। युद्ध के अंत को सामान्यतः विनाशकारी अहंकार पर धर्म की विजय के रूप में समझा जाता है, यद्यपि महाकाव्य के उपसंहार और बाद की परंपराओं में और भी जटिलताएँ मिलती हैं।'],
['सीता की अग्नि परीक्षा','रावण की मृत्यु के बाद सीता को राम के सामने लाया गया। वाल्मीकि के वर्णन में राम ने लंका में उनके रहने को लेकर उठ सकने वाले लोक-संदेह का उत्तर देने की बात कही। सीता ने अग्नि को अपनी सत्यनिष्ठा का साक्षी मानकर उसमें प्रवेश किया। अग्निदेव ने उन्हें सुरक्षित लौटाया और उनकी पवित्रता की पुष्टि की। बाद की कथाएँ इस पीड़ादायक प्रसंग को अलग-अलग ढंग से प्रस्तुत करती हैं।'],
['राम की अयोध्या वापसी','युद्ध समाप्त होने और सीता के मुक्त होने पर राम, सीता, लक्ष्मण और उनके साथी घर लौटने चले। वे पुष्पक विमान से उन स्थानों के ऊपर से गुजरे जो उनके वनवास की स्मृतियों से जुड़े थे। अयोध्या में भरत ने राम का स्वागत किया और राज्य उन्हें सौंप दिया। राम का राज्याभिषेक वनवास के अंत और उनके शासन की शुरुआत बना।']
];
const hiMb=[
['सौति का नैमिषारण्य में आगमन','नैमिषारण्य में बारह वर्ष तक चलने वाले यज्ञ में कथावाचक सौति आते हैं और ऋषि उनका स्वागत करते हैं। वे उनसे भरत वंश का इतिहास सुनाने का अनुरोध करते हैं। सौति सृष्टि, राजवंशों और प्रतिज्ञाओं की कथाओं से आरंभ करते हैं, जिनसे दिखता है कि यह महाकाव्य श्रोताओं की एक सभा से दूसरी सभा तक कैसे पहुँचता है।'],
['उत्तंक की यात्रा और नागराज तक्षक','उत्तंक को अपने गुरु की पत्नी के कुंडल लाने भेजा जाता है। उसकी कठिन यात्रा उसे नागराज तक्षक तक ले जाती है। वर्षों बाद उत्तंक राजा जनमेजय को प्रेरित करता है कि वे अपने पिता परीक्षित की मृत्यु का प्रतिशोध लें और ऐसा यज्ञ आरंभ करें जो नागों को अग्नि में खींच लाए।'],
['रुरु और प्रमद्वरा की कथा','रुरु को प्रमद्वरा से प्रेम हो जाता है, पर विवाह से ठीक पहले सर्पदंश से उसकी मृत्यु हो जाती है। शोक में डूबे रुरु को अपनी आधी आयु देकर उसे जीवित करने का अवसर मिलता है। रुरु स्वीकार करता है और प्रमद्वरा लौट आती है। उनकी कथा पूछती है कि दूसरा अवसर पाने के बदले प्रेम से क्या माँगा जा सकता है।'],
['च्यवन और सुकन्या','सुकन्या से अनजाने में वृद्ध ऋषि च्यवन की तपस्या भंग हो जाती है। प्रायश्चित के रूप में वह उनकी समर्पित पत्नी बन जाती है। अश्विनीकुमार च्यवन को पुनः यौवन देने का प्रस्ताव रखते हैं और सुकन्या उनकी परीक्षा में भी निष्ठावान रहती है। च्यवन नवयौवन पाते हैं, और यह प्रसंग यज्ञों में अश्विनीकुमारों के स्थान की व्याख्या करता है।'],
['गरुड़ का जन्म','महर्षि कश्यप की पत्नियाँ विनता और कद्रू बहुत भिन्न संतानों की माताएँ बनती हैं: विनता के पुत्रों में गरुड़ हैं, जबकि कद्रू से नागों का जन्म होता है। एक शर्त के कारण विनता कद्रू की दासी बन जाती है। गरुड़ बलवान होता है और जानता है कि माता को मुक्त कराने के लिए उसे अमृत लाना होगा।'],
['गरुड़ की अमृत-यात्रा','विनता को मुक्त कराने के लिए गरुड़ उस सुरक्षित स्थान तक जाते हैं जहाँ देवता अमृत रखते हैं। वे बाधाओं को पार करके कलश नागों की ओर ले चलते हैं। इंद्र उनका पीछा करते हैं, पर दोनों में समझौता हो जाता है। गरुड़ अमृत पिए बिना उसे रख देते हैं; नाग उसे खो बैठते हैं और विनता मुक्त हो जाती है।'],
['कद्रू और विनता की शर्त','कद्रू और विनता में दिव्य अश्व उच्चैःश्रवा के रंग को लेकर विवाद होता है। कद्रू चुपके से अपने सर्प-पुत्रों को उसकी पूँछ काली करने का आदेश देती है और जीत जाती है। विनता को अपनी बहन की सेवा करनी पड़ती है। इस छल से नागों और गरुड़ की शत्रुता बनती है, जिसकी आगे की खोज माता की कैद से प्रेरित है।'],
['युवा ऋषि द्वारा परीक्षित को शाप','शिकार से थके राजा परीक्षित ऋषि शमीक से जल माँगते हैं। ऋषि ध्यान में लीन रहते हैं और उत्तर नहीं देते। क्रोध में परीक्षित उनके गले में एक मरा हुआ साँप डाल देते हैं। शमीक का पुत्र शृंगी इस अपमान के बारे में सुनता है और राजा को शाप देता है कि सर्प के डसने से उनकी मृत्यु होगी।'],
['तक्षक का दंश और परीक्षित की मृत्यु','परीक्षित शाप की तैयारी करते हैं, पहरेदारों से घिरे रहते हैं और सुरक्षा खोजते हैं। नागराज तक्षक सुरक्षा को भेदकर उन्हें डस लेता है। राजा की मृत्यु हो जाती है और उनका पुत्र जनमेजय राजगद्दी पर बैठता है। जब उसे पिता की मृत्यु का कारण पता चलता है, तो वह नागों का विनाश करने का निश्चय करता है।'],
['नागों की रक्षा के लिए आस्तीक का जन्म','ऋषि जरत्कारु नाग-कुल की उसी नाम की कन्या जरत्कारु से विवाह करते हैं, ताकि वंश आगे चल सके। उनका पुत्र आस्तीक विद्वान और शांत स्वभाव का ऋषि बनता है। जब जनमेजय का यज्ञ नागों को अग्नि में खींचने लगता है, तब राजा से उसे रोकने का अनुरोध करने में आस्तीक ही समर्थ होता है।'],
['जनमेजय का सर्प-यज्ञ','जनमेजय पुरोहितों को एकत्र करके नाग-वंश के विनाश के लिए यज्ञ आरंभ करता है। जैसे-जैसे मंत्र गूँजते हैं, संसार भर से सर्प खिंचकर अग्नि की ओर गिरने लगते हैं। तक्षक इंद्र के पास छिपा रहता है, पर अनुष्ठान हर साँप के लिए संकट बन जाता है। राजा का शोक अपने कारण से कहीं आगे तक फैलने वाला खतरा बन जाता है।'],
['आस्तीक यज्ञ को रोकता है','आस्तीक यज्ञ में पहुँचकर जनमेजय की स्तुति करता है, जब तक राजा उसे वर देने को तैयार नहीं हो जाता। आस्तीक माँगता है कि यज्ञ समाप्त हो। पुरोहित चेताते हैं कि तक्षक अग्नि में गिरने ही वाला है, पर जनमेजय अपना वचन निभाता है। यज्ञ रुक जाता है, और आस्तीक का विवेक प्रतिशोध को पूर्ण विनाश बनने से बचा लेता है।'],
['शंतनु की गंगा से भेंट','राजा शंतनु नदी के किनारे एक सुंदर स्त्री को देखते हैं और उससे विवाह का प्रस्ताव रखते हैं। वह एक शर्त पर मानती है: वे कभी उसके कार्यों पर प्रश्न नहीं करेंगे। उनके पुत्र होते हैं, पर हर बार जन्म के बाद गंगा बालक को नदी में ले जाती है। शंतनु मौन सहते रहते हैं, जब तक आठवाँ पुत्र उनकी परीक्षा नहीं लेता।'],
['देवव्रत का जन्म और वापसी','जब गंगा आठवें पुत्र को भी ले जाने लगती हैं, तब शंतनु मौन नहीं रह पाते। वे बताती हैं कि वे बालक शाप के कारण पृथ्वी पर जन्मे वसु थे। वे आठवें पुत्र को जीवित रखती हैं और देवव्रत के रूप में पालती हैं, उसे युद्ध-कला और विवेक सिखाती हैं। वर्षों बाद वे उसे एक योग्य राजकुमार के रूप में पिता को लौटा देती हैं।'],
['शंतनु और सत्यवती की भेंट','शंतनु मछुआरे की पुत्री सत्यवती से प्रेम करने लगते हैं। उसके पिता इस विवाह के लिए तभी सहमत होते हैं जब सत्यवती की संतान को राजगद्दी मिले। शंतनु देवव्रत को हटाने से मना कर देते हैं और दुखी होकर महल लौट आते हैं। पिता का शोक देखकर देवव्रत स्वयं मछुआरे के पास जाते हैं ताकि विवाह निश्चित हो सके।'],
['देवव्रत की भीषण प्रतिज्ञा','देवव्रत सत्यवती की संतान के राज्य के लिए सिंहासन पर अपना अधिकार छोड़ देते हैं। जब मछुआरे को चिंता होती है कि देवव्रत की भावी संतान राज्य पर दावा कर सकती है, तो वे आजीवन ब्रह्मचर्य की प्रतिज्ञा करते हैं। देवता उन्हें भीष्म कहते हैं, यानी भीषण प्रतिज्ञा वाला। शंतनु उन्हें इच्छा-मृत्यु का वरदान देते हैं।'],
['अम्बा, अम्बिका और अम्बालिका का हस्तिनापुर आना','भीष्म काशी जाकर वहाँ की तीन राजकुमारियों को अपने सौतेले भाई विचित्रवीर्य के लिए ले आते हैं। अम्बा बताती है कि उसने पहले ही राजा शाल्व को चुन लिया था। भीष्म उसे जाने देते हैं, पर शाल्व उसे अपनाने से मना कर देता है। अम्बिका और अम्बालिका का विवाह विचित्रवीर्य से होता है, और राज्य का उत्तराधिकार अनिश्चित रह जाता है।'],
['अम्बा और शाल्व का टूटा वचन','शाल्व के ठुकराने के बाद अम्बा भीष्म के पास लौटती है और उनसे विवाह करने को कहती है। अपनी प्रतिज्ञा से बँधे भीष्म मना कर देते हैं। राजधर्म के नाम पर लिए गए निर्णयों से अम्बा का जीवन उजड़ जाता है, और वह भीष्म को गिराने का संकल्प लेती है। उसका यही दृढ़ निश्चय आगे चलकर शिखंडी की कथा को आकार देता है।'],
['धृतराष्ट्र, पांडु और विदुर का जन्म','विचित्रवीर्य की निःसंतान मृत्यु के बाद सत्यवती व्यास से राजवंश को आगे बढ़ाने को कहती है। धृतराष्ट्र जन्मांध होते हैं, पांडु पीले और दुर्बल शरीर के, और विदुर महल की एक दासी से जन्म लेते हैं। तीनों बहुत भिन्न व्यक्तित्व वाले बनते हैं, पर उनके वंशज उस प्रतिद्वंद्विता को आकार देंगे जो युद्ध तक पहुँचती है।'],
['कुंती को दुर्वासा से मंत्र मिलना','युवा कुंती अतिथि बने ऋषि दुर्वासा की सेवा लगन से करती है। उसके आतिथ्य से प्रसन्न होकर वे उसे एक मंत्र देते हैं, जिससे वह किसी देवता को बुलाकर संतान पा सकती है। मंत्र की शक्ति जानने की जिज्ञासा में कुंती विवाह से पहले सूर्यदेव का आह्वान करती है। इसका अप्रत्याशित परिणाम वर्षों तक उसका रहस्य बना रहता है।'],
['कर्ण का जन्म','सूर्य कुंती के आह्वान का उत्तर देते हैं और कर्ण जन्म से ही कवच और कुंडल पहने उत्पन्न होता है। अविवाहित और लोकलाज से भयभीत कुंती शिशु को टोकरी में रखकर जल में बहा देती है। अधिरथ और राधा उसे पाकर अपने पुत्र की तरह पालते हैं। कर्ण स्नेह में बड़ा होता है और अपने राजसी जन्म से अनजान रहता है।'],
['पांडु का शाप और वन-गमन','पांडु शिकार में एक हिरण-युगल पर बाण चलाते हैं, यह जाने बिना कि वे पशु-रूप में एक ऋषि और उनकी संगिनी हैं। मरता हुआ ऋषि पांडु को शाप देता है कि यदि वे कामना से किसी पत्नी के पास गए तो उनकी मृत्यु हो जाएगी। राजा बने रहना असंभव जानकर पांडु सिंहासन छोड़ देते हैं और कुंती तथा माद्री के साथ वन चले जाते हैं।'],
['पांडवों का जन्म','पांडु की सहमति से कुंती दुर्वासा के मंत्र से देवताओं का आह्वान करती है। उससे युधिष्ठिर, भीम और अर्जुन का जन्म होता है; माद्री अश्विनीकुमारों का आह्वान करती है और नकुल तथा सहदेव को जन्म देती है। भाई वन में बड़े होते हैं और फिर हस्तिनापुर लौटते हैं, जहाँ उनकी प्रतिभा और लोकप्रियता कौरवों को खटकती है।'],
['गांधारी के सौ पुत्रों का जन्म','गांधारी का गर्भ असामान्य रूप से लंबा चलता है। जब वह मांस के एक पिंड को जन्म देती है, तो व्यास उसे बाँटकर टुकड़े घड़ों में रख देते हैं। उनसे दुर्योधन और उसके भाई, तथा बहन दुःशला जन्म लेते हैं। दुर्योधन के जन्म पर अशुभ लक्षण दिखते हैं, फिर भी धृतराष्ट्र उसे उत्तराधिकारी के रूप में पालते हैं।'],
['द्रोण और द्रुपद की मित्रता शत्रुता में बदली','विद्यार्थी जीवन में द्रोण और राजकुमार द्रुपद वचन देते हैं कि द्रुपद के राजा बनने पर वे सब कुछ बाँटेंगे। वर्षों बाद द्रोण निर्धनता में उसके पास सहायता माँगने जाते हैं। द्रुपद यह कहकर उन्हें ठुकरा देता है कि राजा और निर्धन आचार्य में मित्रता नहीं हो सकती। द्रोण उस अपमान को याद रखते हैं और बाद में अपने शिष्यों से द्रुपद को बंदी बनवाते हैं।'],
['राजकुमारों की युद्ध-विद्या','द्रोण कुरु राजकुमारों के गुरु बनते हैं और उन्हें शस्त्र और युद्ध की शिक्षा देते हैं। अर्जुन की एकाग्रता उन्हें प्रभावित करती है, जबकि भीम और दुर्योधन गदा-युद्ध में निपुण होते हैं। भाई और चचेरे भाई पूरी शिक्षा के दौरान एक-दूसरे से होड़ करते हैं। द्रोण की शिक्षा उन्हें युद्ध के लिए तैयार करती है, पर राजपरिवार की प्रतिद्वंद्विता भी तीव्र कर देती है।'],
['एकलव्य की गुरु-दक्षिणा','एकलव्य द्रोण से धनुर्विद्या सीखना चाहता है, पर द्रोण उसे सिखाने से मना कर देते हैं। एकलव्य द्रोण की मिट्टी की मूर्ति बनाकर अभ्यास करता है और अद्भुत धनुर्धर बन जाता है। उसका कौशल देखकर द्रोण गुरु-दक्षिणा में उसके दाहिने हाथ का अँगूठा माँगते हैं। एकलव्य अँगूठा दे देता है और अपनी सबसे बड़ी प्रतिभा खो बैठता है।'],
['रंगभूमि में कर्ण की अर्जुन को चुनौती','राजकुमारों के कौशल के सार्वजनिक प्रदर्शन में अर्जुन अपनी धनुर्विद्या से दर्शकों को चकित कर देता है। कर्ण आगे आकर वही करतब दिखाता है और उसे चुनौती देता है। जब उसके जन्म पर प्रश्न उठता है, तो दुर्योधन उसे अंग का राजा बना देता है ताकि वह प्रतिस्पर्धा कर सके। कर्ण की कृतज्ञता उसे दुर्योधन से और अर्जुन के साथ आजीवन होड़ से बाँध देती है।'],
['पांडवों का लाक्षागृह से बचना','दुर्योधन पांडवों को ज्वलनशील पदार्थों से बने महल में ठहराने की व्यवस्था करता है, ताकि उन्हें जीवित जला दे। विदुर से चेतावनी पाकर भाई गुप्त रूप से सुरंग खोद लेते हैं। जब महल में आग लगाई जाती है, तो वे कुंती के साथ भूमिगत मार्ग से निकल जाते हैं और वन में लुप्त हो जाते हैं, अपने जीवित होने का रहस्य बनाए रखते हुए।'],
['हिडिंब, हिडिंबा और घटोत्कच का जन्म','वन में राक्षस हिडिंब पांडवों को खाने की योजना बनाता है, पर उसकी बहन हिडिंबा को भीम से प्रेम हो जाता है। भीम हिडिंब को हराकर कुछ समय के लिए हिडिंबा से विवाह करते हैं। उनका पुत्र घटोत्कच मायावी शक्तियों वाला बलशाली योद्धा बनता है और आगे युद्ध में महत्त्वपूर्ण सहयोगी सिद्ध होता है।'],
['भीम द्वारा बकासुर का वध','पांडव एकचक्रा नगरी में शांति से रहते हैं, जहाँ बकासुर भोजन और खाने के लिए एक मनुष्य की माँग करता है। भीम बलि का भोजन ले जाने को स्वयं तैयार हो जाते हैं। वे भोजन स्वयं खा लेते हैं, फिर बकासुर से लड़कर उसे मार डालते हैं। नगर भय से मुक्त हो जाता है, और पांडव अपनी पहचान बताए बिना आगे बढ़ जाते हैं।'],
['अर्जुन और गंधर्व चित्ररथ की भेंट','यात्रा में अर्जुन की भेंट गंधर्व चित्ररथ से होती है, जो भाइयों को चुनौती देता है। अर्जुन के उसे हराने के बाद दोनों मित्र बन जाते हैं। चित्ररथ राजकीय रीति-नीति का ज्ञान देता है और सुझाव देता है कि पांडव किसी विद्वान पुरोहित को नियुक्त करें। उसकी सलाह घुमंतू जीवन जारी रखते भाइयों के काम आती है।'],
['यज्ञ की अग्नि से द्रौपदी का जन्म','राजा द्रुपद द्रोण को हराने वाले पुत्र की कामना से यज्ञ करता है। अग्नि से धृष्टद्युम्न प्रकट होता है, जो योद्धा बनने वाला है, और द्रौपदी, जिसकी नियति पांडवों और कौरवों को संघर्ष में खींच लाएगी। उनका अलौकिक जन्म सत्ता और न्याय के लिए परिवार के संघर्ष का नया अध्याय आरंभ करता है।'],
['स्वयंवर में अर्जुन द्वारा द्रौपदी की प्राप्ति','द्रौपदी के स्वयंवर में प्रतियोगियों को विशाल धनुष चढ़ाकर प्रतिबिंब देखते हुए लक्ष्य भेदना होता है। अनेक राजा असफल रहते हैं। ब्राह्मण के वेश में अर्जुन चुनौती पूरी करके द्रौपदी को जीत लेता है। शासक विरोध करते हैं, पर पांडव अपनी जीत की रक्षा करके उसे साथ ले जाते हैं, यह जाने बिना कि यह प्रतियोगिता उनका भविष्य कैसे बदल देगी।'],
['द्रौपदी का पाँचों पांडवों से विवाह','जब पांडव द्रौपदी के साथ घर लौटते हैं, तो कुंती यह जाने बिना कि वह क्या है, कह देती है कि जो लाए हो, आपस में बाँट लो। परिवार उसके वचन को आज्ञा मानता है। ऋषियों और द्रुपद से परामर्श के बाद द्रौपदी पाँचों भाइयों की पत्नी बनती है, और सामंजस्य की रक्षा के लिए नियम बनाए जाते हैं।'],
['अर्जुन की तीर्थयात्रा और उलूपी से विवाह','युधिष्ठिर और द्रौपदी के एकांत कक्ष में प्रवेश करने के बाद अर्जुन भाइयों के नियम के अनुसार वनवास स्वीकार करता है। यात्रा में उसकी भेंट नाग-राजकन्या उलूपी से होती है, जो उसे अपने जलमग्न लोक में ले जाती है। दोनों का विवाह होता है और पुत्र इरावान का जन्म होता है। अर्जुन अपनी तीर्थयात्रा जारी रखता है।'],
['मणिपुर में अर्जुन और चित्रांगदा','मणिपुर में अर्जुन की भेंट राजकुमारी चित्रांगदा से होती है और वह उसके पिता से विवाह की अनुमति माँगता है। राजा इस शर्त पर मानता है कि उनकी संतान मणिपुर में ही रहेगी और राजगद्दी पाएगी। अर्जुन स्वीकार करता है। उनका पुत्र बभ्रुवाहन अपनी माता के राज्य में पिता के अन्य परिवार से दूर पलता है।'],
['कृष्ण की सहायता से अर्जुन को सुभद्रा की प्राप्ति','अर्जुन वेश बदलकर द्वारका जाता है और कृष्ण की बहन सुभद्रा से प्रेम करने लगता है। कृष्ण उनकी भावनाएँ समझते हैं और यह जानकर कि औपचारिक प्रस्ताव अस्वीकार हो सकता है, उनके भागने में सहायता करते हैं। अर्जुन सुभद्रा को ले जाता है और कृष्ण बाद में यादवों को शांत करते हैं। यह विवाह कृष्ण के परिवार और पांडवों के बंधन को मजबूत करता है।'],
['अर्जुन और कृष्ण द्वारा खांडव वन का दहन','अग्नि कृष्ण और अर्जुन से खांडव वन को भस्म करने में सहायता माँगते हैं। इंद्र उसकी रक्षा के लिए वर्षा भेजते हैं, पर अर्जुन मूसलाधार वर्षा रोक देता है और कृष्ण उसके साथ लड़ते हैं। अनेक प्राणी भाग जाते हैं और वन जल उठता है। वास्तुकार मय बच जाता है और पांडवों के लिए एक अद्भुत सभा बनाने का प्रस्ताव रखता है।'],
['मय द्वारा पांडवों की सभा का निर्माण','प्राण बचाने के लिए अर्जुन का आभारी मय पांडवों के लिए विशाल सभा-भवन रचता है। स्फटिक के फर्श, छिपे जलाशय और विचित्र स्थान आगंतुकों को भ्रमित करते हैं। यह सभा उनकी बढ़ती शक्ति का प्रतीक बन जाती है। बाद में जब दुर्योधन वहाँ आता है, तो उसका अपमान उस ईर्ष्या को गहरा करता है जो द्यूत-क्रीड़ा तक पहुँचती है।'],
['इंद्रप्रस्थ में मय की अद्भुत सभा','मय स्फटिक के फर्श, निर्मल जलाशयों और अदृश्य-से लगते द्वारों से भरी असाधारण सभा पूरी करता है। पांडव वहाँ ऋषियों और राजाओं का स्वागत करते हैं। उसके चमत्कार उनकी समृद्धि दिखाते हैं, पर दुर्योधन के अपमान का स्थान भी बनते हैं। सभा की सुंदरता उस ईर्ष्या और शत्रुता का पूर्वाभास देती है जो इस सम्मेलन को बिखेर देगी।'],
['राजधर्म पर नारद के प्रश्न','नारद युधिष्ठिर के पास आकर पूछते हैं कि क्या वे समझदारी से शासन करते हैं। उनके प्रश्न न्याय और कर से लेकर सैनिकों, किसानों और अतिथियों की देखभाल तक फैले हैं। युधिष्ठिर सुनते हैं और समझते हैं कि राजा का धर्म विजय या धन से कहीं अधिक है। यह संवाद उनकी बढ़ती शक्ति के साथ आने वाले उत्तरदायित्वों की रूपरेखा बनाता है।'],
['कृष्ण, भीम और अर्जुन का मगध प्रस्थान','जरासंध ने अनेक राजाओं को बंदी बना रखा है। कृष्ण, भीम और अर्जुन वेश बदलकर मगध जाते हैं और उसे चुनौती देते हैं। वे नगर में प्रवेश करके अपना उद्देश्य प्रकट करते हैं। जरासंध द्वंद्व के लिए तैयार हो जाता है और भीम को चुनता है। यह संघर्ष तय करेगा कि बंदी राजा मुक्त होंगे या नहीं और युधिष्ठिर राजसूय कर सकेंगे या नहीं।'],
['भीम और जरासंध का अंतिम द्वंद्व','भीम और जरासंध कई दिनों तक मल्लयुद्ध करते हैं, दोनों एक-दूसरे के बल की बराबरी करते हैं। भीम उसे हरा नहीं पाते, जब तक कृष्ण घास की पत्ती को चीरकर संकेत नहीं देते। भीम जरासंध को चीर डालते हैं ताकि दोनों टुकड़े फिर न जुड़ सकें। बंदी राजा मुक्त होते हैं और युधिष्ठिर के राजसूय यज्ञ का मार्ग खुल जाता है।'],
['अर्जुन का उत्तर दिशा का अभियान','युधिष्ठिर के राजसूय के लिए अर्जुन उत्तर दिशा के अभियान का नेतृत्व करता है, ताकि पड़ोसी शासक उसे मान्यता दें और कर चुकाएँ। उसे प्रतिरोध मिलता है, पर अनेक राजा युद्ध या वार्ता के बाद उसका अधिकार स्वीकार कर लेते हैं। यह यात्रा सेनापति के रूप में उसके कौशल की परीक्षा लेती है और पांडव राज्य को इंद्रप्रस्थ से आगे फैलाती है।'],
['भीम का पूर्व दिशा का अभियान','भीम राजसूय के लिए कर एकत्र करने पूर्व की ओर जाते हैं। वे शक्तिशाली शासकों से मिलते हैं और कूटनीति तथा युद्ध से उनकी अधीनता पाते हैं। उनका अभियान युधिष्ठिर की बढ़ती संप्रभुता के पीछे की शक्ति दिखाता है। भीम जो धन और समर्थन जुटाते हैं, वह आने वाले यज्ञ को संभव बनाता है।'],
['सहदेव का दक्षिण दिशा का अभियान','सहदेव दक्षिणी अभियान का नेतृत्व करते हैं, राज्यों में जाकर युधिष्ठिर के शासन की स्वीकृति जुटाते हैं। कुछ शासक शांति से अधीन हो जाते हैं; कुछ पराजित होते हैं। उनकी सफलता राजसूय के लिए आवश्यक संसाधनों में वृद्धि करती है और दिखाती है कि हर भाई परिवार के उत्कर्ष में योगदान देता है।'],
['नकुल का पश्चिम दिशा का अभियान','नकुल पश्चिमी प्रदेशों में पांडव अभियान का नेतृत्व करते हैं। वे स्थानीय शासकों से मिलते हैं, कर प्राप्त करते हैं और दूर के राज्यों को युधिष्ठिर के चारों ओर बने गठबंधन में लाते हैं। उनकी यात्रा भाइयों द्वारा आरंभ की गई चारों दिशाओं की विजय पूरी करती है और राजसूय अनुष्ठान का मार्ग तैयार करती है।'],
['युधिष्ठिर का राजसूय यज्ञ','राजाओं द्वारा अधिकार स्वीकार किए जाने के बाद युधिष्ठिर राजसूय यज्ञ करते हैं। इंद्रप्रस्थ में शासक और ऋषि एकत्र होते हैं, और यह समारोह पांडवों की नई प्रतिष्ठा का उत्सव बन जाता है। प्रथम सम्मान के लिए कृष्ण को चुना जाता है। इस निर्णय से शिशुपाल क्रुद्ध हो जाता है और पवित्र सभा घातक टकराव में बदल जाती है।'],
['शिशुपाल की कृष्ण को चुनौती','शिशुपाल एकत्र राजाओं के सामने कृष्ण का अपमान करता है और पांडवों पर यज्ञ का अनादर करने का आरोप लगाता है। कृष्ण ने शिशुपाल की माता को वचन दिया था कि वे उसके निश्चित संख्या के अपराध क्षमा करेंगे। जब शिशुपाल उस सीमा से आगे बढ़ता है, तो कृष्ण अपने चक्र से उसका वध करते हैं। सभा मौन हो जाती है और युधिष्ठिर का यज्ञ आगे बढ़ता है।'],
['दुर्योधन का मायावी सभा में भ्रम','दुर्योधन स्फटिक की सतहों को जल और जलाशयों को ठोस फर्श समझ बैठता है। जब वह लड़खड़ाता है तो पांडव और उनके सेवक हँस पड़ते हैं। अपमानित दुर्योधन उपहास का शिकार महसूस करते हुए इंद्रप्रस्थ से लौटता है। उसका आहत अभिमान द्यूत-क्रीड़ा से उनका राज्य छीनने की योजना में कठोर हो जाता है।'],
['शकुनि का युधिष्ठिर को द्यूत के लिए निमंत्रण','दुर्योधन अपने मामा शकुनि से युधिष्ठिर के साथ खेल का आयोजन करने को कहता है। धृतराष्ट्र निमंत्रण भेजते हैं, और युधिष्ठिर राजकीय परंपरा से बँधा महसूस करके जाते हैं, यद्यपि वे जानते हैं कि खेल खतरनाक है। शकुनि दुर्योधन की ओर से खेलता है और युधिष्ठिर को बढ़ते हुए लापरवाह दाँवों में खींचता जाता है।'],
['युधिष्ठिर का राज्य और स्वतंत्रता हारना','युधिष्ठिर अपने आभूषण, धन, राज्य, भाइयों और अंत में स्वयं को दाँव पर लगाते हैं, और हर बार हारते हैं। फिर वे द्रौपदी को दाँव पर लगाते हैं, और यह प्रश्न केंद्रीय बन जाता है कि क्या उन्हें उसे दाँव पर रखने का अधिकार था। यह खेल पांडवों को सत्ता से वंचित करता है और कुरु वृद्धों को घोर अन्याय का सामना करने को विवश करता है।'],
['द्रौपदी को सभा में बुलाया जाना','दुःशासन को द्रौपदी को सभा में लाने भेजा जाता है। वह तब तक आने से मना करती है जब तक वृद्धजन यह न बताएँ कि स्वयं को हार चुके युधिष्ठिर उसे दाँव पर रख सकते थे या नहीं। दुःशासन उसे घसीटकर दरबार में ले आता है। उसका प्रश्न सभा को विचलित करता है, फिर भी शक्तिशाली पुरुष हस्तक्षेप करने में हिचकते हैं।'],
['द्रौपदी के प्रश्न और कुरु वृद्ध','वृद्धजनों के सामने द्रौपदी पूछती है कि यदि युधिष्ठिर पहले ही अपनी स्वतंत्रता हार चुके थे, तो क्या वह वैध रूप से जीती गई थी। भीष्म कहते हैं कि प्रश्न कठिन है क्योंकि नियम और कर्तव्य परस्पर टकराते हैं। विकर्ण उसके पक्ष में बोलता है, जबकि कर्ण कौरवों का समर्थन करता है। उसकी रक्षा करने में सभा की विफलता नैतिक पतन का चिह्न है।'],
['सभा में भीम की प्रतिज्ञाएँ','द्रौपदी का अपमान देखकर भीम दुःशासन को मारने और दुर्योधन की जाँघ तोड़ने की शपथ लेते हैं। अर्जुन और अन्य भाई उन्हें रोकते हैं, पर प्रतिज्ञाएँ बनी रहती हैं। धृतराष्ट्र परिणामों से डरकर द्रौपदी को वरदान देते हैं और कुछ समय के लिए पांडवों की स्वतंत्रता और संपत्ति लौटा देते हैं।'],
['धृतराष्ट्र द्वारा द्रौपदी को वरदान','धृतराष्ट्र द्रौपदी को वर देते हैं, और वह माँगती है कि युधिष्ठिर को मुक्त किया जाए। दूसरे वर से वह अपने अन्य पतियों की स्वतंत्रता और उनके शस्त्र पा लेती है। वह और माँगने से मना कर देती है, उनके गुणों पर भरोसा रखते हुए। पांडव चले जाते हैं, पर दुर्योधन शीघ्र ही उन्हें एक और खेल के लिए बुला लेता है।'],
['दूसरा द्यूत और पांडवों का वनवास','दूसरे खेल में तेरह वर्ष के वनवास की शर्तें तय होती हैं, जिनमें अंतिम एक वर्ष वेश बदलकर रहना भी है। युधिष्ठिर हार जाते हैं और पांडव द्रौपदी के साथ चल पड़ते हैं। दुःशासन का अपमान और दुर्योधन की जीत उनके मन में ताज़ा रहती है। वे न्याय की प्रतिज्ञाएँ लिए, यह जानते हुए वन में प्रवेश करते हैं कि युद्ध हो सकता है।'],
['पांडवों के वनवास का आरंभ','पांडव द्रौपदी के साथ नगर छोड़कर वन में प्रवेश करते हैं। वे ऋषियों से मिलते हैं, कठिनाइयाँ सहते हैं और सोचते हैं कि राज्य खोने के बाद कैसे जिएँ। युधिष्ठिर उन लोगों की चिंता करते हैं जो उनके साथ आए हैं, जबकि भीम और द्रौपदी कौरवों के विरुद्ध कार्रवाई पर बल देते हैं। वन शरणस्थली भी बनता है और पाठशाला भी।'],
['भीम द्वारा राक्षस किर्मीर का वध','वन के निकट राक्षस किर्मीर पांडवों का मार्ग रोकता है और उन्हें धमकाता है। वह बकासुर का संबंधी है और प्रतिशोध चाहता है। भीम आगे बढ़कर उससे लड़ते हैं, जबकि अन्य देखते हैं। भयंकर संघर्ष के बाद भीम किर्मीर को मार देते हैं और वनवासियों की यात्रा का मार्ग साफ़ हो जाता है।'],
['अर्जुन का दिव्यास्त्र पाने के लिए प्रस्थान','पांडव जानते हैं कि उन्हें महायुद्ध का सामना करना पड़ सकता है, इसलिए युधिष्ठिर अर्जुन को दिव्य अस्त्र खोजने भेजते हैं। अर्जुन उत्तर की ओर जाकर तपस्या करता है और देवताओं का ध्यान आकर्षित करता है। उसके जाने से परिवार चिंतित रहता है, पर कौरवों को चुनौती देने के लिए उसका यह कार्य आवश्यक है।'],
['किरात वेश में शिव से अर्जुन की भेंट','अर्जुन जब तपस्या कर रहा होता है, तभी एक जंगली सूअर उसकी ओर दौड़ता है। अर्जुन और एक शिकारी एक ही क्षण बाण छोड़ते हैं और इस पर विवाद करते हैं कि किसने उसे मारा। दोनों युद्ध करते हैं और अर्जुन जान जाता है कि शिकारी वेश बदले हुए शिव हैं। उसके साहस से प्रसन्न होकर शिव उसे पाशुपत अस्त्र देते हैं।'],
['अर्जुन को पाशुपत अस्त्र की प्राप्ति','अपना रूप प्रकट करने के बाद शिव अर्जुन को शक्तिशाली पाशुपत अस्त्र देते हैं और उसके प्रयोग की शिक्षा देते हैं। अन्य देवता भी दिव्य अस्त्र प्रदान करते हैं। अर्जुन उन्हें विनम्रता से स्वीकार करता है, यह जानते हुए कि उनकी शक्ति का प्रयोग केवल आवश्यकता पर होना चाहिए। यह प्रशिक्षण उसे आने वाले युद्ध के लिए तैयार करता है और दिव्य जगत से उसका संबंध गहरा करता है।'],
['उर्वशी का शाप और अर्जुन का अज्ञातवास','इंद्र की सभा में उर्वशी अर्जुन के पास आती है, पर वह उसे पूर्वज के रूप में सम्मान देकर मना कर देता है। क्रोधित होकर वह उसे नपुंसक रूप में रहने का शाप देती है। इंद्र समझाते हैं कि यह शाप एक वर्ष के लिए वरदान सिद्ध होगा। वनवास के अंतिम वर्ष में अर्जुन इसी के सहारे बृहन्नला के रूप में रहेगा।'],
['अर्जुन का इंद्रलोक में प्रवास','अर्जुन इंद्र की दिव्य सभा में पहुँचकर संगीत, नृत्य और दिव्य युद्धकला सीखता है। इंद्र उसे पुत्र की तरह अपनाते हैं और शक्तिशाली शत्रुओं से युद्ध के लिए तैयार करते हैं। अर्जुन का यह प्रवास केवल पुरस्कार नहीं है; इससे उसे अपने भाइयों की रक्षा और आगे के संकटों का सामना करने के लिए अस्त्र और ज्ञान मिलते हैं।'],
['अर्जुन और निवातकवचों का युद्ध','इंद्र अर्जुन से निवातकवच दैत्यों को हराने को कहते हैं, जिनका गढ़ देवताओं के लिए भी दुर्भेद्य रहा है। अर्जुन उनके लोक में प्रवेश करके दिव्य अस्त्रों से उनसे लड़ता है। वह उनकी रक्षा-पंक्तियाँ भेदकर विजयी लौटता है। यह युद्ध सिद्ध करता है कि वह अपनी नई शक्तियों का प्रयोग शक्तिशाली शत्रुओं पर अनुशासन खोए बिना कर सकता है।'],
['पांडवों की तीर्थयात्रा','लोमश युधिष्ठिर और उनके भाइयों को पवित्र स्थानों की तीर्थयात्रा पर ले जाते हैं। हर स्थान पर वे ऋषियों, राजाओं और प्रतिज्ञाओं के इतिहास सुनाते हैं। यह यात्रा वनवासियों को कठिनाइयाँ सहने का आधार देती है और उन्हें भूमि की प्राचीन कथाओं से जोड़ती है। युधिष्ठिर सीखते हैं कि अनेक वीरों ने आगे का मार्ग पाने से पहले कठिन परीक्षाएँ झेली थीं।'],
['ऋष्यशृंग और वर्षाविहीन राज्य','एक राज्य लंबे सूखे से पीड़ित है और वहाँ के लोग जानते हैं कि युवा तपस्वी ऋष्यशृंग की उपस्थिति से वर्षा हो सकती है। एक राजकुमारी को उन्हें उनके एकांत वन-जीवन से बुलाने भेजा जाता है। जब वे आते हैं, तो आकाश खुल जाता है और भूमि फिर हरी हो जाती है। यह कथा तपस्या की शक्ति, राजा की आवश्यकता और मानवीय संबंध को जोड़ती है।'],
['बाज़, कबूतर और राजा शिबि','एक बाज़ कबूतर का पीछा करता है, जो राजा शिबि की शरण में आता है। राजा उसकी रक्षा का वचन देते हैं, जबकि बाज़ तर्क देता है कि उसे भी भोजन चाहिए। शिबि बदले में अपना मांस देने को तैयार हो जाते हैं। जब वे उसे कबूतर के साथ तौलते हैं, तो उन्हें पता चलता है कि यह दिव्य परीक्षा है। उनकी करुणा की प्रशंसा होती है।'],
['नल और दमयंती का एक-दूसरे के बारे में सुनना','राजकुमारी दमयंती एक बोलते हंस से राजा नल के गुणों के बारे में सुनती है, और नल उसके सौंदर्य और चरित्र के बारे में सुनते हैं। बिना मिले ही दोनों में प्रेम हो जाता है। हंस उनके बीच संदेश पहुँचाता है। उनकी कथा दूर से प्रशंसा के साथ आरंभ होती है और ऐसे चुनाव की ओर बढ़ती है जो देवताओं और राजाओं को भी चुनौती देगा।'],
['स्वयंवर में दमयंती द्वारा नल का चयन','दमयंती के स्वयंवर में देवता नल का रूप धरकर आते हैं, इस आशा में कि वह उनमें से किसी को चुनेगी। दमयंती सभी आकृतियों को परखती है और मानवीय लक्षणों से मनुष्य नल को पहचान लेती है। वह उसी के गले में वरमाला डालती है। देवता उसका निर्णय स्वीकार करते हैं और दोनों का विवाह होता है।'],
['द्यूत में नल का राज्य खोना','कलि नल के जीवन में प्रवेश करता है और उसे अपने भाई पुष्कर के साथ द्यूत खेलने को प्रेरित करता है। नल अपना राज्य और धन हार जाता है, जबकि दमयंती उसके साथ रहना चुनती है। दोनों थोड़े से सामान के साथ वन चले जाते हैं। उनका दुर्भाग्य पांडवों के वनवास का प्रतिबिंब है, इसलिए नल की कथा युधिष्ठिर के लिए अर्थपूर्ण है।'],
['वन में नल और दमयंती का बिछोह','भूखे और थके भटकते हुए नल को डर लगता है कि दमयंती का साथ उसे और कष्ट देगा। एक रात वह उसे सोता छोड़कर चला जाता है। दमयंती अकेली जागती है और वन में उसे खोजती है। नल का निर्णय उनके दुःख को गहरा करता है, पर लौटने का मार्ग पाने से पहले दोनों को अलग-अलग जीवित रहना है।'],
['नल की नाग कर्कोटक से भेंट','नल नाग कर्कोटक को आग से बचाता है। नाग उसे डस लेता है और उसका रूप बदल जाता है, पर बताता है कि यह परिवर्तन कलि से उसकी रक्षा करेगा और आगे काम आएगा। नल बाहुक नाम धारण करता है और राजा ऋतुपर्ण के लिए घोड़े हाँकना सीखता है। उसकी छिपी पहचान उसे मिलन की तैयारी का समय देती है।'],
['नल को द्यूत-विद्या का रहस्य मिलना','नल राजा ऋतुपर्ण की सेवा करता है, जो द्यूत में निपुण हैं। घोड़े हाँकने की विद्या सिखाने के बदले ऋतुपर्ण नल को खेल के पीछे का ज्ञान सिखाते हैं। नल उस पासे पर नियंत्रण पा लेता है जिसने कभी उसे बर्बाद किया था। आत्मविश्वास लौटने पर वह दमयंती के पास लौटने और अपना जीवन वापस पाने को तैयार होता है।'],
['नल और दमयंती का पुनर्मिलन','दमयंती दूसरा स्वयंवर रचती है, इस आशा में कि समाचार नल तक पहुँचेगा। बाहुक राजा ऋतुपर्ण के साथ आता है, और दमयंती उसके वेश के नीचे अपने पति के लक्षण पहचान लेती है। नल अपना परिचय देता है और दोनों का मिलन होता है। उसे अपना असली रूप मिल जाता है, वह नए खेल में पुष्कर को हराता है और अपना राज्य वापस पाता है।'],
['सावित्री का यम के पीछे जाकर सत्यवान को बचाना','सावित्री यह जानकर भी सत्यवान को चुनती है कि उसकी एक वर्ष में मृत्यु होने वाली है। जब यम सत्यवान के प्राण लेने आते हैं, तो वह उनके पीछे चलती है और विवेक तथा निष्ठा से बात करती है। यम उसे वर देते हैं, पर वह ऐसा वर माँगती है जिसके लिए सत्यवान का जीवित रहना आवश्यक है। अपने वचन से बँधे यम उसके पति को लौटा देते हैं।'],
['पर्वत-मार्ग पर भीम और हनुमान की भेंट','द्रौपदी के लिए सुगंधित पुष्प खोजते हुए भीम को मार्ग में लेटा एक बूढ़ा वानर मिलता है। वानर उनसे अपनी पूँछ हटाने को कहता है, पर भीम उसे उठा नहीं पाते। वानर स्वयं को हनुमान के रूप में प्रकट करता है, जो पवनदेव के नाते भीम के बड़े भाई हैं। हनुमान भीम को आशीर्वाद देते हैं और विनम्रता सिखाते हैं।'],
['गंधर्वों द्वारा दुर्योधन का बंदी होना','वन की यात्रा के दौरान दुर्योधन को गंधर्वराज चित्रसेन बंदी बना लेता है। कौरव उसे छुड़ा नहीं पाते, और युधिष्ठिर शत्रुता के बावजूद पांडवों से अपने चचेरे भाई को बचाने को कहते हैं। अर्जुन और भीम गंधर्वों को हराकर दुर्योधन को वापस लाते हैं। इस कार्य से वह लज्जित और कुपित हो जाता है।'],
['पांडवों द्वारा दुर्योधन की रक्षा','पांडव दुर्योधन को छुड़ाकर सुरक्षित उसके शिविर तक पहुँचा देते हैं। वह इस बात से अपमानित है कि जिन भाइयों के साथ उसने अन्याय किया, उन्हीं ने उसे बचाया। दुर्योधन प्राण त्यागने का विचार करता है, पर कर्ण और शकुनि उसे आगे बढ़ने के लिए मना लेते हैं। यह रक्षा कटु वैर के बीच भी युधिष्ठिर की पारिवारिक कर्तव्य-निष्ठा को प्रकट करती है।'],
['जयद्रथ द्वारा द्रौपदी का हरण','पांडवों की अनुपस्थिति में जयद्रथ द्रौपदी को देखता है और उसे अपने रथ में उठा ले जाता है। वह प्रतिरोध करती है और उसकी निंदा करती है। भाई जयद्रथ का पीछा करके उसे हराते हैं और युधिष्ठिर के सामने ले आते हैं। द्रौपदी उसके प्राण बख्शने को कहती है, पर भीम उसके केश काटकर उसे अपमानित करते हैं।'],
['राम और सीता की कथा','युधिष्ठिर को सांत्वना देने के लिए मार्कंडेय राम की कथा सुनाते हैं: वे राज्य खोते हैं, सीता और लक्ष्मण के साथ वन जाते हैं, और रावण द्वारा सीता का हरण होने पर उन्हें खोजते हैं। राम वानरों के साथ मित्रता करते हैं, रावण को हराते हैं और घर लौटते हैं। यह कथा पांडवों को कठिनाइयों में धैर्य का उदाहरण देती है।'],
['विवेकी व्याध और अभिमानी तपस्वी','एक विद्वान ब्राह्मण एक तपस्वी से ज्ञान चाहता है, जो उसे माता-पिता के भक्त एक विनम्र व्याध के पास भेजता है। व्याध समझाता है कि धर्म इस पर निर्भर है कि दैनिक जीवन में कोई कैसे आचरण करता है, केवल पद या कर्मकांड पर नहीं। उसकी शिक्षा ब्राह्मण को अप्रत्याशित स्थान पर ज्ञान पहचानने की चुनौती देती है।'],
['द्रौपदी और सत्यभामा का विवाह और कर्तव्य पर संवाद','सत्यभामा द्रौपदी से पूछती है कि वह पाँच पतियों का स्नेह कैसे बनाए रखती है। द्रौपदी कहती है कि वह जादू या नियंत्रण पर निर्भर नहीं रहती; वह हर पति का सम्मान करती है, ईर्ष्या से बचती है और गृहस्थी का ध्यान रखती है। उनका संवाद विवाह और कर्तव्य का व्यक्तिगत दृष्टिकोण देता है और उनकी मित्रता दिखाता है।'],
['वन के सरोवर पर यक्ष के प्रश्न','एक रहस्यमय यक्ष द्वारा रक्षित सरोवर पर हर पांडव उसके प्रश्नों का उत्तर दिए बिना जल पीता है और अचेत हो जाता है। युधिष्ठिर सुनते हैं और जीवन, धर्म और विवेक के प्रश्नों के उत्तर देते हैं। एक भाई को जीवित करने को कहा जाने पर वे नकुल को चुनते हैं, ताकि कुंती और माद्री दोनों का एक पुत्र जीवित रहे। यक्ष स्वयं को धर्म के रूप में प्रकट करता है और चारों को जीवित कर देता है।'],
['पांडवों द्वारा वेश का चयन','वन में बारह वर्ष पूरे होने पर पांडवों को एक वर्ष अज्ञात रहना है। वे विराट के दरबार के अनुरूप वेश चुनते हैं: युधिष्ठिर दरबारी बनते हैं, भीम रसोइया, अर्जुन नृत्य-शिक्षक, नकुल अश्वपाल और सहदेव गोपालक। द्रौपदी दासी के रूप में महल में प्रवेश करती है।'],
['युधिष्ठिर का विराट के सलाहकार बनना','युधिष्ठिर राजा विराट के दरबार में कंक नाम के विद्वान दरबारी के रूप में आते हैं, जो द्यूत खेलते हैं और राजा को सलाह देते हैं। वे अपनी राजसी पहचान छिपाते हैं और महल के भीतर से अपने परिवार पर दृष्टि रखते हैं। उनका धैर्य परखा जाता है, जब वेश बदले पांडव अंतिम वर्ष अज्ञात रहकर पूरा करने का प्रयास करते हुए संकटों का सामना करते हैं।'],
['भीम का महल की रसोई में प्रवेश','भीम बल्लव नाम धारण करके विराट के महल में रसोइया बन जाते हैं। उनका विशाल शरीर और बल छिपाना कठिन है, इसलिए वे मल्लयुद्ध और भोजन बनाने का अनुभव होने का दावा करते हैं। वे अपने पद का उपयोग अपने परिवार की रक्षा के लिए करते हैं और उस क्षण की प्रतीक्षा करते हैं जब उनके बल की आवश्यकता होगी।'],
['अर्जुन का बृहन्नला बनना','अर्जुन बृहन्नला नाम धारण करके राजकुमारी उत्तरा को संगीत और नृत्य सिखाता है। उर्वशी का शाप उसे एक वर्ष इस वेश में रहने देता है। यद्यपि यह भूमिका रणभूमि से दूर लगती है, यह उसे राजपरिवार के निकट रखती है और लड़ने का समय आने तक उसकी पहचान छिपाए रखती है।'],
['द्रौपदी का सैरंध्री बनना','द्रौपदी सैरंध्री के रूप में महल में प्रवेश करती है, जो केश और वस्त्र सजाने में कुशल स्त्री है। वह रानी सुदेष्णा से संरक्षण माँगती है और चेताती है कि वह उत्पीड़न स्वीकार नहीं करेगी। उसकी स्थिति उसे बहुत कम शक्ति देती है, पर वह अपने पतियों का रहस्य बचाने का प्रयास करते हुए सजग और साधन-संपन्न बनी रहती है।'],
['भीम द्वारा कीचक का वध','रानी का भाई कीचक द्रौपदी को सताता है और उसकी चेतावनियों पर ध्यान नहीं देता। वह भीम से सहायता माँगती है। रात में भीम एक सभागार में कीचक से मिलते हैं और भयंकर युद्ध में उसे मार डालते हैं। दरबार मानता है कि रहस्यमय गंधर्व पतियों ने उसे दंड दिया है, और द्रौपदी को सताने वाला समाप्त हो जाता है।'],
['कौरवों का विराट की गायों का हरण','दुर्योधन की सेना विराट की गायें हर लेती है, यह परखने के लिए कि क्या पांडव राज्य में छिपे हैं। राजकुमार उत्तर डींग मारता है कि वह उन्हें हरा देगा, पर कौरव सेना देखकर उसका साहस टूट जाता है। बृहन्नला उसका रथ हाँकने और योद्धाओं का सामना करने में सहायता करने को तैयार हो जाती है।'],
['शमी वृक्ष के नीचे अर्जुन का परिचय','बृहन्नला उत्तर को उस शमी वृक्ष के पास ले जाती है जहाँ अर्जुन के शस्त्र छिपे हैं। वह अपनी सच्ची पहचान प्रकट करता है और उत्तर से सारथी बनने को कहता है। उत्तर चकित होता है, फिर मान जाता है। अर्जुन अपना गांडीव धनुष लेकर कौरव सेना का सामना करने की तैयारी करता है।'],
['अर्जुन और उत्तर द्वारा गायों की रक्षा','अर्जुन युद्ध में उतरता है और उत्तर बागडोर थामता है। अर्जुन कौरव योद्धाओं को हराकर विराट की गायें छुड़ा लेता है, पर अपने पूज्य वृद्धजनों को छोड़ देता है। यह विजय राज्य की रक्षा करती है और वर्ष पूरा होने तक पांडवों का वेश सुरक्षित रखती है।'],
['पांडवों का राजा विराट के सामने प्रकट होना','वर्ष समाप्त होने पर पांडव अपना परिचय देते हैं। राजा विराट उनका सम्मान करते हैं और अपनी पुत्री उत्तरा को अर्जुन को देने का प्रस्ताव रखते हैं। अर्जुन ने उसे शिष्या के रूप में पढ़ाया है, इसलिए वह उसे अपने पुत्र अभिमन्यु की वधू के रूप में स्वीकार करता है। विराट से यह संबंध युद्ध से पहले पांडवों को बल देता है।'],
['पांडवों द्वारा राज्य में अपना भाग माँगना','वनवास के बाद पांडव संदेश भेजते हैं कि उन्हें वह राज्य चाहिए जिसका उनसे वचन किया गया था। वे शांतिपूर्ण समाधान चाहते हैं, पर अपने अधिकार नहीं छोड़ेंगे। धृतराष्ट्र के दरबार में उनकी माँग पर विचार होता है, जबकि दुर्योधन भूमि का छोटा-सा भाग भी लौटाने को तैयार नहीं है।'],
['दुर्योधन और अर्जुन का कृष्ण से सहायता माँगना','दुर्योधन और अर्जुन दोनों विश्राम करते कृष्ण के पास जाते हैं। कृष्ण एक पक्ष को अपनी विशाल नारायणी सेना और दूसरे को स्वयं निःशस्त्र रूप में देने की बात करते हैं। दुर्योधन सेना चुनता है, जबकि अर्जुन कृष्ण को अपना सारथी चुनता है। उनके चुनाव शक्ति के विषय में उनके भिन्न विचार प्रकट करते हैं।'],
['दुर्योधन का कृष्ण की सेना चुनना','कृष्ण दुर्योधन को नारायणी सेना चुनने का अवसर देते हैं, जबकि अर्जुन को निःशस्त्र कृष्ण स्वयं मिलेंगे। दुर्योधन सैनिक पाकर प्रसन्न होता है। अर्जुन कृष्ण के साथ से संतुष्ट है। यह निर्णय युद्ध के गठबंधन तय करता है और सैन्य संख्या से परे कृष्ण पर पांडवों का भरोसा दिखाता है।'],
['शल्य को दुर्योधन के पक्ष में मनाया जाना','शल्य पांडवों का साथ देने चलते हैं, पर दुर्योधन रास्ते में गुप्त रूप से भव्य आतिथ्य का प्रबंध करवा देता है। यह मानकर कि यह युधिष्ठिर ने किया है, शल्य दुर्योधन को वर देने का वचन देते हैं। सच जानने पर शल्य को अपना वचन निभाना पड़ता है, यद्यपि बाद में वे कर्ण के सारथी बनकर उसका आत्मविश्वास कमजोर करने को मान जाते हैं।'],
['संजय का पांडवों को कौरवों का संदेश','संजय धृतराष्ट्र के दूत के रूप में पांडवों के पास जाते हैं। वे उनसे युद्ध टालने का आग्रह करते हैं और उसके विनाश की याद दिलाते हैं। युधिष्ठिर सुनते हैं, पर कहते हैं कि शांति के लिए न्याय आवश्यक है। संजय पांडवों का पक्ष और यह चेतावनी लेकर हस्तिनापुर लौटते हैं कि देरी से उनका दावा मिट नहीं जाएगा।'],
['युधिष्ठिर का शांति का अंतिम प्रस्ताव','युधिष्ठिर कहते हैं कि यदि शांति बनी रहे और उनका उचित स्थान सुरक्षित रहे, तो पांडव थोड़े से भाग में भी संतुष्ट होंगे। उनका प्रस्ताव वर्षों की कठिनाई के बाद संयम दिखाता है। दुर्योधन किसी भी समझौते से इनकार करता है, और दोनों ओर एकत्र हो रहे राजाओं के सामने वार्ता की विफलता और स्पष्ट हो जाती है।'],
['विदुला और उसके पुत्र की कथा','कुंती कृष्ण को रानी विदुला की कथा सुनाती है, जिसका पुत्र पराजय के बाद पीछे हट जाता है। विदुला उसकी निराशा को चुनौती देती है और उसे साहस जुटाकर अपनी प्रजा के लिए कर्म करने को कहती है। उसके शब्द पुत्र को संघर्ष में लौटने को प्रेरित करते हैं। कुंती यह कथा युद्ध से पहले पांडवों के लिए संदेश के रूप में भेजती है।'],
['कृष्ण का शांतिदूत बनकर जाना','पांडव कृष्ण से हस्तिनापुर जाकर शांति की बात करने को कहते हैं। वे उनका प्रस्ताव लेकर जाने को मानते हैं, यह जानते हुए कि दुर्योधन मना कर सकता है। कुंती कृष्ण के हाथ अपने पुत्रों के लिए संदेश भेजती है, उन्हें उनके कर्तव्य की याद दिलाती हुई। कृष्ण की यात्रा कूटनीति से युद्ध रोकने का अंतिम बड़ा प्रयास है।'],
['कृष्ण का दुर्योधन का भोज ठुकराना','दुर्योधन कृष्ण को राजमहल में भोजन का निमंत्रण देता है, पर जब तक संघर्ष का समाधान नहीं होता, कृष्ण मना कर देते हैं। वे इसके बजाय विदुर का सादा आतिथ्य स्वीकार करते हैं। उनका निर्णय संकेत देता है कि वे विलासिता या चापलूसी से प्रभावित नहीं होंगे और उनकी यात्रा का उद्देश्य न्याय और शांति है।'],
['कुरु सभा में कृष्ण का शांति-प्रस्ताव','कृष्ण कुरु दरबार को संबोधित करते हैं और वृद्धजनों से पांडवों का राज्य लौटाने का आग्रह करते हैं। वे युद्ध की कीमत बताते हैं और दुर्योधन से मेल-मिलाप चुनने को कहते हैं। भीष्म, विदुर और अन्य लोग शांति का समर्थन करते हैं, पर दुर्योधन उनकी सलाह ठुकरा देता है। सभा युद्ध से पहले का अंतिम स्पष्ट आग्रह सुनती है।'],
['दुर्योधन की कृष्ण को बंदी बनाने की योजना','दुर्योधन कृष्ण को पकड़कर दरबार से जाने से रोकने का निश्चय करता है। कृष्ण अचंभित नहीं होते। वे सभा के सामने अपना विराट दिव्य रूप प्रकट करते हैं, जिससे सिद्ध होता है कि उन्हें बल से रोका नहीं जा सकता। कुरु वृद्ध विस्मित रह जाते हैं, जबकि दुर्योधन युद्ध पर अडिग रहता है।'],
['कृष्ण का विश्वरूप दर्शन','जब दुर्योधन की उन्हें पकड़ने की योजना आगे बढ़ती है, तब कृष्ण कुरु सभा में अपना विश्वरूप प्रकट करते हैं। एकत्र शासक उनके भीतर देवताओं और लोकों को देखते हैं। धृतराष्ट्र को क्षण भर के लिए दृष्टि मिलती है ताकि वे यह दर्शन कर सकें। फिर कृष्ण अपने परिचित रूप में लौटकर चल देते हैं, यह जानते हुए कि शांति विफल हो गई है।'],
['कृष्ण का कर्ण को उसके जन्म का रहस्य बताना','कृष्ण कर्ण से एकांत में मिलते हैं और बताते हैं कि कुंती उसकी माता है और वह ज्येष्ठ पांडव है। वे कर्ण को सिंहासन देने का प्रस्ताव रखते हैं, यदि वह अपने भाइयों से आ मिले। कर्ण विचलित होता है, पर दुर्योधन को नहीं छोड़ता, जिसने दूसरों के ठुकराने पर उसके प्रति निष्ठा दिखाई थी।'],
['युद्ध से पहले कुंती और कर्ण की भेंट','कुंती सूर्योदय के समय कर्ण के पास जाती है और कृष्ण की बात की पुष्टि करती है। वह उससे पांडवों के साथ आने और अपने भाइयों से न लड़ने को कहती है। कर्ण स्वीकार नहीं कर पाता, पर वचन देता है कि अर्जुन के सिवा वह किसी पांडव को नहीं मारेगा। कुंती यह जानकर लौटती है कि युद्ध उसके एक पुत्र को ले सकता है।'],
['कर्ण का कुंती को वचन कि चार पांडव जीवित रहेंगे','कर्ण कुंती से कहता है कि वह दुर्योधन के प्रति निष्ठावान रहेगा, जिसने कभी उसे सम्मान और राज्य दिया था। फिर भी वह वचन देता है कि वह युधिष्ठिर, भीम, नकुल या सहदेव का वध नहीं करेगा। केवल वह और अर्जुन एक-दूसरे के सामने होंगे। कुंती के पाँच पुत्र तब भी रहेंगे, यद्यपि एक को जाना होगा।'],
['अम्बा का भीष्म से न्याय माँगना','शाल्व के ठुकराने और भीष्म के विवाह से मना करने के बाद अम्बा उसी पुरुष से न्याय माँगती है जिसके कार्यों ने उसका जीवन बदल दिया। भीष्म अपनी प्रतिज्ञा से स्वयं को मुक्त नहीं कर सकते। अम्बा एक दरबार से दूसरे दरबार तक किसी रक्षक की खोज में भटकती है, पर उसे विरासत में मिले इस संघर्ष को कोई सुलझा नहीं पाता।'],
['अम्बा की परशुराम से प्रार्थना','अम्बा परशुराम से कहती है कि वे भीष्म को उससे विवाह करने या उसके कष्ट का उत्तर देने को विवश करें। परशुराम अपने पूर्व शिष्य भीष्म को युद्ध के लिए ललकारते हैं। दोनों महान योद्धा भीषण युद्ध करते हैं, पर कोई किसी को हरा नहीं पाता। संघर्ष बिना अम्बा को न्याय मिले समाप्त होता है और उसका संकल्प और गहरा हो जाता है।'],
['अम्बा की प्रतिज्ञा और शिखंडी के रूप में उसका भविष्य','अम्बा तपस्या करके भीष्म के पतन का कारण बनने की शक्ति माँगती है। अगले जन्म में वह शिखंडी बनती है, जो पिछले जीवन की स्मृति और उद्देश्य साथ लिए है। भीष्म शिखंडी से युद्ध नहीं करेंगे, और यही निर्णय युद्ध में अर्जुन को उन्हें गिराने का अवसर देगा।'],
['गालव का विश्वामित्र के लिए दुर्लभ अश्व खोजना','विद्यार्थी गालव अपने गुरु विश्वामित्र को एक असंभव भेंट देकर ऋण चुकाना चाहता है: काले कान वाले आठ सौ श्वेत घोड़े। गरुड़ उसकी खोज में सहायता करते हैं। गालव राजा ययाति से मिलता है, जो अपनी पुत्री माधवी को इसलिए देते हैं कि क्रमिक राजकीय विवाहों से घोड़े प्राप्त हों।'],
['माधवी के चार राजकीय विवाह','माधवी का विवाह कई राजाओं से होता है; प्रत्येक को एक पुत्र मिलता है और गालव की भेंट के लिए घोड़े देता है। दायित्व पूरा होने के बाद माधवी पिता के पास लौट जाती है। उसकी कथा राजकीय गठबंधनों में स्त्रियों द्वारा सही गई कीमत और इस बात को दिखाती है कि वचन अनेक जीवनों को कैसे आकार देते हैं।'],
['ययाति का स्वर्ग से पतन','राजा ययाति अपने कर्मों के पुण्य से स्वर्ग पहुँचते हैं, पर अभिमान के कारण गिर जाते हैं। नीचे उतरते समय उनके वंशज और अन्य लोग उन्हें अपना पुण्य अर्पित करते हैं। ययाति सीखते हैं कि सम्मान केवल पूर्व उपलब्धियों पर नहीं टिक सकता। सहायता करने वालों की उदारता से विनम्र होकर वे स्वर्ग लौटते हैं।'],
['कुरुक्षेत्र में सेनाओं का एकत्र होना','राजा और योद्धा पक्ष चुनते हैं, और कुरुक्षेत्र के मैदान पर विशाल सेनाएँ जुट जाती हैं। पांडव सेनापति नियुक्त करके अपना शिविर तैयार करते हैं; दुर्योधन कौरव पंक्तियाँ संगठित करता है। जब परिवार और गुरु विरोधी पक्षों में खड़े होते हैं, तो रणभूमि हर अधूरे वचन और शिकायत का मिलन-स्थल बन जाती है।'],
['कुरुक्षेत्र में आमने-सामने सेनाएँ','भोर में शंख बजते हैं और दोनों सेनाएँ तैयार खड़ी होती हैं। योद्धा मैदान के पार अपने संबंधियों, गुरुओं और मित्रों को पहचानते हैं। धृतराष्ट्र संजय से पूछते हैं कि क्या हो रहा है, और संजय अपना वर्णन आरंभ करते हैं। युद्ध का पहला क्षण साहस और भय दोनों से भरा है।'],
['रणभूमि में अर्जुन का विषाद','अर्जुन कृष्ण से रथ को दोनों सेनाओं के बीच ले जाने को कहता है। दोनों ओर अपने स्वजनों और गुरुओं को देखकर उसका साहस टूट जाता है और वह धनुष नीचे रख देता है। वह अपने प्रियजनों को मारकर राज्य पाने की कल्पना नहीं कर सकता। कृष्ण कर्तव्य, शोक और कर्म के विषय में उसके भ्रम का उत्तर देना आरंभ करते हैं।'],
['कृष्ण द्वारा भगवद्गीता का उपदेश','कृष्ण अर्जुन को आत्मा, अनुशासित कर्म, भक्ति और ज्ञान के बारे में सिखाते हैं। वे समझाते हैं कि अर्जुन को फल की आसक्ति के बिना अपने कर्तव्य के अनुसार कर्म करना चाहिए। कृष्ण अपना विश्वरूप दिखाते हैं और अर्जुन अपना संकल्प पा लेता है। यह उपदेश महाकाव्य के सबसे प्रसिद्ध आध्यात्मिक संवादों में गिना जाता है।'],
['महायुद्ध का पहला दिन','सेनाएँ टकराती हैं और रणभूमि बाणों, रथों और चीत्कारों से भर जाती है। भीष्म बड़े पराक्रम से कौरव सेना का नेतृत्व करते हैं, जबकि पांडव योद्धा अपनी पंक्तियाँ संभालने का प्रयास करते हैं। दोनों पक्षों को हानि होती है, और भाई समझ जाते हैं कि इस युद्ध में साहस से अधिक की आवश्यकता होगी।'],
['भीष्म का अजेय आक्रमण','कई दिन तक भीष्म पांडव सेना को चीरते हैं, योद्धाओं को हराते हैं और पंक्तियाँ बिखेरते हैं। युधिष्ठिर चिंतित हैं कि उन्हें कोई रोक नहीं सकता। अर्जुन अपने पितामह से पूरी शक्ति से लड़ने में हिचकता है। पांडवों को भीष्म के प्रति अपने स्नेह का मान रखते हुए उनका सामना करने का मार्ग खोजना है।'],
['युद्ध में अर्जुन और भीष्म का सामना','अर्जुन और भीष्म भीषण द्वंद्व में आमने-सामने आते हैं। दोनों एक-दूसरे का कौशल जानते हैं, और हर कोई सावधानी तथा शक्ति से लड़ता है। भीष्म के बाण अर्जुन के रथ पर लगते हैं, जबकि अर्जुन अपने बाणों की झड़ी से उत्तर देता है। उनका युद्ध परिवार के लिए जितना पीड़ादायक है, सेनाओं के लिए उतना ही निर्णायक।'],
['अर्जुन के लिए कृष्ण का शस्त्र उठाना','भीष्म के विरुद्ध अर्जुन को हिचकता देख कृष्ण रथ से कूदकर हाथ में चक्र लिए आगे दौड़ पड़ते हैं। अर्जुन पीछे जाकर उन्हें रोकता है और पूरे संकल्प से लड़ने का वचन देता है। कृष्ण रथ पर लौट आते हैं। यह क्षण अर्जुन के प्रति उनकी भक्ति और भीष्म के आक्रमण की तीव्रता को प्रकट करता है।'],
['शिखंडी को आगे कर अर्जुन का भीष्म पर प्रहार','पांडवों को भीष्म की प्रतिज्ञा याद आती है कि वे शिखंडी से नहीं लड़ेंगे। शिखंडी आगे बढ़ता है, और भीष्म आक्रमण करने के बजाय शस्त्र नीचे कर देते हैं। अर्जुन शिखंडी के पीछे से बाण छोड़ता है। यह योजना भीष्म की अपनी प्रतिज्ञा और अम्बा के इतिहास का उपयोग करके पांडवों को आवश्यक अवसर देती है।'],
['भीष्म का शर-शय्या पर गिरना','अर्जुन के बाण भीष्म को बेध देते हैं, यहाँ तक कि वे रथ से गिर पड़ते हैं, पर बाण उन्हें भूमि से ऊपर थामे रखते हैं। सेनाएँ पितामह के सामने ठहर जाती हैं। भीष्म अभी मृत्यु नहीं चुनते, शुभ काल की प्रतीक्षा करते हैं। वे शर-शय्या पर लेटे हैं और अपने पास आने वालों का मार्गदर्शन करने लगते हैं।'],
['भीष्म का अर्जुन से तकिया और जल माँगना','भीष्म अपनी शर-शय्या के योग्य तकिया माँगते हैं। अर्जुन उनके सिर के नीचे तीन बाण लगा देता है। जब भीष्म जल माँगते हैं, तो अर्जुन पृथ्वी पर एक और बाण मारता है और जल की धारा उनके मुख तक उठ आती है। यह दृश्य दोनों योद्धाओं के विरोधी पक्षों में लड़ने पर भी उनके बीच के बंधन का सम्मान करता है।'],
['द्रोण का कौरव सेना का सेनापति बनना','भीष्म के गिरने के बाद दुर्योधन द्रोण को सेनापति बनाता है। द्रोण युधिष्ठिर को बंदी बनाने का वचन देते हैं, इस आशा में कि पांडवों को एक और हार झेलनी पड़े। अर्जुन सतर्क रहकर इस योजना को सफल नहीं होने देता। नए सेनापति की रणनीति युद्ध को बदल देती है, पर पांडव अपने विरोधियों को पहले से बेहतर जानते हैं।'],
['चक्रव्यूह की रचना','द्रोण कौरव सेना को चक्रव्यूह नामक गहरी, घूमती हुई रचना में व्यवस्थित करते हैं। उसमें प्रवेश कठिन है और बाहर निकलना और भी कठिन। पांडव शिविर ऐसे योद्धा की खोज करता है जो इसे भेद सके। अभिमन्यु इस व्यूह में प्रवेश करना जानता है, पर उसे बाहर निकलने की विधि नहीं सिखाई गई।'],
['अभिमन्यु का चक्रव्यूह में प्रवेश','अभिमन्यु चक्रव्यूह में प्रवेश करने का बीड़ा उठाता है, इस भरोसे पर कि पांडव उसके पीछे आएँगे। वह बाहरी पंक्तियाँ तोड़कर भीतर लड़ता हुआ बढ़ता है। जयद्रथ अन्य पांडवों को रोक देता है और अभिमन्यु अकेला रह जाता है। वरिष्ठ योद्धाओं से घिरा वह युवा राजकुमार अद्भुत साहस से लड़ता रहता है।'],
['अभिमन्यु का अंतिम युद्ध','अभिमन्यु का धनुष टूट जाता है, रथ नष्ट हो जाता है और शस्त्र खो जाते हैं, फिर भी वह रथ-चक्र और गदा से लड़ता रहता है। कई कौरव योद्धा द्वंद्व के सामान्य नियमों के विरुद्ध एक साथ उस पर आक्रमण करते हैं। वे उसे व्यूह के भीतर मार डालते हैं। उसकी मृत्यु पांडव शिविर में शोक और क्रोध भर देती है।'],
['अर्जुन की जयद्रथ-वध की प्रतिज्ञा','जब अर्जुन को पता चलता है कि जयद्रथ ने पांडवों को अभिमन्यु तक पहुँचने से रोका था, तो वह प्रतिज्ञा करता है कि अगले दिन सूर्यास्त से पहले उसे मार देगा। विफल होने पर वह अग्नि में प्रवेश करेगा। कृष्ण यह चुनौती स्वीकार करते हैं और शत्रु की सुरक्षित पंक्तियों के बीच अर्जुन का मार्गदर्शन करने की तैयारी करते हैं।'],
['कृष्ण का कौरव पंक्तियों के बीच अर्जुन को मार्ग दिखाना','कौरव सेना अर्जुन और जयद्रथ के बीच योद्धाओं की परत-दर-परत पंक्तियाँ खड़ी कर देती है। कृष्ण रथ को व्यूहों के बीच से निकालते हैं और अर्जुन मार्ग रोकने वालों को हराता जाता है। सूर्य नीचे ढलता है और प्रतिज्ञा का दबाव बढ़ता है। सारथी के रूप में कृष्ण का कौशल अर्जुन के धनुष जितना ही महत्त्वपूर्ण सिद्ध होता है।'],
['सूर्यास्त से पहले जयद्रथ का पतन','सूर्यास्त निकट आने पर कृष्ण भ्रम का ऐसा क्षण रचते हैं कि कौरव समझ लेते हैं कि दिन समाप्त हो गया। जयद्रथ आगे आता है और प्रकाश लौट आता है। अर्जुन बाण छोड़कर उसे मार देता है और अपनी प्रतिज्ञा पूरी करता है। पांडव शिविर उत्सव मनाता है, जबकि कौरव युद्ध के एक और मोड़ पर शोक करते हैं।'],
['रात्रि-युद्ध और घटोत्कच का आक्रमण','अँधेरे के बाद भी युद्ध चलता रहता है, जब घटोत्कच की शक्तियाँ और बढ़ जाती हैं। वह भयावह मायाओं और बल से कौरव सेना पर टूट पड़ता है। दुर्योधन कर्ण से उसे रोकने की विनती करता है। कर्ण अर्जुन के लिए बचाया दिव्य अस्त्र चला देता है; घटोत्कच मारा जाता है, पर कर्ण अपना सबसे शक्तिशाली लाभ खो बैठता है।'],
['कर्ण का घटोत्कच पर दिव्यास्त्र चलाना','कर्ण इंद्र की वह शक्ति घटोत्कच पर चलाता है, जो अर्जुन के लिए रखी गई एक बार प्रयोग होने वाली शक्ति थी। विशाल योद्धा गिरता है, पर उसका शरीर अनेक कौरव सैनिकों को कुचल देता है। कृष्ण इस बात से आश्वस्त होते हैं कि अब अर्जुन उस अस्त्र का लक्ष्य नहीं रहा। पांडव घटोत्कच का शोक करते हैं, पर कर्ण को हुई रणनीतिक हानि भी पहचानते हैं।'],
['द्रोण का विनाशकारी अभियान','द्रोण पांडव पंक्तियों को तहस-नहस करते रहते हैं और युधिष्ठिर को खोजते हैं। पांडव उनके कौशल और संकल्प को रोकने में कठिनाई पाते हैं। दोनों ओर योद्धा गिरते हैं, और युद्ध के नियमों का पालन और कठिन हो जाता है। युधिष्ठिर को बंदी बनाना द्रोण का लक्ष्य बना रहता है, जबकि पांडव उन्हें रोकने का उपाय खोजते हैं।'],
['अश्वत्थामा का नाम निर्णायक मोड़ बना','कृष्ण पांडवों को सुझाते हैं कि द्रोण को विश्वास दिलाया जाए कि उनका पुत्र अश्वत्थामा मारा गया है। भीम अश्वत्थामा नाम के एक हाथी को मार देते हैं और यह समाचार घोषित करते हैं। द्रोण सत्यनिष्ठ युधिष्ठिर से इसकी पुष्टि माँगते हैं। युधिष्ठिर का सावधानी से शर्तों में बँधा उत्तर द्रोण को टूटा हुआ और असमंजस में छोड़ देता है।'],
['द्रोण का शस्त्र त्यागना','अश्वत्थामा के मारे जाने की बात सुनकर द्रोण शोक में बैठ जाते हैं और लड़ना बंद कर देते हैं। धृष्टद्युम्न आगे बढ़कर उन्हें मार देता है, उस नियति को पूरा करते हुए जिसके लिए उसका जन्म हुआ था। पांडव एक बड़ी लड़ाई जीतते हैं, पर द्रोण की मृत्यु के साधन सत्य और कर्तव्य पर एक कठिन प्रश्न छोड़ जाते हैं।'],
['नारायणास्त्र और पांडवों की प्रतिक्रिया','अश्वत्थामा द्रोण का प्रतिशोध लेने के लिए पांडव सेना पर नारायणास्त्र छोड़ता है। कृष्ण योद्धाओं से शस्त्र रख देने और कोई प्रतिरोध न करने को कहते हैं; जो उससे नहीं लड़ते, उन पर अस्त्र की शक्ति घट जाती है। भीम पहले मना करते हैं, पर अन्य उन्हें मानने के लिए मना लेते हैं। सेना संयम से बच जाती है।'],
['कर्ण का सेनापति बनना','द्रोण की मृत्यु के बाद कर्ण कौरव सेना का सेनापति बनता है। वह अर्जुन को हराने और दुर्योधन की विजय सुनिश्चित करने को उत्सुक है। शल्य उसके सारथी बनते हैं, यद्यपि वे अक्सर कर्ण के आत्मविश्वास को चुनौती देते हैं। दोनों भिन्न निष्ठाएँ लिए, पर यह साझा जानकारी लेकर युद्ध में जाते हैं कि निर्णायक द्वंद्व निकट है।'],
['कर्ण और शल्य का युद्ध की ओर जाना','शल्य कर्ण का रथ हाँकते हैं, पर कर्ण की शक्ति पर अपनी शंकाएँ छिपाते नहीं। उनके संवाद योद्धा और सारथी के बीच तनाव प्रकट करते हैं। कर्ण दावा करता है कि वह अर्जुन को हरा सकता है; शल्य अर्जुन की प्रशंसा से उत्तर देते हैं। युद्ध की ओर उनकी यात्रा अभिमान और आत्मविश्वास की होड़ बन जाती है।'],
['भीम द्वारा दुःशासन के विरुद्ध प्रतिज्ञा पूरी करना','भीम रणभूमि में दुःशासन को खोजकर उसे हराते हैं और द्रौपदी के अपमान के बाद ली गई प्रतिज्ञा पूरी करते हैं। यह प्रसंग भीषण और विचलित करने वाला है, जो दिखाता है कि पुराना अपमान युद्ध की हिंसा का हिस्सा बन चुका है। भीम पांडवों के पास लौटते हैं, और द्रौपदी की न्याय की प्रतिज्ञा पूर्ति के और निकट आ जाती है।'],
['अर्जुन द्वारा कर्ण के पुत्र वृषसेन की पराजय','कर्ण का पुत्र वृषसेन पांडवों से लड़ता है और नकुल को घायल करता है। अर्जुन खतरा देखकर उसे चुनौती देता है, कर्ण की वंश-रेखा को युद्ध में रोकने की अपनी प्रतिज्ञा याद करते हुए। वह कर्ण का सामना करने से पहले वृषसेन को हरा देता है। कर्ण पुत्र का पतन देखता है और शोक तथा क्रोध से अर्जुन की ओर मुड़ता है।'],
['कर्ण और अर्जुन का आमना-सामना','कर्ण और अर्जुन उस महान द्वंद्व में मिलते हैं जिसकी दोनों को प्रतीक्षा थी। रणभूमि के आर-पार उनके बाण एक-दूसरे को उत्तर देते हैं, जबकि कृष्ण और शल्य उनके रथ चलाते हैं। यह होड़ वर्षों की प्रतिद्वंद्विता, छिपे पारिवारिक संबंधों और विरोधी निष्ठाओं को एक साथ ले आती है। हर योद्धा अपने बराबरी के शत्रु में अवसर खोजता है।'],
['कर्ण के रथ का पहिया धँसना','द्वंद्व के बीच कर्ण के रथ का पहिया धरती में धँस जाता है। वह युद्ध-नियमों की दुहाई देकर अर्जुन से रुकने को कहता है ताकि वह पहिया उठा सके। कृष्ण अर्जुन को द्रौपदी और अभिमन्यु के साथ हुए अन्यायों की याद दिलाते हैं। यह क्षण योद्धाओं को स्वीकार करने पर विवश करता है कि युद्ध अपने ही नियम पहले ही तोड़ चुका है।'],
['कर्ण का पतन','जब कर्ण अपने रथ से जूझ रहा होता है, अर्जुन घातक बाण छोड़ता है। कर्ण गिरता है और कौरव सेना अपने सबसे बलवान शेष वीर को खो देती है। पांडव बाद में जानते हैं कि वह उनका ज्येष्ठ भाई था। उसकी मृत्यु युद्ध की सबसे गहरी त्रासदियों में से एक बन जाती है, जो निष्ठा, गोपनीयता और रणभूमि से बहुत पहले लिए गए निर्णयों से आकार लेती है।'],
['अंतिम दिन शल्य का कौरव सेना का नेतृत्व','कर्ण के मारे जाने पर शल्य अंतिम दिन के युद्ध के सेनापति बनते हैं। कौरव सेना बहुत कमजोर हो चुकी है, पर दुर्योधन आत्मसमर्पण से इनकार करता है। दोनों पक्ष थकान की ओर बढ़ते हैं और योद्धा हताश टक्करों में भिड़ते हैं। युद्ध का अंत निकट है, यद्यपि कई व्यक्तिगत प्रतिज्ञाएँ अभी अधूरी हैं।'],
['युधिष्ठिर और शल्य का युद्ध','संयम के लिए प्रसिद्ध युधिष्ठिर रणभूमि में शल्य का सामना करते हैं। शल्य भीषण युद्ध करते हैं, पर युधिष्ठिर स्वयं को स्थिर रखकर उन्हें मार गिराते हैं। कौरव अपना अंतिम सेनापति खो देते हैं। यह विजय दिखाती है कि कर्तव्य के आह्वान पर युधिष्ठिर निर्णायक रूप से कर्म कर सकते हैं, चाहे वे युद्ध की इच्छा न रखते हों।'],
['सहदेव का शकुनि के विरुद्ध प्रतिज्ञा पूरी करना','सहदेव उस शकुनि का पीछा करता है, जिसने उस द्यूत-क्रीड़ा की रचना की जिसने पांडवों को बर्बाद किया। वह उसका सामना करके उसे मार डालता है और वनवास में ली गई प्रतिज्ञा पूरी करता है। शकुनि के जाने से कौरवों के छल का रणनीतिकार गिर जाता है, और भाइयों के पुराने वचन लगभग पूरे हो जाते हैं।'],
['दुर्योधन का सरोवर में छिपना','सेना ढहने पर दुर्योधन रणभूमि छोड़कर जल पर अपनी सिद्धि के सहारे एक सरोवर के नीचे छिप जाता है। पांडव उसे खोजते हैं। मिलने पर युधिष्ठिर उसे चुनौती देते हैं कि वह किसी एक प्रतिद्वंद्वी को चुने। दुर्योधन भीम को चुनता है, और चचेरे भाइयों के बीच अंतिम द्वंद्व की भूमिका बन जाती है।'],
['पांडवों को दुर्योधन का छिपने का स्थान मिलना','पांडव जान लेते हैं कि दुर्योधन सरोवर में छिपा है और उसे पुकारते हैं। वे तर्क देते हैं कि राजा अपनी सेना को छोड़कर युद्ध के बीतने की प्रतीक्षा नहीं कर सकता। दुर्योधन उठ खड़ा होता है, अभिमान में आहत पर लड़ने को तैयार। संघर्ष सेनाओं से सिमटकर दो योद्धाओं और उनके साझा इतिहास तक आ जाता है।'],
['गदा-युद्ध देखने बलराम का लौटना','बलराम तीर्थयात्रा से लौटते हैं और जानते हैं कि भीम और दुर्योधन गदा से लड़ने वाले हैं। वे दोनों को शिष्य के रूप में जानते हैं और युद्ध देखने पर अड़ जाते हैं। उनका द्वंद्व उन्हीं नियमों पर चलता है जो उन्होंने सिखाए थे, जबकि पांडव चिंता से परिणाम की प्रतीक्षा करते हैं।'],
['भीम और दुर्योधन का गदा-युद्ध','भीम और दुर्योधन चक्कर काटते हुए अपनी भारी गदाओं से प्रहार करते हैं। दुर्योधन का कौशल उसे बढ़त देता है, जबकि भीम बल और अपनी प्रतिज्ञा का सहारा लेते हैं। कृष्ण भीम को दुर्योधन की जाँघ तोड़ने की प्रतिज्ञा याद दिलाते हैं। भीम कमर के नीचे प्रहार करते हैं, जिससे द्वंद्व तो समाप्त होता है, पर उसके औपचारिक नियम टूट जाते हैं।'],
['दुर्योधन का पतन और युद्ध का अंत','दुर्योधन टूटी जाँघ के साथ गिर पड़ता है और युद्ध का मुख्य संघर्ष समाप्त हो जाता है। बलराम भीम के अनुचित प्रहार की निंदा करते हैं, जबकि कृष्ण दुर्योधन के पुराने अपराधों को याद दिलाकर उस कार्य का बचाव करते हैं। पांडवों ने राज्य जीत लिया है, पर विजय पर शोक और अपनाई गई विधियों की कीमत की छाया है।'],
['सोते पक्षियों के बीच उल्लू को देखता अश्वत्थामा','युद्ध के बाद अश्वत्थामा एक उल्लू को सोते कौओं पर आक्रमण करते देखता है। उसे दिखता है कि विश्राम करते हुए बलवान शत्रु को भी रात्रि-आक्रमण से नष्ट किया जा सकता है। यह दृश्य उसे अँधेरे में पांडव शिविर पर प्रहार की योजना देता है, रात को प्रतिशोध के अंतिम कृत्य में बदलते हुए।'],
['अश्वत्थामा की रात्रि-आक्रमण की योजना','अश्वत्थामा कृपाचार्य और कृतवर्मा से सोते पांडव शिविर पर आक्रमण में साथ देने को कहता है। वे उसे अपयश की चेतावनी देते हैं, पर वह द्रोण और दुर्योधन के शोक से प्रेरित है। वह रात में शिविर के निकट पहुँचता है, इस संकल्प से कि जीवित योद्धाओं को उठने से पहले ही मार डालेगा।'],
['पांडव शिविर में नरसंहार','अश्वत्थामा शिविर में घुसकर धृष्टद्युम्न, शिखंडी और अनेक सोते योद्धाओं को मार देता है। वह द्रौपदी के पाँचों पुत्रों को भी मार डालता है, सोते शिविर को स्वयं पांडव समझकर। कृपाचार्य और कृतवर्मा निकास-द्वारों की रक्षा करते हैं। भोर तक पांडवों की विजय एक और शोक-दृश्य बन चुकी होती है।'],
['द्रौपदी को पुत्रों की मृत्यु का समाचार','द्रौपदी को पता चलता है कि उसके पुत्र सोते हुए मारे गए हैं। शोक उसे अभिभूत कर देता है, और वह पांडवों से अश्वत्थामा को दंड दिलाने को कहती है। भीम उसका पीछा करने निकलते हैं, और युधिष्ठिर तथा अर्जुन उनके पीछे जाते हैं। द्रौपदी की माँग उत्तरदायित्व तय करना चाहती है, यद्यपि वह खोए प्राण नहीं लौटा सकती।'],
['अश्वत्थामा और अर्जुन द्वारा ब्रह्मशिर अस्त्र का प्रयोग','जब अर्जुन अश्वत्थामा को पकड़ लेता है, तो दोनों योद्धा विनाशकारी ब्रह्मशिर अस्त्र चला देते हैं। ऋषि संसार के विनाश को रोकने के लिए हस्तक्षेप करते हैं। अर्जुन अपना अस्त्र वापस ले लेता है, पर अश्वत्थामा ऐसा पूरी तरह नहीं कर पाता और उसे उत्तरा के गर्भ में पल रहे शिशु की ओर मोड़ देता है। कृष्ण शिशु परीक्षित की रक्षा करते हैं।'],
['अश्वत्थामा से मणि का छीना जाना','अश्वत्थामा को अपने मस्तक की मणि देने को विवश किया जाता है और शाप मिलता है कि वह दुख में भटकेगा। द्रौपदी मणि को न्याय हो जाने के चिह्न के रूप में स्वीकार करती है, यद्यपि उसके पुत्र मृत ही रहते हैं। जीवित बचे लोग शिविर लौटते हैं, युद्ध के बाद की नाज़ुक शांति में प्रतिशोध की कीमत साथ लिए।'],
['रणभूमि में स्त्रियों का आना','कुरु परिवारों की स्त्रियाँ कुरुक्षेत्र आती हैं और मैदान में बिखरे मृतकों को देखती हैं। वे गिरे हुओं में अपने पतियों, पुत्रों और भाइयों को खोजती हैं। उनका विलाप वह कीमत प्रकट करता है जो योद्धा लड़ते समय नहीं देख सके। रणभूमि विजय के स्थान के बजाय शोक का स्थान बन जाती है।'],
['गांधारी का मृतकों के बीच चलना','गांधारी अपने पुत्रों और उनके साथ मारे गए योद्धाओं के शवों के बीच चलती है। उसका शोक अपार है, फिर भी वह गरिमा से बोलती है। वह कृष्ण और पांडवों का सामना करती है और पूछती है कि इतना विनाश होने कैसे दिया गया। उसके शब्द युद्ध से पीछे छूटे परिवारों को स्वर देते हैं।'],
['कुंती का पांडवों को कर्ण का जन्म बताना','युद्ध के बाद कुंती अपने पुत्रों को बताती है कि कर्ण उसका ज्येष्ठ पुत्र था। पांडव समझ जाते हैं कि जिस शत्रु से वे लड़े और जिसे उन्होंने मारा, वह उनका बड़ा भाई था। युधिष्ठिर इस रहस्य पर शोक और क्रोध से भर जाते हैं। यह रहस्योद्घाटन कर्ण की निष्ठा और भाइयों की विजय का अर्थ बदल देता है।'],
['परिवारों द्वारा अंतिम संस्कार','पांडव और स्त्रियाँ दोनों सेनाओं के मृतकों के अंतिम संस्कार करते हैं। जो योद्धा जीवन में शत्रु थे, उन्हें मृतकों के योग्य विधियाँ मिलती हैं। ये संस्कार परिवारों को शोक में एक साथ लाते हैं और युद्ध के बाद जीने का कठिन कार्य आरंभ करते हैं।'],
['गांधारी का कृष्ण को शाप','गांधारी कृष्ण से कहती है कि वे युद्ध रोक सकते थे, पर उन्होंने यादवों और कुरुओं को एक-दूसरे का नाश करने दिया। शोक में वह यादव वंश को वैसे ही अंत का शाप देती है। कृष्ण बिना विरोध उसके शब्द स्वीकार करते हैं, यह जानते हुए कि उनके अपने लोगों का भाग्य निकट आ रहा है।'],
['विजय की कीमत पर युधिष्ठिर का शोक','युधिष्ठिर देखते हैं कि राज्य असंख्य प्राणों की कीमत पर जीता गया है और उत्सव मनाने से मना कर देते हैं। वे मानते हैं कि सिंहासन संबंधियों और गुरुओं की मृत्यु से कलंकित है। कृष्ण और ऋषि उन्हें भीष्म के पास ले जाते हैं, जो शर-शय्या पर लेटे हैं और अब भी मार्गदर्शन दे सकते हैं।'],
['भीष्म द्वारा राजा के कर्तव्यों की व्याख्या','भीष्म युधिष्ठिर को सिखाते हैं कि राजा को प्रजा की रक्षा करनी चाहिए, न्याय का पालन करना चाहिए और निजी इच्छाओं पर संयम रखना चाहिए। वे समझाते हैं कि शासक के निर्णय पूरे राज्य को प्रभावित करते हैं। युधिष्ठिर सुनते हैं और सीखते हैं कि राजपद पुरस्कार नहीं, दूसरों की ओर से निभाया जाने वाला उत्तरदायित्व है।'],
['शासक राज्य की रक्षा कैसे करे','भीष्म बताते हैं कि शासक को सलाहकार कैसे नियुक्त करने चाहिए, कर निष्पक्षता से कैसे लेने चाहिए और निर्बलों की रक्षा कैसे करनी चाहिए। राजा को निर्णय से पहले सुनना चाहिए और क्रूरता तथा दुर्बलता दोनों से बचना चाहिए। इन शिक्षाओं से युधिष्ठिर देखने लगते हैं कि क्षतिग्रस्त राज्य को सावधानी से कैसे चलाया जा सकता है।'],
['संकट काल में राजा का कर्तव्य','भीष्म समझाते हैं कि कठिन समय लोगों को अपूर्ण मार्गों में से चुनने को विवश कर सकता है। शासक को जीवन की रक्षा करनी चाहिए और व्यवस्था की संभावना बचाए रखनी चाहिए, चाहे सामान्य नियमों का ठीक-ठीक पालन न हो सके। संकट में कर्तव्य कठिन हो जाने पर युधिष्ठिर परिणामों और करुणा को तौलना सीखते हैं।'],
['राजा पृथु की कथा','भीष्म सुनाते हैं कि जब पृथ्वी अपनी उपज रोक लेती है तो लोग कष्ट पाते हैं। राजा पृथु गाय का रूप धरी पृथ्वी का पीछा करते हैं और उसे संसार का पोषण करने को मना लेते हैं। वे आदर्श शासक बनते हैं, जो अपनी प्रजा के लिए अन्न और कल्याण सुनिश्चित करने का प्रयत्न करते हैं।'],
['जनक और सुलभा का संवाद','विदुषी सुलभा राजा जनक के पास जाकर उनके आंतरिक स्वतंत्रता के दावे की परीक्षा लेती है। वे विवाद करते हैं कि क्या शासक सत्ता रखते हुए अनासक्त रह सकता है। उनका संवाद संन्यास के सरल विचारों को चुनौती देता है और दिखाता है कि ज्ञान मन की स्वतंत्रता पर निर्भर है, केवल बाहरी रूप पर नहीं।'],
['व्यापारी तुलाधार द्वारा तपस्वी जाजलि को शिक्षा','तपस्वी जाजलि मानता है कि उसकी कठोर तपस्या उसे ज्ञानी बनाती है। दिव्य वाणी उसे व्यापारी तुलाधार के पास भेजती है, जो ईमानदारी, संयम और अहिंसा पर आधारित धर्म समझाता है। जाजलि सीखता है कि दैनिक आचरण और दूसरों की देखभाल से वन की तपस्या जितना गहरा ज्ञान प्रकट हो सकता है।'],
['कर्म और संन्यास के मार्ग','भीष्म कर्म, ज्ञान और जन्म-मरण के चक्र से मुक्ति पर प्रश्नों के उत्तर देते हैं। वे समझाते हैं कि लोग अपने स्वभाव और समझ के अनुसार अलग-अलग मार्ग अपनाते हैं। युधिष्ठिर सुनते हैं कि अनुशासन और अंतर्दृष्टि सामान्य कर्तव्यों को मुक्ति की ओर सोपान बना सकते हैं।'],
['भीष्म का मोक्ष-मार्ग का उपदेश','भीष्म आत्म-संयम, ज्ञान और आसक्ति से मुक्ति के द्वारा मोक्ष की खोज का वर्णन करते हैं। वे ऋषियों और राजाओं की कथाएँ सुनाते हैं, जिन्होंने भिन्न-भिन्न ढंग से सत्य की खोज की। युधिष्ठिर सुनकर देखते हैं कि राज्य का शासन और स्वयं पर विजय अलग कार्य हैं, जिनमें दोनों को अनुशासन चाहिए।'],
['विवेकी ब्राह्मण और उसकी पत्नी की कथा','एक ब्राह्मण और उसकी पत्नी आत्मा के स्वरूप, कामना और शोक से परे जाने के मार्ग पर बात करते हैं। उनका संवाद पूछता है कि ज्ञान सांसारिक भूमिकाओं से आता है या उससे जो भीतर शाश्वत है। भीष्म उनके संवाद से दिखाते हैं कि चिंतन और साझा परामर्श आध्यात्मिक समझ की ओर ले जा सकते हैं।'],
['संकट काल में शासक के कर्तव्य','भीष्म युधिष्ठिर को अकाल, आक्रमण और आंतरिक अव्यवस्था के विषय में सलाह देते हैं। संकट में शासक को शीघ्रता से कार्य करना चाहिए और प्रजा को अनावश्यक हानि से बचाना चाहिए। यह शिक्षा व्यावहारिक अस्तित्व और न्याय में संतुलन बनाती है, यह दिखाते हुए कि राज्य पर संकट होने पर राजा का कर्तव्य विशेष रूप से कठिन हो जाता है।'],
['युधिष्ठिर का राजमुकुट का भार स्वीकारना','भीष्म की शिक्षाएँ सुनकर युधिष्ठिर यह स्वीकारने लगते हैं कि शासन प्रजा की सेवा कर सकता है, भले वह अतीत को न बदल सके। वे मुकुट धारण करने हस्तिनापुर लौटते हैं। उनका शोक बना रहता है, पर वे उन उत्तरदायित्वों के साथ शासन करने को तैयार हैं जो भीष्म ने उन्हें सिखाए।'],
['भीष्म की कर्तव्य और आचरण पर शिक्षाएँ','भीष्म युधिष्ठिर को जीवन की विभिन्न अवस्थाओं में लोगों के कर्तव्य सिखाते रहते हैं। वे सत्यनिष्ठा, संयम, सम्मान और उत्तरदायित्व की बात करते हैं। शिक्षाएँ आध्यात्मिक होने के साथ व्यावहारिक भी हैं, जो राजा को मार्ग दिखाती हैं कि राज्य भर में नैतिक आचरण को कैसे प्रोत्साहित किया जाए।'],
['दान देने और लेने के कर्तव्य','भीष्म समझाते हैं कि दान सावधानी से, योग्य पात्र को और बिना अभिमान के दिया जाना चाहिए। दाता का भाव उतना ही महत्त्वपूर्ण है जितनी दी गई वस्तु। उदारता विद्या का सहारा बन सकती है और कष्ट दूर कर सकती है, पर वह प्रशंसा पाने या दूसरों को नियंत्रित करने का साधन नहीं बननी चाहिए।'],
['करुणा और अहिंसा की शक्ति','युधिष्ठिर पूछते हैं कि जिस संसार में कभी-कभी बल का प्रयोग होता है, वहाँ करुणा शासक का मार्गदर्शन कैसे कर सकती है। भीष्म संयम और प्राणियों की देखभाल की प्रशंसा करते हैं, साथ ही रक्षा के कर्तव्य को भी स्वीकारते हैं। यह शिक्षा नेताओं से कहती है कि शक्ति का प्रयोग सावधानी से करें और जब कोई और मार्ग हो, तब हानि से बचें।'],
['गृहस्थ जीवन के कर्तव्य','भीष्म पारिवारिक जीवन के उत्तरदायित्व बताते हैं: आतिथ्य, बड़ों की सेवा, सत्यनिष्ठा और उदारता। जब घर के सदस्य न्याय और अनुशासन से व्यवहार करते हैं, तो गृहस्थी व्यापक समाज का आधार बन सकती है। उनकी सलाह दैनिक दायित्वों को आध्यात्मिक जीवन में बाधा नहीं, बल्कि सेवा के अर्थपूर्ण रूप मानती है।'],
['उमा और महेश्वर की कथा','भीष्म उमा और महेश्वर से जुड़ा संवाद सुनाते हैं, जिसमें कर्तव्य, भक्ति और सृष्टि-व्यवस्था के प्रश्नों की खोज होती है। यह संवाद दिव्य विभूतियों के आदान-प्रदान से आध्यात्मिक ज्ञान प्रस्तुत करता है। यह प्रसंग पर्व की शिक्षाओं को राजशासन से आगे दिव्य शक्ति और संसार के संबंध तक विस्तार देता है।'],
['विष्णु सहस्रनाम','भीष्म युधिष्ठिर को एक हज़ार नामों से विष्णु की स्तुति करने वाला स्तोत्र सुनाते हैं। प्रत्येक नाम दिव्य के किसी गुण या पक्ष की ओर संकेत करता है। यह पाठ भक्ति और शरण का कर्म बन जाता है, और महाभारत से जुड़े सबसे प्रसिद्ध भक्ति-प्रसंगों में से एक बना रहता है।'],
['दान और सत्य की महिमा','भीष्म सत्य और उदार कर्म के स्थायी मूल्य का वर्णन करते हैं। वे युधिष्ठिर से कहते हैं कि दान सम्मान के साथ और फल की आशा के बिना दिया जाना चाहिए। ये गुण लोगों में विश्वास बनाते हैं और संघर्ष से उबरते राज्य को नैतिक बल देते हैं।'],
['युधिष्ठिर का भीष्म से विदा लेना','निर्धारित काल आता है, और युधिष्ठिर पांडवों तथा ऋषियों के साथ भीष्म के पास लौटते हैं। भीष्म अपनी शिक्षाएँ पूरी कर चुके हैं और देह त्यागने की तैयारी करते हैं। परिवार पितामह के चारों ओर एकत्र होकर उस योद्धा का सम्मान करता है जिसके जीवन ने कुरु वंश को आकार दिया।'],
['भीष्म का अंतिम प्रस्थान','भीष्म अपने चुने हुए समय पर प्राण खींच लेते हैं और उन लोगों के बीच देह त्यागते हैं जिन्हें वे प्रेम करते और सिखाते थे। पांडव उनका शोक मनाते हैं, जबकि राज्य अपना सबसे वृद्ध मार्गदर्शक खो देता है। उनकी मृत्यु उस लंबे परामर्श-संवाद को पूर्ण करती है जो तब आरंभ हुआ था जब युधिष्ठिर सिंहासन स्वीकारने में संघर्ष कर रहे थे।'],
['युधिष्ठिर का अश्वमेध यज्ञ','युद्ध के बाद युधिष्ठिर राज्य की पुनर्स्थापना और अपनी संप्रभुता की पुष्टि के लिए अश्वमेध करते हैं। अभिमंत्रित घोड़े को भ्रमण के लिए छोड़ा जाता है, और अर्जुन उसके पीछे चलता है। शासक इस अनुष्ठान को स्वीकार कर सकते हैं या रक्षक-दल को चुनौती दे सकते हैं। यह यज्ञ कुरुक्षेत्र के विनाश के बाद राजनीतिक पुनर्निर्माण को अनुष्ठानिक कर्तव्य से जोड़ता है।'],
['यज्ञ के अश्व के पीछे अर्जुन','अर्जुन घोड़े के पीछे अनेक राज्यों से गुजरता है और उन शासकों से मिलता है जो या तो उसका स्वागत करते हैं या उसके अधिकार को चुनौती देते हैं। आवश्यकता पड़ने पर वह लड़ता है, पर अनावश्यक विनाश से बचने का प्रयास करता है। यह यात्रा युद्ध के बाद उसकी शक्ति की परीक्षा लेती है और पूर्व शत्रुओं को एक और महायुद्ध के बिना युधिष्ठिर का शासन स्वीकारने का अवसर देती है।'],
['राज्यों में अर्जुन का अभियान','जैसे-जैसे घोड़ा भटकता है, अर्जुन का सामना स्थानीय राजाओं और पुराने मित्रों से होता है। कुछ विरोध करते हैं, जबकि अन्य पांडवों का सम्मान करते हैं। हर भेंट विवेक की छोटी परीक्षा बनती है: अर्जुन को यज्ञ की रक्षा करनी है, यह याद रखते हुए कि राज्य को विजय से अधिक शांति चाहिए।'],
['अर्जुन और बभ्रुवाहन की भेंट','मणिपुर में अर्जुन की भेंट बभ्रुवाहन से होती है, जो चित्रांगदा से उसका पुत्र है। बभ्रुवाहन उसका स्वागत करता है, पर उलूपी युवा राजा को पिता से लड़ने को प्रेरित करती है। दोनों युद्ध करते हैं और बभ्रुवाहन अर्जुन को मार देता है। यह भेंट उस परिवार को सामने लाती है जिसे अर्जुन पीछे छोड़ आया था और अश्वमेध द्वारा थोपे गए कर्तव्यों को भी।'],
['उलूपी द्वारा अर्जुन का पुनर्जीवन','अर्जुन के गिरने के बाद उलूपी बताती है कि यह द्वंद्व भीष्म की मृत्यु और वसुओं के शाप से जुड़े प्रयोजन का भाग था। वह नागलोक से प्राणदायक मणि लाती है। अर्जुन जीवित हो उठता है और पिता-पुत्र में मेल हो जाता है। यह प्रसंग पीड़ादायक भेंट को पारिवारिक पुनर्मिलन में बदल देता है।'],
['कृष्ण द्वारा अनुगीता का उपदेश','अर्जुन कृष्ण से भगवद्गीता को दोहराने का अनुरोध करता है, पर कृष्ण समझाते हैं कि वे वही उपदेश उसी प्रकार दोहरा नहीं सकते। वे आत्मा, अनुशासन और मुक्ति पर एक अन्य संवाद सुनाते हैं, जिसे अनुगीता कहा जाता है। अर्जुन फिर शिष्य की तरह सुनता है और जानता है कि ज्ञान भिन्न रूप में भी लौट सकता है।'],
['उत्तंक का कृष्ण से प्रश्न','ऋषि उत्तंक युद्ध के बाद कृष्ण से मिलते हैं और पूछते हैं कि उन्होंने संघर्ष क्यों होने दिया। कृष्ण अपने शांति-प्रयास और उन निर्णयों की व्याख्या करते हैं जिनसे युद्ध हुआ। उत्तंक का क्रोध शांत होता है, और कृष्ण उन्हें वर देते हैं। यह भेंट दिखाती है कि ऋषि भी दिव्य कर्म की कीमत समझने में संघर्ष करते हैं।'],
['सुनहरा नेवला और सच्चे दान का अर्थ','अश्वमेध के बाद एक नेवला आता है, जिसका आधा शरीर सुनहरा है, और कहता है कि यह भव्य यज्ञ एक निर्धन ब्राह्मण परिवार की उदारता के बराबर नहीं। वह सुनाता है कि उस परिवार ने अपना अंतिम भोजन भूखे अतिथि को दे दिया था। कथा पूछती है कि दान का मूल्य उसके आकार में है या उसके पीछे के त्याग में।'],
['धृतराष्ट्र, गांधारी और कुंती का महल छोड़ना','युद्ध के वर्षों बाद धृतराष्ट्र और गांधारी राजमहल के जीवन से थककर वन चुनते हैं। कुंती अपने पुत्रों को छोड़कर उनके साथ जाने का निश्चय करती है। युधिष्ठिर व्यथित होते हैं, पर उनके निर्णय का सम्मान करते हैं। वृद्धजन विदुर और संजय के साथ चल पड़ते हैं, हानि और शासन के जीवन के बाद शांति की खोज में।'],
['विदुर का अंतिम त्याग','युधिष्ठिर वन के आश्रम जाते हैं और विदुर को तपस्वी के रूप में पाते हैं, जिन्होंने भोजन और वाणी त्याग दी है। भेंट होने पर विदुर की प्राण-शक्ति युधिष्ठिर में प्रवेश कर जाती है, और राजा समझ जाते हैं कि उनके चाचा मुक्ति पा चुके हैं। यह भेंट उन्हें शोक देती है, पर विदुर के अंत के प्रति शांति भी।'],
['युधिष्ठिर का वन-आश्रम जाना','युधिष्ठिर वन में धृतराष्ट्र, गांधारी और कुंती से मिलने लौटते हैं। वे उन्हें ऋषियों के साथ सादगी से रहते पाते हैं और महल लौटने का अनुरोध करते हैं। वे यह कहकर मना करते हैं कि उन्होंने तपस्या का जीवन चुना है। युधिष्ठिर उनका निर्णय स्वीकारते हैं और उनका आशीर्वाद पाते हैं।'],
