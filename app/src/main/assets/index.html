2px calc(10px + env(safe-area-inset-bottom));z-index:8;backdrop-filter:blur(12px)}.nav-btn{background:none;border:0;color:#8b7a6b;min-width:64px;display:grid;justify-items:center;gap:2px;font-size:11px}.nav-btn strong{font-size:21px;font-weight:500}.nav-btn.active{color:var(--rust);font-weight:800}.page-title{font:700 34px Georgia,serif;margin:0 0 6px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:99px;color:var(--muted)}.chip.active{background:var(--rust);border-color:var(--rust);color:white}.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline-color:var(--rust)}.library-list{display:grid;gap:10px}.library-item{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:left;width:100%;color:inherit}.library-icon{height:48px;width:48px;border-radius:13px;background:#f1e4cf;display:grid;place-items:center;color:var(--rust);font-size:23px;flex-shrink:0}.library-item .details{flex:1}.library-item h3{font:700 18px Georgia,serif;margin:0 0 3px}.library-item p{font-size:12px;color:var(--muted);margin:0}.chevron{font-size:23px;color:#aa8a70}.kanda{margin:24px 0}.kanda h3{font:700 21px Georgia,serif;margin:0 0 10px}.story-row{display:flex;align-items:center;gap:13px;padding:13px 15px;margin:8px 0;width:100%;text-align:left;color:inherit}.number{width:35px;height:35px;border-radius:10px;background:#f2e5d1;color:var(--rust);display:grid;place-items:center;font-weight:800;flex-shrink:0}.story-row .details{flex:1}.story-row h4{margin:0;font-size:15px}.story-row small{color:var(--muted)}.reader{max-width:760px;margin:auto;padding:clamp(20px,5vw,46px)}.reader .back{border:0;background:none;color:var(--rust);font-weight:700;padding:0;margin-bottom:25px}.reader h2{font:700 clamp(30px,5vw,44px)/1.12 Georgia,serif;margin:10px 0}.reader-meta{color:var(--muted);font-size:13px;margin-bottom:24px}.reader-body{font:18px/1.9 Georgia,serif;color:#4c3b2e}.source-note{padding:15px;border-radius:12px;background:#f3e8d5;color:#72563f;font-size:13px;margin:24px 0}.reader-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.empty-state{text-align:center;padding:40px 20px}.empty-state .big{font-size:44px}.empty-state h3{font:700 24px Georgia,serif;margin:12px 0}.notice{background:#f3e8d5;border:1px solid #e5d2b8;padding:28px;border-radius:20px;text-align:center;max-width:520px;margin:32px auto}.notice .symbol{font-size:42px}.notice h2{font:700 28px Georgia,serif;color:var(--rust);margin:12px 0}.notice p{color:#72563f}.settings-card{padding:18px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0}.settings-card label{display:flex;justify-content:space-between;align-items:center;gap:10px}.settings-card select{padding:8px;border-radius:8px;border:1px solid var(--line);background:white}.toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#38291f;color:white;padding:11px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow)}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:11px;padding:30px 10px 12px}

<script>
const scriptures=[

];
const covers={'Ramayana':['ramayana','50% 16%'],'Mahabharata':['mahabharata','50% 18%'],'Bhagavata Purana':['bhagavata-purana','50% 18%'],'Shiva Purana':['shiva-purana','50% 15%'],'Vishnu Purana':['vishnu-purana','50% 25%'],'Devi Bhagavata Purana':['devi-bhagavata-purana','50% 6%'],'Markandeya Purana':['markandeya-purana','50% 25%'],'Bhagavad Gita':['bhagavad-gita','50% 28%'],'The Upanishads':['upanishads','50% 31%'],'The Vedas':['vedas','50% 40%'],'Other Puranas':['other-puranas','50% 43%']};
function coverImg(name){const c=covers[name];return c?`<img class="cover-img" src="assets/images/${c[0]}.webp" alt="${esc(name)} cover illustration" style="object-position:${c[1]}" decoding="async">`:''}
const hiKanda={'Bala Kanda':'बाल कांड','Ayodhya Kanda':'अयोध्या कांड','Aranya Kanda':'अरण्य कांड','Kishkindha Kanda':'किष्किंधा कांड','Sundara Kanda':'सुंदर कांड','Yuddha Kanda':'युद्ध कांड'};
const hiScr={
'Ramayana':['रामायण','30 कथाएँ · अभी उपलब्ध','राम, सीता और उनके साथियों की यात्रा।'],
'Mahabharata':['महाभारत','महान भारतीय महाकाव्य','कुरु वंश का महान महाकाव्य।'],
'Bhagavata Purana':['भागवत पुराण','भक्तिपरक आख्यान','विष्णु और उनके अवतारों की कथाएँ, जिनमें कृष्ण भी सम्मिलित हैं।'],
'Shiva Purana':['शिव पुराण','शिव की कथाएँ','शिव और उनकी परंपराओं से जुड़े आख्यान।'],
'Vishnu Purana':['विष्णु पुराण','सृष्टि-विद्या और अवतार','सृष्टि-विद्या, वंश-परंपराएँ और विष्णु के कार्य।'],
'Devi Bhagavata Purana':['देवी भागवत पुराण','दिव्य देवी','देवी पर केंद्रित कथाएँ और उपदेश।'],
'Markandeya Purana':['मार्कंडेय पुराण','देवी महात्म्य सहित','देवी महात्म्य सहित एक पौराणिक संग्रह।'],
'Bhagavad Gita':['भगवद्गीता','ज्ञान और कर्तव्य','कर्तव्य, कर्म और ज्ञान पर अर्जुन को दिए गए कृष्ण के उपदेश।'],
'The Upanishads':['उपनिषद्','दर्शन और जिज्ञासा','आत्मा और परम सत्य की दार्शनिक खोज।'],
'The Vedas':['वेद','आधारभूत वैदिक ग्रंथ','चार आधारभूत वैदिक संहिताएँ।'],
'Other Puranas':['अन्य पुराण','और संग्रह प्रस्तावित','आगामी अद्यतनों में और पौराणिक परंपराएँ जानिए।']
};
const hiStories=[
['राम का जन्म','कोसल राज्य पर राजा दशरथ का शासन था, जिनका सबसे बड़ा दुख यह था कि उनकी कोई संतान नहीं थी। ऋषियों से मार्गदर्शन लेने के बाद एक पवित्र यज्ञ किया गया। पारंपरिक वर्णन के अनुसार एक दिव्य पुरुष ने रानियों के लिए अभिमंत्रित प्रसाद लाकर दिया। समय आने पर चार राजकुमारों का जन्म हुआ: राम, भरत, लक्ष्मण और शत्रुघ्न। राम का जीवन आगे चलकर भारत के सबसे चिरस्थायी महाकाव्यों में से एक का केंद्र बना।'],
['विश्वामित्र का अयोध्या आगमन','ऋषि विश्वामित्र सहायता माँगने राजा दशरथ के पास आए। शक्तिशाली राक्षस उनके पवित्र अनुष्ठानों में विघ्न डाल रहे थे, और उन्होंने राम को अपने साथ भेजने का अनुरोध किया। राजा हिचकिचाए, किंतु राजगुरु वशिष्ठ ने उन्हें ऋषि पर विश्वास करने की सलाह दी। इसके बाद राम और लक्ष्मण एक ऐसी यात्रा पर निकले जो उनके साहस की परीक्षा लेने वाली थी और उनकी शिक्षा को व्यापक संसार तक ले जाने वाली थी।'],
['राम और लक्ष्मण का विश्वामित्र के साथ प्रस्थान','राम और लक्ष्मण ने विश्वामित्र के मार्गदर्शन में अयोध्या के सुख-वैभव को छोड़ दिया। ऋषि ने उन्हें पवित्र ज्ञान सिखाया और आने वाली चुनौतियों के लिए तैयार किया। वन की उनकी यात्रा महलों में पले राजकुमारों के, अनुशासन, उत्तरदायित्व और दूसरों की रक्षा सीखने वाले युवाओं में बदलने का क्षण थी।'],
['अहल्या की कथा','यात्रा के दौरान राम उस आश्रम में पहुँचे जो अहल्या से जुड़ा है, जिनकी कथा रामायण की विभिन्न परंपराओं में अलग-अलग ढंग से कही गई है। वाल्मीकि के वर्णन में उनके दीर्घकालीन शाप से मुक्ति राम के आगमन से जुड़ी है। यह प्रसंग पाठक को कृपा की शक्ति, कर्मों के परिणामों और अहल्या की कथा की उन अनेक व्याख्याओं पर विचार करने के लिए आमंत्रित करता है जो बाद की परंपराओं ने की हैं।'],
['ताड़का वध','विश्वामित्र राजकुमारों को उस वन में ले गए जो ताड़का के आतंक से त्रस्त था। बल-प्रयोग के उत्तरदायित्व को लेकर राम असमंजस में थे, किंतु ऋषि ने उन्हें वह कर्तव्य समझाया जिसे वे राम के लिए आवश्यक मानते थे। राम ने ताड़का का सामना किया और उस क्षेत्र की रक्षा की। यह प्रसंग विवेक, साहस और शक्ति के साथ आने वाले कठिन उत्तरदायित्वों की एक आरंभिक परीक्षा प्रस्तुत करता है।'],
['राम ने तोड़ा शिव का धनुष','राजा जनक के दरबार में शिव से जुड़ा एक महान धनुष एकत्र हुए राजाओं के लिए परीक्षा के रूप में प्रस्तुत किया गया। राम ने उसे उठाया और प्रत्यंचा चढ़ाई, और धनुष भयंकर ध्वनि के साथ टूट गया। इस पराक्रम ने उनके असाधारण बल को प्रकट किया और उन विवाह-व्यवस्थाओं की ओर ले गया जो राम और सीता को एक सूत्र में बाँधने वाली थीं।'],
['राम और सीता का विवाह','जनक के दरबार में राम के पराक्रम के बाद राम और सीता का विवाह उनके भाइयों के विवाहों के साथ धूमधाम से संपन्न हुआ। इस संबंध ने दो राजवंशों को जोड़ा और ऐसी साझेदारी की शुरुआत की जिसे असाधारण परीक्षाओं का सामना करना था। यह विवाह उन घटनाओं से पहले के एक आनंदमय मोड़ के रूप में स्मरण किया जाता है जो कथा को राजमहल के जीवन से बहुत आगे ले जाती हैं।'],
['वह राज्याभिषेक जो नहीं हुआ','राजा दशरथ ने राम को अपना उत्तराधिकारी बनाकर राजगद्दी सौंपने का निश्चय किया। अयोध्या के लोगों ने इस विचार का स्वागत किया, क्योंकि वे राम को भावी राजा के योग्य मानते थे। परंतु महल के भीतर की घटनाओं ने इस योजना को डगमगा दिया। जो निर्णय निश्चित लग रहा था, वह राजपरिवार के जीवन और राज्य के भविष्य को बदलने वाला था।'],
['कैकेयी के दो वरदान','मंथरा के प्रभाव में आकर रानी कैकेयी को वे दो वरदान याद आए जो दशरथ ने कभी उन्हें देने का वचन दिया था। उन्होंने माँगा कि भरत को राजा बनाया जाए और राम को चौदह वर्ष का वनवास दिया जाए। अपने वचन से बँधे दशरथ टूट गए। यह प्रसंग वचन के भार और निजी इच्छा तथा सार्वजनिक कर्तव्य के टकराव को दर्शाता है।'],
['राम ने स्वीकारा वनवास','जब राम को कैकेयी की माँगों का पता चला, तो उन्होंने अपने पिता का वचन टूटने देने के बजाय वनवास स्वीकार कर लिया। उनके उत्तर ने कर्तव्य के प्रति उनकी निष्ठा को दर्शाया, यद्यपि इससे दशरथ और अयोध्या को गहरा शोक हुआ। व्यक्तिगत क्षति के सामने दृढ़ संकल्प के चित्रण में यह प्रसंग महाकाव्य के सबसे निर्णायक प्रसंगों में गिना जाता है।'],
['सीता और लक्ष्मण का राम के साथ जाना','सीता ने राम के साथ वनवास में जाने का आग्रह किया, और लक्ष्मण ने भी उनके साथ जाने का निश्चय किया। उनके निर्णय प्रेम, निष्ठा और साझा उत्तरदायित्व की भावना से प्रेरित थे। महल छोड़ने का अर्थ था सुख-सुविधा और पद का त्याग, परंतु तीनों ने राजसी विशेषाधिकार से कहीं अधिक दृढ़ बंधनों में बँधकर साथ-साथ वन-जीवन आरंभ किया।'],
['अयोध्या से प्रस्थान','राम, सीता और लक्ष्मण ने अयोध्या से प्रस्थान किया, और नगरवासी उनके जाने पर शोकाकुल थे। दशरथ का दुख गहराता गया, जबकि नगर अपने प्रिय राजकुमार के चले जाने को स्वीकार करने के लिए संघर्ष करता रहा। राजधानी से उनकी यह यात्रा लंबे वनवास का आरंभ है और कथा को राजगद्दी के उत्तराधिकार से वन-जीवन की ओर मोड़ देती है।'],
['भरत ने ठुकराया सिंहासन','भरत लौटे तो उन्हें पता चला कि राम को वनवास दे दिया गया है और उनका अपना राज्याभिषेक तय किया गया है। इन परिस्थितियों से मिले सिंहासन को उन्होंने अस्वीकार कर दिया और राम से लौट आने की प्रार्थना करने गए। जब राम ने अपने पिता के वचन का उल्लंघन करने से मना कर दिया, तो भरत राम की चरण-पादुकाएँ राज्य के प्रतीक के रूप में ले आए और अपने भाई के प्रतिनिधि बनकर शासन किया।'],
['वन में जीवन','राम, सीता और लक्ष्मण वनों में घूमे और आश्रमों में गए, जहाँ उन्होंने ऋषियों से भेंट की और वहाँ रहने वालों के सामने आने वाली कठिनाइयों को जाना। उनका वनवास सहनशीलता और मिलन-भेंट का काल बन गया। वन के इस परिवेश ने उन खतरों और संबंधों से भी परिचित कराया जो आगे चलकर सीता-हरण का कारण बने।'],
['शूर्पणखा से भेंट','शूर्पणखा राम से मिली और उसने उनके प्रति रुचि प्रकट की। जब वह सीता के पास गई और लक्ष्मण ने हस्तक्षेप किया, तो टकराव बढ़ गया। इस प्रसंग ने रावण और लंका की शक्तियों से जुड़ी प्रतिशोध की एक श्रृंखला आरंभ कर दी। बाद की कथाओं में विवरण भिन्न मिलते हैं, इसलिए यह जानना महत्त्वपूर्ण है कि किस मूल परंपरा का अनुसरण किया जा रहा है।'],
['खर और दूषण से युद्ध','शूर्पणखा के प्रसंग के बाद खर और दूषण सेनाएँ लेकर राम पर चढ़ आए। राम ने युद्ध किया और आक्रमणकारियों को पराजित किया। इस संघर्ष से वन की घटनाओं की सूचना रावण तक पहुँची, और राम को सीता से अलग करने की उसकी योजना की भूमिका तैयार हुई।'],
['स्वर्ण मृग','रावण ने मारीच को अपने साथ मिलाया, जो आश्रम के निकट एक सुंदर स्वर्ण मृग के रूप में प्रकट हुआ। सीता ने राम से उसे पकड़ लाने को कहा। राम मृग के पीछे गए, और मारीच के छल ने उन्हें कुटिया से दूर खींच लिया। इस क्षण ने रावण को वह अवसर दिया जिसकी उसे प्रतीक्षा थी, जब राम और लक्ष्मण दोनों वहाँ नहीं थे।'],
['सीता-हरण','राम के दूर होने और लक्ष्मण के भी आश्रम से हट जाने पर रावण वेश बदलकर सीता के पास आया और उनका हरण कर लिया। सीता ने प्रतिरोध किया और सहायता के लिए पुकारा, जबकि रावण उन्हें लंका की ओर ले जा रहा था। इस हरण ने राम के वनवास को हताश खोज में बदल दिया और शेष महाकाव्य को आगे बढ़ाने वाला केंद्रीय संघर्ष बन गया।'],
['जटायु का अंतिम युद्ध','गृध्रराज जटायु ने सीता को ले जाए जाते देखा और उन्हें बचाने के प्रयास में रावण से युद्ध किया। गंभीर रूप से घायल होने पर भी उन्होंने बाद में राम को सारा वृत्तांत सुनाया। जटायु के साहस और बलिदान ने राम को महत्त्वपूर्ण जानकारी दी और उन्हें निष्ठा तथा निःस्वार्थ कर्म का प्रतीक बना दिया।'],
['राम की हनुमान से भेंट','सीता की खोज करते हुए राम और लक्ष्मण की भेंट हनुमान से हुई, जो सुग्रीव की ओर से उनके पास आए थे। हनुमान ने उनकी उदात्तता को पहचाना और वे उनके विश्वसनीय सहयोगी बन गए। उनकी इस भेंट से महाकाव्य के सबसे महत्त्वपूर्ण संबंधों में से एक का आरंभ हुआ, जो सेवा, विश्वास और साझा उद्देश्य पर आधारित था।'],
['सुग्रीव से मित्रता','राम और सुग्रीव में मैत्री हुई: राम सुग्रीव को उनका पद वापस दिलाने में सहायता करेंगे, और सुग्रीव सीता की खोज के लिए अपने साथियों का उपयोग करेंगे। इस समझौते ने दो संघर्षों को जोड़ दिया और राम की खोज को एक व्यापक अभियान में बदल दिया। उनकी मित्रता से वह सेना जुटी जो लंका पहुँचने के लिए आवश्यक थी।'],
['बाली का वध','राम ने सुग्रीव और बाली के बीच के संघर्ष में हस्तक्षेप किया, जिसके परिणामस्वरूप बाली की मृत्यु हुई और सुग्रीव का पुनः राज्याभिषेक हुआ। इस प्रसंग ने राजधर्म, न्याय और हस्तक्षेप की नैतिकता पर लंबे समय से चर्चा को प्रेरित किया है। विभिन्न टीकाकार राम के कार्यों की अलग-अलग व्याख्या करते हैं, इसलिए यह एक सरल विजय-कथा के बजाय विचारपूर्वक पढ़े जाने योग्य कथा है।'],
['सीता की खोज','सुग्रीव ने अलग-अलग दिशाओं में खोज-दल भेजे। हनुमान सहित दक्षिणी दल को अंततः पता चला कि लंका समुद्र के पार है। उनकी खोज कठिन और अनिश्चित रही थी, पर नई जानकारी ने आगे का मार्ग खोल दिया और हनुमान को उनकी अद्भुत छलाँग के लिए तैयार किया।'],
['हनुमान की सागर-छलाँग','अपनी शक्ति को पहचानने के लिए प्रोत्साहित किए जाने पर हनुमान ने लंका की ओर समुद्र के ऊपर से छलाँग लगाई। मार्ग में उन्हें ऐसी बाधाओं का सामना करना पड़ा जिन्होंने उनके साहस, विवेक और दृढ़ संकल्प की परीक्षा ली। उनकी यह यात्रा सीता की खोज के निर्णायक मोड़ के रूप में और एक बड़े उद्देश्य की सेवा में अपनी क्षमताओं को पहचानने की कथा के रूप में मनाई जाती है।'],
['अशोक वाटिका में हनुमान को मिलीं सीता','लंका में खोज करने के बाद हनुमान ने अशोक वाटिका में सीता को पाया, जहाँ वे पहरे में और शोकाकुल थीं, किंतु अपने संकल्प पर अडिग थीं। वे सावधानी से उनके पास पहुँचे और इस बात के प्रमाण के रूप में कि वे उनके पति के पास से आए हैं, राम की अँगूठी भेंट की। उनकी इस भेंट ने आशा लौटाई और हनुमान को राम तक समाचार ले जाने का मार्ग दिया।'],
['हनुमान का सीता को संदेश','हनुमान ने सीता को आश्वस्त किया कि राम उनकी खोज में हैं और उन्हें अपने साथ ले चलने का प्रस्ताव रखा। सीता ने राम की प्रतीक्षा करना चुना, और राम की आने वाली विजय तथा न्याय की पुनःस्थापना में अपना विश्वास रखा। हनुमान ने लौटने के लिए उनसे एक निशानी ली, जिससे उनकी यह भेंट पहचान और आशा के एक महत्त्वपूर्ण आदान-प्रदान में बदल गई।'],
['हनुमान ने लंका जलाई','बंदी बनाए जाने के बाद हनुमान की पूँछ में आग लगा दी गई, पर उन्होंने इस अवसर का उपयोग करके लंका के कुछ भागों को जला डाला और फिर बच निकले। इसके बाद वे सीता का समाचार लेकर समुद्र पार लौटे। यह प्रसंग उनकी चतुराई और साहस की प्रशंसा करता है, और साथ ही गुप्त जानकारी जुटाने के चरण की समाप्ति तथा युद्ध की तैयारियों के आरंभ को चिह्नित करता है।'],
['राम सेतु का निर्माण','राम के सहयोगियों ने मिलकर लंका की ओर समुद्र पर एक सेतु बनाया। इस कार्य के लिए सामूहिक प्रयास और कठिन अभियान में विश्वास आवश्यक था। यह सेतु सहयोग का एक सशक्त प्रतीक बन गया: एक विविध समूह ने अपनी क्षमताओं को जोड़कर वह संभव कर दिखाया जो पहले पहुँच से बाहर लगता था।'],
['रावण का पतन','राम की सेना और रावण की सेना के बीच संघर्ष एक निर्णायक युद्ध में परिणत हुआ। रावण पराजित हुआ और सीता का उद्धार संभव हुआ। युद्ध के अंत को सामान्यतः विनाशकारी अहंकार पर धर्म की विजय के रूप में समझा जाता है, यद्यपि महाकाव्य के उपसंहार और बाद की परंपराओं में और भी जटिलताएँ मिलती हैं।']
];

function isHi(){return language==='Hindi'}
function T(s){return isHi()&&HI_UI[s]?HI_UI[s]:s}
function nm(n){return isHi()&&hiScr[n]?hiScr[n][0]:n}
function sn(s){return nm(s.name)}
function ssub(s){return isHi()&&hiScr[s.name]?hiScr[s.name][1]:s.sub}
function sdesc(s){return isHi()&&hiScr[s.name]?hiScr[s.name][2]:s.desc}
function kn(k){return isHi()&&hiKanda[k]?hiKanda[k]:k}
function stT(s){return isHi()&&hiStories[s.index-1]?hiStories[s.index-1][0]:s.title}
function stB(s){return isHi()&&hiStories[s.index-1]?hiStories[s.index-1][1]:s.body}
function metaShort(n){return isHi()?`कथा ${n} / 30 · लगभग 2 मिनट का पाठ`:`Story ${n} of 30 · About 2 min read`}
function applyLang(){const hi=isHi();document.documentElement.lang=hi?'hi':'en';document.title=hi?'इतिहास — भारतीय पौराणिक कथा अन्वेषक':'Itihasa — Indian Mythology Explorer';const q=(s,t)=>{const e=document.querySelector(s);if(e)e.textContent=t};q('.brand h1',hi?'इतिहास':'Itihasa');q('.brand small',T('Stories that shaped Bharat'));q('footer',T("Made for curious minds · Stories rooted in India's literary traditions"));const sb=document.querySelector('.icon-btn');if(sb)sb.setAttribute('aria-label',T('Search'));const nl={home:'Home',stories:'Stories',saved:'Saved',profile:'Profile'};document.querySelectorAll('.nav-btn').forEach(b=>{b.lastChild.textContent=T(nl[b.dataset.page])})}
const groups=[
{name:'Bala Kanda',stories:[['The Birth of Rama','The ancient kingdom of Kosala was ruled by King Dasharatha, whose greatest sorrow was that he had no heir. After seeking guidance from his sages, a sacred sacrifice was performed. In the traditional account, a divine being brought a consecrated offering for the queens. In time, four princes were born: Rama, Bharata, Lakshmana and Shatrughna. Rama’s life would become central to one of India’s most enduring epics.'],['Vishvamitra Arrives at Ayodhya','The sage Vishvamitra came to King Dasharatha seeking help. His sacred rites were being disturbed by powerful beings, and he asked that Rama accompany him. Though the king hesitated, the royal teacher Vashishtha counselled him to trust the sage. Rama and Lakshmana then set out on a journey that would test their courage and begin their education in a wider world.'],['Rama and Lakshmana Leave with Vishvamitra','Rama and Lakshmana left the comforts of Ayodhya under Vishvamitra’s guidance. The sage taught them sacred knowledge and prepared them for the challenges ahead. Their journey through the forest marked a transition from princes sheltered by the palace to young men learning discipline, responsibility and the protection of others.'],['The Story of Ahalya','During their travels, Rama encountered the hermitage associated with Ahalya, whose story is told in differing ways across Ramayana traditions. In Valmiki’s account, her release from a long curse is connected with Rama’s arrival. The episode invites readers to consider the power of grace, the consequences of actions and the many ways later traditions have interpreted Ahalya’s story.'],['The Slaying of Tataka','Vishvamitra led the princes into a forest troubled by Tataka. Rama struggled with the responsibility of using force, but the sage explained the duty he believed Rama must fulfil. Rama confronted Tataka and protected the region. The episode presents an early test of judgement, courage and the difficult responsibilities that accompany power.'],['Rama Breaks Shiva’s Bow','At King Janaka’s court, a great bow associated with Shiva was presented as a test for the assembled suitors. Rama lifted and strung it, and the bow broke with a tremendous sound. The feat demonstrated his extraordinary strength and led to the marriage arrangements that would unite Rama and Sita.'],['The Marriage of Rama and Sita','After Rama’s feat at Janaka’s court, the marriage of Rama and Sita was celebrated alongside the marriages of their brothers. The alliance joined two royal houses and began a partnership that would face extraordinary trials. The wedding is remembered as a joyful turning point before the events that take the story far beyond palace life.']]},
{name:'Ayodhya Kanda',stories:[['The Coronation That Never Happened','King Dasharatha decided to crown Rama as his successor. The people of Ayodhya welcomed the prospect, seeing Rama as a worthy future king. Yet events inside the palace unsettled the plan. A decision that seemed certain was about to change the lives of the royal family and the future of the kingdom.'],['Kaikeyi’s Two Boons','Influenced by Manthara, Queen Kaikeyi recalled two boons Dasharatha had once promised her. She asked that Bharata be crowned king and that Rama spend fourteen years in exile. Bound by his word, Dasharatha was devastated. The episode explores the weight of promises and the collision between private desire and public duty.'],['Rama Accepts Exile','When Rama learned of Kaikeyi’s demands, he accepted exile rather than allow his father’s promise to be broken. His response demonstrated his commitment to duty, though it brought profound grief to Dasharatha and Ayodhya. The episode remains one of the epic’s defining portrayals of resolve in the face of personal loss.'],['Sita and Lakshmana Join Rama','Sita insisted on accompanying Rama into exile, and Lakshmana chose to go with them. Their decisions were shaped by love, loyalty and a shared sense of responsibility. Leaving the palace meant surrendering comfort and status, but the three began their forest life together, bound by commitments stronger than royal privilege.'],['The Departure from Ayodhya','Rama, Sita and Lakshmana departed Ayodhya as citizens grieved their departure. Dasharatha’s sorrow deepened, while the city struggled to accept the loss of its beloved prince. Their journey away from the capital marks the start of the long exile and shifts the story from royal succession to life in the forest.'],['Bharata Refuses the Throne','Bharata returned to discover that Rama had been exiled and that his own coronation had been arranged. He rejected the throne gained through these circumstances and travelled to ask Rama to return. When Rama refused to violate their father’s promise, Bharata took Rama’s sandals as a symbol of his rule and governed as his brother’s representative.']]},
{name:'Aranya Kanda',stories:[['Life in the Forest','Rama, Sita and Lakshmana travelled through forests and visited hermitages, meeting sages and learning about the challenges facing those who lived there. Their exile became a period of endurance and encounter. The forest setting also introduced the dangers and relationships that would eventually lead to Sita’s abduction.'],['The Encounter with Shurpanakha','Shurpanakha encountered Rama and expressed interest in him. The confrontation escalated when she approached Sita and Lakshmana intervened. The episode set off a chain of retaliatory events involving Ravana and the forces of Lanka. Details differ in later retellings, making it important to distinguish the source tradition being followed.'],['The Battle with Khara and Dushana','After the encounter with Shurpanakha, Khara and Dushana led forces against Rama. Rama fought them and defeated the attackers. The conflict brought the events in the forest to the attention of Ravana, setting the stage for the plan that would separate Rama from Sita.'],['The Golden Deer','Ravana enlisted Maricha, who appeared as a beautiful golden deer near the hermitage. Sita asked Rama to capture it. Rama pursued the deer, and Maricha’s deception drew him away from the dwelling. This moment created the opening Ravana needed to approach Sita while Rama and Lakshmana were absent.'],['The Abduction of Sita','With Rama away and Lakshmana drawn from the hermitage, Ravana approached Sita in disguise and abducted her. Sita resisted and called for help as Ravana carried her toward Lanka. The abduction transformed Rama’s exile into a desperate search and became the central conflict driving the remainder of the epic.'],['Jatayu’s Last Stand','The vulture-king Jatayu witnessed Sita being carried away and fought Ravana in an attempt to rescue her. Though gravely wounded, he later told Rama what had happened. Jatayu’s courage and sacrifice gave Rama crucial information and made him a symbol of loyalty and selfless action.']]},
{name:'Kishkindha Kanda',stories:[['Rama Meets Hanuman','While searching for Sita, Rama and Lakshmana encountered Hanuman, who approached them on behalf of Sugriva. Hanuman recognised their nobility and became a trusted ally. Their meeting began one of the epic’s most important relationships, built on service, confidence and shared purpose.'],['The Alliance with Sugriva','Rama and Sugriva formed an alliance: Rama would help Sugriva regain his position, and Sugriva would use his allies to search for Sita. The agreement linked two struggles and turned Rama’s search into a wider mission. Their alliance would mobilise the forces needed to reach Lanka.'],['The Defeat of Vali','Rama intervened in the conflict between Sugriva and Vali, leading to Vali’s death and Sugriva’s restoration. The episode has long prompted discussion about kingship, justice and the ethics of intervention. Different commentators interpret Rama’s actions in different ways, making this a useful story for thoughtful reading rather than a simple victory narrative.'],['The Search for Sita','Sugriva organised search parties in different directions. The southern group, including Hanuman, eventually learned that Lanka lay across the ocean. Their search had been difficult and uncertain, but the new information created a path forward and prepared Hanuman for his extraordinary leap.']]},
{name:'Sundara Kanda',stories:[['Hanuman Leaps Across the Ocean','Encouraged to recognise his strength, Hanuman leapt across the ocean toward Lanka. Along the way he faced obstacles that tested his courage, discernment and determination. His journey is celebrated as a turning point in the search for Sita and as a story about discovering one’s capabilities in service of a larger purpose.'],['Hanuman Finds Sita in Ashoka Vatika','After searching Lanka, Hanuman found Sita in the Ashoka grove, guarded and grieving but steadfast in her resolve. He approached carefully and offered Rama’s signet ring as proof that he had come from her husband. Their meeting restored hope and gave Hanuman a way to carry news back to Rama.'],['Hanuman’s Message to Sita','Hanuman reassured Sita that Rama was searching for her and offered to carry her away. Sita chose to wait for Rama, placing her trust in his coming victory and the restoration of justice. Hanuman received a token from her to take back, turning their encounter into a vital exchange of recognition and hope.'],['Hanuman Sets Lanka Ablaze','After being captured, Hanuman’s tail was set alight, but he used the opportunity to set parts of Lanka ablaze before escaping. He then returned across the ocean with news of Sita. The episode celebrates his resourcefulness and courage, while marking the end of reconnaissance and the beginning of preparations for war.']]},
{name:'Yuddha Kanda',stories:[['The Building of Rama’s Bridge','Rama’s allies worked together to build a bridge across the ocean toward Lanka. The undertaking required collective effort and faith in a difficult mission. The bridge became a powerful image of cooperation: a diverse group joined its abilities to make possible what had first seemed beyond reach.'],['The Fall of Ravana','The conflict between Rama’s forces and Ravana’s army culminated in a decisive battle. Ravana was defeated, and Sita’s rescue became possible. The ending of the war is commonly understood as the triumph of dharma over destructive pride, though the epic’s aftermath and later traditions contain further complexities.']]}
];
const allStories=groups.flatMap((g,gi)=>g.stories.map((s,si)=>({title:s[0],body:s[1],kanda:g.name,index:groups.slice(0,gi).reduce((n,x)=>n+x.stories.length,0)+si+1})));
let page='home',filter='All',selectedScripture='Ramayana',currentStory=0,query='',toastTimer;let saved=JSON.parse(localStorage.getItem('itihasa-saved')||'[]');let progress=JSON.parse(localStorage.getItem('itihasa-progress')||'{}');let language=localStorage.getItem('itihasa-language')||'English';
const main=document.getElementById('main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2300)}
function saveData(){localStorage.setItem('itihasa-saved',JSON.stringify(saved));localStorage.setItem('itihasa-progress',JSON.stringify(progress))}
function showPage(next){page=next;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===next));render()}
function scriptureCard(s){return `<article class="scripture-card" onclick="openScripture('${esc(s.name)}')"><div class="scripture-art${covers[s.name]?' has-img':''}">${coverImg(s.name)||s.symbol}</div><h3>${esc(sn(s))}</h3><p class="sub">${esc(ssub(s))}</p><span class="pill ${s.status==='soon'?'soon':''}">${s.status==='available'?T('Read now'):T('Coming soon')}</span></article>`}
function home(){const last=progress.last??0;const story=allStories[last]||allStories[0];return `<section class="hero"><div><div class="eyebrow">${T('Your journey into Indian epics')}</div><h2>${T('Discover the stories of our timeless past.')}</h2><p>${T('Explore legendary characters, epic journeys and ancient wisdom—one story at a time.')}</p><button class="primary" onclick="openScripture('Ramayana')">${T('Explore the Ramayana →')}</button></div><div class="hero-art"><span>${T('Echoes of an ancient world')}</span></div></section><div class="section-head"><div><h2>${T('Continue reading')}</h2><div class="sub">${T('Pick up where you left off')}</div></div><button class="text-link" onclick="showPage('stories')">${T('View all')}</button></div><div class="continue-card" role="button" tabindex="0" onclick="readStory(${story.index-1})"><div class="cover">राम</div><div style="flex:1"><div class="eyebrow">${T('Ramayana')} · ${esc(kn(story.kanda))}</div><h3>${esc(stT(story))}</h3><div class="sub">${metaShort(story.index)}</div><div class="progress"><span style="width:${progress[story.index-1]?'100%':'0%'}"></span></div></div><span class="chevron">›</span></div><div class="section-head"><div><h2>${T('Explore scriptures')}</h2><div class="sub">${T('A growing library of Indian traditions')}</div></div><button class="text-link" onclick="showPage('stories')">${T('All scriptures')}</button></div><div class="grid">${scriptures.slice(0,6).map(scriptureCard).join('')}</div>`}
function storyList(){return groups.map(g=>`<section class="kanda"><h3>${esc(kn(g.name))}</h3>${g.stories.map(s=>{const st=allStories.find(x=>x.title===s[0]);return `<button class="story-row" onclick="readStory(${st.index-1})"><span class="number">${st.index}</span><span class="details"><h4>${esc(stT(st))}</h4><small>${T('Read story')} · ${esc(kn(g.name))}</small></span><span class="chevron">›</span></button>`}).join('')}</section>`).join('')}
function storiesPage(){let list=scriptures.filter(s=>(filter==='All'||(filter==='Available'&&s.status==='available')||(filter==='Coming soon'&&s.status==='soon'))&&(`${s.name} ${s.desc}${isHi()&&hiScr[s.name]?' '+hiScr[s.name][0]+' '+hiScr[s.name][2]:''}`.toLowerCase().includes(query.toLowerCase())));return `<div class="eyebrow">${T('The library')}</div><h2 class="page-title">${T('Stories & scriptures')}</h2><p class="sub">${T('Choose a collection to explore. More texts will be added over time.')}</p><div class="toolbar">${['All','Available','Coming soon'].map(x=>`<button class="chip ${filter===x?'active':''}" onclick="setFilter('${x}')">${T(x)}</button>`).join('')}</div><input class="search" id="searchInput" placeholder="${T('Search scriptures…')}" value="${esc(query)}" oninput="setQuery(this.value)"/><div class="library-list" style="margin-top:16px">${list.map(s=>`<button class="library-item" onclick="openScripture('${esc(s.name)}')"><span class="library-icon${covers[s.name]?' has-img':''}">${coverImg(s.name)||s.symbol}</span><span class="details"><h3>${esc(sn(s))}</h3><p>${esc(sdesc(s))}</p></span><span class="pill ${s.status==='soon'?'soon':''}">${s.status==='available'?T('Available'):T('Coming soon')}</span><span class="chevron">›</span></button>`).join('')||`<div class="empty-state">${T('No scriptures match that search.')}</div>`}</div>`}
function setFilter(x){filter=x;render()}function setQuery(x){query=x;const pos=document.getElementById('searchInput')?.selectionStart;render();const el=document.getElementById('searchInput');el?.focus();if(pos!==undefined)el?.setSelectionRange(pos,pos)}
function openScripture(name){selectedScripture=name;if(name!=='Ramayana'){main.innerHTML=`<div class="notice"><div class="symbol">${coverImg(name)||'✧'}</div><div class="eyebrow">${T('Coming soon')}</div><h2>${esc(nm(name))}</h2><p>${T('You will be able to read them soon.')}</p><p>${T("We're building this collection carefully, with attention to source traditions and context.")}</p><button class="primary" onclick="showPage('stories')">${T('Back to stories')}</button></div>`;return}page='collection';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page==='stories'));render()}
function collection(){return `<button class="text-link" onclick="showPage('stories')">${T('← All scriptures')}</button><div class="hero" style="margin-top:16px;grid-template-columns:1fr .55fr"><div><div class="eyebrow">${T('The epic collection')}</div><h2>${T('Ramayana')}</h2><p>${T('The journey of Rama, Sita, Lakshmana and Hanuman—told across six Kandas.')}</p><span class="pill">${isHi()?hiScr['Ramayana'][1]:'30 stories · Available now'}</span></div><div class="hero-art has-img">${coverImg('Ramayana')}</div></div><div class="section-head"><div><h2>${T('All 30 stories')}</h2><div class="sub">${T('Read in traditional Kanda order')}</div></div></div>${storyList()}`}
function readStory(i){currentStory=Math.max(0,Math.min(i,allStories.length-1));progress.last=currentStory;progress[currentStory]=true;saveData();page='reader';render()}
function reader(){const s=allStories[currentStory];return `<article class="reader"><button class="back" onclick="showPage('collection')">${T('← Back to Ramayana')}</button><div class="eyebrow">${T('Ramayana')} · ${esc(kn(s.kanda))}</div><h2>${esc(stT(s))}</h2><div class="reader-meta">${isHi()?`कथा ${s.index} / 30 · हिन्दी · 2 मिनट का पाठ`:`Story ${s.index} of 30 · ${language} · 2 min read`}</div><div class="reader-body"><p>${esc(stB(s))}</p></div><div class="source-note"><strong>${T('Source & context')}</strong><br>${T('This is a concise introductory retelling for the prototype. Before publication, the story should be verified against the selected source edition and clearly distinguish source text from later regional retellings.')}</div><div class="reader-actions"><button class="secondary" onclick="toggleSave(${currentStory})">${saved.includes(currentStory)?T('♥ Saved'):T('♡ Save story')}</button><div><button class="secondary" ${currentStory===0?'disabled':''} onclick="readStory(${currentStory-1})">${T('← Previous')}</button> <button class="primary" ${currentStory===29?'disabled':''} onclick="readStory(${currentStory+1})">${T('Next →')}</button></div></div></article>`}
function toggleSave(i){if(saved.includes(i))saved=saved.filter(x=>x!==i);else saved.push(i);saveData();showToast(saved.includes(i)?T('Story saved'):T('Removed from saved stories'));render()}
function savedPage(){if(!saved.length)return `<div class="eyebrow">${T('Your library')}</div><h2 class="page-title">${T('Saved stories')}</h2><div class="empty-state"><div class="big">♡</div><h3>${T('No saved stories yet')}</h3><p class="sub">${T('Bookmark a story to find it here later.')}</p><button class="primary" onclick="showPage('stories')">${T('Explore stories')}</button></div>`;return `<div class="eyebrow">${T('Your library')}</div><h2 class="page-title">${T('Saved stories')}</h2><p class="sub">${T('Your bookmarked reading list, stored on this device.')}</p>${saved.map(i=>{const s=allStories[i];return `<button class="story-row" onclick="readStory(${i})"><span class="number">${s.index}</span><span class="details"><h4>${esc(stT(s))}</h4><small>${esc(kn(s.kanda))}</small></span><span class="chevron">›</span></button>`}).join('')}`}
function profile(){const opened=Object.keys(progress).filter(k=>k!=='last').length;return `<div class="eyebrow">${T('Your preferences')}</div><h2 class="page-title">${T('Profile & settings')}</h2><p class="sub">${T('A simple reading experience, tailored to you.')}</p><div class="settings-card"><label><span><strong>${T('Reading language')}</strong><br><small class="sub">${T('Choose the language for story text')}</small></span><select onchange="setLanguage(this.value)"><option value="English" ${language==='English'?'selected':''}>English</option><option value="Hindi" ${language==='Hindi'?'selected':''}>${isHi()?'हिन्दी':'Hindi'}</option></select></label></div><div class="settings-card"><strong>${T('Reading progress')}</strong><p class="sub" style="margin:6px 0 12px">${isHi()?`इस डिवाइस पर 30 में से ${opened} कथाएँ खोली गई हैं।`:`${opened} of 30 stories opened on this device.`}</p><div class="progress"><span style="width:${Math.min(100,opened/30*100)}%"></span></div></div><div class="settings-card"><strong>${T('About Itihasa')}</strong><p class="sub" style="margin:6px 0 0">${T("A text-first explorer for India's epics, Puranas and philosophical traditions. Content will identify its source tradition wherever possible.")}</p></div><div class="settings-card"><strong>${T('Privacy')}</strong><p class="sub" style="margin:6px 0 0">${T('This prototype stores bookmarks and reading progress locally in your browser. It has no account system or server.')}</p></div><button class="secondary" onclick="if(confirm(T('Clear all saved stories and reading progress on this device?'))){saved=[];progress={};saveData();render();showToast(T('Local reading data cleared'))}" style="margin-top:8px">${T('Clear local reading data')}</button>`}
function setLanguage(x){language=x;localStorage.setItem('itihasa-language',x);render();showToast(T('Language preference saved.'))}
function render(){applyLang();if(page==='home')main.innerHTML=home();else if(page==='stories')main.innerHTML=storiesPage();else if(page==='collection')main.innerHTML=collection();else if(page==='reader')main.innerHTML=reader();else if(page==='saved')main.innerHTML=savedPage();else if(page==='profile')main.innerHTML=profile();window.scrollTo({top:0,behavior:'smooth'})}
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
