['राम का जन्म','अयोध्या के राजा दशरथ संतान की कामना करते थे। एक पवित्र यज्ञ के बाद उनकी रानियों ने चार पुत्रों को जन्म दिया—राम, भरत, लक्ष्मण और शत्रुघ्न। कौशल्या के पुत्र राम विवेकशील और कुशल राजकुमार के रूप में बड़े हुए। भाइयों ने शासन और शस्त्रविद्या की शिक्षा पाई, और राम तथा लक्ष्मण में विशेष स्नेह था। राजमहल में बीता उनका बचपन उस यात्रा की शुरुआत था जो उन्हें अयोध्या से बहुत दूर ले जाने वाली थी।'],
['विश्वामित्र का अयोध्या आगमन','ऋषि विश्वामित्र दशरथ के दरबार में सहायता माँगने आए। वन में उनके यज्ञों में राक्षस विघ्न डाल रहे थे, इसलिए उन्होंने राम से यज्ञ की रक्षा करने को कहा। दशरथ अपने युवा पुत्र को भेजने में हिचकिचाए, पर ऋषि वसिष्ठ ने उन्हें विश्वामित्र की विनती स्वीकार करने की सलाह दी। राम, लक्ष्मण के साथ विश्वामित्र के मार्गदर्शन में चल पड़े। यह राजमहल से बाहर रक्षक के रूप में राम की पहली यात्रा थी।'],
['राम और लक्ष्मण विश्वामित्र के साथ जाते हैं','विश्वामित्र ने राजकुमारों को दिव्य अस्त्रों का ज्ञान दिया। मार्ग में उनके साहस और संयम की परीक्षा हुई। राम ने ताड़का और सुबाहु जैसे राक्षसों से विश्वामित्र के यज्ञ की रक्षा की; मारीच को दूर फेंका और सुबाहु का वध किया। भाइयों ने समझा कि शक्ति का उपयोग उत्तरदायित्व के साथ होना चाहिए। वे यश पाने नहीं, बल्कि ऋषि के तप और कार्य की रक्षा करने निकले थे।'],
['अहल्या की कथा','गौतम ऋषि के आश्रम में राम की भेंट अहल्या से हुई, जो लंबे समय से शाप के कारण एकांत में थीं। वाल्मीकि की कथा में, इंद्र के छल का पता चलने पर गौतम ने उन्हें शाप दिया था; राम के आगमन तक वे वहीं रहीं। राम की उपस्थिति से शाप समाप्त हुआ। गौतम लौटे और अहल्या को फिर स्वीकार किया। बाद की कथाओं में इस प्रसंग के विवरण अलग-अलग हैं, पर इसे मुक्ति और पुनर्स्थापन की कथा के रूप में याद किया जाता है।'],
['ताड़का का वध','विश्वामित्र राम और लक्ष्मण को ऐसे वन में ले गए जहाँ यक्षी ताड़का यात्रियों और ऋषियों को भयभीत करती थी। राम स्त्री से युद्ध करने को लेकर संकोच में थे, पर विश्वामित्र ने उसके खतरे को समझाया और क्षेत्र की रक्षा करने को कहा। राम ने ताड़का का सामना कर उसका वध किया। यह योद्धा के रूप में उनके कर्तव्य की पहली कठिन परीक्षा थी। इसके बाद विश्वामित्र ने उन्हें और ज्ञान तथा अस्त्रों का प्रशिक्षण दिया।'],
['राम शिवधनुष तोड़ते हैं','मिथिला के राजा जनक ने घोषणा की कि जो शिव से जुड़ा विशाल धनुष उठा कर उस पर प्रत्यंचा चढ़ाएगा, वही उनकी पुत्री सीता से विवाह करेगा। अनेक शक्तिशाली राजा असफल रहे। विश्वामित्र के कहने पर राम धनुष के पास गए, उसे उठाया और प्रत्यंचा चढ़ाने लगे। धनुष गर्जना के साथ टूट गया। जनक ने राम के सामर्थ्य और स्वभाव को पहचाना और विवाह की तैयारी की।'],
['राम और सीता का विवाह','जनक ने दशरथ और उनके परिवार का मिथिला में स्वागत किया। ऋषियों की उपस्थिति में राम और सीता का विवाह हुआ, और राजकुमारों के विवाह जनक के परिवार की कन्याओं से भी संपन्न हुए। इन विवाहों से दो राजपरिवार जुड़े। राम और सीता बड़ों का आशीर्वाद लेकर अयोध्या लौटे। उनका साथ आगे वनवास, विरह और युद्ध की कठिन परीक्षाओं से गुजरने वाला था।'],
['जो राज्याभिषेक नहीं हो सका','दशरथ ने राम को युवराज बनाने का निश्चय किया और अयोध्या में राज्याभिषेक की तैयारी होने लगी। नगरवासी इस समाचार से प्रसन्न थे। लेकिन मंथरा ने रानी कैकेयी को चेताया कि राम के राजा बनने पर भरत का स्थान कम हो सकता है। कैकेयी को दशरथ के दिए दो वरदान याद आए और उसने उन्हें माँगने का निश्चय किया। आनंद का समारोह राजपरिवार के संकट में बदल गया।'],
['कैकेयी के दो वरदान','कैकेयी ने दशरथ से अपने दो वरदान माँगे: भरत का राज्याभिषेक और राम को चौदह वर्ष का वनवास। दशरथ शोक से टूट गए, पर राम ने पिता के वचन की मर्यादा रखने के लिए यह माँग स्वीकार कर ली। उन्होंने कैकेयी को दोष नहीं दिया और विरोध भी नहीं किया। उनकी शांत स्वीकृति ने महल के विवाद को महाकाव्य का निर्णायक मोड़ बना दिया।'],
['राम वनवास स्वीकार करते हैं','राम ने सीता और लक्ष्मण को बताया कि वे वन जा रहे हैं। उन्होंने राजसी वस्त्र त्यागे, वन के वस्त्र धारण किए और पिता के वचन को अपने राजसिंहासन से ऊपर रखा। दशरथ शोक में डूब गए और राम को जाते देखना सहन न कर सके। राम ने अपने प्रियजनों को सांत्वना दी और अयोध्या से निकल पड़े। वनवास के चौदह वर्ष आरंभ हुए।'],
['सीता और लक्ष्मण राम के साथ जाते हैं','सीता ने आग्रह किया कि वह वन में राम के साथ रहेंगी। लक्ष्मण ने भी उनकी रक्षा के लिए साथ चलने का निश्चय किया। राम ने वन के कष्ट समझाए, पर दोनों अपने निर्णय पर दृढ़ रहे। सीता ने महल का सुरक्षित जीवन छोड़ा और लक्ष्मण अपनी पत्नी उर्मिला तथा राजसी जीवन से विदा हुए। उनके निर्णय ने वनवास को निष्ठा और पारिवारिक कर्तव्य की साझा यात्रा बना दिया।'],
['अयोध्या से प्रस्थान','राम, सीता और लक्ष्मण रथ से अयोध्या से निकले, जबकि दुखी नगरवासी उनके पीछे चल पड़े। कुछ समय बाद तीनों ने भीड़ से अलग अपनी यात्रा जारी रखी और वन तथा बस्तियों से होते हुए आगे बढ़े। दशरथ राम के वियोग में शोक करते रहे और अंततः उनका निधन हो गया। वनवासी वन पहुँचे और सरल जीवन आरंभ किया। अयोध्या अपने चुने हुए युवराज से वंचित रह गई।'],
['भरत सिंहासन स्वीकार नहीं करते','भरत अयोध्या लौटे और उन्हें कैकेयी के कार्य का पता चला। उन्होंने सिंहासन ठुकरा दिया और राम को वन भेजने के निर्णय का विरोध किया। वे वन में राम से मिलने गए और उन्हें लौटकर राजा बनने की विनती की, पर राम पिता के वचन से पीछे नहीं हटे। भरत राम की चरण-पादुकाएँ लेकर अयोध्या लौटे और उन्हें सिंहासन पर रखकर राम के प्रतिनिधि के रूप में शासन किया।'],
['वन में जीवन','राम, सीता और लक्ष्मण वनों में घूमते हुए ऋषियों से मिले और उनके आश्रमों को संकट से बचाया। अंततः उन्होंने पंचवटी के पास निवास बनाया। उनके दिन वनवासियों से मिलने, सादा जीवन बिताने और क्षेत्र की रक्षा करने में गुजरते थे। राजमहल छोड़ने के बाद भी वन में नई जिम्मेदारियाँ और खतरे थे। आगे की घटनाएँ सीता को राम से अलग कर देने वाली थीं।'],
['शूर्पणखा से भेंट','रावण की बहन शूर्पणखा ने राम को देखा और उनसे विवाह की इच्छा जताई। राम ने विनम्रता से मना किया और उसे लक्ष्मण के पास भेजा; लक्ष्मण ने भी उसे अस्वीकार किया। क्रोधित होकर उसने सीता को धमकाया। लक्ष्मण ने बीच में आकर उसे घायल कर दिया। शूर्पणखा अपने संबंधियों के पास सहायता माँगने भागी। उसके अपमान और क्रोध ने खर-दूषण को राम से भिड़ाया और अंततः रावण को सीता के बारे में बताया।'],
['खर-दूषण से युद्ध','शूर्पणखा की बात सुनकर खर और दूषण बड़ी सेना लेकर राम पर चढ़ आए। लक्ष्मण सीता को सुरक्षित स्थान पर ले गए और राम ने अकेले हमलावरों का सामना किया। राम ने युद्ध में राक्षस योद्धाओं और उनके सेनापतियों को परास्त किया। इस विजय का समाचार वन से बाहर पहुँचा: शूर्पणखा ने रावण को सब बताया और उसने सीता के अपहरण की योजना बनानी शुरू की।'],
['स्वर्ण मृग','रावण ने मारीच की सहायता से राम को आश्रम से दूर ले जाने की योजना बनाई। मारीच ने चमकते स्वर्ण मृग का रूप धारण किया और सीता ने राम से उसे पकड़ने को कहा। राम मृग के पीछे वन में दूर तक गए। राम के बाण से घायल होने पर मारीच ने राम की आवाज़ में पुकार लगाई। यह सुनकर सीता ने लक्ष्मण से राम की सहायता के लिए जाने को कहा।'],
['सीता का अपहरण','राम और लक्ष्मण के दूर होने पर रावण संन्यासी के वेश में आश्रम आया। उसने अपना परिचय दिया और सीता को अपने साथ चलने के लिए मनाने की कोशिश की। सीता के मना करने पर उसने उन्हें बलपूर्वक उठाया और रथ से लंका की ओर ले चला। सीता ने सहायता के लिए पुकारा और रास्ते में निशान छोड़े। इस अपहरण ने उस खोज को जन्म दिया जिसने राम को वानरों का सहयोगी बनाया।'],
['जटायु का अंतिम संघर्ष','वृद्ध गिद्ध जटायु ने रावण को सीता का अपहरण करते देखा और उसे रोकने का प्रयास किया। उसने बहादुरी से युद्ध किया, रावण के रथ को क्षति पहुँचाई, पर रावण ने उसके पंख काट दिए और उसे मरणासन्न छोड़ दिया। बाद में राम और लक्ष्मण ने जटायु को पाया। मरने से पहले उसने उन्हें घटना बताई और दक्षिण दिशा का संकेत दिया। राम ने शोकपूर्वक जटायु का अंतिम संस्कार किया।'],
['राम की हनुमान से भेंट','सीता की खोज करते हुए राम और लक्ष्मण किष्किन्धा के क्षेत्र में पहुँचे। हनुमान तपस्वी का वेश बनाकर उनसे मिले और सावधानी तथा बुद्धिमत्ता से बातचीत की। परिचय जानने के बाद वे दोनों भाइयों को निर्वासित वानर राजकुमार सुग्रीव के पास ले गए। हनुमान की यह भेंट सेवा और मित्रता के ऐसे संबंध की शुरुआत थी जो सीता की खोज और लंका की यात्रा में निर्णायक बना।'],
['सुग्रीव से मित्रता','सुग्रीव ने राम को बताया कि उसके भाई वाली ने राज्य छीन लिया है और वह स्वयं भय में रह रहा है। राम ने सुग्रीव को उसका स्थान वापस दिलाने में सहायता का वचन दिया; सुग्रीव ने सीता की खोज में मदद करने का वचन दिया। दोनों ने अग्नि के सामने मित्रता की शपथ ली। राम की सहायता से वाली के पराजित होने पर सुग्रीव राजा बने और उन्होंने वानरों को चारों दिशाओं में खोज के लिए भेजा।'],
['वाली का पराजय','सुग्रीव ने वाली को द्वंद्व के लिए ललकारा, पर दोनों भाइयों को पहचानना कठिन था, इसलिए राम ने पहले बाण नहीं चलाया। सुग्रीव माला पहनकर लौटा और दोनों फिर भिड़े। इस बार राम ने छिपकर बाण चलाया, जो वाली को लगा। मृत्युशय्या पर वाली ने राम के निर्णय पर प्रश्न किया। राम ने अपना पक्ष रखा; वाली ने अपने पुत्र अंगद को सुग्रीव के संरक्षण में सौंपा और सुग्रीव ने राज्य संभाला।'],
['सीता की खोज','सुग्रीव ने सीता की खोज के लिए दलों को अलग-अलग दिशाओं में भेजा। हनुमान, अंगद और जाम्बवान दक्षिण की ओर गए। खोज निष्फल लग रही थी कि उनकी भेंट जटायु के भाई संपाति से हुई। उसने दूर समुद्र पार लंका में सीता को देखा था। जाम्बवान ने हनुमान को उनकी भूली हुई शक्ति याद दिलाई। वानरों ने समुद्र पार जाने के लिए हनुमान को चुना।'],
['हनुमान का समुद्र लाँघना','जाम्बवान से प्रोत्साहित होकर हनुमान ने अपनी शक्ति पहचानी और समुद्र पार करने की तैयारी की। वे पर्वत से उछलकर समुद्र के ऊपर से लंका की ओर उड़ चले। मार्ग में ऐसी चुनौतियाँ आईं जिन्होंने उनके बल और विवेक दोनों की परीक्षा ली। उन्होंने ध्येय से विचलित हुए बिना बाधाएँ पार कीं। उनकी छलाँग राम की आशा को समुद्र पार ले गई और उन्हें उस नगर तक पहुँचा गई जहाँ सीता बंदी थीं।'],
['अशोक वाटिका में सीता','हनुमान रात में लंका में प्रवेश कर महलों और उपवनों में सीता को खोजते रहे। अंततः उन्होंने अशोक वाटिका में सीता को देखा, जो राक्षसियों की निगरानी में राम के विरह में थीं। वे पेड़ पर छिपकर देखते रहे। रावण आया और सीता को स्वीकार करने के लिए दबाव डाला, पर सीता ने उसे ठुकरा दिया। उसके जाने पर हनुमान ने राम की कथा सुनाई और पहचान के लिए उनकी अंगूठी दिखाई।'],
['हनुमान का सीता को संदेश','सीता ने राम की अंगूठी पहचान ली और हनुमान से उनकी खोज तथा उन्हें बचाने के संकल्प के बारे में सुना। हनुमान ने उन्हें वापस ले जाने की पेशकश की, पर सीता ने मना किया। वे राम की प्रतीक्षा करना चाहती थीं और अपने लौटने के तरीके पर कोई संदेह नहीं चाहती थीं। उन्होंने राम को देने के लिए एक रत्न और अपने जीवन की एक स्मृति का संदेश हनुमान को दिया। हनुमान इस प्रमाण के साथ लौटे कि सीता जीवित और दृढ़ थीं।'],
['हनुमान ने लंका जलाई','लंका छोड़ने से पहले हनुमान ने रावण के योद्धाओं से भिड़कर स्वयं को बंदी बनने दिया। रावण ने उनकी पूँछ में आग लगाने का आदेश दिया। हनुमान ने उसी अग्नि के सहारे छतों पर छलाँग लगाई और नगर के कुछ हिस्सों में आग लगा दी, फिर वहाँ से निकल गए। सीता की कुशलता सुनिश्चित कर वे समुद्र पार लौटे। उन्होंने सीता का संदेश और रत्न राम को दिया, जिससे सेना की आशा लौट आई।'],
['राम का सेतु निर्माण','राम और उनकी सेना समुद्र तट पर पहुँचे, पर लंका बहुत दूर थी। समुद्र देवता से मार्ग मिलने के बाद नल ने वानरों के साथ सेतु निर्माण का नेतृत्व किया। वानर पत्थर और वृक्ष तट तक लाते रहे और मिलकर समुद्र पर पुल बनाया। इसके सहारे सेना लंका तक पहुँच सकी।'],
['विभीषण रावण का दरबार छोड़ते हैं','रावण के भाई विभीषण ने उसे सीता लौटाकर विनाशकारी युद्ध टालने की सलाह दी। रावण ने उनकी बात अस्वीकार कर उन्हें दरबार से निकाल दिया। विभीषण ने राम की शरण लेने का निर्णय किया। राम की सेना के कुछ लोगों को उन पर संदेह था, फिर भी राम ने उन्हें सहयोगी के रूप में स्वीकार किया। लंका का उनका ज्ञान आगे की लड़ाई में काम आया।'],
['लंका के शुरुआती युद्ध','राम की सेना ने लंका को घेर लिया और रावण के योद्धा नगर से बाहर आकर भिड़े। लड़ाई नगर के द्वारों और रणभूमि तक फैल गई। वानर सेनानायक लंका के सेनापतियों से लड़े, जबकि राम की सेना घेरा कसती रही। आरंभिक युद्धों ने रावण की सेना का आकार और सीता को बचाने आए सहयोगियों का साहस दिखाया।'],
['इंद्रजीत के नागास्त्र','रावण का पुत्र इंद्रजीत शक्तिशाली अस्त्रों और छिपकर युद्ध करने की कला से लड़ा। उसके नागास्त्र ने राम और लक्ष्मण को सर्प-बन्धन में जकड़ दिया, जिससे सेना निराश हो गई। गरुड़ के आगमन से दोनों भाई सर्पों के बंधन से मुक्त हुए। इस प्रसंग में इंद्रजीत की प्रचंड शक्ति दिखती है, और भाइयों की मुक्ति से वानर सेना में फिर आशा जागती है।'],
['कुंभकर्ण का जागना','युद्ध लंका के विरुद्ध जाने लगा तो रावण ने अपने विशालकाय भाई कुंभकर्ण को जगवाया। उसे लंबे निद्रा-काल से उठाकर राज्य के संकट के बारे में बताया गया। कुंभकर्ण ने रावण के निर्णयों की आलोचना की, फिर भी परिवार और लंका के लिए युद्ध करने को तैयार हुआ। विपरीत परिस्थितियों का ज्ञान होते हुए भी वह रणभूमि में उतरा।'],
['कुंभकर्ण का अंत','कुंभकर्ण ने अपनी विशाल शक्ति से वानर सेना को तितर-बितर कर दिया। राम ने उसका सामना किया और शक्तिशाली बाणों से युद्ध किया। भीषण संघर्ष के बाद राम ने कुंभकर्ण को गिरा दिया। उसकी मृत्यु लंका के लिए बड़ी क्षति थी। रावण ने अपने भाई के लिए शोक किया, जिसने युद्ध को अनुचित मानने के बावजूद उसके पक्ष में लड़ाई की थी।'],
['इंद्रजीत का मायाजाल','इंद्रजीत ने राम की सेना को कमजोर करने के लिए छल का सहारा लिया और ऐसा आभास कराया मानो सीता मारी गई हों। वानर शोक में डूब गए, पर विभीषण ने इस कृत्य को माया पहचाना। उन्होंने समझाया कि इंद्रजीत उन्हें भ्रमित करना चाहता है और सीता जीवित हैं। सत्य जानकर सेना का साहस लौटा और सबका ध्यान इंद्रजीत को रोकने पर गया।'],
['लक्ष्मण इंद्रजीत को पराजित करते हैं','विभीषण ने बताया कि इंद्रजीत निकुम्भिला में एक अनुष्ठान कर रहा है जिससे उसे युद्ध में बल मिलता। लक्ष्मण, विभीषण और वानर योद्धाओं के साथ उसे रोकने गए। दोनों वीरों के बीच भीषण युद्ध हुआ। अंततः लक्ष्मण ने इंद्रजीत को पराजित किया और रावण के सबसे शक्तिशाली पुत्र का खतरा समाप्त हुआ।'],
['हनुमान संजीवनी लाते हैं','युद्ध में लक्ष्मण और अनेक वानर योद्धा गंभीर रूप से घायल हो गए। हनुमान को दूर पर्वत से औषधियाँ लाने भेजा गया। वे सही पौधों को पहचान नहीं पाए, इसलिए पूरा पर्वत ही उठाकर रणभूमि में ले आए। औषधियों से घायल योद्धाओं को जीवन मिला और सेना युद्ध जारी रख सकी।'],
['अहिरावण राम और लक्ष्मण का अपहरण करता है','बाद की रामायण कथा में अहिरावण—जिसे कुछ संस्करणों में रावण का सहयोगी या संबंधी और पाताल का शक्तिशाली शासक बताया गया है—छल से राम और लक्ष्मण को उठा ले जाता है। हनुमान को पता चलता है कि दोनों भाइयों को पाताल ले जाया गया है, और वे उन्हें छुड़ाने निकलते हैं। रक्षकों और अहिरावण की योजनाओं को पार कर हनुमान राम और लक्ष्मण को मुक्त कर रणभूमि में वापस लाते हैं।'],
['रावण का पतन','राम की सेना और रावण की सेना के बीच संघर्ष एक निर्णायक युद्ध में परिणत हुआ। रावण पराजित हुआ और सीता का उद्धार संभव हुआ। युद्ध के अंत को सामान्यतः विनाशकारी अहंकार पर धर्म की विजय के रूप में समझा जाता है, यद्यपि महाकाव्य के उपसंहार और बाद की परंपराओं में और भी जटिलताएँ मिलती हैं।'],
['सीता की अग्नि परीक्षा','रावण की मृत्यु के बाद सीता को राम के सामने लाया गया। वाल्मीकि के वर्णन में राम ने लंका में उनके रहने को लेकर उठ सकने वाले लोक-संदेह का उत्तर देने की बात कही। सीता ने अग्नि को अपनी सत्यनिष्ठा का साक्षी मानकर उसमें प्रवेश किया। अग्निदेव ने उन्हें सुरक्षित लौटाया और उनकी पवित्रता की पुष्टि की। बाद की कथाएँ इस पीड़ादायक प्रसंग को अलग-अलग ढंग से प्रस्तुत करती हैं।'],
['राम की अयोध्या वापसी','युद्ध समाप्त होने और सीता के मुक्त होने पर राम, सीता, लक्ष्मण और उनके साथी घर लौटने चले। वे पुष्पक विमान से उन स्थानों के ऊपर से गुजरे जो उनके वनवास की स्मृतियों से जुड़े थे। अयोध्या में भरत ने राम का स्वागत किया और राज्य उन्हें सौंप दिया। राम का राज्याभिषेक वनवास के अंत और उनके शासन की शुरुआत बना।']
];

function applyLang(){const hi=isHi();document.documentElement.lang=hi?'hi':'en';document.title=hi?'इतिहास — भारतीय पौराणिक कथा अन्वेषक':'Itihasa — Indian Mythology Explorer';const q=(s,t)=>{const e=document.querySelector(s);if(e)e.textContent=t};q('.brand h1',hi?'इतिहास':'Itihasa');q('.brand small',T('Stories that shaped Bharat'));q('footer',T("Made for curious minds · Stories rooted in India's literary traditions"));const sb=document.querySelector('.icon-btn');if(sb)sb.setAttribute('aria-label',T('Search'));const nl={home:'Home',stories:'Stories',saved:'Saved',profile:'Profile'};document.querySelectorAll('.nav-btn').forEach(b=>{b.lastChild.textContent=T(nl[b.dataset.page])})}
const groups=[
{name:'Bala Kanda',stories:[['The Birth of Rama','King Dasharatha of Ayodhya longed for an heir. After a sacred rite, his queens welcomed four sons: Rama, Bharata, Lakshmana and Shatrughna. Rama, born to Kausalya, grew into a thoughtful and capable prince. The brothers were trained in statecraft and arms, and Rama and Lakshmana became especially close. Their childhood in the palace was the beginning of a journey that would carry them far beyond Ayodhya.'],['Vishvamitra Arrives at Ayodhya','The sage Vishvamitra came to Dasharatha’s court seeking help. Demons were disrupting the rites he performed in the forest, and he asked that Rama protect the sacrifice. Dasharatha hesitated to send his young son, but the sage Vasishta advised him to honor the request. Rama set out with Lakshmana, guided by Vishvamitra. The journey began his life as a protector beyond the palace walls.'],['Rama and Lakshmana Leave with Vishvamitra','Vishvamitra taught the princes sacred knowledge and gave them powerful weapons. On the road they faced dangers that tested their courage and discipline. Rama protected the sage’s rite from the demons Maricha and Subahu, driving Maricha far away and defeating Subahu. The brothers learned that strength carried responsibility: they were travelling not for glory, but to safeguard the work of a sage.'],['The Story of Ahalya','At the hermitage of Gautama, Rama encountered Ahalya, who had long lived under a curse. In Valmiki’s telling, the sage had cursed her after discovering Indra’s deception, and she remained secluded until Rama’s arrival. Rama’s presence brought the curse to an end. Gautama returned, and Ahalya was welcomed again. Later tellings vary in the details, but the episode is remembered as one of restoration and release.'],['The Slaying of Tataka','Vishvamitra led Rama and Lakshmana into a forest where the yaksha woman Tataka threatened travellers and sages. Rama was uneasy about fighting a woman, but Vishvamitra explained the danger she posed and asked him to protect the region. Rama faced Tataka and killed her. The act was a difficult first test of his duty as a warrior, and Vishvamitra then entrusted him with further knowledge and weapons.'],['Rama Breaks Shiva’s Bow','In Mithila, King Janaka announced that whoever could lift and string the great bow associated with Shiva could marry his daughter Sita. Many powerful kings tried and failed. Rama approached the bow at Vishvamitra’s request, lifted it, and as he drew it, the bow broke with a thunderous sound. Janaka recognized Rama’s strength and character and prepared for the marriage.'],['The Marriage of Rama and Sita','Janaka welcomed Dasharatha and the royal family to Mithila. With the sages presiding, Rama and Sita were married, and the other royal brothers were married to Janaka’s family as well. The ceremonies joined two kingdoms and two families. Rama and Sita returned to Ayodhya with the blessings of their elders, beginning a partnership that would be tested by exile, separation and war.']]},
{name:'Ayodhya Kanda',stories:[['The Coronation That Never Happened','Dasharatha decided to make Rama his heir, and Ayodhya prepared for the coronation. The city rejoiced at the news. But Manthara, a servant of Queen Kaikeyi, warned her that Rama’s accession might leave Bharata without a place in the kingdom. Kaikeyi remembered two boons Dasharatha had promised her and resolved to claim them. The preparations for a joyful ceremony turned into a crisis for the royal family.'],['Kaikeyi’s Two Boons','Kaikeyi asked Dasharatha to grant the two boons he had once promised: that Bharata be crowned king and that Rama spend fourteen years in the forest. Dasharatha was devastated, but Rama accepted the demand to uphold his father’s word. He did not blame Kaikeyi or resist the decision. His calm acceptance transformed the private conflict in the palace into the turning point of the epic.'],['Rama Accepts Exile','Rama told Sita and Lakshmana that he would leave for the forest. He accepted bark garments and prepared to depart, placing his father’s promise above his own claim to the throne. Dasharatha, overcome by grief, could not bear to see him go. Rama comforted those around him and set out from Ayodhya, beginning the years of exile.'],['Sita and Lakshmana Join Rama','Sita insisted that she would share Rama’s life in the forest, while Lakshmana asked to accompany and protect them. Rama tried to explain the hardships they would face, but both remained firm. Sita left the security of the palace, and Lakshmana left his wife Urmila and the royal life behind. Their choice made the exile a shared journey of loyalty and family duty.'],['The Departure from Ayodhya','Rama, Sita and Lakshmana rode out of Ayodhya as citizens followed in sorrow. The trio eventually continued without the crowd, travelling through forests and settlements. Dasharatha mourned Rama’s departure and died grieving for his son. The exiles reached the forest, where they began a simpler life away from the court. Their departure left Ayodhya without its chosen heir and brought Bharata home to a changed kingdom.'],['Bharata Refuses the Throne','Bharata returned to Ayodhya and learned what Kaikeyi had done. He rejected the throne and rebuked the decision that had sent Rama away. He travelled to the forest and pleaded with Rama to return, but Rama would not break their father’s promise. Bharata carried Rama’s sandals back to Ayodhya and placed them on the throne, governing as Rama’s representative while awaiting his brother’s return.']]},
{name:'Aranya Kanda',stories:[['Life in the Forest','Rama, Sita and Lakshmana travelled through the forests, meeting sages and protecting hermitages from threats. They eventually made their home near Panchavati. Their days included visits from forest dwellers, quiet routines and the duties of guarding the region. Though they had left palace life behind, the forest brought its own responsibilities and dangers, setting the stage for the events that would separate Sita from Rama.'],['The Encounter with Shurpanakha','Shurpanakha, Ravana’s sister, encountered Rama and expressed a desire to marry him. Rama gently declined and directed her to Lakshmana, who also refused. Enraged, she threatened Sita. Lakshmana intervened and wounded her, and Shurpanakha fled to her relatives for help. Her humiliation and anger drew Khara and Dushana into conflict with Rama, and eventually brought news of Sita to Ravana.'],['The Battle with Khara and Dushana','Khara and Dushana led a large force against Rama after hearing Shurpanakha’s account. Lakshmana took Sita to safety while Rama faced the attackers alone. Rama fought through the assault and defeated the rakshasa warriors, including their commanders. The battle demonstrated his skill, but its consequences travelled beyond the forest: Shurpanakha carried the story to Ravana, who began to scheme against Sita.'],['The Golden Deer','Ravana enlisted Maricha to lure Rama away from the hermitage. Maricha took the form of a dazzling golden deer, and Sita asked Rama to catch it. Rama pursued the deer, which led him deeper into the forest. When Rama’s arrow struck Maricha, the demon cried out in Rama’s voice. Hearing it, Sita urged Lakshmana to go to Rama, leaving her without their protection.'],['The Abduction of Sita','With Rama and Lakshmana away, Ravana approached the hermitage disguised as an ascetic. He revealed his identity and tried to persuade Sita to go with him. When she refused, he seized her and carried her toward Lanka in his chariot. Sita called for help and left signs along the way. The abduction began the search that would bring Rama into alliance with the vanaras.'],['Jatayu’s Last Stand','The aged eagle Jatayu saw Ravana carrying Sita away and tried to stop him. He fought bravely, damaging Ravana’s chariot and challenging the abduction, but Ravana cut off his wings and left him mortally wounded. Rama and Lakshmana later found Jatayu. Before dying, he told them what had happened and pointed them toward the south. Rama mourned the loyal bird and performed his funeral rites.']]},
{name:'Kishkindha Kanda',stories:[['Rama Meets Hanuman','While searching for Sita, Rama and Lakshmana entered the region of Kishkindha. Hanuman approached them in the guise of an ascetic and spoke with care and intelligence. He learned who they were and brought them to Sugriva, the exiled vanara prince. Hanuman’s meeting with Rama began a bond of service and friendship that would become essential to the search for Sita and the journey to Lanka.'],['The Alliance with Sugriva','Sugriva told Rama that his brother Vali had taken the kingdom and that Sugriva lived in fear of him. Rama agreed to help Sugriva regain his place, and Sugriva promised to help find Sita. They pledged their alliance before a fire. After Rama helped Sugriva defeat Vali, Sugriva became king and organized the vanaras to search in every direction.'],['The Defeat of Vali','Sugriva challenged Vali to a duel, but Rama could not distinguish the brothers at first and held back. Sugriva returned wearing a garland, and the brothers fought again. Rama then released an arrow that struck Vali. As Vali lay dying, he questioned Rama’s decision to shoot from concealment. Rama explained his reasons; Vali entrusted his son Angada to Sugriva, and Sugriva took the throne.'],['The Search for Sita','Sugriva sent search parties across the regions, with Hanuman, Angada and Jambavan travelling south. Their search seemed to fail until they met Sampati, Jatayu’s brother, who saw Lanka across the ocean and told them Sita was there. Jambavan reminded Hanuman of the strength he had forgotten. The vanaras chose Hanuman to make the great leap across the sea.']]},
{name:'Sundara Kanda',stories:[['Hanuman Leaps Across the Ocean','Encouraged by Jambavan, Hanuman grew in confidence and prepared to cross the ocean. He launched himself from the mountain and flew over the sea toward Lanka. Along the way, he met challenges that tested both his strength and judgment. He overcame them without losing sight of his purpose. His leap carried Rama’s hope across the water and brought him to the city where Sita was held.'],['Hanuman Finds Sita in Ashoka Vatika','Hanuman entered Lanka at night and searched its palaces and gardens. At last he found Sita in Ashoka Vatika, guarded by rakshasis and grieving for Rama. He watched from a tree until Ravana came and urged her to accept him. Sita refused. When Ravana left, Hanuman approached cautiously, recited Rama’s story and showed her Rama’s ring as proof that he had come from her husband.'],['Hanuman’s Message to Sita','Sita recognized Rama’s ring and listened as Hanuman described Rama’s search and his determination to rescue her. Hanuman offered to carry her back, but Sita declined, choosing to wait for Rama and avoid any question about how she returned. She gave Hanuman a jewel to take to Rama and a message recalling a moment from their life together. Hanuman left with proof that Sita was alive and steadfast.'],['Hanuman Sets Lanka Ablaze','Before leaving Lanka, Hanuman allowed himself to be captured after confronting Ravana’s warriors. Ravana ordered that Hanuman’s tail be set on fire. Hanuman used the flames to leap from rooftop to rooftop, setting parts of the city ablaze before escaping. He made sure Sita was safe, then crossed back over the ocean. He delivered her message and jewel to Rama, restoring the army’s hope.']]},
{name:'Yuddha Kanda',stories:[['The Building of Rama’s Bridge','Rama and his army reached the ocean, but Lanka lay far across the water. After the ocean deity revealed a way forward, Nala led the vanaras in building a bridge. They carried stones and trees to the shore, working together until the army could cross to Lanka.'],['Vibhishana Leaves Ravana’s Court','Ravana’s brother Vibhishana urged him to return Sita and avoid a disastrous war. Ravana rejected his counsel and drove him away. Vibhishana chose to seek refuge with Rama. Though some in Rama’s camp distrusted him, Rama welcomed him and accepted him as an ally. Vibhishana’s knowledge of Lanka later helped Rama’s army understand the challenges ahead.'],['The First Battles at Lanka','Rama’s army surrounded Lanka, and Ravana’s warriors came out to meet them. The fighting spread across the city gates and battlefield. Vanara leaders faced Lanka’s commanders while Rama’s side pressed the siege. The opening battles showed the scale of Ravana’s forces and the courage of the allies who had gathered to rescue Sita.'],['Indrajit’s Serpent Weapons','Indrajit, Ravana’s son, attacked using powerful weapons and concealment. His serpent weapon bound Rama and Lakshmana, leaving the army in despair. Garuda’s arrival freed the brothers from the serpents. The episode revealed Indrajit as a formidable opponent, while the brothers’ release returned hope to the vanara army.'],['Kumbhakarna Awakens','As the war turned against Lanka, Ravana called upon his mighty brother Kumbhakarna. The rakshasa was roused from his long sleep and told of the danger facing their kingdom. Though he criticized Ravana’s choices, Kumbhakarna agreed to fight for his family and Lanka. He entered the battlefield knowing the odds were grave.'],['The Fall of Kumbhakarna','Kumbhakarna advanced through the battlefield, scattering the vanara army with his immense strength. Rama confronted him and fought with powerful arrows. After a fierce struggle, Rama struck Kumbhakarna down. His death was a major loss for Lanka, and Ravana grieved for the brother who had fought despite believing the war was unjust.'],['Indrajit’s Illusion','Indrajit used deception to weaken Rama’s army, creating the appearance that Sita had been killed. The vanaras were overcome with grief, but Vibhishana recognized the act as an illusion. He explained that Indrajit was trying to confuse them and that Sita remained alive. The truth restored the army’s resolve and turned its attention to stopping Indrajit.'],['Lakshmana Defeats Indrajit','Vibhishana revealed that Indrajit was performing a rite at Nikumbhila to strengthen himself for battle. Lakshmana, accompanied by Vibhishana and the vanara warriors, went to confront him. The two warriors fought fiercely. Lakshmana finally defeated Indrajit, ending the threat of Ravana’s most powerful son.'],['Hanuman Brings the Healing Herbs','During the fighting, Lakshmana and many vanara warriors were gravely wounded. Hanuman was sent to find healing herbs on a distant mountain. Unable to identify the right plants, he lifted and carried the mountain itself back to the battlefield. The herbs helped revive the wounded, and the army could continue the struggle.'],['Ahiravan’s Abduction of Rama and Lakshmana','In a later Ramayana episode, Ahiravan—a powerful ruler of the underworld and an ally or relative of Ravana in some versions—uses deception to carry Rama and Lakshmana away. Hanuman discovers that the brothers have been taken below the earth and sets out to rescue them. After overcoming the guardians and Ahiravan’s schemes, Hanuman frees Rama and Lakshmana and brings them back to the battlefield.\nLater-tradition note: This episode is not part of Valmiki’s Yuddha Kanda. Versions differ on Ahiravan’s identity and on the details of the rescue.'],['The Fall of Ravana','The conflict between Rama’s forces and Ravana’s army culminated in a decisive battle. Ravana was defeated, and Sita’s rescue became possible. The ending of the war is commonly understood as the triumph of dharma over destructive pride, though the epic’s aftermath and later traditions contain further complexities.'],['Sita’s Trial by Fire','After Ravana’s defeat, Sita was brought before Rama. In the Valmiki account, Rama spoke of the need to answer public doubts about her time in Lanka. Sita entered the fire, calling upon it to bear witness to her truth. The fire god returned her unharmed, affirming her purity. Retellings differ in how they frame this painful episode.'],['Rama’s Return to Ayodhya','With the war over and Sita rescued, Rama, Sita, Lakshmana and their companions began the journey home. They travelled in the Pushpaka chariot, passing places connected with their years in exile. In Ayodhya, Bharata welcomed Rama and returned the kingdom to him. Rama’s coronation marked the end of exile and the beginning of his reign.']]}
];

function startSession(u,msg){LS.setItem('itihasa-session',u.id);loadSession();page='home';render();showToast(T(msg))}
async function doSignup(){const uname=val('f_u').trim(),email=val('f_e').trim().toLowerCase(),pw=val('f_pw'),pw2=val('f_pw2');if(!uname||!email||!pw||!pw2)return authErr('Please fill in all fields.');if(!/^[A-Za-z0-9_]{3,20}$/.test(uname))return authErr('Username must be 3–20 characters: letters, numbers or underscore.');if(users.some(u=>u.username.toLowerCase()===uname.toLowerCase()))return authErr('That username is already taken.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return authErr('Enter a valid email address.');if(users.some(u=>u.email===email))return authErr('A profile with this email already exists. Try logging in.');if(pw.length<8)return authErr('Password must be at least 8 characters.');if(pw!==pw2)return authErr('Passwords do not match.');const algo=SUBTLE?'pbkdf2':'sha256x',salt=b64(crypto.getRandomValues(new Uint8Array(16)));const rec={id:randId(),username:uname,email,algo,salt,hash:await hashPw(pw,salt,algo),created:Date.now(),language,saved:[],progress:{}};if(!users.length){const ls=jget('itihasa-saved',null),lp=jget('itihasa-progress',null);if(ls||lp){rec.saved=ls||[];rec.progress=lp||{};LS.removeItem('itihasa-saved');LS.removeItem('itihasa-progress')}}users.push(rec);persistUsers();startSession(rec,'Profile created')}
async function doLogin(){const id=val('f_id').trim().toLowerCase(),pw=val('f_pw');if(!id||!pw)return authErr('Please fill in all fields.');const u=users.find(x=>x.username.toLowerCase()===id||x.email===id);if(!u)return authErr('Incorrect username/email or password.');if(u.algo==='pbkdf2'&&!SUBTLE)return authErr('This profile cannot be verified on this device.');if(await hashPw(pw,u.salt,u.algo)!==u.hash)return authErr('Incorrect username/email or password.');startSession(u,'Welcome back')}
function logout(){LS.removeItem('itihasa-session');user=null;saved=[];progress={};page='home';authMode='login';render();showToast(T('Logged out'))}
let reelBusy=false,wheelUntil=0,wheelDecay=false,lastW=0;
function reelEl(){return document.getElementById('reel')}
function curPanel(){return document.querySelector('#reelTrack .reel-panel:nth-child(2)')}
function reelH(){const r=reelEl();return r?r.clientHeight:0}
function atTop(p){return p.scrollTop<=1}
function atBottom(p){return p.scrollTop+p.clientHeight>=p.scrollHeight-2}
function setTrack(y,anim){const t=document.getElementById('reelTrack');if(!t)return;t.style.transition=anim?'transform .3s cubic-bezier(.22,.8,.24,1)':'none';t.style.transform=`translate3d(0,${y}px,0)`}
function fitReel(){const r=reelEl();if(!r)return;const nav=document.querySelector('.bottom-nav'),vh=window.visualViewport?window.visualViewport.height:window.innerHeight,top=r.getBoundingClientRect().top,h=Math.max(320,Math.floor(vh-top-(nav?nav.offsetHeight:0)-8));r.style.height=h+'px';document.querySelectorAll('#reelTrack .reel-panel').forEach(p=>p.style.height=h+'px');setTrack(-h,false)}
function reelPanels(){const mk=i=>`<div class="reel-panel" data-i="${i}">${i>=0&&i<allStories.length?readerCard(i):''}</div>`;return mk(currentStory-1)+mk(currentStory)+mk(currentStory+1)}
function goStory(i){currentStory=i;progress.last=i;progress[i]=true;saveData();storyMs=0;track('story_opened',{story_id:storyId(i),scripture_id:'ramayana'});const t=document.getElementById('reelTrack');if(!t)return;t.innerHTML=reelPanels();fitReel()}
function stepStory(dir,fromDrag){if(reelBusy)return;const to=currentStory+dir;if(to<0||to>=allStories.length){if(to>=allStories.length)showToast(T('This is the last story for now'));if(fromDrag)setTrack(-reelH(),true);return}reelBusy=true;setTrack(-reelH()*(1+dir),true);let done=false;const fin=()=>{if(done)return;done=true;goStory(to);reelBusy=false},tr=document.getElementById('reelTrack');tr.addEventListener('transitionend',ev=>{if(ev.target===tr)fin()},{once:true});setTimeout(fin,380)}
function setupReel(){const r=reelEl();if(!r)return;fitReel();const hint=document.getElementById('reelHint');if(hint){user.hintSeen=true;persistUsers();setTimeout(()=>{hint.classList.add('gone');setTimeout(()=>hint.remove(),700)},3800)}
let sy=0,sx=0,dy=0,mode=null,aT=false,aB=false,t0=0;
r.addEventListener('touchstart',e=>{if(reelBusy||e.touches.length!==1){mode='x';return}const t=e.touches[0],p=curPanel();sy=t.clientY;sx=t.clientX;dy=0;mode=null;aT=atTop(p);aB=atBottom(p);t0=Date.now()},{passive:true});
r.addEventListener('touchmove',e=>{if(reelBusy||!e.touches.length||mode==='x'||mode==='scroll'||mode==='end')return;const t=e.touches[0],ddy=t.clientY-sy,ddx=t.clientX-sx;if(mode===null){if(Math.abs(ddy)<8&&Math.abs(ddx)<8)return;if(Math.abs(ddx)>Math.abs(ddy)){mode='x';return}if(ddy<0&&aB){if(currentStory<allStories.length-1)mode='drag';else{mode='end';showToast(T('This is the last story for now'));return}}else if(ddy>0&&aT&&currentStory>0)mode='drag';else{mode='scroll';return}}
if(mode==='drag'){e.preventDefault();const h=reelH();dy=Math.max(-h,Math.min(h,ddy));setTrack(-h+dy,false)}},{passive:false});
const endT=()=>{if(mode!=='drag'){mode=null;return}mode=null;const h=reelH(),v=Math.abs(dy)/Math.max(1,Date.now()-t0);if(Math.abs(dy)>h*0.2||(v>0.35&&Math.abs(dy)>40))stepStory(dy<0?1:-1,true);else setTrack(-h,true)};
r.addEventListener('touchend',endT);r.addEventListener('touchcancel',endT);
r.addEventListener('wheel',e=>{const now=Date.now();if(now<wheelUntil){e.preventDefault();lastW=now;return}if(wheelDecay){if(now-lastW<120){e.preventDefault();lastW=now;return}wheelDecay=false}lastW=now;if(reelBusy){e.preventDefault();return}if(Math.abs(e.deltaY)<20)return;const p=curPanel();if(!p)return;if(e.deltaY>0&&atBottom(p)&&currentStory<allStories.length-1){e.preventDefault();wheelUntil=now+650;wheelDecay=true;stepStory(1)}else if(e.deltaY<0&&atTop(p)&&currentStory>0){e.preventDefault();wheelUntil=now+650;wheelDecay=true;stepStory(-1)}},{passive:false})}
if(!window.__reelInit){window.__reelInit=true;window.addEventListener('resize',()=>{if(user&&page==='reader')fitReel()});document.addEventListener('keydown',e=>{if(!user||page!=='reader'||reelBusy)return;const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;const p=curPanel();if(!p)return;const dn=e.key==='ArrowDown'||e.key==='PageDown',up=e.key==='ArrowUp'||e.key==='PageUp';if(dn){e.preventDefault();if(atBottom(p))stepStory(1);else p.scrollBy({top:e.key==='PageDown'?p.clientHeight*0.9:80,behavior:'smooth'})}else if(up){e.preventDefault();if(atTop(p))stepStory(-1);else p.scrollBy({top:e.key==='PageUp'?-p.clientHeight*0.9:-80,behavior:'smooth'})}})}
function render(){applyLang();const has=!!user,reelOn=has&&page==='reader';document.body.classList.toggle('auth-mode',!has);document.documentElement.classList.toggle('reel-mode',reelOn);document.body.classList.toggle('reel-mode',reelOn);if(!has)main.innerHTML=authView();else if(page==='home')main.innerHTML=home();else if(page==='stories')main.innerHTML=storiesPage();else if(page==='collection')main.innerHTML=collection();else if(page==='reader')main.innerHTML=reader();else if(page==='saved')main.innerHTML=savedPage();else if(page==='profile')main.innerHTML=profile();if(reelOn){window.scrollTo(0,0);setupReel()}else window.scrollTo({top:0,behavior:'smooth'})}
loadSession();
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
