 This recollection showed why Prahlada’s faith remained steady despite his father’s threats and the lessons of the royal court.'],['Hiranyakashipu Tries to Kill Prahlada','Hiranyakashipu tried to destroy his son through poison, weapons, fire, snakes and a mountain’s height. Each attempt failed, and Prahlada continued to remember Vishnu without hatred. The king’s anger deepened as he realized that neither power nor fear could force his son to abandon his faith.'],['Narasimha Appears from the Pillar','Hiranyakashipu asked whether Vishnu was in a nearby pillar and struck it. Narasimha emerged, neither man nor beast, and fought the demon at twilight on a threshold. He placed Hiranyakashipu on his lap and killed him with his claws, fulfilling the boon’s conditions while protecting Prahlada.'],['Prahlada Prays Before Narasimha','The gods feared Narasimha’s fierce anger, but Prahlada approached him without fear. He offered a prayer of humility, saying that birth or status cannot make anyone worthy without devotion. Narasimha’s anger softened, and he blessed Prahlada, who asked only for the welfare of his father and all beings.'],['Prahlada Is Crowned King','After Hiranyakashipu’s death, Prahlada was placed on the throne. He ruled with compassion and devotion rather than revenge. The former asura kingdom became a place where people could honor the Lord freely, and Prahlada’s life showed that a ruler’s strength can serve peace.'],['Shiva Destroys the Three Cities of Tripura','The three demon cities moved through the heavens, protected by boons and difficult to conquer. When they threatened the worlds, Shiva mounted a divine chariot and released a single arrow that burned all three cities. The gods praised him as Tripurari, the destroyer of Tripura, and order returned to the realms.'],['The Eternal Path of Religion','Narada described the enduring principles of dharma: truth, compassion, restraint, generosity and remembrance of the Lord. These values remain meaningful through changing ages and circumstances. Yudhishthira heard that spiritual life is sustained not only by rituals but by the way people treat one another.'],['Right Conduct in Everyday Life','The sages asked how people should act in the duties of ordinary life. Narada explained that honesty, self-control, respect and fairness help preserve trust among families and communities. Ethical conduct prepares the heart for devotion, and the smallest decisions can reflect a person’s understanding of dharma.'],['The Life of a Renunciant','Narada described the discipline expected of those who renounce household life: simplicity, study, restraint and kindness toward all beings. Renunciation is not a display of hardship or pride. It is the gradual release of possessiveness so that a seeker can remain focused on the divine.'],['The Duties of a Householder','Householders sustain families and communities through hospitality, honest work, care for elders and generosity. Narada explained that worldly responsibilities can be performed as service to the Lord. A home becomes a place of spiritual practice when its members act with respect and share what they have.'],['The Duties of a Student and a Forest Dweller','Narada outlined the responsibilities of students and those who withdraw to the forest. Students learn with discipline and respect; forest dwellers simplify their lives and turn toward reflection. Each stage has its own duties, and each can prepare a person for wisdom and devotion.']]},
{name:'Skandha Eight: Gajendra the Churning and Vamana',stories:[['Gajendra Is Seized by a Crocodile','The elephant king Gajendra entered a lake with his herd, but a crocodile seized his leg. The struggle continued for a long time, and the other elephants could not free him. As his strength faded, Gajendra remembered a prayer from a former life and called to the Lord for help.'],['Gajendra Calls to the Lord for Help','Gajendra raised a lotus and offered it to the Lord, asking for rescue from the crocodile and from the deeper bondage of worldly life. His prayer came from a heart stripped of pride and strength. The gods heard his cry, but only the Lord could end the struggle.'],['The Lord Rescues Gajendra','Vishnu arrived on Garuda and freed Gajendra by cutting down the crocodile. The elephant was released from the struggle and from the consequences of his earlier life. The story honors a devotee who remembered the Lord in danger, showing that sincere surrender can reach beyond physical strength.'],['The Churning of the Ocean Begins','The gods had lost their strength and sought a way to recover the nectar of immortality. Vishnu advised them to work with the asuras and churn the ocean using Mount Mandara and the serpent Vasuki. The rivals joined the enormous task, each hoping to claim the nectar for themselves.'],['Mount Mandara Needs a Foundation','When the gods and asuras carried Mount Mandara to the ocean, the mountain sank beneath the waters. Their effort seemed lost until Vishnu took the form of a vast tortoise. He supported the mountain on his back, giving the churning a stable foundation.'],['Poison and Treasures Emerge from the Ocean','As the ocean churned, deadly poison appeared first and threatened all creation. Shiva drank it to protect the worlds, holding it in his throat. Many treasures then emerged, including the goddess Lakshmi, the divine horse and celestial beings, before the nectar finally appeared.'],['Mohini Appears to Distribute the Nectar','The asuras seized the nectar, and the gods feared they would become too powerful. Vishnu took the enchanting form of Mohini and offered to divide it fairly. Captivated by her beauty, the asuras agreed to let her serve the nectar, not realizing her plan.'],['Mohini Gives the Nectar to the Gods','Mohini seated the gods and asuras apart and served the nectar to the gods first. Rahu disguised himself among them, but the Sun and Moon recognized him. Vishnu cut off Rahu’s head before the nectar could make his body immortal, and the gods regained their strength.'],['The Gods and Asuras Fight for the Heavens','After the gods drank the nectar, the asuras realized they had been deceived and attacked. The armies clashed across the worlds. Vishnu aided the gods, and the battle turned in their favor, though the conflict between the two groups continued through later ages.'],['Narada Brings the Battle to an End','The fighting raged until Narada intervened and urged the parties to stop. The gods returned to their celestial home, while the asuras withdrew. His intervention ended the immediate battle and reminded both sides that endless conflict could bring ruin to all worlds.'],['The Fifth and Sixth Manvantaras and Brahma’s Prayer','Shuka described the rulers and divine protectors of the fifth and sixth Manvantaras. In these ages, Brahma praised the Lord and sought strength for the work of creation. The account shows how each cosmic era has its own guardians while remaining within the Lord’s larger design.'],['Shiva Sees Mohini’s Enchanting Form','Shiva heard of Mohini’s beauty and asked Vishnu to show him that form. When Mohini appeared, Shiva was captivated and pursued her until the illusion ended. He then understood the power of the Lord’s maya and praised Vishnu for revealing how even great ascetics can be tested.'],['The Future Manvantaras','Shuka described the Manus who would guide the future ages and the divine beings who would serve with them. Each Manvantara has its own rulers, sages and protectors. The changing names and eras remind listeners that the worlds pass through vast cycles while the divine order remains constant.'],['The Duties of Manus and Their Guardians','The Manus govern their eras by upholding dharma, protecting living beings and guiding human society. Their ministers, sages and divine allies share this responsibility. Shuka explained these duties to show that cosmic order depends on service and justice as much as on divine power.'],['Bali Conquers the Celestial Realm','King Bali and the asuras defeated the gods and took control of heaven. The gods sought help from Vishnu, while Aditi prayed for the return of her sons’ realm. The Lord promised to appear as her child, setting the stage for Bali’s encounter with Vamana.'],['Aditi Performs the Payovrata','At the advice of her husband Kashyapa, Aditi undertook the Payovrata, a disciplined vow devoted to Vishnu. She prayed for protection for the gods, not out of hatred for Bali but concern for her sons. Vishnu appeared and assured her that he would be born to restore balance.'],['Vamana Is Born to Aditi and Kashyapa','Vishnu was born to Aditi and Kashyapa in the form of a radiant dwarf Brahmana. The gods rejoiced and offered him sacred gifts. Though small in stature, Vamana carried the power to restore the worlds, and he set out to meet Bali at his great sacrifice.'],['Vamana Visits Bali’s Sacrifice','Bali was performing a generous sacrifice when Vamana arrived. The young Brahmana’s radiance drew everyone’s attention. Bali welcomed him and offered to grant whatever he asked. Vamana requested only three paces of land, a modest gift that concealed the scale of the test ahead.'],['Vamana Requests Three Paces of Land','Bali’s teacher Shukracharya recognized Vamana as Vishnu and warned Bali not to agree. Bali considered the cost but chose to honor his promise. He poured water into Vamana’s hand, formally granting the three paces, even though his teacher feared the kingdom would be lost.'],['Vishnu Reveals His Cosmic Form','Vamana grew until his body filled the universe. With one step he covered the Earth and with the next the heavens, leaving no place for the third. Bali saw the Lord’s cosmic form and understood that the visitor had come to test his promise and humility.'],['Bali Is Bound After Giving the Worlds','With the worlds measured, Vishnu’s attendants bound Bali. The king did not protest that the gift had taken everything; he admitted that he still owed the third pace. His honesty and steadiness under loss impressed the Lord, who waited to hear Bali’s final offer.'],['Bali Offers His Own Head to Vamana','Bali offered his head as the place for Vamana’s third step. Prahlada praised his descendant’s truthfulness, while Vishnu accepted the offering and blessed him. Bali’s kingdom was returned in another form, and he was promised the Lord’s protection in the realm of Sutala.'],['Bali Enters Sutala Under the Lord’s Protection','Freed from his bonds, Bali entered Sutala, where Vishnu stood guard at his door. Bali had lost his celestial empire but gained the Lord’s presence and companionship. The story shows that surrender and truthfulness can bring a deeper blessing than worldly sovereignty.'],['The Fish Incarnation Saves Manu from the Flood','When a tiny fish asked Manu for protection, he placed it in a small vessel. The fish grew too large for each new home, revealing itself as Vishnu. It warned Manu of a coming flood and guided his boat, carrying the seeds of life and the sages safely through the waters.']]},
{name:'Skandha Nine: Royal Dynasties and the Ancestors of Krishna',stories:[['King Sudyumna’s Changing Fortune','Sudyumna entered a forest where a curse changed his form, leaving him to live alternately as a man and a woman. The unusual fate unsettled the royal line, but a sage helped establish a way for the kingdom to continue. The story reflects the complex destinies woven through the Purana’s royal genealogies.'],['The Sons of Manu and the Lineages of Kings','Shuka traced the descendants of Manu, describing rulers who established kingdoms and family lines across the world. Their histories include courage, error and acts of devotion. Through these genealogies, Parikshit learned how the royal families of later stories arose from the earliest generations.'],['Sukanya’s Choice and the Ashvins','Princess Sukanya accidentally disturbed the meditation of the aged sage Chyavana. To make amends, she married him and served him faithfully. The Ashvins offered to restore Chyavana’s youth, testing Sukanya’s loyalty. She recognized her husband among the transformed sages, and Chyavana gained renewed strength.'],['Ambarisha Keeps His Fast Despite Durvasa’s Anger','King Ambarisha observed a sacred fast with devotion. Sage Durvasa arrived just as the time to break it was ending and went to bathe. To keep the vow, Ambarisha sipped water, which angered Durvasa. A fiery being pursued the king, but Vishnu’s discus protected him.'],['Durvasa Seeks Protection from the Sudarshana','The Sudarshana discus pursued Durvasa across the worlds. He sought help from Brahma and Shiva, but neither could stop it. Vishnu told him that Ambarisha’s forgiveness alone could save him. Durvasa returned, and the king welcomed him without resentment, ending the chase through compassion.'],['King Harishchandra’s Trial of Truth','Harishchandra promised the sage Vishvamitra a gift and was made to surrender his kingdom and wealth. To keep his word, he endured poverty and worked at a cremation ground. When his own family faced tragedy, he still upheld truth. The gods finally restored his family and praised his unwavering honesty.'],['Sagara’s Sons Search for the Sacrificial Horse','King Sagara’s sacrificial horse disappeared, and his many sons dug through the Earth to find it. They reached the sage Kapila, mistook his radiance for guilt and attacked. Kapila’s power reduced them to ashes. Their descendants later sought a way to bring sacred waters to their remains.'],['Bhagiratha Brings the Ganga to Earth','Bhagiratha performed severe austerities so the Ganga would descend and purify the ashes of Sagara’s sons. Shiva caught the river in his matted hair, then released her streams toward Earth. Bhagiratha guided the waters to the ocean, fulfilling his ancestors’ hope and giving the world a sacred river.'],['Kalmashapada’s Curse','King Kalmashapada offended the sage Vasistha and was cursed to become a man-eater. The curse brought sorrow to the royal family and tested the sage’s compassion. After the king’s long suffering, the curse ended, and the dynasty continued through the descendants born under difficult circumstances.'],['Rama Is Born in the Ikshvaku Dynasty','The Bhagavata recounts the life of Rama, born to protect dharma in the Ikshvaku line. His story moves from his birth and royal upbringing to the trials that shaped his character. The Purana remembers him as a divine king whose conduct offered an example of duty and courage.'],['Rama’s Exile and the Search for Sita','Rama accepted exile rather than challenge his father’s promise. Sita and Lakshmana joined him in the forest. When Ravana abducted Sita, Rama searched for her, formed an alliance with the vanaras and crossed to Lanka. With their help he defeated Ravana and returned to Ayodhya.'],['Nimi and the Line of Videha','King Nimi’s line continued through a remarkable birth after a dispute with the sage Vasistha. The descendants ruled Videha and became known for wisdom and spiritual inquiry. Shuka included their history as part of the ancient royal lines that eventually connect with the larger story of Krishna’s ancestors.'],['The Lunar Dynasty Before Yayati','Shuka traced the Lunar Dynasty from Pururavas and Urvashi through the generations leading to Yayati. The lineage included kings whose desires and choices shaped the fortunes of their descendants. This account sets the family background for Yayati’s story and the later branches of the royal house.'],['Parashurama Defeats Sahasrarjuna','King Kartavirya Arjuna, famed for his thousand arms, seized the sage Jamadagni’s sacred cow. Parashurama returned and killed the king. When Kartavirya’s sons murdered Jamadagni, Parashurama took up his axe and fought the oppressive Kshatriya rulers, avenging his father and restoring balance.'],['Parashurama’s Vow Against the Warrior Kings','Grieving for Jamadagni, Parashurama vowed to punish the rulers who abused their power. He defeated the Kshatriya forces repeatedly and later performed rites to release his anger. His story is fierce, yet it also warns that royal authority becomes destructive when separated from restraint and justice.'],['Yayati Trades His Old Age for Youth','King Yayati was cursed with premature old age. He asked his sons to exchange their youth for his age, but most refused. His youngest son Puru agreed. Yayati resumed worldly pleasures for a time, believing he could satisfy his desires, but learned that enjoyment only makes craving grow.'],['Yayati Learns That Desire Cannot Be Satisfied','After years of pleasure, Yayati recognized that desire is never ended by indulgence, just as fire is not quenched by pouring oil on it. He returned Puru’s youth, gave him the kingdom and retired. His story became a lasting lesson about self-control and the limits of worldly satisfaction.'],['Bharata Is Born in the Line of Puru','The line of Puru produced King Bharata, whose name became associated with the land and its people. His descendants carried the royal lineage through changing fortunes. Shuka’s account connects Bharata’s dynasty with the later kingdoms and shows how one ruler’s legacy can shape a region’s identity.'],['Rantideva Shares His Last Meal','King Rantideva had endured a long fast when food and water finally arrived. Before he could eat, visitors came one by one, each in need. He gave away every portion, including his last water, and felt no regret. The guests revealed themselves as divine beings, praising his compassion and selflessness.'],['The Royal Dynasties of Panchala Magadha and Kuru','Shuka described the branches of the royal families that ruled Panchala, Magadha and Kuru. Their lineages intersected with the stories of the epics and with Parikshit’s own ancestry. The genealogy helped place the Bhagavata’s devotional narratives within the familiar history of ancient kings.'],['The Descendants of Anu Druhyu Turvasu and Yadu','Yayati’s sons founded distinct royal lines: Anu, Druhyu, Turvasu, Yadu and Puru. Their descendants spread across many regions and built separate kingdoms. Shuka traced these branches in order, showing how one family became the source of many peoples and political histories.'],['The Yadu Dynasty and Krishna’s Ancestors','The Yadu line continued through generations of kings until Vasudeva and Devaki were born. Their family history led directly to Krishna’s appearance. Shuka’s account closes the royal genealogy by connecting ancient rulers with the central story of the Bhagavata.']]},
{name:'Skandha Ten: The Life and Deeds of Krishna',stories:[['Kamsa Hears a Prophecy at Devaki’s Wedding','As Vasudeva drove his bride Devaki home, a heavenly voice warned Kamsa that her eighth child would kill him. Kamsa drew his sword against his sister, but Vasudeva persuaded him to spare her and promised to bring him each child. Kamsa accepted, though fear soon consumed him.'],['Vasudeva Promises to Surrender Devaki’s Children','Kamsa imprisoned Vasudeva and Devaki and watched for each birth. Vasudeva kept his word, bringing the first child to the tyrant. Kamsa returned that infant at first, but Narada’s warning about the gods’ plans made him suspicious. He began killing Devaki’s children to escape the prophecy.'],['Krishna Appears in Devaki’s Prison Cell','When the time came, Vishnu appeared before Devaki and Vasudeva in his divine form, reassuring them that he would be born as their child. He then became a newborn baby. Though they were surrounded by guards and prison walls, the parents understood that the child’s birth carried hope for the world.'],['Vasudeva Carries Krishna Across the Yamuna','The prison doors opened and the guards fell asleep. Vasudeva carried the newborn Krishna through the night toward Gokula. The Yamuna rose, but parted enough for him to cross, while Shesha sheltered the child from rain. Vasudeva exchanged Krishna with Yashoda’s newborn daughter and returned unseen.'],['Nanda and Yashoda Welcome Their Son','Nanda and Yashoda awoke to find a child in their home and celebrated his birth with the people of Gokula. They loved Krishna as their own son, unaware of the exchange with Devaki’s child. The cowherd community filled the village with music, gifts and joyful blessing.'],['Putana Comes to Gokula in Disguise','The demoness Putana came disguised as a beautiful woman and offered to nurse the infant Krishna. Her breast was poisoned, but Krishna drew out her life along with the poison. Her vast body fell across the village, and the cowherds realized that the baby had survived a deadly attack.'],['The Cart Demon and the Whirlwind Demon','At a festival, a demon hidden in a cart tried to crush Krishna, but the baby kicked it apart. Later Trinavarta carried him into the sky as a whirlwind. Krishna grew heavy in the demon’s grasp, bringing him crashing to the ground. The villagers found the child safe again.'],['Yashoda Sees the Universe in Krishna’s Mouth','After Krishna ate dirt, Yashoda asked him to open his mouth. She saw the entire universe within it: stars, lands, oceans and even herself holding him. The vision startled her, but the Lord’s power soon covered the moment in motherly affection, and she returned to caring for her little son.'],['Yashoda Ties Krishna to the Mortar','Krishna broke pots and shared butter with the monkeys. When Yashoda caught him, he ran until she finally tied him to a heavy mortar. Her love was greater than the child’s freedom, yet the rope kept coming up short until Krishna allowed himself to be bound by her devotion.'],['Krishna Uproots the Twin Arjuna Trees','Dragging the mortar, Krishna passed between two tall trees and pulled them down. The trees were the cursed sons of Kubera, Nalakuvara and Manigriva. They emerged from the trunks, praised Krishna and were released from their curse. The sound brought the cowherds running to see what had happened.'],['The Cowherds Move from Gokula to Vrindavana','After repeated dangers in Gokula, the cowherds decided to move to Vrindavana. They loaded their carts and brought the children, cattle and household goods to a safer forest settlement. There Krishna and Balarama grew among the herds, discovering streams, groves and open pastures for play.'],['Krishna Defeats Vatsasura and Bakasura','Vatsasura disguised himself as a calf and mingled with the herd, but Krishna recognized him and hurled him away. Bakasura appeared as a giant crane and swallowed Krishna, only to be defeated when Krishna burned his throat. The cowherd boys rejoiced at their friend’s courage.'],['Aghasura Swallows the Cowherd Boys','Aghasura took the form of an enormous serpent and opened his mouth like a cave. The boys entered, thinking it a wonder, and Krishna followed to save them. He expanded inside the demon until Aghasura suffocated. Krishna brought his friends back to life, and the gods celebrated the rescue.'],['Brahma Hides the Calves and Cowherd Boys','Brahma wondered how the child Krishna could defeat mighty demons, so he hid the calves and cowherd boys. Krishna responded by becoming each missing calf and boy, returning to their homes and living with their families for a year. No one noticed the difference because each form was Krishna himself.'],['Brahma Sees Krishna’s Infinite Forms','When Brahma returned, he saw countless forms of Krishna, each radiant and complete. The Lord revealed that he was the source of all beings, not merely a village child. Brahma bowed in humility, restored the calves and boys, and praised Krishna before returning to his own duties.'],['Krishna and Balarama Defeat Dhenukasura','Dhenukasura guarded a grove of sweet palm fruits and drove away anyone who approached. Balarama shook a tree, drawing the demon in donkey form to attack. He seized Dhenuka by the legs and hurled him down. Krishna and Balarama defeated the other demons, and the cowherds gathered fruit freely.'],['Krishna Subdues the Serpent Kaliya','Kaliya poisoned the waters of the Yamuna, and birds and animals fell dead near its bank. Krishna leapt into the river and fought the serpent. He danced upon Kaliya’s many hoods until the serpent’s wives begged for mercy. Krishna spared him but ordered him to leave the river and not harm the cowherds.'],['Krishna Saves the Cowherds from a Forest Fire','While the cowherd boys slept in the forest, flames surrounded them. They called to Krishna for help, and he swallowed the fire, saving everyone. The boys returned to Vrindavana unharmed, amazed that their friend could protect them even when danger came from every direction.'],['Pralambasura Challenges the Cowherd Boys','Pralambasura disguised himself as a cowherd and joined the boys’ games. He chose Balarama as his partner and carried him away, hoping to escape. Balarama grew heavy, recognized the demon and struck him down. Krishna praised his brother, and the boys returned to their play.'],['Krishna Swallows Another Forest Fire','A forest fire trapped the cowherds and their animals once more. The boys gathered around Krishna, trusting him to protect them. Krishna asked them to close their eyes and swallowed the flames. They opened their eyes in safety, while the forest stood peaceful around them.'],['The Gopis Sing of Krishna’s Flute','When Krishna played his flute, the gopis heard its notes across the fields and forests. They described how the sound made rivers pause, animals stand still and trees lean toward him. Their song expresses the way Krishna’s music awakened devotion in every part of Vrindavana.'],['The Cowherd Maidens Pray to Katyayani','The young gopis observed a vow to Katyayani, hoping that Krishna would become their husband. They bathed in the Yamuna and worshipped the goddess with simple offerings. Krishna playfully took their clothes and returned them after they approached him with humility, accepting their devotion and completing their vow.'],['Krishna Frees the Wives of the Sacrificing Brahmanas','The cowherd boys were hungry, so Krishna sent them to ask ritual Brahmanas for food. The priests ignored them, but their wives eagerly brought meals after hearing Krishna’s name. Krishna thanked them and taught that devotion can surpass ritual pride. The women returned home, their hearts fixed on him.'],['Krishna Prevents the Sacrifice to Indra','The cowherds prepared their annual sacrifice to Indra for rain and pasture. Krishna asked Nanda to honor Govardhana Hill and the land that directly sustained them instead. The people agreed and offered food and worship to the mountain, angering Indra, who sent a storm to punish them.'],['Krishna Lifts Govardhana Hill','Indra’s rain flooded Vrindavana. Krishna lifted Govardhana Hill on one finger and invited the cowherds and their cattle to shelter beneath it. For seven days he held the mountain steady while the storm raged. The people saw that Krishna’s protection was greater than Indra’s power.'],['Indra Learns Humility After the Storm','Indra saw that his storm could not harm the people protected by Krishna. Realizing his pride, he came with Surabhi and asked forgiveness. He honored Krishna as Govinda, the protector of cows and the Earth. The storm ended, and the cowherds returned to their homes.'],['Nanda Is Rescued from Varuna’s Realm','Nanda entered the Yamuna at an unusual hour and was seized by Varuna’s servants, who brought him to their lord. Krishna went to Varuna’s realm and secured his father’s release. Nanda returned amazed by the divine worlds he had glimpsed and by the honor shown to his son.'],['The Gopis Search for Krishna','During the night of the rasa dance, Krishna suddenly disappeared. The gopis searched through the forest, asking trees, vines and animals whether they had seen him. They imitated his past deeds and followed his footprints, their longing deepening as they realized how completely their hearts were bound to him.'],['The Gopis Sing for Krishna’s Return','Unable to find Krishna, the gopis sang of his beauty, kindness and playful deeds. Their song carried both grief and trust: they missed him intensely, yet remembered the joy he had given them. The prayer became one of the Bhagavata’s most celebrated expressions of love in separation.'],['Krishna Comforts the Gopis','Krishna returned to the gopis and explained that separation had made their devotion even stronger. He praised their love, which did not depend on reward or possession. The gopis welcomed him again, and the night’s gathering resumed with joy and a deeper understanding of their bond.'],['The Dance of the Rasa Circle','Krishna danced with the gopis in a circle beneath the moon, appearing beside each one so that every devotee felt personally embraced. The dance joined many lovers in one divine presence. The sages later explained that the episode represents spiritual love and should be heard with reverence.'],['Sudarshana Is Freed and Shankhachuda Is Defeated','The serpent Sudarshana once seized Nanda during a night of worship, but Krishna touched him and released him from the curse that had changed his form. Later the demon Shankhachuda abducted the gopis. Balarama and Krishna pursued him; Krishna killed the demon and returned the jewel from his head.'],['The Gopis Sing of Krishna in the Forest','As Krishna and Balarama tended the cattle, the gopis watched them from afar and sang of their beauty and skill. They described Krishna’s flute and the dust from the cows that covered his face. Their paired verses turned ordinary sights of the forest into signs of divine presence.'],['Akrura Is Sent to Bring Krishna to Mathura','Kamsa summoned Akrura and asked him to bring Krishna and Balarama to Mathura for a wrestling festival. Akrura knew the invitation concealed danger, but he was overjoyed to meet Krishna. He travelled toward Gokula, praying for the chance to see the Lord.'],['Krishna Defeats Keshi and Vyoma','Keshi attacked Vrindavana as a powerful horse, but Krishna thrust his arm into the demon’s mouth and defeated him. Later Vyoma disguised himself among the cowherd boys and hid some of them in a cave. Krishna discovered the trick, freed the children and killed the demon.'],['Akrura Arrives in Gokula','Akrura reached Gokula and saw Krishna and Balarama tending the cows. He bowed, overwhelmed by the sight. Krishna welcomed him warmly and asked about the people of Mathura. Akrura shared Kamsa’s invitation, and the brothers prepared to leave despite the grief of the cowherds.'],['Akrura Carries Krishna and Balarama to Mathura','As the chariot left Gokula, the gopis watched Krishna depart and feared they would never see him again. Akrura saw the Lord’s divine forms in the waters of the Yamuna and praised him. Krishna and Balarama continued toward Mathura, while the people of Vrindavana remained in sorrow.'],['Akrura Praises the Lord','During the journey, Akrura bathed in the Yamuna and saw Krishna and Balarama in their cosmic forms beneath the water. He praised the Lord as the source of the universe and the refuge of all beings. Krishna returned to the chariot, and Akrura continued toward Mathura with renewed devotion.'],['Krishna Breaks the Washerman’s Pride','In Mathura, Krishna asked a royal washerman for clothes fit for the festival. The man refused and insulted the brothers. Krishna struck him down and took garments for himself and Balarama. The townspeople were astonished by the bold visitors who had challenged the king’s authority.'],['Krishna Blesses the Garland Maker and the Hunchback','A humble garland maker welcomed Krishna and Balarama with flowers and prayers, and Krishna blessed him. They also met Trivakra, a bent palace attendant who offered fragrant sandal paste. Krishna gently straightened her body and restored her confidence. Their kindness to ordinary people brought joy throughout Mathura.'],['Krishna Breaks Kamsa’s Bow','At the festival grounds, Krishna found the great bow guarded by soldiers. He lifted and snapped it, and the crack echoed across Mathura. Kamsa heard the sound and grew fearful, sensing that the young visitor he had summoned would not be easily controlled.'],['Kuvalayapida Guards the Wrestling Arena','Kamsa placed the fierce elephant Kuvalayapida at the arena entrance to kill Krishna and Balarama. The mahout drove it against them, but Krishna seized the elephant and killed it. The brothers entered the arena carrying its tusks, ready to face the wrestlers.'],['Krishna and Balarama Defeat the Wrestlers','The champion wrestlers Chanura and Mushtika challenged the brothers before the crowd. Krishna fought Chanura while Balarama faced Mushtika. The wrestlers fell, and the people rejoiced. Kamsa’s plan to kill the brothers had failed, and the tyrant now faced the danger he had feared.'],['Krishna Ends Kamsa’s Tyranny','Kamsa ordered his guards to seize Krishna and imprison Vasudeva and Nanda. Krishna leapt onto the king’s platform and pulled him down, ending his rule. He freed his parents and restored honor to the Yadava family. Mathura’s people celebrated the fall of the tyrant.'],['Krishna and Balarama Study with Sandipani','After their initiation, Krishna and Balarama studied with the sage Sandipani. They mastered the arts and sciences with remarkable speed. To repay their teacher, they asked what gift he desired. Sandipani requested the return of his son, who had died in the sea, and the brothers set out to find him.'],['The Brothers Restore Their Teacher’s Lost Son','Krishna and Balarama searched the ocean and the realm of the dead for Sandipani’s son. They found the boy and brought him back alive to his parents. Sandipani rejoiced at their gift, and the brothers completed their education with gratitude toward the teacher who had welcomed them.'],['Uddhava Visits Nanda and Yashoda','Krishna sent his friend Uddhava to Vrindavana with a message for Nanda and Yashoda. They asked about Krishna and remembered his childhood with longing. Uddhava saw how deeply they loved him and realized that their simple affection held a spiritual depth he had not previously understood.'],['Uddhava Hears the Gopis’ Love in Separation','The gopis asked Uddhava to carry their message to Krishna. One gopi spoke to a bee as if it were his messenger, moving between reproach and tenderness. Uddhava listened and saw that their separation had not weakened their devotion; it had made their remembrance constant.'],['Krishna Visits Trivakra and Akrura','Krishna visited Trivakra, who welcomed him with devotion, and then met Akrura. The visits showed that Krishna remembered those who had offered him kindness. He also continued to guide the Yadava family and attend to political concerns beyond Mathura.'],['Akrura Carries a Message to Hastinapura','Krishna sent Akrura to Hastinapura to learn how the Pandavas were being treated under Dhritarashtra’s rule. Akrura spoke with the Kuru elders and observed the danger surrounding the young princes. He returned with a report, helping Krishna understand the growing conflict in the Kuru court.'],['Jarasandha Attacks Mathura','Jarasandha repeatedly attacked Mathura to avenge Kamsa. Krishna and Balarama defended the city, but the people suffered from constant sieges. To protect them, Krishna arranged a move to the fortified city of Dvaraka, where the Yadavas could live more safely near the sea.'],['Krishna Establishes the City of Dvaraka','Krishna led the Yadavas to Dvaraka, a splendid city protected by the sea and built for their security. The people settled there with their families and possessions. Krishna’s choice was not a retreat from danger but a way to preserve his community while planning how to face its enemies.'],['Muchukunda Awakens After His Long Sleep','Krishna drew the invading Kalayavana into a cave where King Muchukunda slept. Kalayavana kicked the sleeping king and was burned by the fire of Muchukunda’s gaze. The king awoke, learned that ages had passed and met Krishna. He chose spiritual practice over another kingdom.'],['Krishna and Balarama Return to Dvaraka','After escaping the pressure of Jarasandha’s forces, Krishna and Balarama returned to Dvaraka. Their people welcomed them, grateful for the protection of the sea-fortress. The brothers continued to meet challenges while making Dvaraka a secure home for the Yadava clan.'],['Rukmini Sends Krishna a Secret Message','Princess Rukmini was promised to Shishupala, though she had chosen Krishna in her heart. She sent a trusted Brahmana with a letter asking Krishna to rescue her before the wedding. Krishna received the message and immediately set out for Vidarbha, determined to honor her choice.'],['Krishna Carries Rukmini Away from Her Wedding','At Rukmini’s wedding, Krishna arrived and carried her away in his chariot. Her relatives pursued them, but Krishna’s allies held them back. Rukmini’s brother Rukmi followed and challenged Krishna, who defeated him but spared his life at her request.'],['Rukmini’s Wedding in Dvaraka','Krishna and Rukmini were welcomed in Dvaraka and married with joyful ceremony. Rukmini became Krishna’s principal queen, admired for her devotion and composure. Their marriage began a new chapter in Krishna’s life among the Yadavas and the many royal alliances connected to Dvaraka.'],['Pradyumna Is Born and Abducted','Rukmini gave birth to Pradyumna, who resembled Krishna. The demon Sambara abducted the infant and threw him into the sea, but a fish swallowed him. A fisherman caught the fish, and Pradyumna was found alive in Sambara’s household, where Mayavati raised him.'],['Pradyumna Returns to Dvaraka','Mayavati revealed Pradyumna’s identity and taught him how to defeat Sambara’s magic. Pradyumna killed the demon and returned to Dvaraka with her. Rukmini recognized her lost son, and the family rejoiced at the return of the child she had believed dead.'],['The Syamantaka Jewel Brings Suspicion to Dvaraka','Satrajit kept the radiant Syamantaka jewel, whose presence brought both prosperity and suspicion. When his brother Prasena disappeared while carrying it, people accused Krishna of taking the gem. Krishna went into the forest to discover what had happened and clear his name.'],['Krishna Marries Jambavati and Satyabhama','When the Syamantaka jewel disappeared, Krishna searched for it and found Jambavan guarding it in a cave. After a long struggle, Jambavan recognized Krishna and offered both the jewel and his daughter Jambavati. Satrajit later gave Satyabhama to Krishna in marriage, acknowledging his own part in the jewel’s dispute.'],['The Syamantaka Jewel and Satrajit’s Death','Satrajit’s brother Prasena died while carrying the Syamantaka jewel, and suspicion fell on Krishna. Krishna found the jewel with Jambavan and returned it, clearing his name. Later Satrajit was murdered by Satadhanva, and Krishna pursued the killer to recover the jewel and restore justice.'],['Krishna Marries His Other Queens','Krishna married several princesses who chose him at their swayamvaras or sought his protection. Each marriage joined Dvaraka to another royal family. The queens lived in separate palaces, yet Krishna cared for each household, showing a divine presence that was not limited by ordinary human capacity.'],['Krishna Rescues the Princesses Held by Narakasura','Narakasura had imprisoned many princesses and stolen Aditi’s earrings. Krishna and Satyabhama attacked his fortress, defeated the demon and freed the captives. The princesses asked Krishna to marry them so they would not be left dishonored, and he welcomed them into his household.'],['Aditi Receives Her Earrings','After defeating Narakasura, Krishna returned Aditi’s stolen earrings. The gods welcomed him, grateful that the demon’s oppression had ended and the celestial treasure had been restored. Satyabhama accompanied Krishna and saw the wonders of Indra’s heaven.'],['Satyabhama Brings the Parijata Tree to Dvaraka','In Indra’s heaven, Satyabhama wished to take the Parijata tree to Dvaraka. Indra opposed the transfer, but Krishna prevailed and planted the celestial tree in Satyabhama’s palace garden. The episode joined a royal visit with a playful contest between Krishna and the king of the gods.'],['Krishna and Rukmini Share a Sweet Quarrel','Krishna teasingly suggested that Rukmini might have chosen a more powerful husband. Rukmini took his words seriously and fainted. Krishna comforted her, explaining his affection. Their playful exchange revealed the intimacy and trust within their marriage, while Rukmini’s devotion remained steadfast.'],['Aniruddha Marries Rukmavati and Rukmi Is Slain','Aniruddha, Krishna’s grandson, married Rukmavati, the daughter of Rukmi. At the wedding, a dice game turned into a dispute when Rukmi cheated and insulted Balarama. Balarama killed Rukmi, ending the quarrel but bringing sorrow to the families gathered for the celebration.'],['Aniruddha Is Taken Captive by Banasura','Princess Usha dreamed of a young man and later recognized him as Aniruddha. Her friend Chitralekha brought him secretly to her palace. When the guards discovered him, Banasura captured Aniruddha and imprisoned him, setting the stage for a battle between Krishna’s family and the asura king.'],['Krishna Defeats Banasura','Krishna and Balarama came to rescue Aniruddha, and Shiva joined the battle to protect Banasura, his devotee. Krishna fought Shiva’s forces and finally subdued Banasura, cutting off all but four of his many arms. He spared the king at Shiva’s request, and Aniruddha returned to Dvaraka with Usha.'],['King Nriga Is Freed from a Lizard’s Body','The Yadava princes found a huge lizard trapped in a well and called Krishna for help. Krishna touched it, and the creature became King Nriga. The king explained that he had accidentally given the same cow to two Brahmanas and had been cursed. His story warned rulers to handle gifts and property carefully.'],['Balarama Visits Gokula and Redirects the Yamuna','Balarama visited the cowherds and gopis of Gokula, who welcomed him with affection. When the Yamuna did not come near at his call, he dragged her course with his plough. The river appeared and begged forgiveness. Balarama spent the season with his old friends, sharing their memories of Krishna.'],['Paundraka Pretends to Be the Lord','Paundraka claimed that he alone was the true Vasudeva and sent Krishna a message to surrender his symbols. Krishna answered by going to battle and defeating him. The false claimant’s challenge ended, but his ally, the king of Kashi, continued the conflict.'],['The King of Kashi’s City Falls','After Krishna defeated Paundraka, the king of Kashi sent forces against him. Krishna’s discus overcame the city’s defenses and brought the battle to an end. The episode shows how Paundraka’s claim drew his allies into a conflict they could not win.'],['Balarama Defeats Dvivida','The monkey Dvivida caused destruction across the countryside, flooding villages and disrupting sacrifices. Balarama confronted him and fought through a fierce exchange of rocks and trees. At last Balarama struck him down, ending the mischief and restoring safety to the people.'],['Balarama Drags Hastinapura Toward the Yamuna','When the Kauravas refused to release Samba, Balarama went to Hastinapura to demand justice. The elders dismissed his request, so he hooked the city with his plough and began dragging it toward the Yamuna. The Kauravas surrendered and freed Samba, recognizing Balarama’s strength.'],['Krishna’s Household Life in Dvaraka','Krishna lived among his queens and children in Dvaraka, attending to the needs of each household. He performed daily duties, met visitors and cared for his family. The account presents the Lord moving through many homes at once, while remaining fully present and loving in each.'],['Krishna Frees the Kings Imprisoned by Jarasandha','Kings imprisoned by Jarasandha sent a message asking Krishna for help. Krishna went to Indraprastha with Bhima and Arjuna, where the three planned to challenge the Magadha ruler. Their mission would free the captive kings and support Yudhishthira’s preparations for the Rajasuya sacrifice.'],['Krishna Visits Indraprastha','Krishna arrived in Indraprastha and was welcomed by the Pandavas. He advised them on the challenge posed by Jarasandha and joined Bhima and Arjuna in a plan to approach the king in disguise. His visit connected the Yadava story with the events of the Mahabharata.'],['Bhima Defeats Jarasandha','Disguised as Brahmanas, Krishna, Bhima and Arjuna challenged Jarasandha. The king chose Bhima for a wrestling duel that lasted many days. Krishna showed Bhima how to divide Jarasandha so the halves could not reunite. Bhima killed the king and freed the imprisoned rulers.'],['The Captive Kings Return to Their Realms','After Jarasandha’s death, the captive kings were released from prison. They thanked Krishna and returned to their kingdoms, carrying news of his protection. Their freedom strengthened Yudhishthira’s standing and cleared the way for the Rajasuya sacrifice in Indraprastha.'],['Yudhishthira Performs the Rajasuya and Shishupala Falls','At Yudhishthira’s Rajasuya, Krishna was chosen for the first honor. Shishupala objected and insulted him before the gathered kings. Krishna had promised Shishupala’s mother to forgive many offenses, but when the limit was passed he killed him with the Sudarshana discus.'],['Krishna Defeats the King of the Cedis','Shishupala, king of the Cedis, rose before the assembly and challenged Krishna’s honor. He continued his insults long after Krishna had forgiven him for his mother’s sake. When Shishupala crossed the promised limit, Krishna released the discus and ended his attack, bringing the confrontation at the Rajasuya to a close.'],['Duryodhana Is Confused in the Hall of Illusions','Duryodhana walked through the Pandavas’ marvelous hall and mistook clear floors for water and pools for solid ground. The attendants laughed when he stumbled. Humiliated, he returned to Hastinapura filled with envy, and his resentment helped lead to the dice game that changed the Pandavas’ lives.'],['Shalva Attacks Dvaraka','Shalva attacked Dvaraka in a flying city called Saubha, seeking revenge for Krishna’s part in Rukmini’s marriage. The illusion-filled craft confused the defenders, and Krishna returned to protect the city. He pursued Shalva through the sky and fought to end the threat to his people.'],['Krishna Destroys Shalva’s Flying City','Krishna broke through Shalva’s illusions and struck down the king with his discus. Saubha crashed, ending the assault on Dvaraka. Shalva’s defeat showed that deception and magical weapons could not overcome Krishna’s resolve to protect his people.'],['Dantavaktra and Viduratha Are Defeated','Dantavaktra confronted Krishna to avenge his friend Shalva. Krishna met him in battle and struck him down with his mace. Viduratha then attacked, but Krishna’s discus ended the final threat. The city was safe, and the cycle of revenge among the rival kings came to an end.'],['Balarama’s Pilgrimage and the Slaying of Balvala','Balarama travelled to sacred sites during the great war, choosing pilgrimage rather than fighting for either side. At Naimisharanya, the demon Balvala polluted the sages’ sacrifice. Balarama killed him and continued his journey, honoring the sages and restoring the quiet of their ritual grounds.'],['Sudama Brings Krishna a Humble Gift','Krishna’s childhood friend Sudama lived in poverty but remained content. At his wife’s urging, he travelled to Dvaraka with a small bundle of flattened rice as a gift. Krishna welcomed him with affection, washed his feet and treated him as a dear friend rather than a poor visitor.'],['Krishna Rewards His Friend’s Devotion','Krishna eagerly ate the flattened rice Sudama had brought, seeing the love behind the humble gift. Sudama left without asking for wealth, grateful for their reunion. When he returned home, he found that his poverty had been lifted. Krishna had answered his need without making him ask.'],['The Yadavas and Cowherds Meet at Kurukshetra','During a solar eclipse, the Yadavas and the cowherds of Vrindavana gathered at Kurukshetra. Nanda, Yashoda and the gopis saw Krishna and Balarama again after many years. Their meeting carried joy and sorrow, as the people who raised Krishna were reunited with the Lord now living in Dvaraka.'],['The Gopis Reunite with Krishna at Kurukshetra','The gopis longed to take Krishna back to the forests of Vrindavana, where they had shared his youthful pastimes. They asked him to return in their hearts and not remain only amid royal duties. Krishna comforted them, and their reunion expressed love that endured even across long separation.'],['Nanda and Yashoda Remember Krishna’s Childhood','Nanda and Yashoda embraced Krishna and Balarama and recalled the children they had raised in Gokula. Krishna honored them as parents and reassured them of his affection. Their reunion showed that his royal life had not erased the bond formed through years of care and love.'],['Krishna’s Queens Tell the Stories of Their Marriages','Krishna’s queens described how they came to marry him, sharing stories of messages, swayamvaras, rescue and family alliances. Each account showed a different path into the same devotion. Their conversations revealed Krishna’s many relationships and the personal love each queen felt for him.'],['Vasudeva Performs a Great Sacrifice','At a gathering of sages and relatives, Vasudeva performed a sacrifice and sought spiritual understanding. The sages explained how the Supreme Lord is present in every being and how devotion purifies action. Vasudeva listened with humility, and the Yadava gathering became an occasion for sacred teaching.'],['Krishna Restores Devaki’s Lost Sons','Devaki remembered the six sons Kamsa had killed and asked Krishna to let her see them once more. Krishna and Balarama travelled to the realm of Sutala and brought the sons back. Devaki embraced them, and after receiving her blessing they returned to their destined place.'],['Subhadra’s Marriage and Krishna’s Grace to Shrutadeva','Arjuna carried Subhadra away with Krishna’s support, and the Yadavas eventually accepted the marriage. In another episode, Krishna visited the humble Brahmana Shrutadeva and the king Bahulashva, honoring both equally. His grace did not depend on wealth or rank, but on the devotion of the heart.'],['The Vedas Praise the Lord','The personified Vedas praised the Lord as the source of the universe and the truth beyond ordinary speech. Their hymns asked how the finite mind could describe the infinite. Krishna’s presence was understood through devotion and insight, not by words alone.'],['Shiva Is Protected by Krishna','When the asura Vrkasura threatened Shiva, Krishna came to protect him. Disguised as a young Brahmana, Krishna persuaded the demon to test his boon on himself. Vrkasura placed his hand on his own head and perished. Shiva was freed, and the gods praised Krishna’s wisdom.'],['Krishna Restores the Brahmana’s Lost Sons','A Brahmana in Dvaraka repeatedly lost his newborn sons and blamed the king for failing to protect them. Arjuna promised to save the next child but could not. Krishna accompanied him across the worlds to the divine realm, where they found the missing sons and returned them to their father.'],['The Queens Sing of Krishna’s Deeds','The queens of Dvaraka reflected on Krishna’s adventures, friendships and divine qualities. Their song gathered many episodes into a final praise of the Lord, who had lived among them as husband, king and friend. The tenth Skandha closes with their devotion and remembrance.']]},
{name:'Skandha Eleven: Uddhava’s Teachings and Krishna’s Departure',stories:[['The Yadavas Celebrate at Pindaraka','At a gathering near Pindaraka, the Yadava youths dressed Samba as a pregnant woman and asked visiting sages what child would be born. Their mockery insulted the sages, who pronounced a curse upon the clan. The incident began the chain of events that would end the Yadava dynasty.'],['The Sages’ Curse on the Yadava Princes','The sages declared that an iron pestle would destroy the Yadava clan. The princes brought the curse home, and the Yadavas ground the pestle down and cast it into the sea. Its iron fragments returned as reeds along the shore, carrying the danger forward.'],['King Nimi Questions the Nine Yogendras','King Nimi welcomed the nine Yogendras and asked them how people could find freedom from fear and worldly suffering. The sages answered one by one, describing devotion, the Lord’s nature and the responsibilities of a spiritual seeker. Their dialogue became a guide to the Bhagavata’s path of devotion.'],['The Path of Bhagavata Dharma','The Yogendras explained that Bhagavata dharma is practiced through sincere devotion, compassion, remembrance and service. A devotee sees the Lord in all beings and does not use spiritual life to gain power over others. Their teaching gave Nimi a practical path for living with wisdom amid ordinary duties.'],['How to Cross Beyond Maya','The sages described how attachment to the senses and the changing world can bind the soul. By hearing about the Lord, serving devotees and cultivating discernment, a seeker can cross beyond maya. The teaching does not deny the world; it shows how to live in it without forgetting the eternal.'],['The Lord’s Incarnations and Their Purpose','The sage Drumila described the Lord’s incarnations and the different purposes they serve. In each age, the divine appears to protect the good, restrain destructive forces and renew spiritual understanding. Nimi heard that the Lord’s many forms express one source of compassion and power.'],['Worship in the Four Ages','Karabhajana explained how people worship the Lord in each age. Practices change according to the conditions of the time, but devotion remains the central principle. In the present age, hearing and chanting the Lord’s names offer a path accessible to many people, even amid distraction and difficulty.'],['Krishna Asks Uddhava to Prepare for His Departure','Krishna told Uddhava that the Yadava clan’s end was approaching and that he would soon leave the world. Uddhava was overcome with grief and asked how he could live without Krishna’s guidance. Krishna began a final teaching, helping his friend turn sorrow into understanding and steady devotion.'],['The Avadhuta and His Twenty-Four Teachers','Krishna told Uddhava about an Avadhuta who learned from twenty-four teachers found in nature and daily life. Earth taught patience, water purity, fire transformation and the sky spaciousness. Even a bird or a child could reveal a truth to someone who watched carefully and remained free from pride.'],['What the Avadhuta Learned from Nature','The Avadhuta learned not to be possessed by wealth or desire from a honeybee, and to avoid excessive attachments from a pigeon’s grief. The ocean taught depth and steadiness; the moon showed that the self remains while appearances change. His teachers were not confined to formal schools.'],['The Avadhuta Completes His Teaching','The Avadhuta explained that a wise person observes the world without becoming trapped by it. Self-control, humility and clear attention make every experience a chance to learn. Krishna used this account to show Uddhava that spiritual insight can arise through direct observation as well as from scripture and teachers.'],['The Soul Becomes Entangled in Worldly Life','Krishna described how the living being identifies with the body, senses and possessions, then experiences fear when they change. Desire leads to action, and action brings further attachment. Uddhava learned that remembering the soul’s nature and the Lord’s presence can loosen this cycle.'],['Bondage Liberation and Devotion','Krishna distinguished bondage from liberation: bondage grows from identification and craving, while freedom comes through knowledge and devotion. A devotee need not abandon kindness or responsibility. By offering actions to the Lord and treating others with respect, one can remain active without being ruled by attachment.'],['Renouncing Prescribed Actions with Discernment','Krishna explained that spiritual maturity involves performing one’s duties without selfish expectation, then gradually releasing even the pride of being the doer. Renunciation is not careless neglect. It arises when a person understands the purpose of action and no longer depends on its rewards for identity or happiness.'],['The Divine Swan Teaches the Kumaras','The four Kumaras once asked the Lord, appearing as a swan, about the difference between the self and the mind. The Lord explained that the mind can be trained to rest in truth rather than chase changing objects. The dialogue showed how clear inquiry and devotion work together.'],['The Path of Devotion and Meditation','Krishna taught Uddhava to worship with attention, remember the Lord’s qualities and meditate on the divine presence within the heart. He explained that steady practice gradually quiets distraction. Devotion gives meditation warmth and purpose, while meditation helps the devotee remain centered through changing circumstances.'],['The Limits of Yogic Powers','Krishna described extraordinary powers that may arise through yoga, such as unusual strength or perception. He warned Uddhava not to mistake these abilities for liberation. A seeker who becomes proud of powers can become more entangled; the goal is freedom and loving devotion, not display.'],['Seeing the Lord’s Presence Everywhere','Uddhava asked how to recognize the Lord throughout creation. Krishna explained that the divine is reflected in the finest, strongest and most beautiful qualities of the world, but is not limited to them. Seeing the Lord everywhere encourages reverence and compassion toward all living beings.'],['Duties for Students and Householders','Krishna outlined the duties of students and householders: learn with discipline, honor teachers, care for family and welcome guests. These responsibilities can be offered to the Lord rather than performed for status. Spiritual life, he taught, can be woven into the rhythms of study, work and home.'],['Duties for Forest Dwellers and Renunciants','For those who withdraw from household life, Krishna recommended simplicity, restraint and study. Forest dwellers and renunciants should treat all beings with kindness and avoid using austerity to seek admiration. Their outer life is meaningful when it supports inner freedom and remembrance of the Lord.'],['The Song of the Recluse','Krishna recounted the song of a poor recluse who had been insulted and mistreated. Rather than blame others, the recluse recognized that the mind’s reactions create much of one’s suffering. His insight helped Uddhava understand how patience and self-knowledge can protect the heart from resentment.'],['The Song of King Aila','King Pururavas, overcome by grief after Urvashi left him, wandered in search of her. With time he saw how desire had made him restless and dependent. His song reflects on the fleeting nature of passion and the peace that comes when the mind turns toward spiritual truth.'],['The Essence of Knowledge Karma and Devotion','Krishna compared the paths of knowledge, action and devotion, explaining how each can lead toward the divine when practiced with sincerity. Knowledge clarifies the self, disciplined action purifies intention, and devotion draws the heart toward the Lord. Uddhava listened as Krishna brought the paths together.'],['Uddhava’s Final Questions and Departure','Uddhava asked his final questions and received Krishna’s blessing to live by the teachings he had heard. He left for Badarikashrama, carrying the Lord’s wisdom into a life of meditation. Though separated from Krishna’s visible presence, Uddhava remained close through remembrance and devotion.'],['The Yadavas Gather at Prabhasa','The Yadavas travelled to Prabhasa for pilgrimage, carrying the iron pestle’s curse toward its fulfillment. Old arguments resurfaced, and the clan drank and quarrelled. Krishna saw that the end was near, while Balarama withdrew from the gathering and prepared to leave the world.'],['The Yadava Clan Destroys Itself','In the quarrel at Prabhasa, the iron reeds became weapons. The Yadavas attacked one another until nearly the entire clan had fallen. Krishna watched the destruction unfold, knowing that the curse and the clan’s own anger had converged. The powerful dynasty ended through its own conflict.'],['Krishna Returns to Vaikuntha','After the Yadavas’ destruction, Krishna sat beneath a tree in the forest. The hunter Jara mistook his foot for a deer and shot an arrow. Krishna forgave him and left the world, returning to his divine abode. His departure marked the end of an age and the beginning of Kali Yuga.']]},
{name:'Skandha Twelve: Kali Yuga and the Bhagavata’s Legacy',stories:[['The Future Kings of the Kali Age','Shuka described the dynasties that would rule as Kali Yuga advanced. Their power would rise and fade quickly, and many rulers would neglect the people. The prophecy asks listeners to see political change within the larger passage of time and to seek what remains steady beyond it.'],['The Troubles of Kali Yuga','As Kali Yuga deepens, truth, patience and compassion weaken, while greed and conflict grow. People may judge worth by wealth and status rather than character. Shuka’s description warns of these patterns, encouraging listeners to protect integrity and kindness even when society rewards their opposites.'],['The Lord’s Name Preserves Dharma','Though dharma declines in Kali Yuga, the Lord’s name remains a powerful refuge. Hearing and repeating it can steady the mind and awaken devotion. The Bhagavata teaches that spiritual practice is still possible in a troubled age, and that sincere remembrance can restore hope and ethical purpose.'],['The Four Kinds of Cosmic Dissolution','Shuka described the different dissolutions of the universe: the daily ending of beings, the periodic withdrawal of worlds, the final dissolution of material creation and the soul’s release from ignorance. Creation and dissolution move in vast cycles, while the Supreme Lord remains beyond them.'],['Shuka’s Final Teaching to Parikshit','As the seven days drew to a close, Shuka reminded Parikshit that the self is eternal and that fear belongs to the changing body. The king had listened with concentration and devotion. He now prepared to meet death with his mind fixed on the Lord rather than on the kingdom he had left.'],['Takshaka Bites Parikshit and Janamejaya Begins a Sacrifice','Parikshit remained absorbed in the teaching when Takshaka arrived in disguise and struck him with a fatal bite. The king met death with his thoughts on the Lord. Later, his son Janamejaya began a serpent sacrifice to avenge him, but the sage Astika would persuade the king to stop.'],['The Vedas Are Divided and Preserved','Shuka recalled how the Vedas were arranged into branches so their teachings could be preserved and transmitted. Sages accepted responsibility for different collections, ensuring that sacred knowledge would survive through generations. The account honors disciplined learning and the many teachers who carried the tradition forward.'],['The Purana Traditions Are Remembered','The sages organized the Purana traditions and passed them on through lineages of teachers. These histories preserve genealogies, accounts of creation and teachings about the divine. The Bhagavata places itself within this stream of memory, offering a path centered on hearing and devotion.'],['Markandeya Performs Long Austerities','The sage Markandeya performed severe austerities and worshipped Nara-Narayana. The gods tested his discipline, but he remained devoted. The Lord appeared and offered a boon. Markandeya asked to see the power of divine maya, wishing to understand how the Lord’s illusion could shape the experience of the worlds.'],['Markandeya Sees the Lord’s Maya','During a cosmic flood, Markandeya was swept through endless waters. He saw a small child resting beneath a banyan tree and entered the child’s breath, where he beheld the universe. When he emerged, the flood had vanished. He understood that the child was Narayana and that creation rested within the Lord.'],['Shiva and Uma Bless Markandeya','Shiva and Uma visited Markandeya and praised his devotion. They offered him a blessing, and Markandeya asked for lasting devotion and wisdom. Shiva granted his request and blessed the sage with long life. The episode shows the harmony of divine traditions and the honor given to steadfast spiritual practice.'],['The Parts of the Lord’s Universal Form','Shuka described the parts of the Lord’s universal form and the qualities they represent. The image gives listeners a way to contemplate the divine through the world’s structure, from the cosmic body to its living beings. It leads from description toward devotion and reverence for all creation.'],['The Twelve Skandhas Remembered','Suta recalled the twelve Skandhas and the many stories through which the Bhagavata teaches creation, devotion, duty and liberation. The accounts return again and again to the Lord’s presence and the love of devotees. Their purpose is fulfilled when listeners remember the divine and live with compassion.'],['The Eighteen Puranas and Their Scope','The Bhagavata closes by describing the range and traditional scale of the eighteen Puranas. Each preserves histories, teachings and accounts of the divine in its own way. The final remembrance places the Bhagavata within a wider body of sacred literature while affirming devotion as its central gift.']]}
];
const allStories=[];[['Ramayana',groups],['Mahabharata',mbGroups],['Bhagavata Purana',bpGroups]].forEach(([scr,gs])=>{let si=0;gs.forEach(g=>g.stories.forEach(s=>{si++;allStories.push({title:s[0],body:s[1],kanda:g.name,scr:scr,si:si,index:allStories.length+1})}))});
const SCR_RANGE={};allStories.forEach((s,i)=>{const r=SCR_RANGE[s.scr]||(SCR_RANGE[s.scr]={lo:i,hi:i,n:0});r.hi=i;r.n++});
function rg(i){return SCR_RANGE[allStories[i].scr]}function hasStories(n){return !!SCR_RANGE[n]}

function readStory(i){currentStory=Math.max(0,Math.min(i,allStories.length-1));progress.last=currentStory;progress[currentStory]=true;selectedScripture=allStories[currentStory].scr;saveData();storyMs=0;track('story_opened',{story_id:storyId(currentStory),scripture_id:scrId(selectedScripture)});page='reader';render()}
function readerCard(i){const s=allStories[i];return `<article class="reader"><button class="back" onclick="showPage('collection')">${isHi()?'← '+nm(s.scr)+' पर वापस':'← Back to '+s.scr}</button>${storyImg(s,'story-img',stT(s))}<div class="eyebrow">${esc(nm(s.scr))} · ${esc(kn(s.kanda))}</div><h2>${esc(stT(s))}</h2><div class="reader-meta">${isHi()?`कथा ${s.si} / ${SCR_RANGE[s.scr].n} · हिन्दी · 2 मिनट का पाठ`:`Story ${s.si} of ${SCR_RANGE[s.scr].n} · ${language} · 2 min read`}</div><div class="reader-body">${stB(s).split('\n').map(x=>`<p>${esc(x)}</p>`).join('')}</div>${s.scr==='Bhagavata Purana'?`<div class="source-note"><strong>${T('Reading Note')}</strong><br>${T('These concise retellings follow the twelve Skandhas of the Bhagavata Purana. Each story is written to stand on its own while keeping the larger frame of the text in view. Episode details and chapter divisions can vary across editions and traditions.')}</div>`:s.scr==='Mahabharata'?`<div class="source-note"><strong>${T('Reading Note')}</strong><br>${T('These are brief retellings rather than translations. The Mahabharata has multiple recensions and regional tellings; names, details and episode placement may differ among editions.')}</div>`:`<div class="source-note"><strong>${T('Source and Tradition Note')}</strong><br>${T('These are concise retellings, not translations. The main narrative follows the broad sequence of Valmiki’s Ramayana. Episodes such as Ahiravan’s abduction belong to later or regional tellings and are identified as such. Character names and details may vary between versions.')}</div>`}<div class="reader-actions"><div><button class="secondary save-btn" onclick="toggleSave(${i})">${saved.includes(i)?T('♥ Saved'):T('♡ Save story')}</button> <button class="secondary" onclick="shareStory(${i})">${T('Share')}</button></div><div><button class="secondary" ${i<=rg(i).lo?'disabled':''} onclick="stepStory(-1)">${T('← Previous')}</button> <button class="primary" ${i>=rg(i).hi?'disabled':''} onclick= function profile(){const opened=Object.keys(progress).filter(k=>k!=='last').length;return `<div class="eyebrow">${T('Your preferences')}</div><h2 class="page-title">${T('Profile & settings')}</h2><p class="sub">${T('A simple reading experience, tailored to you.')}</p><div class="settings-card"><strong>${T('Account')}</strong><p class="sub" style="margin:6px 0 12px">@${esc(user.username)} · ${esc(user.email)}</p><button class="secondary" onclick="logout()">${T('Log out')}</button> <button class="secondary" onclick="deleteProfile()">${T('Delete profile')}</button></div><div class="settings-card"><label><span><strong>${T('Reading language')}</strong><br><small class="sub">${T('Choose the language for story text')}</small></span><select onchange="setLanguage(this.value)"><option value="English" ${language==='English'?'selected':''}>English</option><option value="Hindi" ${language==='Hindi'?'selected':''}>${isHi()?'हिन्दी':'Hindi'}</option></select></label></div><div class="settings-card"><strong>${T('Reading progress')}</strong><p class="sub" style="margin:6px 0 12px">${isHi()?`इस डिवाइस पर ${allStories.length} में से ${opened} कथाएँ खोली गई हैं।`:`${opened} of ${allStories.length} stories opened on this device.`}</p><div class="progress"><span style="width:${Math.min(100,opened/allStories.length*100)}%"></span></div></div><div class="settings-card"><strong>${T('About Itihasa')}</strong><p class="sub" style="margin:6px 0 0">${T("A text-first explorer for India's epics, Puranas and philosophical traditions. Content will identify its source tradition wherever possible.")}</p></div><div class="settings-card"><strong>${T('Privacy')}</strong><p class="sub" style="margin:6px 0 0">${T('Your profile, bookmarks and reading progress are stored only on this device. There is no server, so they do not sync to other devices. Your password is stored only in a scrambled (hashed) form.')}</p>${NATIVE&&NATIVE.isAnalyticsEnabled?`<p class="sub" style="margin:10px 0 0">${T('Itihasa also sends anonymous usage statistics (such as which stories are opened) to Google Firebase Analytics to help improve the app. Your name, email and search text are never sent.')}</p><label class="show-pw"><input type="checkbox" ${NATIVE.isAnalyticsEnabled()?'checked':''} onchange="setAnalytics(this.checked)"> ${T('Share anonymous usage statistics')}</label>`:''}</div><button class="secondary" onclick="if(confirm(T('Clear all saved stories and reading progress on this device?'))){saved=[];progress={};saveData();render();showToast(T('Local reading data cleared'))}" style="margin-top:8px">${T('Clear local reading data')}</button>`}

function deleteProfile(){if(!user)return;if(!confirm(T('Delete this profile and all its saved stories and progress from this device? This cannot be undone.')))return;const id=user.id;users=users.filter(u=>u.id!==id);persistUsers();try{if(NATIVE&&NATIVE.resetAnalytics)NATIVE.resetAnalytics()}catch(e){}logout();authMode=users.length?'login':'signup';render();showToast(T('Profile deleted'))}

const SUBTLE=!!(window.crypto&&crypto.subtle);

function b64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function cat(a,b){const o=new Uint8Array(a.length+b.length);o.set(a);o.set(b,a.length);return o}

function startSession(u,msg){LS.setItem('itihasa-session',u.id);loadSession();page='home';render();showToast(T(msg))}
async function doSignup(){const uname=val('f_u').trim(),email=val('f_e').trim().toLowerCase(),pw=val('f_pw'),pw2=val('f_pw2');if(!uname||!email||!pw||!pw2)return authErr('Please fill in all fields.');if(!/^[A-Za-z0-9_]{3,20}$/.test(uname))return authErr('Username must be 3–20 characters: letters, numbers or underscore.');if(users.some(u=>u.username.toLowerCase()===uname.toLowerCase()))return authErr('That username is already taken.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return authErr('Enter a valid email address.');if(users.some(u=>u.email===email))return authErr('A profile with this email already exists. Try logging in.');if(pw.length<8)return authErr('Password must be at least 8 characters.');if(pw!==pw2)return authErr('Passwords do not match.');const algo=SUBTLE?'pbkdf2':'sha256x',salt=b64(crypto.getRandomValues(new Uint8Array(16)));const rec={id:randId(),username:uname,email,algo,salt,hash:await hashPw(pw,salt,algo),created:Date.now(),language,saved:[],progress:{}};if(!users.length){const ls=jget('itihasa-saved',null),lp=jget('itihasa-progress',null);if(ls||lp){rec.saved=ls||[];rec.progress=lp||{};LS.removeItem('itihasa-saved');LS.removeItem('itihasa-progress')}}users.push(rec);persistUsers();startSession(rec,'Profile created')}
async function doLogin(){const id=val('f_id').trim().toLowerCase(),pw=val('f_pw');if(!id||!pw)return authErr('Please fill in all fields.');const u=users.find(x=>x.username.toLowerCase()===id||x.email===id);if(!u)return authErr('Incorrect username/email or password.');if(u.algo==='pbkdf2'&&!SUBTLE)return authErr('This profile cannot be verified on this device.');if(await hashPw(pw,u.salt,u.algo)!==u.hash)return authErr('Incorrect username/email or password.');startSession(u,'Welcome back')}
function logout(){LS.removeItem('itihasa-session');user=null;saved=[];progress={};page='home';authMode='login';render();showToast(T('Logged out'))}
let reelBusy=false,wheelUntil=0,wheelDecay=false,lastW=0;
function reelEl(){return document.getElementById('reel')}
function curPanel(){return document.querySelector('#reelTrack .reel-panel:nth-child(2)')}
function reelH(){const r=reelEl();return r?r.clientHeight:0}
function atTop(p){return p.scrollTop<=1}
function atBottom(p){return p.scrollTop+p.clientHeight>=p.scrollHeight-2}
function setTrack(y,anim){const t=document.getElementById('reelTrack');if(!t)return;t.style.transition=anim?'transform .3s cubic-bezier(.22,.8,.24,1)':'none';t.style.transform=`translate3d(0,${y}px,0)`}
function fitReel(){const r=reelEl();if(!r)return;const nav=document.querySelector('.bottom-nav'),vh=window.visualViewport?window.visualViewport.height:window.innerHeight,top=r.getBoundingClientRect().top,h=Math.max(320,Math.floor(vh-top-(nav?nav.offsetHeight:0)-8));r.style.height=h+'px';document.querySelectorAll('#reelTrack .reel-panel').forEach(p=>p.style.height=h+'px');setTrack(-h,false)}
function reelPanels(){const mk=i=>`<div class="reel-panel" data-i="${i}">${i>=rg(currentStory).lo&&i<=rg(currentStory).hi?readerCard(i):''}</div>`;return mk(currentStory-1)+mk(currentStory)+mk(currentStory+1)}
function goStory(i){currentStory=i;progress.last=i;progress[i]=true;saveData();storyMs=0;track('story_opened',{story_id:storyId(i),scripture_id:scrId(allStories[i].scr)});const t=document.getElementById('reelTrack');if(!t)return;t.innerHTML=reelPanels();fitReel()}
function stepStory(dir,fromDrag){if(reelBusy)return;const r_=rg(currentStory),to=currentStory+dir;if(to<r_.lo||to>r_.hi){if(to>r_.hi)showToast(T('This is the last story for now'));if(fromDrag)setTrack(-reelH(),true);return}reelBusy=true;setTrack(-reelH()*(1+dir),true);let done=false;const fin=()=>{if(done)return;done=true;goStory(to);reelBusy=false},tr=document.getElementById('reelTrack');tr.addEventListener('transitionend',ev=>{if(ev.target===tr)fin()},{once:true});setTimeout(fin,380)}
function setupReel(){const r=reelEl();if(!r)return;fitReel();const hint=document.getElementById('reelHint');if(hint){user.hintSeen=true;persistUsers();setTimeout(()=>{hint.classList.add('gone');setTimeout(()=>hint.remove(),700)},3800)}
let sy=0,sx=0,dy=0,mode=null,aT=false,aB=false,t0=0;
r.addEventListener('touchstart',e=>{if(reelBusy||e.touches.length!==1){mode='x';return}const t=e.touches[0],p=curPanel();sy=t.clientY;sx=t.clientX;dy=0;mode=null;aT=atTop(p);aB=atBottom(p);t0=Date.now()},{passive:true});
r.addEventListener('touchmove',e=>{if(reelBusy||!e.touches.length||mode==='x'||mode==='scroll'||mode==='end')return;const t=e.touches[0],ddy=t.clientY-sy,ddx=t.clientX-sx;if(mode===null){if(Math.abs(ddy)<8&&Math.abs(ddx)<8)return;if(Math.abs(ddx)>Math.abs(ddy)){mode='x';return}if(ddy<0&&aB){if(currentStory<rg(currentStory).hi)mode='drag';else{mode='end';showToast(T('This is the last story for now'));return}}else if(ddy>0&&aT&&currentStory>0)mode='drag';else{mode='scroll';return}}
if(mode==='drag'){e.preventDefault();const h=reelH();dy=Math.max(-h,Math.min(h,ddy));setTrack(-h+dy,false)}},{passive:false});
const endT=()=>{if(mode!=='drag'){mode=null;return}mode=null;const h=reelH(),v=Math.abs(dy)/Math.max(1,Date.now()-t0);if(Math.abs(dy)>h*0.2||(v>0.35&&Math.abs(dy)>40))stepStory(dy<0?1:-1,true);else setTrack(-h,true)};
r.addEventListener('touchend',endT);r.addEventListener('touchcancel',endT);
r.addEventListener('wheel',e=>{const now=Date.now();if(now<wheelUntil){e.preventDefault();lastW=now;return}if(wheelDecay){if(now-lastW<120){e.preventDefault();lastW=now;return}wheelDecay=false}lastW=now;if(reelBusy){e.preventDefault();return}if(Math.abs(e.deltaY)<20)return;const p=curPanel();if(!p)return;if(e.deltaY>0&&atBottom(p)&&currentStory<rg(currentStory).hi){e.preventDefault();wheelUntil=now+650;wheelDecay=true;stepStory(1)}else if(e.deltaY<0&&atTop(p)&&currentStory>0){e.preventDefault();wheelUntil=now+650;wheelDecay=true;stepStory(-1)}},{passive:false})}
if(!window.__reelInit){window.__reelInit=true;window.addEventListener('resize',()=>{if(user&&page==='reader')fitReel()});document.addEventListener('keydown',e=>{if(!user||page!=='reader'||reelBusy)return;const tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='SELECT'||tg==='TEXTAREA')return;const p=curPanel();if(!p)return;const dn=e.key==='ArrowDown'||e.key==='PageDown',up=e.key==='ArrowUp'||e.key==='PageUp';if(dn){e.preventDefault();if(atBottom(p))stepStory(1);else p.scrollBy({top:e.key==='PageDown'?p.clientHeight*0.9:80,behavior:'smooth'})}else if(up){e.preventDefault();if(atTop(p))stepStory(-1);else p.scrollBy({top:e.key==='PageUp'?-p.clientHeight*0.9:-80,behavior:'smooth'})}})}
function render(){applyLang();const has=!!user,reelOn=has&&page==='reader';document.body.classList.toggle('auth-mode',!has);document.documentElement.classList.toggle('reel-mode',reelOn);document.body.classList.toggle('reel-mode',reelOn);if(!has)main.innerHTML=authView();else if(page==='home')main.innerHTML=home();else if(page==='stories')main.innerHTML=storiesPage();else if(page==='collection')main.innerHTML=collection();else if(page==='reader')main.innerHTML=reader();else if(page==='saved')main.innerHTML=savedPage();else if(page==='profile')main.innerHTML=profile();if(reelOn){window.scrollTo(0,0);setupReel()}else window.scrollTo({top:0,behavior:'smooth'})}
loadSession();
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
