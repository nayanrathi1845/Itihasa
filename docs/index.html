<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Itihasa</title><style>
:root{--ink:#38291f;--muted:#7d6c5c;--paper:#fbf6ed;--card:#fffdf8;--line:#e8dccb;--rust:#8c482e}
@media (prefers-color-scheme:dark){:root{--ink:#f1e7d8;--muted:#c3b29c;--paper:#241a14;--card:#2e221a;--line:#4a392c;--rust:#e0a07f}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 Georgia,'Times New Roman',serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin:18px 0}
h1{color:var(--rust);font-size:34px;line-height:1.15;margin:8px 0 4px}h2{color:var(--rust);font-size:22px;margin:30px 0 6px}
p,li{margin:8px 0}ul{padding-left:22px}.meta{color:var(--muted);font-size:15px}a{color:var(--rust)}
.brand{font:700 15px/1 'Helvetica Neue',Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
table{border-collapse:collapse;width:100%;font-size:15.5px}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--paper)}
</style></head><body><main><div class="brand">Itihasa</div><h1>Stories that shaped Bharat</h1>
<div class="card"><p>Itihasa is a free, offline reader of Indian mythology: the Ramayana in English and Hindi, with illustrations, bookmarks and reading progress.</p><p><a href="privacy.html">Privacy Policy</a> · <a href="delete-data.html">Delete your data</a> · <a href="mailto:nayan.rathi1845@gmail.com">Contact</a></p></div></main></body></html>
